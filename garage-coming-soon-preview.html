<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Garage · Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════
   GARAGE · COMING SOON — standalone port of src/pages/GarageComingSoon.jsx
   No React, no framer-motion: the stage tracker is laid out by one
   measure-and-place pass (re-run on resize) and every animation is CSS.
   ══════════════════════════════════════════════════════════════════ */

/* ── theme tokens, lifted from src/index.css ── */
:root{
  --bg:#faf9f7; --text:#6b6375; --text-h:#1a1512; --border:#e5e0d8;
  --accent:#7c3aed; --accent-bg:rgba(124,58,237,0.08); --accent-border:rgba(124,58,237,0.4);
  --card-bg:#ffffff;
  --green:#22c55e;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --heading:'Playfair Display',Georgia,serif;
  color-scheme:light dark;
}
[data-theme="dark"]{
  --bg:#16141a; --text:#9ca3af; --text-h:#f3f0ff; --border:#2e2a38;
  --accent:#a78bfa; --accent-bg:rgba(167,139,250,0.12); --accent-border:rgba(167,139,250,0.4);
  --card-bg:#1e1c24;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16141a; --text:#9ca3af; --text-h:#f3f0ff; --border:#2e2a38;
    --accent:#a78bfa; --accent-bg:rgba(167,139,250,0.12); --accent-border:rgba(167,139,250,0.4);
    --card-bg:#1e1c24;
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:18px/1.6 var(--sans); letter-spacing:0.01em;
  overflow-x:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
@media (max-width:768px){body{font-size:16px}}

/* ── the page ── */
.coming{
  position:relative;
  min-height:100vh;
  min-height:100svh;        /* phones: the small viewport, so no phantom scroll */
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; background:var(--bg);
  /* the 120px top was clearance for the site navbar; standalone and on a
     phone that is just a dead band above the heading */
  padding:clamp(28px,7vh,120px) clamp(16px,4vw,24px) clamp(44px,6vh,80px);
}

/* soft accent glow behind the content */
.glow{
  position:absolute; top:20%; left:50%; transform:translateX(-50%);
  width:min(680px,90vw); height:420px; border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,0.28) 0%,transparent 68%);
  filter:blur(40px); pointer-events:none;
  animation:glow 5s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{opacity:0.25;transform:translateX(-50%) scale(0.9)}
  50%    {opacity:0.5; transform:translateX(-50%) scale(1.1)}
}

.stack{
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
  text-align:center; width:100%; max-width:960px;
}
/* staggered entry, one step per direct child */
.stack > *{opacity:0;transform:translateY(24px);animation:rise .6s cubic-bezier(.16,1,.3,1) forwards}
.stack > :nth-child(1){animation-delay:.10s}
.stack > :nth-child(2){animation-delay:.22s}
.stack > :nth-child(3){animation-delay:.34s}
.stack > :nth-child(4){animation-delay:.46s}
@keyframes rise{to{opacity:1;transform:none}}

h1{
  margin:0; font-family:var(--heading); font-weight:900; color:var(--accent);
  font-size:clamp(2.4rem,8vw,4.5rem); line-height:1.02; letter-spacing:-0.02em;
}

.sub{
  margin:20px 0 0; color:var(--text); line-height:1.7;
  font-size:clamp(0.95rem,2.4vw,1.1rem); max-width:460px;
}

/* ── handover countdown ────────────────────────────────────────────
   Counts down to the moment the keys change hands. Tabular numerals so
   the tiles do not twitch as the digits roll.
   ─────────────────────────────────────────────────────────────── */
.countdown{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cd-label{
  font-size:0.66rem; font-weight:700; letter-spacing:0.22em; text-transform:uppercase;
  color:var(--text); opacity:.85;
}
.cd-tiles{display:flex;align-items:center;gap:8px}
.cd-tile{
  min-width:66px; padding:10px 12px 8px; border-radius:14px;
  background:var(--card-bg); border:1px solid var(--accent-border);
  box-shadow:0 6px 20px rgba(124,58,237,0.12);
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.cd-tile b{
  font-size:clamp(1.35rem,4.4vw,2rem); font-weight:800; line-height:1;
  color:var(--text-h); font-variant-numeric:tabular-nums; font-feature-settings:'tnum';
}
.cd-tile span{
  font-size:0.56rem; font-weight:700; letter-spacing:0.16em;
  text-transform:uppercase; color:var(--text);
}
.cd-tiles i{
  font-style:normal; font-size:1.3rem; font-weight:700; color:var(--accent);
  animation:blink 1s steps(1,end) infinite;
}
@keyframes blink{50%{opacity:.25}}
.cd-when{font-size:0.74rem;color:var(--accent);font-weight:600;letter-spacing:0.04em}
.cd-tile.hide,.cd-tiles i.hide{display:none}
/* the moment it lands */
.countdown.done .cd-tiles,.countdown.done .cd-label{display:none}
.cd-hit{
  display:none; padding:10px 22px; border-radius:999px;
  background:var(--accent-bg); border:1px solid var(--accent-border);
  color:var(--text-h); font-weight:800; letter-spacing:0.02em;
  font-size:clamp(1rem,3vw,1.3rem);
}
.countdown.done .cd-hit{display:block}

/* fireworks, behind everything */
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.9}

.tracker-wrap{width:100%;margin-top:42px}

/* ── stage tracker ─────────────────────────────────────────────────
   Connectors are absolutely positioned siblings of the stage list, so
   they sit behind the nodes and can be measured in pixels.
   ─────────────────────────────────────────────────────────────── */
.tracker{position:relative;width:100%}
.stages{
  list-style:none; margin:0; padding:0; position:relative;
  display:grid; grid-template-columns:repeat(var(--cols),1fr);
}
.stages li{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.row{position:relative;width:100%;height:var(--rowH)}

/* small nodes, centred on the ground line */
.node-pos{position:absolute;left:50%;top:var(--groundY);transform:translate(-50%,-50%)}
.node{
  position:relative; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.node.done{background:var(--green);border:2px solid var(--green);box-shadow:0 0 18px rgba(34,197,94,0.4)}
.node.active{
  background:var(--accent-bg); border:2px solid var(--accent);
  box-shadow:0 0 20px rgba(124,58,237,0.35);
}
.node.todo{
  background:var(--card-bg); border:2px solid var(--border);
  filter:grayscale(1); opacity:.5;
}
/* ring going out of a live/finished node */
.ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid currentColor;animation:ping 1.9s ease-out infinite}
.node.done .ring{color:var(--green)}
.node.active .ring{color:var(--accent)}
@keyframes ping{from{transform:scale(1);opacity:.55}to{transform:scale(1.6);opacity:0}}

/* the tick draws itself in */
.tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .55s ease-out .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* dealer mark, floating over the showroom node. The source PNG is
   already transparent, so it needs no plate behind it — just a shadow
   to lift it off the page. */
.stage-logo{
  position:absolute; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,0.35));
  pointer-events:none;
  animation:signFloat 3.4s ease-in-out infinite;
}
@keyframes signFloat{50%{transform:translateX(-50%) translateY(-5px)}}
.stage-logo .mark{display:block;background-repeat:no-repeat}

/* labels under each stage */
.label{line-height:1.3}
.note{margin-top:3px;font-size:clamp(0.6rem,1.5vw,0.7rem)}
li.is-done  .label{font-size:clamp(0.72rem,1.8vw,0.88rem);font-weight:700;color:var(--text-h)}
li.is-active .label{font-size:clamp(0.82rem,2.1vw,1.02rem);font-weight:700;color:var(--text-h)}
li.is-todo  .label{font-size:clamp(0.66rem,1.6vw,0.78rem);font-weight:500;color:var(--text)}
li.is-done  .note{color:var(--green);font-weight:600}
li.is-active .note{color:var(--accent)}
li.is-todo  .note{color:var(--text);opacity:.7}
.text{text-align:center;padding:0 4px}

/* ── connectors ── */
.leg{position:absolute;height:4px;border-radius:999px;background:var(--border);overflow:hidden}
.leg .fill{height:100%;border-radius:999px;background:var(--green);width:0;animation:fillLeg .7s ease-out forwards}
@keyframes fillLeg{to{width:100%}}

/* asphalt on the leg the shipment is currently on — dark on both themes */
.road{
  position:absolute; border-radius:2px; overflow:hidden;
  background:linear-gradient(180deg,#4b4857 0 30%,#322f3c 30% 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.09);
}
.road .lane{
  position:absolute; left:0; right:0; top:50%; height:1.5px; margin-top:-0.75px;
  background-image:repeating-linear-gradient(90deg,#cfc9b4 0 9px,transparent 9px 20px);
  opacity:.55;
}
/* The delivery car makes the run once, on load, and parks at the
   handover. The drive itself is scripted (see startDrive) rather than a
   CSS animation: keyframes holding a var() cannot be handed to the
   compositor, and on the main thread the fireworks canvas made the
   motion stutter. Plain px transforms via the Web Animations API stay
   composited and smooth.

   It starts fully off the left end of the track, which is clipped, so it
   drives into view instead of fading in on the spot. */
.car-track{position:absolute;overflow:hidden}
.car{position:absolute;left:0;bottom:0}
.car .tilt{transform-origin:50% 100%}      /* squat and nose-dive */
.car .bob{animation:bob .42s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-0.9px)}}
.car svg{display:block;overflow:visible}
.wheel{transform-box:fill-box;transform-origin:center}
.brake{transition:none}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 1.2s ease-out infinite}
.puff.p2{animation-delay:.6s}
@keyframes puff{
  from{transform:translateX(0) scale(1);opacity:.3}
  to  {transform:translateX(-10px) scale(3);opacity:0}
}
/* handbrake on: nothing about a parked car should still be moving */
.car.parked .bob,.car.parked .wheel,.car.parked .puff{animation:none}
.car.parked .puff{opacity:0}

/* ── the handover ─────────────────────────────────────────────────
   Someone is waiting at the far end with the key held out. They step
   in as the car rolls to a stop, and the key catches the light.
   ─────────────────────────────────────────────────────────────── */
.handover{
  position:absolute; bottom:0;
  opacity:0; animation:handIn .7s cubic-bezier(.16,1,.3,1) 2.6s forwards;
}
@keyframes handIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.handover svg{display:block;overflow:visible}
.sparkle{
  transform-box:fill-box; transform-origin:center;
  animation:twinkle 1.7s ease-in-out 3.3s infinite;
}
@keyframes twinkle{
  0%,100%{transform:scale(.4);opacity:0}
  45%    {transform:scale(1);opacity:.95}
}

/* ── the bike ──────────────────────────────────────────────────────
   Six regions tile the 800×501 product shot exactly, so however rough
   the mid-flight arrangement looks the assembled state is a pixel-
   perfect reconstruction of the photo.
   ─────────────────────────────────────────────────────────────── */
.bike-box{position:absolute;left:50%;top:0;transform:translateX(-50%)}
.bike-ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.09}
.bike-parts{position:absolute;inset:0}
.part{
  position:absolute; background-repeat:no-repeat;
  animation:fly .55s cubic-bezier(.22,1,.36,1) both;
  animation-delay:calc(.15s + var(--i) * .2s);
}
@keyframes fly{
  from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.94)}
  to  {opacity:1;transform:translate(0,0) scale(1)}
}
.bike-built{width:100%;height:100%;display:block;user-select:none;animation:hover 3.2s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-3px)}}
/* badge kept above the line the bike stands on */
.bike-badge{
  position:absolute; right:3%; display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:var(--green); box-shadow:0 0 12px rgba(34,197,94,0.47);
}

/* ── under-construction sign, bottom-left ──────────────────────────
   One background-removed frame with the beacon lamps recreated as CSS
   glows, instead of the original white-background looping GIF.
   ─────────────────────────────────────────────────────────────── */
.uc{
  position:absolute; left:clamp(10px,2.5vw,40px); bottom:clamp(20px,3vh,36px);
  width:clamp(112px,24vw,230px); aspect-ratio:450 / 400;
  pointer-events:none; z-index:2;
}
.uc img{width:100%;height:100%;display:block}
/* lamps are sized as a share of the sign, so it can scale down on a phone
   instead of being dropped */
.lamp{
  position:absolute; border-radius:50%; aspect-ratio:1;
  transform:translate(-50%,-50%); mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,216,90,0.95) 0%,rgba(255,186,32,0.4) 38%,transparent 70%);
  animation:flash 1.1s ease-in-out infinite;
}
.lamp.l1{left:19.6%;top:23.3%;width:30%}
.lamp.l2{left:59.6%;top:26.5%;width:24%;animation-delay:.55s}
@keyframes flash{0%,100%{opacity:.12}50%{opacity:1}}
/* narrow screens: leave the sign room at the bottom rather than letting it
   sit on top of the tracker, and start the content near the top instead of
   centring it — centred, a phone gets a tall empty band above the heading */
@media (max-width:999px){
  .coming{
    align-items:flex-start;
    padding-top:clamp(32px,5vh,64px);
    padding-bottom:calc(clamp(112px,24vw,230px) * 0.889 + 30px);
  }
}

/* construction stripe at the very bottom */
.stripe{
  position:absolute; left:0; right:0; bottom:0; height:10px; opacity:.85;
  background-image:repeating-linear-gradient(45deg,#f5b301 0 14px,#1a1a1a 14px 28px);
  background-size:56px 56px;
  animation:crawl 1.2s linear infinite;
}
@keyframes crawl{to{background-position-x:56px}}

/* preview-only theme switch — the real page gets this from the navbar */
.theme-btn{
  position:fixed; top:18px; right:18px; z-index:10;
  width:38px; height:38px; border-radius:50%; cursor:pointer;
  background:var(--card-bg); border:1px solid var(--border); color:var(--text-h);
  display:flex; align-items:center; justify-content:center; font-size:1rem;
}

@media (prefers-reduced-motion:reduce){
  .glow,.stack > *,.ring,.tick path,.leg .fill,.car,.car .bob,
  .wheel,.puff,.part,.bike-built,.lamp,.stripe,.stage-logo,
  .cd-tiles i,.handover,.sparkle{animation:none}
  .stack > *{opacity:1;transform:none}
  .leg .fill{width:100%}
  .tick path{stroke-dashoffset:0}
  .bike-ghost{opacity:1}
  .bike-parts{display:none}
  /* the car is simply already there, parked (placed by script) */
  .puff{opacity:0}
  .handover{opacity:1}
}
</style>
</head>
<body>

<button class="theme-btn" id="theme" type="button" aria-label="Toggle colour theme">🌗</button>

<section class="coming">
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>

  <div class="stack">
    <h1><span>Coming Soon</span></h1>

    <p class="sub">
      The Bear 650 has landed at the showroom. Keys change hands at 9:30 AM
      on 3 August — rides, gear, and the stories land here once it rolls
      home. 🏍️
    </p>

    <div class="countdown" id="countdown">
      <div class="cd-label">Handover in</div>
      <div class="cd-tiles">
        <div class="cd-tile" id="cd-day-tile"><b id="cd-day">00</b><span>days</span></div>
        <i id="cd-day-sep">:</i>
        <div class="cd-tile"><b id="cd-hr">00</b><span>hrs</span></div>
        <i>:</i>
        <div class="cd-tile"><b id="cd-min">00</b><span>mins</span></div>
        <i>:</i>
        <div class="cd-tile"><b id="cd-sec">00</b><span>secs</span></div>
      </div>
      <div class="cd-hit">🎉 It's handover time — the Bear is yours!</div>
      <div class="cd-when" id="cd-when"></div>
    </div>

    <div class="tracker-wrap">
      <div class="tracker" id="tracker"></div>
    </div>
  </div>

  <div class="uc" aria-hidden="true">
    <img src="public/under-construction.png" alt="" />
    <span class="lamp l1"></span>
    <span class="lamp l2"></span>
  </div>

  <div class="stripe" aria-hidden="true"></div>
</section>

<script>
/* ── Delivery stages ──────────────────────────────────────────────
   Move `status` along as things progress: 'done' → 'active' → 'todo'.
   The connector fill and the road both derive from whichever stage is
   marked 'active', so this array is the only thing to edit.

   `showBike` is where the bike itself lives — it was built at that
   stage, so that is where the model sits, whatever the status.
   ──────────────────────────────────────────────────────────────── */
const STAGES = [
  { key:'booked',    icon:'📋', label:'Booking Confirmed',   note:'22 July 2026',   status:'done' },
  { key:'building',  icon:'🔧', label:'Building Bike',       note:'28 July 2026',   status:'done', showBike:true },
  /* the showroom stage wears the dealer's own sign */
  { key:'arrived',   icon:'🏬', label:'Arrived at Showroom', note:'31 July 2026',   status:'done', logo:true },
  /* where the keys change hands, so where the person holding them stands */
  { key:'delivered', icon:'🏁', label:'Delivering',          note:'3 Aug 2026 · 9:30 AM',
    status:'active', doneLabel:'Delivered', handover:true },
];

/* The handover itself — the countdown target, and what the fireworks
   are waiting for. Local time. */
const HANDOVER = new Date(2026, 7, 3, 9, 30, 0);   // 3 Aug 2026, 9:30 AM

const ACTIVE_INDEX = Math.max(0, STAGES.findIndex(s => s.status === 'active'));
/* The leg the shipment is currently on: the one leaving the last
   finished stage. That is the leg drawn as a road with the car on it. */
const ROAD_LEG = ACTIVE_INDEX - 1;

const BUILD_SRC = 'public/bear650/wild-honey01.png';
const BIKE_W = 800, BIKE_H = 501;
const ASSEMBLE_MS = 3600;          // one full build pass, then it replays
const BIKE_GROUND = 0.858;         // tyre bottoms, as a fraction of frame height
const BIKE_HALF   = 0.427;         // bodywork half-width, as a fraction of frame width

/* x/y/w/h are source pixels; dx/dy is where the part flies in from */
const BIKE_PARTS = [
  { key:'rear-wheel',  x:0,   y:200, w:270, h:301, dx:-95, dy: 40 },
  { key:'front-wheel', x:505, y:200, w:295, h:301, dx: 95, dy: 40 },
  { key:'engine',      x:270, y:200, w:235, h:301, dx:  0, dy: 85 },
  { key:'frame-seat',  x:0,   y:0,   w:340, h:200, dx:-45, dy:-85 },
  { key:'fuel-tank',   x:340, y:0,   w:220, h:200, dx:  0, dy:-95 },
  { key:'front-end',   x:560, y:0,   w:240, h:200, dx: 75, dy:-70 },
];

const CAR_VB_W = 64, CAR_VB_H = 30;
const HAND_VB_W = 44, HAND_VB_H = 64;

/* ── Dealer mark ──────────────────────────────────────────────────
   The wordmark sits in a 3840×2160 canvas with a lot of transparent
   space around it — measured, the ink runs y 828…1326. Cropping to that
   band means the mark can be placed by its own edges instead of by a
   box that is mostly nothing.
   ──────────────────────────────────────────────────────────────── */
const LOGO_SRC = 'public/Royal-Enfield-Logo.png';
const LOGO_RATIO = 2160 / 3840;    // source aspect
const LOGO_TOP = 820 / 2160;       // ink band, as fractions of source height
const LOGO_BAND = 516 / 2160;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── handover countdown ───────────────────────────────────────────
   Ticks once a second off the wall clock rather than accumulating, so
   a throttled background tab cannot drift it.
   ──────────────────────────────────────────────────────────────── */
const cd = {
  root: document.getElementById('countdown'),
  day:  document.getElementById('cd-day'),
  hr:   document.getElementById('cd-hr'),
  min:  document.getElementById('cd-min'),
  sec:  document.getElementById('cd-sec'),
  dayTile: document.getElementById('cd-day-tile'),
  daySep:  document.getElementById('cd-day-sep'),
};
const pad = n => String(n).padStart(2, '0');

document.getElementById('cd-when').textContent = HANDOVER.toLocaleString(undefined, {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  hour: 'numeric', minute: '2-digit',
});

let celebrated = false;
function tickCountdown() {
  const left = HANDOVER - new Date();

  if (left <= 0) {
    cd.root.classList.add('done');
    if (!celebrated) {
      celebrated = true;
      markDelivered();   // the keys are in hand
      salvo(6);          // let it rip
    }
    return;
  }

  const s = Math.floor(left / 1000);
  const days = Math.floor(s / 86400);
  cd.day.textContent = pad(days);
  cd.hr.textContent  = pad(Math.floor(s / 3600) % 24);
  cd.min.textContent = pad(Math.floor(s / 60) % 60);
  cd.sec.textContent = pad(s % 60);

  /* no point holding a column of zeroes on handover day */
  cd.dayTile.classList.toggle('hide', days === 0);
  cd.daySep.classList.toggle('hide', days === 0);
}
setInterval(tickCountdown, 1000);
/* first tick runs at the end of the script: if the handover has already
   passed it reaches for the tracker and the fireworks, and both are
   built further down. */

/* ── Delivery car ─────────────────────────────────────────────────
   Drawn rather than an emoji, so it can be sized to the road, take the
   site accent on its bodywork, and have wheels that actually turn.
   The viewBox is set so the wheels touch its bottom edge — sit the SVG
   directly on the road strip and it lands on the surface.
   ──────────────────────────────────────────────────────────────── */
function carSVG() {
  const wheel = cx => `
    <g class="wheel">
      <circle cx="${cx}" cy="25.4" r="4.6" fill="#1b1922" />
      <circle cx="${cx}" cy="25.4" r="1.8" fill="#8d8a99" />
      <path d="M${cx - 3.2} 25.4 H${cx + 3.2} M${cx} 22.2 V28.6" stroke="#5d5a6b" stroke-width="0.9" />
    </g>`;
  return `
  <svg viewBox="0 0 ${CAR_VB_W} ${CAR_VB_H}" aria-hidden="true">
    <!-- exhaust, puffing off the back as it goes -->
    <g class="puff p1"><circle cx="3" cy="21.5" r="1.2" fill="var(--text)" /></g>
    <g class="puff p2"><circle cx="3" cy="21.5" r="1.2" fill="var(--text)" /></g>

    <ellipse cx="32" cy="28.6" rx="25" ry="1.5" fill="#000" opacity="0.22" />

    <!-- greenhouse, then the lower body over it -->
    <path d="M18 13.4 L23 5.6 Q24.4 4 26.6 4 L38.4 4 Q40.4 4 41.7 5.7 L46.6 13.4 Z" fill="var(--accent)" />
    <path d="M24.4 12.2 L27.6 6.8 Q28 6.2 28.8 6.2 L31.3 6.2 L31.3 12.2 Z" fill="#dCE7F5" opacity="0.9" />
    <path d="M33.2 6.2 L37.4 6.2 Q38.2 6.2 38.7 6.9 L42.4 12.2 Z" fill="#dCE7F5" opacity="0.9" />

    <path d="M5.5 24 L5.5 17.6 Q5.5 14.7 8.6 14.3 L20 13.2 L45.4 13.2 L52 14.5
             Q58.5 15.7 58.5 18.7 L58.5 24 Z" fill="var(--accent)" />
    <rect x="5.5" y="20.8" width="53" height="1.5" fill="#000" opacity="0.14" />
    <path d="M32 13.2 L32 22" stroke="#000" stroke-width="0.6" opacity="0.18" />
    <rect x="27.6" y="17.8" width="3.4" height="0.9" rx="0.45" fill="#000" opacity="0.22" />

    <circle cx="56.4" cy="18.6" r="1.6" fill="#ffd85a" />
    <rect class="brake" x="5.6" y="17.6" width="2.4" height="2.4" rx="1"
          fill="#ff5647" opacity="0.5" />

    ${wheel(17)}${wheel(47)}
  </svg>`;
}

/* ── The handover ─────────────────────────────────────────────────
   The person waiting at the far end of the road, key held out. Feet on
   the bottom edge of the viewBox, so it stands on the ground line; the
   key and its glint sit on the left, facing the arriving car.
   ──────────────────────────────────────────────────────────────── */
function handoverSVG() {
  return `
  <svg viewBox="0 0 ${HAND_VB_W} ${HAND_VB_H}" aria-hidden="true">
    <ellipse cx="27" cy="63" rx="10" ry="1.7" fill="#000" opacity="0.22" />

    <!-- legs and shoes -->
    <path d="M23 43 L23 60 M32 43 L32 60" stroke="#3a3745" stroke-width="6.2" stroke-linecap="round" />
    <path d="M20.6 61.4 H25.4 M29.6 61.4 H34.4" stroke="#22202a" stroke-width="3.4" stroke-linecap="round" />

    <!-- torso -->
    <path d="M20 27 Q27.5 24.2 35 27 L36.4 45 Q27.5 47.6 18.6 45 Z" fill="var(--accent)" />
    <path d="M20 27 Q27.5 24.2 35 27 L34.6 30.4 Q27.5 28 20.4 30.4 Z" fill="#000" opacity="0.14" />

    <!-- arm reaching out, hand, and the key in it -->
    <path d="M21.4 30 L11.6 32.4" stroke="var(--accent)" stroke-width="4.6" stroke-linecap="round" />
    <circle cx="10" cy="32.6" r="2.7" fill="#f0c4a0" />
    <g>
      <circle cx="6" cy="31.4" r="2.4" fill="none" stroke="#f5b301" stroke-width="1.5" />
      <path d="M3.6 31.4 H0.9 M2 31.4 V33.4 M0.9 31.4 V33.9"
            stroke="#f5b301" stroke-width="1.4" stroke-linecap="round" />
    </g>
    <path class="sparkle" d="M5.6 22.4 L6.6 25.4 L9.6 26.4 L6.6 27.4 L5.6 30.4
             L4.6 27.4 L1.6 26.4 L4.6 25.4 Z" fill="#ffe58a" />

    <!-- head -->
    <circle cx="27.4" cy="15.4" r="8.4" fill="#f0c4a0" />
    <path d="M18.9 14.6 Q19.4 5.6 27.4 5.6 Q35.4 5.6 35.9 14.6
             Q33.2 9.6 27.8 10.2 Q22.4 10.8 18.9 14.6 Z" fill="#2b2733" />
    <ellipse cx="24.4" cy="16.6" rx="1.5" ry="2" fill="#221f2b" />
    <ellipse cx="30.4" cy="16.6" rx="1.5" ry="2" fill="#221f2b" />
    <circle cx="23.9" cy="15.9" r="0.55" fill="#fff" />
    <circle cx="29.9" cy="15.9" r="0.55" fill="#fff" />
    <path d="M25.8 20 Q27.4 21.4 29 20" stroke="#b07a52" stroke-width="0.9"
          stroke-linecap="round" fill="none" />
  </svg>`;
}

const tickSVG = size => `
  <svg class="tick" width="${size * 0.52}" height="${size * 0.52}" viewBox="0 0 24 24"
       fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12.5 L9.5 18 L20 6" />
  </svg>`;

/* ── The drive ─────────────────────────────────────────────────────
   One run, on load: it pulls away from the showroom, covers the road,
   and brakes to a stop short of the handover.

   Every moving part shares the drive's own easing, so they stay in
   agreement — the wheels roll at exactly the ground speed (no slipping,
   because the turn count comes from the distance and the tyre radius),
   and they wind down as the car does instead of stopping dead.
   ──────────────────────────────────────────────────────────────── */
const DRIVE_MS = 3400, DRIVE_DELAY = 650;
const DRIVE_EASE = 'cubic-bezier(.42,0,.24,1)';   // brisk away, long roll-out

let driveAnim = null, carParked = false;

function startDrive(x0, x1, carH, at) {
  const travel = Math.max(1, x1 - x0);
  const timing = { duration: DRIVE_MS, delay: DRIVE_DELAY, easing: DRIVE_EASE, fill: 'both' };
  const parts = [];

  /* tyre radius is 4.6 of the 30-unit viewBox */
  const turns = travel / (2 * Math.PI * (carH * 4.6 / CAR_VB_H));
  car.querySelectorAll('.wheel').forEach(w => {
    parts.push(w.animate(
      [{ transform: 'rotate(0deg)' }, { transform: `rotate(${turns * 360}deg)` }], timing));
  });

  /* weight transfer: squats as it pulls away, dips onto its nose braking */
  parts.push(car.querySelector('.tilt').animate([
    { transform: 'rotate(0deg)' },
    { transform: 'rotate(-1.1deg)', offset: 0.1 },
    { transform: 'rotate(0deg)',    offset: 0.45 },
    { transform: 'rotate(1.4deg)',  offset: 0.84 },
    { transform: 'rotate(0deg)' },
  ], { duration: DRIVE_MS, delay: DRIVE_DELAY, easing: 'ease-in-out', fill: 'both' }));

  /* brake lights come up as it slows, and stay on once it is standing */
  const brake = car.querySelector('.brake');
  if (brake) {
    parts.push(brake.animate([
      { opacity: 0.5 }, { opacity: 0.5, offset: 0.62 },
      { opacity: 1, offset: 0.8 }, { opacity: 1 },
    ], { duration: DRIVE_MS, delay: DRIVE_DELAY, easing: 'linear', fill: 'both' }));
  }

  const main = car.animate(
    [{ transform: `translateX(${x0}px)` }, { transform: `translateX(${x1}px)` }],
    timing,
  );
  parts.push(main);

  /* picking up where the cancelled run left off, so a resize mid-drive
     does not send the car back to the showroom */
  if (at != null) parts.forEach(a => { a.currentTime = at; });

  main.finished.then(() => {
    carParked = true;
    car.classList.add('parked');      // handbrake: bob, wheels and exhaust off
    /* Bake the arrival into inline styles and drop the animations. A
       finished animation would otherwise outrank inline styles and pin the
       car to the road length it was started with, so it would sit in the
       wrong place after a resize. */
    parts.forEach(a => {
      try { a.commitStyles(); } catch (e) { /* not rendered; nothing to keep */ }
      a.cancel();
    });
    car.style.transform = `translateX(${x1}px)`;
  }).catch(() => {});                 // cancelled by a resize mid-run

  return main;
}

/* Called on every layout pass. Before the run it starts it, mid-run it
   re-aims it at the new geometry, and afterwards it just keeps the parked
   car standing in the right place. */
function placeCar(x0, x1, carH) {
  if (reduce || carParked) {
    car.style.transform = `translateX(${x1}px)`;
    if (reduce) car.classList.add('parked');
    return;
  }
  let at = null;
  if (driveAnim) {
    at = driveAnim.currentTime;
    driveAnim.cancel();
  }
  driveAnim = startDrive(x0, x1, carH, at);
}

/* ── build the tracker DOM once; layout() places it in pixels ── */
const tracker = document.getElementById('tracker');
const bikeIndex = STAGES.findIndex(s => s.showBike);
const legCount = STAGES.length - 1;
const legEls = [];
let road = null, carTrack = null, car = null, arrivedLeg = null;

for (let i = 0; i < legCount; i++) {
  if (i === ROAD_LEG) {
    road = document.createElement('div');
    road.className = 'road';
    road.setAttribute('aria-hidden', 'true');
    road.innerHTML = '<div class="lane"></div>';

    carTrack = document.createElement('div');
    carTrack.className = 'car-track';
    carTrack.setAttribute('aria-hidden', 'true');
    carTrack.innerHTML =
      '<div class="car"><div class="tilt"><div class="bob">' + carSVG() + '</div></div></div>';
    car = carTrack.firstElementChild;

    /* what the road becomes once the handover lands: an ordinary
       finished leg, kept in place so the swap needs no re-layout */
    arrivedLeg = document.createElement('div');
    arrivedLeg.className = 'leg';
    arrivedLeg.setAttribute('aria-hidden', 'true');
    arrivedLeg.style.display = 'none';
    arrivedLeg.innerHTML = '<div class="fill" style="width:100%;animation:none"></div>';

    tracker.append(road, carTrack, arrivedLeg);
    legEls.push(null);
  } else {
    const leg = document.createElement('div');
    leg.className = 'leg';
    leg.setAttribute('aria-hidden', 'true');
    /* travelled already, or still ahead */
    if (i < ROAD_LEG) {
      const fill = document.createElement('div');
      fill.className = 'fill';
      fill.style.animationDelay = (0.3 + i * 0.25) + 's';
      leg.appendChild(fill);
    }
    tracker.appendChild(leg);
    legEls.push(leg);
  }
}

const ol = document.createElement('ol');
ol.className = 'stages';
ol.style.setProperty('--cols', STAGES.length);

const nodeEls = [];   // { row, holder, node, parts[], badge, img }

STAGES.forEach((stage, i) => {
  const done = stage.status === 'done';
  const active = stage.status === 'active';

  const li = document.createElement('li');
  li.className = done ? 'is-done' : active ? 'is-active' : 'is-todo';
  if (active) li.setAttribute('aria-current', 'step');

  const row = document.createElement('div');
  row.className = 'row';

  const ref = { row, parts: [] };

  if (stage.showBike) {
    /* The bike sits at the stage it was built at, whatever that stage's
       status — bare, with no plate or ring behind it. */
    const box = document.createElement('div');
    box.className = 'bike-box';

    if (active) {
      /* mid-build: parts still flying together, over a faint ghost of
         the whole bike so they have somewhere to land */
      box.setAttribute('role', 'img');
      box.setAttribute('aria-label', 'Royal Enfield Bear 650 being assembled');
      box.innerHTML =
        '<img class="bike-ghost" src="' + BUILD_SRC + '" alt="" aria-hidden="true" />' +
        '<div class="bike-parts"></div>';
      const group = box.querySelector('.bike-parts');
      BIKE_PARTS.forEach((p, pi) => {
        const el = document.createElement('div');
        el.className = 'part';
        el.style.setProperty('--i', pi);
        el.style.backgroundImage = 'url(' + BUILD_SRC + ')';
        group.appendChild(el);
        ref.parts.push({ el, spec: p });
      });
      ref.group = group;
    } else {
      /* signed off: it just sits there, finished, with a tick pinned to it */
      box.innerHTML =
        '<img class="bike-built" src="' + BUILD_SRC + '" alt="" draggable="false"' +
        ' role="img" aria-label="Royal Enfield Bear 650, built" />' +
        '<span class="bike-badge" aria-hidden="true"></span>';
      ref.badge = box.querySelector('.bike-badge');
    }

    ref.box = box;
    row.appendChild(box);
  } else {
    const holder = document.createElement('div');
    holder.className = 'node-pos';

    const node = document.createElement('span');
    node.className = 'node ' + stage.status;
    if (done) {
      node.innerHTML = (reduce ? '' : '<span class="ring" aria-hidden="true"></span>') + tickSVG(46);
    } else if (active) {
      node.innerHTML = (reduce ? '' : '<span class="ring" aria-hidden="true"></span>') + stage.icon;
    } else {
      node.textContent = stage.icon;
    }

    holder.appendChild(node);
    row.appendChild(holder);
    ref.holder = holder;
    ref.node = node;

    if (stage.handover) {
      const person = document.createElement('span');
      person.className = 'handover';
      person.setAttribute('role', 'img');
      person.setAttribute('aria-label', 'Showroom staff handing over the key');
      person.innerHTML = handoverSVG();
      row.appendChild(person);
      ref.person = person;
    }

    if (stage.logo) {
      const sign = document.createElement('span');
      sign.className = 'stage-logo';
      sign.setAttribute('role', 'img');
      sign.setAttribute('aria-label', 'Royal Enfield showroom');
      sign.innerHTML = '<i class="mark"></i>';
      sign.querySelector('.mark').style.backgroundImage = 'url(' + LOGO_SRC + ')';
      row.appendChild(sign);
      ref.sign = sign;
      ref.mark = sign.firstElementChild;
    }
  }

  const text = document.createElement('div');
  text.className = 'text';
  text.innerHTML =
    '<div class="label"></div><div class="note"></div>';
  text.querySelector('.label').textContent = stage.label;
  text.querySelector('.note').textContent = stage.note;

  li.append(row, text);
  ol.appendChild(li);
  nodeEls.push(ref);
});

tracker.appendChild(ol);

/* ── layout ────────────────────────────────────────────────────────
   Size hierarchy: the bike > active node > completed tick > pending
   circle. All of them come off the column width, so the ordering holds
   at every screen size.

   Everything stands on one line: the bike on its tyres, the car on
   the road, the small nodes centred on it. That line is where the
   bike's tyres fall, so the connectors read as the ground rather than
   as a rail drawn through the middle of the bike.
   ──────────────────────────────────────────────────────────────── */
function layout() {
  const wrapW = tracker.clientWidth || 960;
  const colW = wrapW / STAGES.length;

  /* deliberately under a full column: whatever the bike takes, the road
     next to it gives up, and the car needs somewhere to travel */
  const bikeW = Math.min(colW * 0.86, 220);
  const bikeH = bikeW / (BIKE_W / BIKE_H);
  const doneSize   = clamp(bikeH * 0.28, 24, 46);
  const todoSize   = clamp(doneSize * 0.74, 20, 36);
  const activeSize = clamp(doneSize * 1.32, 32, 60);
  const maxNode = Math.max(doneSize, todoSize, activeSize);

  const groundY = bikeH * BIKE_GROUND;
  const rowH = Math.max(bikeH, groundY + maxNode / 2);

  tracker.style.setProperty('--rowH', rowH + 'px');
  tracker.style.setProperty('--groundY', groundY + 'px');

  /* Legs run node centre to node centre — except either side of the
     bike, where they stop short of it. Otherwise the connector would
     cross the bodywork, and the car would spend part of its run peeking
     through the gaps in the bike. */
  const clear = bikeW * BIKE_HALF + 6;
  for (let i = 0; i < legCount; i++) {
    const x0 = (i + 0.5) * colW + (i === bikeIndex ? clear : 0);
    const x1 = (i + 1.5) * colW - (i + 1 === bikeIndex ? clear : 0);
    const len = Math.max(24, x1 - x0);

    if (i === ROAD_LEG) {
      /* both sized off the road's own length, not the column, because
         the road gets shortened wherever it clears the bike */
      const roadH = clamp(len * 0.075, 6, 11);
      const carH = clamp(len * 0.19, 15, 28);
      const carW = carH * (CAR_VB_W / CAR_VB_H);

      Object.assign(road.style, {
        left: x0 + 'px', width: len + 'px',
        top: (groundY - roadH / 2) + 'px', height: roadH + 'px',
      });
      Object.assign(carTrack.style, {
        left: x0 + 'px', width: len + 'px',
        top: (groundY - roadH / 2 - carH) + 'px', height: carH + 'px',
      });
      Object.assign(arrivedLeg.style, {
        left: x0 + 'px', width: len + 'px', top: (groundY - 2) + 'px',
      });

      const svg = car.querySelector('svg');
      svg.setAttribute('height', carH);
      svg.setAttribute('width', carW);

      /* It parks short of the node it is arriving at, rather than driving
         through it — the last stretch belongs to the handover. */
      placeCar(-carW, Math.max(0, len - carW - activeSize * 0.6), carH);
    } else {
      Object.assign(legEls[i].style, {
        left: x0 + 'px', width: len + 'px', top: (groundY - 2) + 'px',
      });
    }
  }

  nodeEls.forEach((ref, i) => {
    const stage = STAGES[i];

    if (stage.showBike) {
      Object.assign(ref.box.style, { width: bikeW + 'px', height: bikeH + 'px' });

      const k = bikeH / BIKE_H;            // source pixels → screen pixels
      ref.parts.forEach(({ el, spec }) => {
        Object.assign(el.style, {
          left: spec.x * k + 'px',
          top: spec.y * k + 'px',
          width: spec.w * k + 'px',
          height: spec.h * k + 'px',
          backgroundSize: (BIKE_W * k) + 'px ' + (BIKE_H * k) + 'px',
          backgroundPosition: (-spec.x * k) + 'px ' + (-spec.y * k) + 'px',
        });
        el.style.setProperty('--dx', spec.dx * k + 'px');
        el.style.setProperty('--dy', spec.dy * k + 'px');
      });

      if (ref.badge) {
        const s = bikeH * 0.19;
        Object.assign(ref.badge.style, {
          width: s + 'px', height: s + 'px',
          bottom: ((1 - BIKE_GROUND) * 100 + 2) + '%',
        });
        ref.badge.innerHTML =
          '<svg width="' + s * 0.58 + '" height="' + s * 0.58 + '" viewBox="0 0 24 24"' +
          ' fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M4 12.5 L9.5 18 L20 6" /></svg>';
      }
      return;
    }

    const size = stage.status === 'done' ? doneSize
      : stage.status === 'active' ? activeSize
      : todoSize;
    Object.assign(ref.node.style, {
      width: size + 'px', height: size + 'px',
      fontSize: (stage.status === 'active' ? size * 0.46 : size * 0.42) + 'px',
    });
    const tick = ref.node.querySelector('.tick');
    if (tick) {
      tick.setAttribute('width', size * 0.52);
      tick.setAttribute('height', size * 0.52);
    }

    if (ref.person) {
      /* stands on the ground line, just clear of the node, key pointing
         back down the road at the arriving car. Sized to the room left in
         its own half-column, and dropped entirely on a phone where there
         is none. */
      const room = colW * 0.5 - size * 0.5 - 4;
      const personH = clamp(Math.min(size * 1.9, room * (HAND_VB_H / HAND_VB_W)), 36, 104);
      ref.person.style.display = room < 24 ? 'none' : '';
      const svg = ref.person.querySelector('svg');
      svg.setAttribute('height', personH);
      svg.setAttribute('width', personH * (HAND_VB_W / HAND_VB_H));
      ref.person.style.left = '50%';
      ref.person.style.marginLeft = (size * 0.5 + 4) + 'px';
      ref.person.style.bottom = (rowH - groundY) + 'px';
    }

    if (ref.sign) {
      /* wide enough to read, never wider than its own column */
      const markW = clamp(colW * 0.44, 56, 104);
      const fullH = markW * LOGO_RATIO;
      Object.assign(ref.mark.style, {
        width: markW + 'px',
        height: (fullH * LOGO_BAND) + 'px',
        backgroundSize: markW + 'px ' + fullH + 'px',
        backgroundPosition: '0px ' + (-fullH * LOGO_TOP) + 'px',
      });
      /* measured from the row's bottom edge, so the sign clears the node
         without having to know how tall the plaque came out */
      ref.sign.style.bottom = (rowH - (groundY - size / 2 - 9)) + 'px';
    }
  });
}

layout();

/* Only width matters, and layout() changes the tracker's own height —
   gating on width keeps the observer from chasing its own tail. */
let lastW = tracker.clientWidth;
new ResizeObserver(() => {
  const w = tracker.clientWidth;
  if (w === lastW) return;
  lastW = w;
  layout();
}).observe(tracker);

/* Re-keying the part group replays the entry animation — simpler and
   better synced than looping each part's keyframes independently. */
const assembling = nodeEls.find(r => r.group);
if (assembling && !reduce) {
  setInterval(() => {
    assembling.parts.forEach(({ el }) => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
  }, ASSEMBLE_MS);
}

/* ── handover landed ──────────────────────────────────────────────
   The countdown running out is the delivery: the last stage flips to
   done, and the road it travelled becomes a finished leg.
   ──────────────────────────────────────────────────────────────── */
function markDelivered() {
  const i = ACTIVE_INDEX;
  const stage = STAGES[i];
  const ref = nodeEls[i];
  if (!ref || !ref.node) return;

  stage.status = 'done';
  ol.children[i].className = 'is-done';
  ol.children[i].removeAttribute('aria-current');

  ref.node.className = 'node done';
  ref.node.innerHTML = (reduce ? '' : '<span class="ring" aria-hidden="true"></span>') + tickSVG(46);

  if (stage.doneLabel) {
    stage.label = stage.doneLabel;
    ol.children[i].querySelector('.label').textContent = stage.doneLabel;
  }

  if (road) {
    road.style.display = 'none';
    carTrack.style.display = 'none';
    arrivedLeg.style.display = '';
  }

  layout();
}

/* ── Fireworks ────────────────────────────────────────────────────
   Rockets climb, burst, and the sparks fall under gravity. Drawn as
   short line segments from each particle's previous position, on a
   canvas cleared every frame — so the trails cost nothing and the
   backdrop stays whatever the theme says it is.

   `salvo()` is safe to call before this block runs: the countdown fires
   it the instant the handover lands, which may be on first paint.
   ──────────────────────────────────────────────────────────────── */
var fxReady = false;
var pendingSalvo = 0;

const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
const FX_COLORS = ['#a78bfa', '#7c3aed', '#f5b301', '#22c55e', '#ff6b9d', '#6be3ff'];
/* the spark cap is a frame-budget cap as much as a memory one: this loop
   shares the main thread with everything else on the page */
const GRAVITY = 0.045, ROCKET_G = 0.11, DRAG = 0.985, MAX_SPARKS = 620;

let fxW = 0, fxH = 0;
let fxDark = true;      // additive sparks only read on a dark page
const rockets = [], sparks = [];

/* Which way to blend is a property of the theme, not of the frame, so it
   is measured off the live background whenever that can have changed. */
function fxReadTheme() {
  const m = getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g);
  if (!m) return;
  const [r, g, b] = m.map(Number);
  fxDark = (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128;
}

function fxResize() {
  const r = fxCanvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fxW = r.width; fxH = r.height;
  fxCanvas.width = Math.round(fxW * dpr);
  fxCanvas.height = Math.round(fxH * dpr);
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function launch(x) {
  const at = x === undefined ? (0.08 + Math.random() * 0.84) * fxW : x;
  const burstY = fxH * (0.14 + Math.random() * 0.34);
  /* fired exactly hard enough to arrive at burstY with nothing left, so
     the burst height is the one asked for however tall the page is */
  const vy = -Math.sqrt(2 * ROCKET_G * Math.max(80, fxH - burstY)) * 1.02;

  rockets.push({
    x: at, y: fxH, px: at, py: fxH,
    vx: (Math.random() - 0.5) * 0.7,
    vy, burstY,
    color: FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)],
  });
}

function burst(x, y, color) {
  if (sparks.length > MAX_SPARKS) return;
  const n = 34 + Math.floor(Math.random() * 26);
  const power = 2.3 + Math.random() * 1.9;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.22;
    const sp = power * (0.45 + Math.random() * 0.8);
    sparks.push({
      x, y, px: x, py: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, decay: 0.008 + Math.random() * 0.013,
      /* a few contrast sparks keep the burst from reading as one flat blob */
      color: Math.random() < 0.2 ? (fxDark ? '#ffffff' : '#1a1512') : color,
    });
  }
}

/* one celebratory volley, walked across the width */
function salvo(n) {
  if (!fxReady) { pendingSalvo = Math.max(pendingSalvo, n); return; }
  for (let i = 0; i < n; i++) {
    setTimeout(() => launch((0.12 + (i / Math.max(1, n - 1)) * 0.76) * fxW), i * 260);
  }
}

function fxFrame() {
  fxCtx.clearRect(0, 0, fxW, fxH);
  fxCtx.globalCompositeOperation = fxDark ? 'lighter' : 'source-over';
  fxCtx.lineCap = 'round';

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.px = r.x; r.py = r.y;
    r.x += r.vx; r.y += r.vy; r.vy += ROCKET_G;

    fxCtx.globalAlpha = 0.9;
    fxCtx.strokeStyle = r.color;
    fxCtx.lineWidth = 2;
    fxCtx.beginPath();
    fxCtx.moveTo(r.px, r.py);
    fxCtx.lineTo(r.x, r.y);
    fxCtx.stroke();

    if (r.y <= r.burstY || r.vy >= 0) {
      burst(r.x, r.y, r.color);
      rockets.splice(i, 1);
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.px = s.x; s.py = s.y;
    s.vx *= DRAG; s.vy = s.vy * DRAG + GRAVITY;
    s.x += s.vx; s.y += s.vy;
    s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }

    fxCtx.globalAlpha = Math.max(0, s.life);
    fxCtx.strokeStyle = s.color;
    fxCtx.lineWidth = 1.7;
    fxCtx.beginPath();
    fxCtx.moveTo(s.px, s.py);
    fxCtx.lineTo(s.x, s.y);
    fxCtx.stroke();
  }

  fxCtx.globalAlpha = 1;
  fxCtx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(fxFrame);
}

/* idle cadence: a rocket every second or two, none while hidden */
function fxSchedule() {
  setTimeout(() => {
    if (!document.hidden && sparks.length < MAX_SPARKS) launch();
    fxSchedule();
  }, 1100 + Math.random() * 1600);
}

if (!reduce) {
  fxReadTheme();
  fxResize();
  new ResizeObserver(fxResize).observe(fxCanvas);
  fxReady = true;
  requestAnimationFrame(fxFrame);
  setTimeout(() => launch(), 500);
  setTimeout(() => launch(), 1400);
  fxSchedule();
  if (pendingSalvo) { const n = pendingSalvo; pendingSalvo = 0; salvo(n); }
}

tickCountdown();

/* preview-only theme switch */
document.getElementById('theme').addEventListener('click', () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  if (!reduce) fxReadTheme();
});

/* and if the OS theme changes under a page that never got toggled */
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!reduce) fxReadTheme();
});
</script>
</body>
</html>
