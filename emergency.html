<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-web.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Whoever opens this has scanned the QR card or tapped the NFC tag. It is
         its own entry so they don't wait on the portfolio's bundle, fonts or
         analytics before the call buttons appear. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#edf1f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b131a" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loads without holding up first paint, so the call buttons below show in
         system fonts first. EmergencyPage adds the same link on the portfolio's
         /emergency/ route. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap"
      />
    </noscript>
    <title>Emergency info</title>
    <style>
      /* Same as --em-bg in emergency.css, so there's no flash before it loads */
      html, body { margin: 0; background: #edf1f4; color: #14202b; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0b131a; color: #e8eef3; }
      }
      .boot {
        min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
        display: grid; align-content: center; gap: 12px;
        max-width: 420px; margin: 0 auto; padding: 24px 16px;
        font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .boot p { margin: 0 0 8px; text-align: center; }
      .boot a {
        display: block; padding: 16px; border-radius: 12px;
        background: #c8102e; color: #fff; text-align: center;
        font-size: 20px; font-weight: 700; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- Until the page's script takes over, or if it never loads, anyone can
         still call for help. Same numbers as PUBLIC_NUMBERS in
         src/emergency/config.js. -->
    <div id="root">
      <div class="boot">
        <p>Loading emergency info…</p>
        <a href="tel:112">Call 112 · Emergency</a>
        <a href="tel:108">Call 108 · Ambulance</a>
      </div>
    </div>
    <script type="module" src="/src/emergency/main.jsx"></script>
  </body>
</html>
