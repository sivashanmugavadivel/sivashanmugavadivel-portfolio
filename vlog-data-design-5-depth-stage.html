<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vlog detail · 5 · Depth Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════
   DEPTH STAGE — everything sits at a distance from you.

   Nothing on this page is flat. The hero is four separate layers that
   move at four speeds, and the whole stack also tilts toward the
   pointer, so the scene has real depth rather than a scroll offset.

   Below it, the sections are planes on a perspective track: a card
   rotates out of the screen as it leaves and settles flat as it
   arrives. The Bear 650's 37-frame spin is wired to the closing
   section, so scrolling the last screen turns the bike.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05060a; --deep:#080a12; --card:#0e111c; --card2:#141826;
  --off:#eef1f8; --d1:rgba(238,241,248,0.62); --d2:rgba(238,241,248,0.38);
  --d3:rgba(238,241,248,0.16); --bd:rgba(255,255,255,0.08); --bd2:rgba(255,255,255,0.15);
  --acc:#3ddc97; --acc2:#7af0bd; --hot:#ff5c7a;
  --disp:'Chakra Petch',sans-serif; --sans:'Outfit',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--acc);color:#04120c}
img,video{display:block;max-width:100%}

/* a horizon glow, fixed, so everything above it reads as floating */
.horizon{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(70vw 44vh at 50% 104%,rgba(61,220,151,.2),transparent 70%)}
.scan{position:fixed;inset:0;z-index:59;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(180deg,#fff 0 1px,transparent 1px 3px)}

.chrome{position:fixed;top:0;left:0;right:0;z-index:52;height:54px;display:flex;align-items:center;
  gap:14px;padding:0 clamp(14px,3vw,30px);background:rgba(5,6,10,.7);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd)}
.chrome a.b{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:.66rem;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--d2);
  text-decoration:none;transition:.3s}
.chrome a.b:hover{color:var(--acc)}
.chrome a.b i{font-style:normal;transition:transform .3s var(--ease)}
.chrome a.b:hover i{transform:translateX(-4px)}
.chrome .id{font-family:var(--disp);font-size:.66rem;color:var(--d3);letter-spacing:.1em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome .z{margin-left:auto;font-family:var(--disp);font-size:.66rem;color:var(--acc);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.bar{position:fixed;top:54px;left:0;height:2px;z-index:53;width:0;
  background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 11px var(--acc)}

/* ══ HERO — four layers, four speeds, plus pointer tilt ══ */
.hero{height:100vh;position:relative;overflow:hidden;
  perspective:1200px;perspective-origin:50% 45%}
.layers{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.L{position:absolute;inset:-8%;will-change:transform}
.L img{width:100%;height:100%;object-fit:cover}
/* far: the still, dimmed and blurred */
.L.far img{filter:brightness(.3) blur(3px) saturate(.7);transform:scale(1.06)}
/* mid: a colour field */
.L.mid{background:radial-gradient(52vw 52vw at 68% 30%,rgba(61,220,151,.28),transparent 66%),
                  radial-gradient(40vw 40vw at 22% 74%,rgba(255,92,122,.16),transparent 68%)}
/* near: a grid floor that recedes */
.L.grid{background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:linear-gradient(to top,#000 0%,transparent 62%);
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 62%)}
.L.vig{background:linear-gradient(to bottom,rgba(5,6,10,.7),transparent 26%,transparent 58%,rgba(5,6,10,.96))}

.herotype{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;
  justify-content:flex-end;padding:0 clamp(20px,6vw,86px) clamp(56px,10vh,104px);
  transform-style:preserve-3d;will-change:transform}
.tag{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;
  opacity:0;animation:fin 1s var(--ease) .5s forwards}
.tag b{font-family:var(--disp);font-size:.62rem;font-weight:700;letter-spacing:.28em;
  text-transform:uppercase;color:var(--acc)}
.tag i{font-style:normal;width:44px;height:1px;background:var(--acc);opacity:.55}
.tag s{text-decoration:none;font-family:var(--disp);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--d2)}
h1{font-size:clamp(2.1rem,7vw,6rem);font-weight:900;line-height:.96;letter-spacing:-.035em;
  color:var(--off);max-width:20ch}
h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom}
h1 .w span{display:inline-block;transform:translateY(108%);animation:rise 1.15s var(--ease) forwards}
@keyframes rise{to{transform:none}}
@keyframes fin{to{opacity:1}}
.lede{margin-top:16px;max-width:52ch;font-size:clamp(.86rem,1.5vw,1.02rem);line-height:1.78;
  opacity:0;animation:up 1s var(--ease) 1s forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.gauges{display:flex;gap:clamp(16px,3.4vw,42px);flex-wrap:wrap;margin-top:26px;
  opacity:0;animation:up 1s var(--ease) 1.15s forwards}
.gauges div b{display:block;font-family:var(--disp);font-size:clamp(1.4rem,3vw,2.2rem);color:var(--off);
  line-height:1;font-variant-numeric:tabular-nums}
.gauges div span{font-family:var(--disp);font-size:.53rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--d2)}
.hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:7;
  font-family:var(--disp);font-size:.58rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--d3);display:flex;align-items:center;gap:10px;
  opacity:0;animation:fin 1s var(--ease) 1.5s forwards}
.hint i{font-style:normal;width:1px;height:26px;background:linear-gradient(var(--acc),transparent);
  animation:drop 2s var(--ease) infinite}
@keyframes drop{50%{transform:translateY(8px)}}

/* ══ the perspective track ══ */
.track{position:relative;z-index:5;perspective:1400px;perspective-origin:50% 50%;
  padding:clamp(46px,8vw,100px) clamp(14px,4vw,44px) clamp(56px,10vw,120px);
  max-width:1240px;margin:0 auto}
/* every section is a plane: it arrives flat and rotates away as it leaves */
.plane{transform-style:preserve-3d;will-change:transform,opacity;margin-bottom:clamp(18px,3vw,34px);
  background:var(--card);border:1px solid var(--bd);border-radius:20px;
  padding:clamp(18px,3.2vw,36px);position:relative;overflow:hidden;
  box-shadow:0 34px 70px -34px rgba(0,0,0,.95)}
.plane::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.5}
@media(prefers-reduced-motion:reduce){.plane{transform:none !important}}

.ph{display:flex;align-items:center;gap:13px;margin-bottom:20px;flex-wrap:wrap}
.ph .ix{font-family:var(--disp);font-size:.6rem;font-weight:700;letter-spacing:.16em;color:var(--acc);
  border:1px solid rgba(61,220,151,.32);padding:4px 10px;border-radius:7px;
  background:rgba(61,220,151,.08)}
.ph h2{font-size:clamp(1.05rem,2.2vw,1.5rem);font-weight:800;color:var(--off);letter-spacing:-.02em}
.ph u{text-decoration:none;margin-left:auto;font-family:var(--disp);font-size:.6rem;color:var(--d2);
  white-space:nowrap}

/* ── the player plane ── */
.screen{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;
  border:1px solid var(--bd2)}
.screen img.p{width:100%;height:100%;object-fit:cover;filter:brightness(.7);transition:.7s var(--ease)}
.screen:hover img.p{filter:brightness(.88);transform:scale(1.03)}
.screen video.c{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity 1.1s var(--ease)}
.screen video.c.on{opacity:.92}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5}
.screen .go{position:absolute;inset:0;z-index:3;border:0;background:transparent;cursor:pointer;
  display:grid;place-items:center}
.screen .go i{font-style:normal;width:clamp(58px,7.5vw,84px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;font-size:1.15rem;padding-left:4px;color:#04120c;background:var(--acc);
  box-shadow:0 0 44px rgba(61,220,151,.42);transition:.4s var(--ease)}
.screen .go:hover i{transform:scale(1.1)}
.tl{display:flex;align-items:center;gap:13px;margin-top:16px;flex-wrap:wrap}
.tl .t{font-family:var(--disp);font-size:.92rem;color:var(--acc);font-variant-numeric:tabular-nums}
.tl .rail{flex:1;min-width:130px;height:4px;background:var(--card2);border-radius:99px;position:relative;
  border:1px solid var(--bd)}
.tl .rail b{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:99px;width:0;
  transition:width .5s var(--ease);box-shadow:0 0 10px var(--acc)}
.tl .rail s{position:absolute;top:-5px;width:2px;height:12px;background:var(--d3);
  transform:translateX(-50%);text-decoration:none;cursor:pointer;transition:.3s}
.tl .rail s:hover{background:var(--acc);height:18px;top:-8px}

/* ── chapters: cards on the same track, tilting individually ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:13px;
  perspective:1000px}
.cc{background:var(--card2);border:1px solid var(--bd);border-radius:15px;overflow:hidden;
  cursor:pointer;transform-style:preserve-3d;transition:transform .5s var(--ease),border-color .4s,
  box-shadow .5s var(--ease)}
.cc:hover{border-color:rgba(61,220,151,.45);box-shadow:0 22px 44px -18px rgba(0,0,0,.9)}
.cc .im{position:relative;aspect-ratio:16/10;overflow:hidden;background:#000}
.cc .im img{width:100%;height:100%;object-fit:cover;filter:brightness(.66) saturate(.85);
  transition:.6s var(--ease)}
.cc:hover .im img{filter:brightness(.95) saturate(1);transform:scale(1.08)}
.cc .im .n{position:absolute;top:9px;left:11px;font-family:var(--disp);font-size:1.6rem;
  font-weight:700;color:rgba(255,255,255,.28);line-height:1}
.cc .im .at{position:absolute;bottom:8px;left:10px;font-family:var(--disp);font-size:.62rem;
  font-weight:700;color:#04120c;background:var(--acc);padding:2px 8px;border-radius:5px}
.cc .tx{padding:13px 14px 16px}
.cc .tx b{display:block;font-size:.87rem;font-weight:700;color:var(--off);line-height:1.3}
.cc .tx span{display:block;font-size:.74rem;line-height:1.62;margin-top:5px}

/* ── stills: a depth wall — each tile sits at its own z ── */
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:11px;
  perspective:900px}
.tile{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:#000;
  transform-style:preserve-3d;transition:transform .55s var(--ease),box-shadow .55s var(--ease)}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;filter:brightness(.72);transition:.6s var(--ease)}
.tile:hover{transform:translateZ(46px) scale(1.03);box-shadow:0 26px 46px -18px rgba(0,0,0,.92);z-index:4}
.tile:hover img{filter:brightness(1.02)}
.tile .cp{position:absolute;left:0;right:0;bottom:0;padding:20px 9px 8px;
  background:linear-gradient(to top,rgba(0,0,0,.92),transparent);display:flex;justify-content:space-between;
  gap:7px;font-size:.58rem;color:rgba(255,255,255,.85)}
.tile .cp em{font-style:normal;color:var(--acc);font-weight:700;font-size:.53rem}

/* ── route: the map is a tilted plane you look across ── */
.rr{display:grid;grid-template-columns:1fr 262px;gap:clamp(18px,3vw,32px);align-items:center}
@media(max-width:860px){.rr{grid-template-columns:1fr;gap:22px}}
.floor{perspective:900px}
.mapp{position:relative;aspect-ratio:4/3;border:1px solid var(--bd2);border-radius:15px;overflow:hidden;
  background:var(--deep);transform:rotateX(16deg);transform-origin:50% 100%;
  transition:transform .8s var(--ease);will-change:transform}
.mapp:hover{transform:rotateX(4deg)}
.mapp::before{content:'';position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:30px 30px}
.mapp::after{content:'';position:absolute;inset:0;
  background:radial-gradient(58% 58% at 50% 44%,rgba(61,220,151,.11),transparent 72%)}
.mapp svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible}
.mapp .gh{fill:none;stroke:var(--bd2);stroke-width:2;stroke-dasharray:4 6}
.mapp .ln{fill:none;stroke:var(--acc);stroke-width:2.8;stroke-linecap:round;
  filter:drop-shadow(0 0 9px var(--acc));stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  transition:stroke-dashoffset 2.4s var(--ease) .25s}
.plane.in .mapp .ln{stroke-dashoffset:0}
.mapp .dot{r:6;fill:var(--acc);filter:drop-shadow(0 0 12px var(--acc))}
.mapp .pin{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;
  gap:7px;opacity:0;transition:opacity .7s var(--ease)}
.plane.in .mapp .pin{opacity:1}
.mapp .pin b{width:8px;height:8px;border-radius:50%;background:var(--off);
  box-shadow:0 0 0 3px rgba(8,10,18,.9)}
.mapp .pin.edge b{width:12px;height:12px;background:var(--acc);
  box-shadow:0 0 0 3px rgba(8,10,18,.9),0 0 13px var(--acc)}
.mapp .pin s{text-decoration:none;font-family:var(--disp);font-size:.58rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--off);background:rgba(8,10,18,.88);
  padding:3px 8px;border-radius:5px;border:1px solid var(--bd);white-space:nowrap}
.rx .md{display:inline-block;font-family:var(--disp);font-size:.55rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--acc);border:1px solid rgba(61,220,151,.34);padding:4px 11px;
  border-radius:99px;margin-bottom:12px;background:rgba(61,220,151,.08)}
.rx h3{font-size:1.06rem;font-weight:800;color:var(--off);line-height:1.26;margin-bottom:10px;
  letter-spacing:-.015em}
.rx p{font-size:.79rem;line-height:1.74;margin-bottom:14px}
.rx .kv{display:flex;flex-direction:column;gap:1px;background:var(--bd);border:1px solid var(--bd);
  border-radius:11px;overflow:hidden}
.rx .kv div{background:var(--deep);padding:9px 12px;display:flex;justify-content:space-between;gap:9px}
.rx .kv span{font-family:var(--disp);font-size:.55rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--d2)}
.rx .kv b{font-family:var(--disp);font-size:.78rem;color:var(--off)}
.rx .hl{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.rx .hl u{text-decoration:none;font-size:.55rem;font-weight:600;padding:4px 9px;border-radius:99px;
  background:var(--card2);border:1px solid var(--bd);color:var(--d1)}

/* ── instagram: cards that tilt to the pointer ── */
.igs{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:13px;perspective:900px}
.igc{position:relative;aspect-ratio:9/16;border-radius:15px;overflow:hidden;background:#000;
  border:1px solid var(--bd);cursor:pointer;transform-style:preserve-3d;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .4s}
.igc:hover{border-color:rgba(255,92,122,.5);box-shadow:0 26px 50px -20px rgba(0,0,0,.92)}
.igc img{width:100%;height:100%;object-fit:cover;filter:brightness(.58);transition:.6s var(--ease)}
.igc:hover img{filter:brightness(.88)}
.igc iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5;background:#000}
.igc .lg{position:absolute;top:9px;left:9px;z-index:3;width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;font-size:.6rem;color:#fff;
  background:linear-gradient(135deg,#f9ce34,#ee2a7b 55%,#6228d7);transform:translateZ(24px)}
.igc .pp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateZ(30px);z-index:3;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;
  padding-left:2px;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.32);
  backdrop-filter:blur(5px);transition:.4s var(--ease)}
.igc:hover .pp{background:var(--hot);border-color:var(--hot)}
.igc .cp{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:24px 11px 11px;
  background:linear-gradient(to top,rgba(0,0,0,.94),transparent);transform:translateZ(16px)}
.igc .cp b{display:block;font-size:.68rem;font-weight:700;color:#fff;line-height:1.38}
.igc .cp span{display:block;font-size:.52rem;color:var(--acc2);margin-top:4px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* ── posts + videos, side by side ── */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,32px)}
@media(max-width:900px){.duo{grid-template-columns:1fr;gap:26px}}
.rowlist{display:flex;flex-direction:column;gap:9px}
.rowlist a{display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center;text-decoration:none;
  background:var(--card2);border:1px solid var(--bd);border-radius:13px;overflow:hidden;
  transition:.45s var(--ease)}
.rowlist a:hover{border-color:rgba(61,220,151,.42);transform:translateX(7px)}
.rowlist .th{width:82px;aspect-ratio:1;overflow:hidden;background:#000;position:relative}
.rowlist .th img{width:100%;height:100%;object-fit:cover;filter:brightness(.74);transition:.5s var(--ease)}
.rowlist a:hover .th img{filter:brightness(1);transform:scale(1.09)}
.rowlist .th i{position:absolute;bottom:4px;left:5px;font-style:normal;font-size:.85rem}
.rowlist .th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .4s}
.rowlist a:hover .th video{opacity:1}
.rowlist .tx{padding:10px 12px 10px 0;min-width:0}
.rowlist .tx u{text-decoration:none;font-family:var(--disp);font-size:.5rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.rowlist .tx b{display:block;font-size:.82rem;font-weight:700;color:var(--off);line-height:1.3;
  margin:4px 0 2px}
.rowlist .tx span{display:block;font-size:.68rem;line-height:1.52;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── closing plane: the bike spin ── */
.outro{text-align:center}
.spin{position:relative;width:min(620px,100%);margin:0 auto;aspect-ratio:16/10}
.spin img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;
  filter:drop-shadow(0 26px 44px rgba(0,0,0,.6))}
.spin img.on{opacity:1}
.spin::after{content:'';position:absolute;left:12%;right:12%;bottom:4%;height:14%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(61,220,151,.24),transparent 72%);filter:blur(14px)}
.outro h2{font-size:clamp(1.5rem,4.4vw,2.7rem);font-weight:900;color:var(--off);letter-spacing:-.03em;
  line-height:1.06;margin-top:8px}
.outro p{max-width:46ch;margin:12px auto 0;font-size:.88rem;line-height:1.78}
.outro .sc{font-family:var(--disp);font-size:.56rem;font-weight:700;letter-spacing:.24em;
  text-transform:uppercase;color:var(--d3);margin-top:14px}
.outro .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.outro .btns a{text-decoration:none;font-family:var(--disp);font-size:.62rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;padding:12px 24px;border-radius:99px;
  transition:.4s var(--ease)}
.outro .btns a.y{background:var(--acc);color:#04120c}
.outro .btns a.i{border:1px solid var(--bd2);color:var(--off)}
.outro .btns a:hover{transform:translateY(-3px)}
.outro .btns a.i:hover{border-color:var(--hot);color:var(--hot)}

/* ── empty state ── */
.empty{min-height:80vh;display:grid;place-items:center;text-align:center;padding:100px 24px 60px;
  position:relative;z-index:5}
.empty .in{max-width:480px}
.empty .ic{font-size:2.9rem;margin-bottom:16px;animation:bob 3.4s var(--ease) infinite}
@keyframes bob{50%{transform:translateY(-11px)}}
.empty b{display:block;font-family:var(--disp);font-size:.58rem;font-weight:700;letter-spacing:.28em;
  text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.empty h2{font-size:clamp(1.5rem,4.6vw,2.5rem);font-weight:900;color:var(--off);letter-spacing:-.03em;
  line-height:1.1;margin-bottom:14px}
.empty p{font-size:.9rem;line-height:1.8}
.empty .rr2{height:2px;background:var(--bd);margin:24px 0;position:relative;overflow:hidden;
  border-radius:9px}
.empty .rr2 i{position:absolute;inset:0;width:38%;background:var(--acc);
  animation:sweep 2.6s var(--ease) infinite}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(270%)}}
</style>
</head>
<body>
<div class="horizon"></div>
<div class="scan"></div>
<div class="chrome">
  <a class="b" href="vlog-data-design-preview.html"><i>←</i> Designs</a>
  <span class="id" id="cid"></span>
  <span class="z" id="cz">0%</span>
</div>
<div class="bar" id="cbar"></div>
<div id="app"></div>

<script src="vlog-data.js"></script>
<script>
const D = window.VLOG
const app = document.getElementById('app')
const $ = s => document.querySelector(s)

if (D.isEmpty) {
  $('#cid').textContent = 'VLOG / —'
  app.innerHTML = `
    <div class="empty"><div class="in">
      <div class="ic">🛰</div><b>Standing by</b>
      <h2>No ride on the stage yet</h2>
      <div class="rr2"><i></i></div>
      <p>The rig is mounted and ${D.routes.length} rides are already plotted. The first one filmed
         gets the full depth treatment — layered hero, tilted route plane and the Bear turning
         at the end of it.</p>
    </div></div>`
} else {
  render(D.current())
}

function render(V) {
  $('#cid').textContent = `VLOG / ${V.cat} / ${String(V.n).padStart(2, '0')}`

  const plane = (ix, title, note, body, cls) => `
    <section class="plane${cls ? ' ' + cls : ''}">
      <div class="ph"><span class="ix">${ix}</span><h2>${title}</h2>
        ${note ? `<u>${note}</u>` : ''}</div>
      ${body}
    </section>`

  app.innerHTML = `
  <!-- ══ layered hero ══ -->
  <div class="hero" id="hero">
    <div class="layers" id="layers">
      <div class="L far"  data-depth="0.14"><img src="${V.still}" alt="" /></div>
      <div class="L mid"  data-depth="0.30"></div>
      <div class="L grid" data-depth="0.52"></div>
      <div class="L vig"></div>
    </div>
    <div class="herotype" id="herotype">
      <div class="tag"><b>${V.cat}</b><i></i>
        <s>${V.when.label} · ${V.kind} · ${V.duration}</s></div>
      <h1>${V.title.split(' ').map((w, i) =>
        `<span class="w"><span style="animation-delay:${0.3 + i * 0.05}s">${w}</span></span>`).join(' ')}</h1>
      <p class="lede">${V.blurb}</p>
      <div class="gauges">
        ${[[V.duration, 'Runtime'], [V.views, 'Views'], [V.chapters.length, 'Chapters'],
           [V.route.distance, 'Route'], [V.insta.length, 'Reels']]
          .map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('')}
      </div>
    </div>
    <div class="hint"><i></i> Scroll · move the pointer</div>
  </div>

  <!-- ══ the track ══ -->
  <div class="track">
    ${plane('01', 'Watch', `${V.kind} · ${V.duration}`, `
      <div class="screen" id="screen">
        <img class="p" src="${V.posterBig}" alt="" onerror="this.src='${V.still}'" />
        ${V.clip ? `<video class="c" id="cl" src="${V.clip}" muted loop playsinline preload="metadata"></video>` : ''}
        <button class="go" id="go" aria-label="Play"><i>▶</i></button>
      </div>
      <div class="tl">
        <span class="t" id="now">0:00</span>
        <div class="rail" id="rail"><b id="fill"></b>
          ${V.chapters.map(c => `<s data-seek="${c.sec}" style="left:${c.pct}%" title="${c.title}"></s>`).join('')}
        </div>
        <span class="t">${V.duration}</span>
      </div>`)}

    ${plane('02', 'Chapters', `${V.chapters.length} marks · click to seek`, `
      <div class="cards" id="cards">
        ${V.chapters.map((c, i) => `
          <div class="cc" data-seek="${c.sec}">
            <div class="im"><img src="${c.photo}" alt="" loading="lazy" />
              <span class="n">${String(i + 1).padStart(2, '0')}</span>
              <span class="at">${c.at}</span></div>
            <div class="tx"><b>${c.title}</b><span>${c.blurb}</span></div>
          </div>`).join('')}
      </div>`)}

    ${plane('03', 'Frames', `${V.stills.length} grabs · hover for depth`, `
      <div class="wall">
        ${V.stills.map(s => `
          <figure class="tile"><img src="${s.src}" alt="" loading="lazy" />
            <figcaption class="cp"><span>${s.cap}</span><em>${s.at}</em></figcaption></figure>`).join('')}
      </div>`)}

    ${plane('04', 'The Route', `${V.route.distance} · ${V.route.mode}`, `
      <div class="rr">
        <div class="floor">
          <div class="mapp" id="mapp">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path class="gh" id="gh" d="" vector-effect="non-scaling-stroke" />
              <path class="ln" id="ln" d="" vector-effect="non-scaling-stroke" />
              <circle class="dot" id="dot" cx="0" cy="0" />
            </svg>
            ${V.route.stops.map(s => `
              <div class="pin${s.first || s.last ? ' edge' : ''}"
                   style="left:${s.x}%;top:${s.y}%"><b></b><s>${s.label}</s></div>`).join('')}
          </div>
        </div>
        <div class="rx">
          <span class="md">${V.route.mode} · ${V.route.date}</span>
          <h3>${V.route.name}</h3>
          <p>${V.route.story}</p>
          <div class="kv">
            <div><span>Distance</span><b>${V.route.distance}</b></div>
            <div><span>Stops</span><b>${V.route.stops.length}</b></div>
            <div><span>States</span><b>${V.route.states.join(', ')}</b></div>
          </div>
          <div class="hl">${V.route.highlights.map(h => `<u>${h}</u>`).join('')}</div>
        </div>
      </div>`)}

    ${plane('05', 'On Instagram', `${D.social.handle} · tap to load`, `
      <div class="igs" id="igs">
        ${V.insta.map(r => `
          <div class="igc" data-embed="${r.embed}">
            <img src="${r.still}" alt="" loading="lazy" />
            <div class="lg">◙</div><div class="pp">▶</div>
            <div class="cp"><b>${r.caption}</b><span>${r.tags.slice(0, 3).join(' ')}</span></div>
          </div>`).join('')}
      </div>`)}

    ${plane('06', 'Read & Watch', `${D.posts.length} posts · ${D.count} videos`, `
      <div class="duo">
        <div>
          <div class="rowlist">
            ${V.posts.map(p => `
              <a href="${p.href}">
                <div class="th"><img src="${p.cover}" alt="" loading="lazy" /><i>${p.icon}</i></div>
                <div class="tx"><u>${p.cat} · ${p.when.short}</u><b>${p.title}</b>
                  <span>${p.excerpt}</span></div></a>`).join('')}
          </div>
        </div>
        <div>
          <div class="rowlist">
            ${V.related.slice(0, 4).map(r => `
              <a href="?v=${r.yt}">
                <div class="th"><img src="${r.poster}" alt="" loading="lazy" onerror="this.src='${r.still}'" />
                  ${r.clip ? `<video src="${r.clip}" muted loop playsinline preload="none"></video>` : ''}</div>
                <div class="tx"><u>${r.cat} · ${r.duration}</u><b>${r.title}</b>
                  <span>${r.blurb}</span></div></a>`).join('')}
          </div>
        </div>
      </div>`)}

    <section class="plane outro" id="outro">
      <div class="spin" id="spin"></div>
      <h2>Filmed off the Bear 650</h2>
      <p>${D.count} videos, ${D.insta.length} reels and ${D.posts.length} posts so far — with
         ${D.routes.length} rides already plotted and nothing filmed off them yet.</p>
      <div class="sc">Scroll to turn the bike</div>
      <div class="btns">
        <a class="y" href="${V.url}" target="_blank" rel="noopener">Watch on YouTube</a>
        <a class="i" href="${D.social.instagram}" target="_blank" rel="noopener">Follow on Instagram</a>
      </div>
    </section>
  </div>`

  wire(V)
}

function wire(V) {
  const clamp01 = n => Math.min(1, Math.max(0, n))
  const lerp = (a, b, t) => a + (b - a) * t

  /* ══ HERO: scroll drives the layer offsets, pointer drives the tilt ══ */
  const hero = $('#hero'), layers = $('#layers'), herotype = $('#herotype')
  const Ls = [...document.querySelectorAll('.L[data-depth]')]
  let tx = 0, ty = 0, cx = 0, cy = 0        // pointer target and eased current

  addEventListener('pointermove', e => {
    tx = (e.clientX / innerWidth - 0.5) * 2
    ty = (e.clientY / innerHeight - 0.5) * 2
  }, { passive: true })

  function heroFrame() {
    /* ease the tilt so it trails the pointer rather than snapping to it */
    cx = lerp(cx, tx, 0.075)
    cy = lerp(cy, ty, 0.075)
    const p = clamp01(scrollY / innerHeight)

    layers.style.transform =
      `rotateY(${cx * 5}deg) rotateX(${-cy * 4}deg) scale(1.02)`
    /* each layer takes the same scroll and the same tilt at its own strength —
       that difference is the whole depth effect */
    Ls.forEach(L => {
      const d = +L.dataset.depth
      L.style.transform =
        `translate3d(${cx * -26 * d}px, ${p * -160 * d + cy * -18 * d}px, 0)`
    })
    /* the type is the nearest thing to you: biggest tilt, fastest exit */
    herotype.style.transform =
      `translate3d(${cx * -34}px, ${p * -110}px, 60px)`
    herotype.style.opacity = 1 - clamp01(p / 0.72)
    requestAnimationFrame(heroFrame)
  }
  requestAnimationFrame(heroFrame)

  /* ══ the perspective track: each plane rotates as it passes ══ */
  const planes = [...document.querySelectorAll('.plane')]
  function tilt() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return
    planes.forEach(pl => {
      const r = pl.getBoundingClientRect()
      if (r.bottom < -300 || r.top > innerHeight + 300) return
      /* -1 well above the middle … +1 well below it */
      const c = (r.top + r.height / 2 - innerHeight / 2) / innerHeight
      const k = Math.max(-1, Math.min(1, c))
      pl.style.transform =
        `rotateX(${k * -7}deg) translateZ(${-Math.abs(k) * 90}px) scale(${1 - Math.abs(k) * 0.035})`
      pl.style.opacity = 1 - Math.abs(k) * 0.35
    })
  }

  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('in')
  }), { threshold: 0.18 })
  planes.forEach(p => io.observe(p))

  /* ── the player ── */
  const screen = $('#screen'), cl = $('#cl')
  if (cl) cl.play().then(() => cl.classList.add('on')).catch(() => {})
  function seek(sec) {
    let f = screen.querySelector('iframe')
    if (!f) {
      f = document.createElement('iframe')
      f.allow = 'autoplay; encrypted-media; picture-in-picture'
      f.allowFullscreen = true
      screen.appendChild(f)
    }
    f.src = `${V.embed}?autoplay=1&start=${sec}&rel=0&modestbranding=1`
    $('#go').style.display = 'none'
    if (cl) cl.style.display = 'none'
    const c = V.chapters.reduce((a, b) => (b.sec <= sec ? b : a), V.chapters[0])
    $('#fill').style.width = c.pct + '%'
    $('#now').textContent = c.at
  }
  $('#go').addEventListener('click', () => seek(0))
  document.querySelectorAll('[data-seek]').forEach(el => el.addEventListener('click', () => {
    seek(+el.dataset.seek)
    screen.scrollIntoView({ behavior: 'smooth', block: 'center' })
  }))

  /* ── cards and reels tilt toward the pointer individually ── */
  function tiltable(sel, strength) {
    document.querySelectorAll(sel).forEach(el => {
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect()
        const px = (e.clientX - r.left) / r.width - 0.5
        const py = (e.clientY - r.top) / r.height - 0.5
        el.style.transform =
          `rotateY(${px * strength}deg) rotateX(${-py * strength}deg) translateZ(26px)`
      })
      el.addEventListener('pointerleave', () => { el.style.transform = '' })
    })
  }
  tiltable('.cc', 9)
  tiltable('.igc', 11)

  /* ── the route ── */
  const ln = $('#ln'), gh = $('#gh'), dot = $('#dot'), mapp = $('#mapp')
  const stops = V.route.stops
  const path = stops.map((s, i) => {
    if (i === 0) return `M ${s.x} ${s.y}`
    const p = stops[i - 1]
    const cxx = (p.x + s.x) / 2 + (s.y - p.y) * 0.16
    const cyy = (p.y + s.y) / 2 - (s.x - p.x) * 0.16
    return `Q ${cxx} ${cyy} ${s.x} ${s.y}`
  }).join(' ')
  ln.setAttribute('d', path); gh.setAttribute('d', path)
  const len = ln.getTotalLength()
  ln.style.setProperty('--len', len)
  function ride() {
    const r = mapp.getBoundingClientRect()
    const p = clamp01((innerHeight * 0.85 - r.top) / (r.height + innerHeight * 0.45))
    const pt = ln.getPointAtLength(len * p)
    dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y)
  }

  /* ── Instagram embeds on tap ── */
  document.querySelectorAll('.igc').forEach(c => c.addEventListener('click', () => {
    if (c.querySelector('iframe')) return
    const f = document.createElement('iframe')
    f.src = c.dataset.embed; f.loading = 'lazy'; f.allowFullscreen = true
    f.setAttribute('scrolling', 'no')
    c.appendChild(f)
  }))

  /* ── related clips on hover ── */
  document.querySelectorAll('.rowlist video').forEach(v => {
    const a = v.closest('a')
    a.addEventListener('mouseenter', () => { v.currentTime = 0; v.play().catch(() => {}) })
    a.addEventListener('mouseleave', () => v.pause())
  })

  /* ══ the closing spin: 37 frames of the Bear, swapped from scroll ══
     All of them are stacked and toggled rather than swapping one src, so
     the browser never has to decode a new image mid-scroll. */
  const FRAMES = 37
  const spin = $('#spin')
  spin.innerHTML = Array.from({ length: FRAMES }, (_, i) =>
    `<img src="${D.bike(i + 1)}" alt="${i === 0 ? 'Royal Enfield Bear 650' : ''}"
       ${i === 0 ? 'class="on"' : ''} loading="${i < 4 ? 'eager' : 'lazy'}" />`).join('')
  const frames = [...spin.children]
  let shown = 0
  function turn() {
    const r = spin.getBoundingClientRect()
    /* the spin runs across the window either side of the section */
    const p = clamp01((innerHeight - r.top) / (innerHeight + r.height))
    const i = Math.min(FRAMES - 1, Math.max(0, Math.round(p * (FRAMES - 1))))
    if (i === shown) return
    frames[shown].classList.remove('on')
    frames[i].classList.add('on')
    shown = i
  }

  /* ── chrome readout ── */
  function prog() {
    const max = document.documentElement.scrollHeight - innerHeight
    const p = clamp01(scrollY / Math.max(1, max))
    $('#cbar').style.width = p * 100 + '%'
    $('#cz').textContent = Math.round(p * 100) + '%'
  }

  let raf = null
  addEventListener('scroll', () => {
    if (raf) return
    raf = requestAnimationFrame(() => { prog(); tilt(); ride(); turn(); raf = null })
  }, { passive: true })
  addEventListener('resize', () => { tilt(); ride(); turn() })
  prog(); tilt(); ride(); turn()
}
</script>
</body>
</html>
