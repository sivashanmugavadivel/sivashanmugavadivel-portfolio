name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let in-progress Pages deployments finish — cancelling mid-sync causes
  # "Deployment failed, try again later" (GitHub's recommended setting).
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pinned here on purpose — it comes from package.json's
      # "packageManager" field, so CI always runs the same pnpm as local.
      # Pinning it separately is what broke the build: pnpm 10+ moved
      # `pnpm.overrides` out of package.json into pnpm-workspace.yaml, and
      # pnpm 9 rejects that file for having no `packages:` field.
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
