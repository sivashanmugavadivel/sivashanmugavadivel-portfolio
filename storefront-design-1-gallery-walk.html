<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Storefront · 1 · Gallery Walk</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════
   GALLERY WALK — the page scrolls sideways, not down.
   No top header: a vertical rail on the left is the only nav.
   Products hang like frames on a wall, two rows deep.
   ══════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bone:#efece4; --bone2:#e5e1d6; --ink:#12110f; --red:#d1341f;
  --d1:rgba(18,17,15,0.62); --d2:rgba(18,17,15,0.38); --d3:rgba(18,17,15,0.18);
  --hair:rgba(18,17,15,0.14);
  --sans:'Archivo',sans-serif; --serif:'Instrument Serif',Georgia,serif;
  --ease:cubic-bezier(.16,1,.3,1); --rail:86px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bone);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--red);color:var(--bone)}

.app{display:flex;height:100vh}

/* ── left rail: brand runs vertically, dots mark the walk ── */
.rail{width:var(--rail);flex-shrink:0;border-right:1px solid var(--hair);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:22px 0;background:var(--bone);z-index:20}
.sig{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--serif);font-size:1.05rem;
  letter-spacing:0.04em;color:var(--ink);display:flex;align-items:center;gap:14px}
.sig em{font-style:italic;color:var(--red)}
.sig::after{content:'';width:1px;height:34px;background:var(--hair)}
.marks{display:flex;flex-direction:column;gap:14px;align-items:center}
.mk{width:9px;height:9px;border-radius:50%;border:1px solid var(--d3);background:transparent;
  cursor:pointer;padding:0;position:relative;transition:.35s var(--ease)}
.mk:hover{border-color:var(--ink);transform:scale(1.3)}
.mk.on{background:var(--red);border-color:var(--red);transform:scale(1.25)}
.mk b{position:absolute;left:20px;top:50%;transform:translateY(-50%) translateX(-6px);
  font-size:0.62rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink);
  white-space:nowrap;opacity:0;pointer-events:none;transition:.3s var(--ease);
  background:var(--ink);color:var(--bone);padding:4px 9px;border-radius:3px}
.mk:hover b{opacity:1;transform:translateY(-50%) translateX(0)}
.railfoot{writing-mode:vertical-rl;font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--d2)}

/* ── the wall: one long horizontal track ── */
.track{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;align-items:stretch;
  scroll-behavior:smooth;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track > *{flex-shrink:0;height:100vh}

/* opening wall text */
.intro{width:clamp(400px,54vw,760px);padding:0 clamp(30px,5vw,80px);
  display:flex;flex-direction:column;justify-content:center;gap:22px;border-right:1px solid var(--hair)}
.kick{font-size:0.63rem;font-weight:600;letter-spacing:0.28em;text-transform:uppercase;color:var(--red);
  display:flex;align-items:center;gap:12px;opacity:0;animation:fade .8s var(--ease) .15s forwards}
.kick::after{content:'';flex:1;height:1px;background:var(--hair);max-width:90px}
h1{font-family:var(--serif);font-size:clamp(2.8rem,7.5vw,6.4rem);line-height:0.92;letter-spacing:-0.02em;
  color:var(--ink);font-weight:400}
h1 .w{display:block;overflow:hidden}
h1 .w span{display:block;transform:translateY(105%);animation:rise 1.05s var(--ease) forwards}
h1 em{font-style:italic;color:var(--red)}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
.intro p{max-width:390px;font-size:0.95rem;line-height:1.75;
  opacity:0;transform:translateY(14px);animation:up .9s var(--ease) .8s forwards}
@keyframes up{to{opacity:1;transform:none}}
.tally{display:flex;gap:34px;padding-top:12px;border-top:1px solid var(--hair);
  opacity:0;transform:translateY(14px);animation:up .9s var(--ease) .95s forwards}
.tally div b{display:block;font-family:var(--serif);font-size:2rem;color:var(--ink);line-height:1}
.tally div span{font-size:0.6rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--d2)}
.hint{display:inline-flex;align-items:center;gap:10px;font-size:0.66rem;font-weight:600;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--d2);
  opacity:0;animation:fade .9s var(--ease) 1.2s forwards}
.hint i{display:block;width:44px;height:1px;background:var(--ink);position:relative;animation:nudge 2.2s var(--ease) infinite}
.hint i::after{content:'';position:absolute;right:0;top:-3px;width:7px;height:7px;
  border-top:1px solid var(--ink);border-right:1px solid var(--ink);transform:rotate(45deg)}
@keyframes nudge{50%{transform:translateX(9px)}}

/* category marker: a rotated title slab between rooms */
.room{width:118px;border-right:1px solid var(--hair);background:var(--bone2);
  display:flex;align-items:center;justify-content:center;position:relative}
.room .vert{writing-mode:vertical-rl;font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.6rem);
  color:var(--ink);letter-spacing:0.01em;display:flex;align-items:center;gap:20px}
.room .vert i{font-style:normal;font-size:1rem}
.room .no{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:0.62rem;
  font-weight:700;letter-spacing:0.16em;color:var(--red)}
.room .qty{position:absolute;bottom:26px;left:0;right:0;text-align:center;writing-mode:vertical-rl;
  margin:0 auto;font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--d2)}

/* the frames, two rows deep, flowing sideways */
.room-items{display:grid;grid-template-rows:1fr 1fr;grid-auto-flow:column;gap:0;
  border-right:1px solid var(--hair)}
.frame{width:clamp(230px,22vw,310px);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;position:relative;
  background:var(--bone);transition:background .45s var(--ease);
  opacity:0;transform:translateY(24px);animation:frameIn .8s var(--ease) forwards}
@keyframes frameIn{to{opacity:1;transform:none}}
.room-items .frame:nth-child(2n){border-bottom:0}
.frame:hover{background:#fff}
.frame .idx{font-size:0.58rem;font-weight:700;letter-spacing:0.18em;color:var(--d3);transition:color .3s}
.frame:hover .idx{color:var(--red)}
.plate{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  cursor:zoom-in;overflow:hidden}
.plate img{max-width:100%;max-height:100%;object-fit:contain;
  transition:transform .7s var(--ease),opacity .25s;mix-blend-mode:multiply}
.frame:hover .plate img{transform:scale(1.07)}
.plate .none{font-size:2rem;opacity:0.16}
.plate .tag{position:absolute;top:0;right:0;font-size:0.55rem;font-weight:700;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--red);border:1px solid var(--red);padding:2px 7px;border-radius:2px}
/* thin sheet of thumbnails, revealed on hover */
.sheet{display:flex;gap:5px;height:0;overflow:hidden;transition:height .4s var(--ease)}
.frame:hover .sheet{height:30px}
.sheet button{flex:1;padding:0;border:1px solid var(--hair);background:transparent;cursor:pointer;
  overflow:hidden;opacity:0.5;transition:.24s}
.sheet button:hover{opacity:0.85}
.sheet button.on{opacity:1;border-color:var(--ink)}
.sheet img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.cap{border-top:1px solid var(--hair);padding-top:11px;display:flex;flex-direction:column;gap:8px}
.cap h3{font-family:var(--serif);font-size:1.02rem;font-weight:400;color:var(--ink);line-height:1.25}
.cap .from{font-size:0.6rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--d2)}
.buys{display:flex;gap:6px;flex-wrap:wrap}
.buy{font-size:0.65rem;font-weight:600;letter-spacing:0.06em;text-decoration:none;padding:7px 12px;
  border:1px solid var(--ink);color:var(--ink);transition:.28s var(--ease);white-space:nowrap}
.buy:hover{background:var(--ink);color:var(--bone)}
.buy.p{background:var(--ink);color:var(--bone)}
.buy.p:hover{background:var(--red);border-color:var(--red)}
.soon{font-size:0.64rem;color:var(--d3);font-style:italic}

/* closing panel */
.outro{width:clamp(320px,34vw,480px);padding:0 clamp(30px,4vw,60px);
  display:flex;flex-direction:column;justify-content:center;gap:20px;background:var(--ink);color:rgba(239,236,228,0.6)}
.outro h2{font-family:var(--serif);font-size:clamp(1.8rem,4vw,3rem);color:var(--bone);line-height:1.05}
.outro h2 em{font-style:italic;color:var(--red)}
.outro p{font-size:0.9rem;line-height:1.7;max-width:300px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:13px 24px;
  border:1px solid rgba(239,236,228,0.3);color:var(--bone);text-decoration:none;font-size:0.72rem;
  font-weight:600;letter-spacing:0.13em;text-transform:uppercase;transition:.3s var(--ease)}
.back:hover{background:var(--red);border-color:var(--red);transform:translateX(-5px)}

/* walk progress along the bottom */
.hbar{position:fixed;left:var(--rail);right:0;bottom:0;height:2px;background:var(--hair);z-index:30}
.hbar i{display:block;height:100%;width:0;background:var(--red);transition:width .12s linear}

/* lightbox */
.lb{position:fixed;inset:0;z-index:999;background:rgba(239,236,228,0.97);display:none;
  align-items:center;justify-content:center;padding:60px}
.lb.on{display:flex;animation:fade .3s}
.lb img{max-width:84vw;max-height:76vh;object-fit:contain;mix-blend-mode:multiply;animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.lb .cap2{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-family:var(--serif);
  font-style:italic;font-size:0.95rem;color:var(--ink)}
.lb button{position:absolute;width:44px;height:44px;border:1px solid var(--hair);background:var(--bone);
  color:var(--ink);font-size:1.05rem;cursor:pointer;transition:.22s}
.lb button:hover{background:var(--ink);color:var(--bone)}
.lb .x{top:24px;right:24px}.lb .prev{left:24px;top:50%}.lb .next{right:24px;top:50%}

@media(max-width:760px){
  html,body{overflow:visible;height:auto}
  .app{flex-direction:column;height:auto}
  .rail{width:100%;height:auto;flex-direction:row;justify-content:space-between;padding:12px 16px;
    border-right:0;border-bottom:1px solid var(--hair);position:sticky;top:0}
  .sig,.railfoot{writing-mode:horizontal-tb;transform:none}
  .marks{flex-direction:row}
  .track{flex-direction:column;overflow:visible;height:auto}
  .track > *{height:auto;width:100%!important}
  .intro{padding:60px 22px}
  .room{padding:26px 22px;justify-content:flex-start}
  .room .vert{writing-mode:horizontal-tb}
  .room .no,.room .qty{position:static;text-align:left;writing-mode:horizontal-tb;margin-top:8px}
  .room-items{grid-template-rows:none;grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .frame{width:auto;padding:16px 16px 18px}
  .hbar{display:none}
  .outro{padding:50px 22px calc(60px + env(safe-area-inset-bottom))}
}
@media(max-width:420px){
  .room-items{grid-template-columns:1fr}
  .rail{gap:10px}
  .sig{font-size:0.9rem}
  .sig::after{display:none}
  .railfoot{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="sig">The <em>Storefront</em></div>
    <div class="marks" id="marks"></div>
    <div class="railfoot">Bear 650</div>
  </aside>

  <div class="track" id="track">
    <section class="intro">
      <div class="kick">Room by room</div>
      <h1>
        <span class="w"><span style="animation-delay:.16s">A wall of</span></span>
        <span class="w"><span style="animation-delay:.3s"><em>everything</em></span></span>
        <span class="w"><span style="animation-delay:.44s">fitted</span></span>
      </h1>
      <p id="lede"></p>
      <div class="tally" id="tally"></div>
      <div class="hint"><i></i>Scroll to walk</div>
    </section>
    <!-- rooms injected here -->
    <section class="outro">
      <h2>That's the <em>whole</em> wall.</h2>
      <p>Nothing on this page was sent for free. Every part was bought, fitted and ridden.</p>
      <a class="back" href="#">← Back to My Garage</a>
    </section>
  </div>
</div>

<div class="hbar"><i id="hbar"></i></div>

<div class="lb" id="lb">
  <button class="x" onclick="closeLb()">✕</button>
  <button class="prev" onclick="stepLb(-1)">‹</button>
  <button class="next" onclick="stepLb(1)">›</button>
  <img id="lbImg" alt="" />
  <div class="cap2" id="lbCap"></div>
</div>

<script src="storefront-data.js"></script>
<script>
document.getElementById('lede').textContent = SF.note

document.getElementById('tally').innerHTML = [
  ['Pieces', SF.count], ['Rooms', SF.cats.length], ['Plates', SF.photoCount],
].map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')

/* build the rooms and slot them before the closing panel */
let n = 0
const rooms = SF.cats.map((c, ci) => `
  <section class="room" id="room-${c.id}">
    <span class="no">${String(ci + 1).padStart(2, '0')}</span>
    <div class="vert"><i>${c.icon}</i>${c.label}</div>
    <span class="qty">${c.items.length} ${c.items.length === 1 ? 'piece' : 'pieces'}</span>
  </section>
  <section class="room-items">${c.items.map((it, i) => frame(it, c, ++n, i)).join('')}</section>`).join('')
document.querySelector('.outro').insertAdjacentHTML('beforebegin', rooms)

function frame(it, c, seq, i) {
  const imgs = it.imgs.map(f => SF.url(f))
  return `<article class="frame" style="animation-delay:${Math.min(i, 6) * 70 + 300}ms"
      data-imgs='${JSON.stringify(imgs)}' data-name="${it.name}">
    <div class="idx">No. ${String(seq).padStart(2, '0')}</div>
    <div class="plate" onclick="openLb(this)">
      ${it.featured ? '<span class="tag">On the bike</span>' : ''}
      ${imgs.length ? `<img src="${imgs[0]}" alt="${it.name}" loading="lazy" />` : `<span class="none">${c.icon}</span>`}
    </div>
    ${imgs.length > 1 ? `<div class="sheet">${imgs.map((s, k) =>
      `<button class="${k === 0 ? 'on' : ''}" onclick="pick(this,${k})"><img src="${s}" alt="" loading="lazy" /></button>`).join('')}</div>` : ''}
    <div class="cap">
      <h3>${it.name}</h3>
      <div class="from">${it.links.map(l => l[0]).join(' · ') || 'source pending'}</div>
      <div class="buys">
        ${it.links.length ? it.links.map(([v, u], k) =>
          `<a class="buy ${k === 0 ? 'p' : ''}" href="${u}" target="_blank" rel="noopener noreferrer">${v}</a>`).join('')
          : '<span class="soon">Link coming soon</span>'}
      </div>
    </div>
  </article>`
}

function pick(btn, k) {
  const f = btn.closest('.frame')
  const imgs = JSON.parse(f.dataset.imgs)
  const img = f.querySelector('.plate img')
  img.style.opacity = 0
  setTimeout(() => { img.src = imgs[k]; img.style.opacity = 1 }, 150)
  f.querySelectorAll('.sheet button').forEach((b, j) => b.classList.toggle('on', j === k))
  f.dataset.at = k
}

/* rail marks jump to a room */
const track = document.getElementById('track')
document.getElementById('marks').innerHTML = SF.cats.map(c =>
  `<button class="mk" data-room="room-${c.id}"><b>${c.label}</b></button>`).join('')
document.querySelectorAll('.mk').forEach(b => b.addEventListener('click', () => {
  const el = document.getElementById(b.dataset.room)
  track.scrollTo({ left: el.offsetLeft - 40, behavior: 'smooth' })
}))

/* vertical wheel drives horizontal travel */
track.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return
  if (innerWidth <= 760) return
  e.preventDefault()
  track.scrollLeft += e.deltaY * 1.35
}, { passive: false })

addEventListener('keydown', e => {
  if (document.getElementById('lb').classList.contains('on')) return
  if (e.key === 'ArrowRight') track.scrollLeft += 340
  if (e.key === 'ArrowLeft') track.scrollLeft -= 340
})

/* progress + which room you're standing in */
const marks = [...document.querySelectorAll('.mk')]
const rooomEls = SF.cats.map(c => document.getElementById('room-' + c.id))
track.addEventListener('scroll', () => {
  const max = track.scrollWidth - track.clientWidth
  document.getElementById('hbar').style.width = (max > 0 ? track.scrollLeft / max * 100 : 0) + '%'
  const at = track.scrollLeft + track.clientWidth * 0.35
  let cur = -1
  rooomEls.forEach((el, i) => { if (el.offsetLeft <= at) cur = i })
  marks.forEach((m, i) => m.classList.toggle('on', i === cur))
}, { passive: true })

/* lightbox */
let set = [], at = 0, who = ''
function openLb(plate) {
  const f = plate.closest('.frame')
  set = JSON.parse(f.dataset.imgs); if (!set.length) return
  at = +(f.dataset.at || 0); who = f.dataset.name
  paint(); document.getElementById('lb').classList.add('on')
}
function paint() {
  document.getElementById('lbImg').src = set[at]
  document.getElementById('lbCap').textContent = `${who} — plate ${at + 1} of ${set.length}`
}
function stepLb(d) { at = (at + d + set.length) % set.length; paint() }
function closeLb() { document.getElementById('lb').classList.remove('on') }
document.getElementById('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLb() })
addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('on')) return
  if (e.key === 'Escape') closeLb()
  if (e.key === 'ArrowRight') stepLb(1)
  if (e.key === 'ArrowLeft') stepLb(-1)
})
</script>
</body>
</html>
