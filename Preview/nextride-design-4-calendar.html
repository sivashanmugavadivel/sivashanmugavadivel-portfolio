<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Next Ride · 4 · Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════
   CALENDAR — a date block torn off a desk calendar and pinned to the page.

   Where the countdown card leads with "how soon", this one leads with
   WHEN, because a date is the thing you actually have to keep free. It is
   a physical object: a bound pad with a wire binding along the top, a
   thick block of leaves underneath the top sheet, and a curling corner
   that lifts as you approach it.

   The leaves under the top sheet are not decoration — there is one for
   each remaining day, stacked and offset, so a ride three weeks out has a
   visibly thick pad and the day before has almost nothing left to tear.
   The pad thins as the ride approaches, which is the countdown told in an
   object rather than a number.

   The month band takes the ride's own colour, so switching rides
   re-tints the block; the weekday reads red on a Sunday, the way a
   printed calendar prints its holidays.
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0b0a12; --paper:#fbf8f1; --paper2:#efe9dc; --edge:#ddd4c2;
  --dark:#191720; --d1:rgba(25,23,32,0.72); --d2:rgba(25,23,32,0.48);
  --d3:rgba(25,23,32,0.3); --hair:rgba(25,23,32,0.14);
  --disp:'Archivo',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1);
  --c:#dc2626;
}
body{background:var(--ink);color:rgba(244,242,247,0.6);font-family:var(--sans);
  min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:clamp(16px,4vw,42px)}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(70vw 60vh at 22% 18%,rgba(255,196,120,0.14),transparent 62%),
    radial-gradient(60vw 60vh at 82% 78%,rgba(120,90,220,0.13),transparent 64%),
    linear-gradient(160deg,#151220,#0b0a12 60%)}
::selection{background:var(--c);color:#fff}

.wrap{position:relative;z-index:2;width:min(100%,452px)}

/* ── the binding ── */
.bind{display:flex;justify-content:center;gap:clamp(20px,7vw,42px);margin-bottom:-9px;
  position:relative;z-index:5}
.bind i{width:11px;height:26px;border-radius:99px;
  background:linear-gradient(180deg,#8d93a2,#4a4e59 55%,#6b7180);
  box-shadow:0 2px 5px rgba(0,0,0,0.6)}

/* ── the pad ── */
.pad{position:relative;filter:drop-shadow(0 30px 60px rgba(0,0,0,0.72))}
/* the remaining leaves, one per day left — built in JS */
.leaves{position:absolute;left:0;right:0;top:0;bottom:0;z-index:0}
.leaves i{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:4px;
  background:var(--paper2);border:1px solid var(--edge)}

.sheet{position:relative;z-index:2;background:var(--paper);border-radius:4px;
  overflow:hidden;border:1px solid var(--edge)}
/* the curling corner */
.sheet::after{content:'';position:absolute;right:0;bottom:0;width:52px;height:52px;z-index:4;
  background:linear-gradient(315deg,var(--paper2) 0 48%,rgba(0,0,0,0.16) 50%,transparent 52%);
  border-bottom-right-radius:4px;pointer-events:none;
  transition:width .4s var(--ease),height .4s var(--ease)}
.wrap:hover .sheet::after{width:74px;height:74px}

/* the punched holes in the top sheet */
.holes{display:flex;justify-content:center;gap:clamp(20px,7vw,42px);padding:9px 0 0}
.holes i{width:13px;height:13px;border-radius:50%;background:var(--ink);
  box-shadow:inset 0 2px 3px rgba(0,0,0,0.7)}

/* the month band */
.band{background:var(--c);color:#fff;padding:8px 16px;display:flex;align-items:center;gap:10px;
  margin-top:8px;transition:background .7s var(--ease)}
.band b{font-family:var(--disp);font-weight:800;font-size:0.82rem;letter-spacing:0.26em;
  text-transform:uppercase}
.band u{margin-left:auto;text-decoration:none;font-size:0.56rem;font-weight:600;
  letter-spacing:0.18em;text-transform:uppercase;opacity:0.78}

/* the day */
.day{text-align:center;padding:clamp(10px,2vw,16px) 16px clamp(6px,1.4vw,10px)}
.day .num{font-family:var(--disp);font-weight:900;color:var(--dark);
  font-size:clamp(5rem,20vw,7.4rem);line-height:0.78;letter-spacing:-0.06em;
  font-variant-numeric:tabular-nums;display:block}
.day .wd{font-family:var(--disp);font-weight:700;font-size:0.82rem;letter-spacing:0.3em;
  text-transform:uppercase;color:var(--d2);margin-top:9px}
.day .wd.sun{color:var(--c)}

/* the tear line */
.tear{height:1px;margin:10px 14px 0;
  background:repeating-linear-gradient(90deg,var(--hair) 0 5px,transparent 5px 10px)}

/* the body of the sheet */
.note{padding:14px clamp(14px,2.6vw,20px) clamp(16px,2.6vw,20px)}
.note .lbl{display:flex;align-items:center;gap:8px;font-size:0.54rem;font-weight:700;
  letter-spacing:0.24em;text-transform:uppercase;color:var(--c);margin-bottom:10px}
.note .lbl i{width:6px;height:6px;border-radius:50%;background:currentColor}
.note .lbl em{margin-left:auto;font-style:normal;color:var(--d3);letter-spacing:0.14em}
.note h2{font-family:var(--disp);font-weight:800;color:var(--dark);
  font-size:clamp(1.24rem,4vw,1.6rem);line-height:1.1;letter-spacing:-0.025em;margin-bottom:6px}
.note .rt{font-size:0.66rem;color:var(--d2);line-height:1.6;margin-bottom:14px}
.note .rt b{color:var(--d1);font-weight:600}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);
  border:1px solid var(--hair);border-radius:8px;overflow:hidden;margin-bottom:14px}
.facts > div{background:var(--paper);padding:10px 11px}
.facts k{display:block;font-size:0.44rem;font-weight:700;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--d3);margin-bottom:5px}
.facts v{display:block;font-family:var(--disp);font-weight:700;font-size:0.98rem;
  color:var(--dark);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.who{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.who .badge{width:32px;height:32px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;
  background:var(--dark);overflow:hidden}
.who .badge img{width:100%;height:100%;object-fit:contain;padding:4px;filter:brightness(0) invert(1)}
.who .badge span{font-family:var(--disp);font-weight:800;font-size:0.6rem;color:var(--paper)}
.who .tx{min-width:0}
.who .tx b{display:block;font-size:0.76rem;font-weight:700;color:var(--dark);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .tx u{display:block;text-decoration:none;font-size:0.5rem;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--d3);margin-top:3px}
.who .cd{margin-left:auto;text-align:right;flex-shrink:0}
.who .cd b{display:block;font-family:var(--disp);font-weight:800;font-size:1.06rem;
  color:var(--c);line-height:1;font-variant-numeric:tabular-nums}
.who .cd u{display:block;text-decoration:none;font-size:0.44rem;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--d3);margin-top:4px}

.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;
  border-radius:8px;background:var(--dark);color:var(--paper);text-decoration:none;
  font-family:var(--disp);font-size:0.7rem;font-weight:700;letter-spacing:0.16em;
  text-transform:uppercase;transition:.3s var(--ease)}
.go:hover{background:var(--c);transform:translateY(-2px)}
.go:hover .arrow{transform:translateX(5px)}
.arrow{transition:transform .3s var(--ease);display:inline-block}

.switch{position:relative;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  justify-content:center;font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(244,242,247,0.22)}
.switch button{font-family:var(--sans);font-size:0.6rem;letter-spacing:0.1em;padding:7px 13px;
  border-radius:99px;border:1px solid rgba(244,242,247,0.22);background:transparent;
  color:rgba(244,242,247,0.42);cursor:pointer;transition:.24s var(--ease)}
.switch button.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}
.switch button:hover{color:var(--paper)}
.switch button.on:hover{color:var(--ink)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="bind"><i></i><i></i><i></i></div>

  <div class="pad">
    <div class="leaves" id="leaves"></div>

    <div class="sheet">
      <div class="holes"><i></i><i></i><i></i></div>
      <div class="band">
        <b id="month"></b>
        <u id="year"></u>
      </div>

      <div class="day">
        <span class="num" id="dayNum"></span>
        <div class="wd" id="weekday"></div>
      </div>
      <div class="tear"></div>

      <div class="note">
        <div class="lbl"><i></i>Next ride<em id="whenWords"></em></div>
        <h2 id="dest"></h2>
        <div class="rt" id="route"></div>

        <div class="facts">
          <div><k>Distance</k><v id="km"></v></div>
          <div><k id="tk">Starts</k><v id="tv"></v></div>
          <div><k>Entry</k><v id="fee"></v></div>
        </div>

        <div class="who">
          <div class="badge" id="badge"></div>
          <div class="tx"><b id="orgName"></b><u>Organiser</u></div>
          <div class="cd"><b id="cd"></b><u id="cdLab">left</u></div>
        </div>

        <a class="go" href="#">Explore ride <em class="arrow">→</em></a>
      </div>
    </div>
  </div>
</div>

<div class="switch" id="switch"><span>Preview with:</span></div>

<script src="nextride-data.js"></script>
<script>
let ride = NR.next

const sw = document.getElementById('switch')
NR.rides.forEach(r => {
  const b = document.createElement('button')
  b.textContent = r.name.split(' ').slice(0, 2).join(' ')
  b.dataset.id = r.id
  b.onclick = () => { ride = r; paint(); tick() }
  sw.appendChild(b)
})

function paint() {
  document.documentElement.style.setProperty('--c', ride.color)

  const w = ride.when
  document.getElementById('month').textContent =
    NR.monthShort(ride).toUpperCase()
  document.getElementById('year').textContent = w ? w.getFullYear() : ''
  document.getElementById('dayNum').textContent = w ? w.getDate() : '—'
  const wd = document.getElementById('weekday')
  wd.textContent = NR.weekday(ride)
  /* a printed calendar reddens its Sundays; One Ride falls on one */
  wd.classList.toggle('sun', w && w.getDay() === 0)

  document.getElementById('dest').textContent = ride.dest
  document.getElementById('route').innerHTML = ride.loop
    ? `A loop from <b>${ride.fromCity}</b> and back · ${ride.states.join(' · ')}`
    : `From <b>${ride.fromCity}</b> · ${ride.states.join(' · ')}`

  document.getElementById('km').textContent = ride.distance
  const tk = document.getElementById('tk'), tv = document.getElementById('tv')
  if (ride.assemble) { tk.textContent = 'Assemble'; tv.textContent = ride.assemble }
  else if (ride.rideStart) { tk.textContent = 'Rolls out'; tv.textContent = ride.rideStart }
  else { tk.textContent = 'Stops'; tv.textContent = ride.stopCount }
  document.getElementById('fee').textContent = ride.fee || 'Free'

  const badge = document.getElementById('badge')
  badge.innerHTML = ride.logo
    ? `<img src="${ride.logo}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${ride.initials}'}))" />`
    : `<span>${ride.initials}</span>`
  document.getElementById('orgName').textContent = ride.organizer

  document.querySelectorAll('.switch button').forEach(b =>
    b.classList.toggle('on', b.dataset.id === ride.id))
}

/* ── the pad thins as the ride approaches ─────────────────────────────── */
/* One leaf per day left, capped so a ride two months out does not build a
   brick. Each sits a pixel lower and a pixel narrower than the one above. */
function leaves() {
  const c = NR.countdown(ride)
  const n = Math.max(0, Math.min(14, c.phase === 'counting' || c.phase === 'tomorrow' ? c.d : 0))
  document.getElementById('leaves').innerHTML = Array.from({ length: n }, (_, i) => {
    const k = i + 1
    return `<i style="transform:translateY(${k * 2.2}px);
      left:${k * 1.3}px;right:${k * 1.3}px;
      opacity:${(1 - k * 0.055).toFixed(2)};z-index:${-k}"></i>`
  }).join('')
}

function tick() {
  const c = NR.countdown(ride)
  const el = document.getElementById('cd'), lab = document.getElementById('cdLab')
  document.getElementById('whenWords').textContent = NR.whenWords(ride)

  if (c.phase === 'riding') { el.textContent = 'Today'; lab.textContent = 'ride day' }
  else if (c.phase === 'past') { el.textContent = '—'; lab.textContent = 'ridden' }
  else if (c.d === 0) { el.textContent = `${NR.pad(c.h)}:${NR.pad(c.m)}`; lab.textContent = 'to go' }
  else { el.textContent = c.d; lab.textContent = c.d === 1 ? 'day left' : 'days left' }

  leaves()
}

paint()
tick()
setInterval(tick, 30000)
</script>
</body>
</html>
