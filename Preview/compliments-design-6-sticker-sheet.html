<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Compliments — Sticker Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════════
   STICKER SHEET — the inclusions list as die-cut stickers on backing paper.

   Half the perks on a ride poster ARE stickers, so the panel is the sheet they
   came on: a glossy backing board, dashed die-lines, and vinyl badges waiting
   to be peeled.

   THE PEEL is done with two stacked layers rather than a filter. The sticker
   sits on a backing shadow; on hover its bottom-right corner lifts via a
   `clip-path` corner triangle rotating up, the shadow deepens and slides, and
   the whole badge tips a degree or two. Nothing 3D is involved — the lift is
   sold by the shadow travelling further than the sticker does.

   GLOSS is a single sheen sweep across each badge, held off until the sticker
   has landed so the two reads don't fight.
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08070d;--sheet:#16141e;--sheet2:#1c1926;--off:#f4f2fa;
  --d1:rgba(244,242,250,.6);--d2:rgba(244,242,250,.36);--acc:#eab308}
body{background:radial-gradient(70% 50% at 50% 0%,rgba(234,179,8,.08),transparent 72%),var(--bg);
  font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;
  padding:clamp(14px,3vw,34px)}

.sheet{position:relative;width:100%;max-width:840px;border-radius:16px;
  padding:clamp(22px,4vw,36px);
  background:linear-gradient(155deg,var(--sheet2),var(--sheet) 55%,#111018);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 32px 62px -24px #000, inset 0 1px 0 rgba(255,255,255,.05);
  animation:in .85s cubic-bezier(.16,1,.3,1) both;overflow:hidden}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.985)}}
/* the backing paper's register marks, top and bottom */
.sheet::before,.sheet::after{content:'';position:absolute;left:14px;right:14px;height:1px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 6px,transparent 6px 14px)}
.sheet::before{top:12px}.sheet::after{bottom:12px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;
  flex-wrap:wrap;margin-bottom:clamp(20px,3.4vw,30px)}
.head .eye{font-size:.55rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
  color:var(--acc);margin-bottom:7px}
.head h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.9rem,6vw,3.2rem);
  line-height:.9;color:var(--off);letter-spacing:.02em}
.head .meta{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--d2);
  text-align:right;line-height:1.9;white-space:nowrap}
.head .meta b{display:block;color:var(--off);font-size:.74rem;letter-spacing:.06em;text-transform:none}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:clamp(14px,2.4vw,20px)}

/* ── one sticker ─────────────────────────────────────────────────────────── */
.st{position:relative;padding:18px 16px;border-radius:14px;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  /* the die-line: the cut the sticker would be punched along */
  outline:2px dashed rgba(255,255,255,.16);outline-offset:-7px;
  box-shadow:0 6px 14px -6px rgba(0,0,0,.8);
  transform:rotate(var(--tilt));
  animation:pop .6s cubic-bezier(.34,1.45,.55,1) both;
  animation-delay:calc(.34s + var(--i) * .09s);
  transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s}
@keyframes pop{from{opacity:0;transform:rotate(var(--tilt)) scale(.82) translateY(12px)}}

/* the sheen, sweeping once after it lands */
.st .gloss{position:absolute;top:-60%;bottom:-60%;width:38%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);
  transform:rotate(14deg);left:-45%;
  animation:sweep 1.1s cubic-bezier(.4,0,.2,1) both;
  animation-delay:calc(.7s + var(--i) * .09s)}
@keyframes sweep{from{left:-45%}to{left:125%}}

/* the peeling corner, folded up out of the bottom-right */
.st .peel{position:absolute;right:0;bottom:0;width:0;height:0;pointer-events:none;
  border-style:solid;border-width:0 0 0 0;
  border-color:transparent transparent rgba(255,255,255,.14) transparent;
  transition:border-width .4s cubic-bezier(.16,1,.3,1)}
.st:hover{transform:rotate(0deg) translateY(-5px) scale(1.02);
  box-shadow:14px 18px 26px -12px rgba(0,0,0,.95);z-index:3}
.st:hover .peel{border-width:0 0 30px 30px;
  border-color:transparent transparent rgba(255,255,255,.13) transparent}

.st .mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:1.2rem;margin-bottom:11px;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.22),transparent 62%),
    color-mix(in srgb,var(--acc) 22%,transparent);
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.st .mark.tick{color:var(--acc);font-weight:900;font-size:1rem}
.st .txt{font-size:clamp(.8rem,1.9vw,.9rem);font-weight:600;color:var(--off);line-height:1.45}
.st .no{position:absolute;top:11px;right:13px;font-family:'Bebas Neue',sans-serif;
  font-size:.78rem;color:var(--d2)}

.foot{margin-top:clamp(22px,3.6vw,32px);padding-top:16px;
  border-top:1px dashed rgba(255,255,255,.14);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--d2);font-weight:700}
.foot b{color:var(--acc);letter-spacing:.06em;font-size:.74rem;text-transform:none}

@media(prefers-reduced-motion:reduce){
  .sheet,.st,.st .gloss{animation:none}
  .st .gloss{display:none}
}
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>

<script src="compliments-data.js"></script>
<script>
const r = window.COMPLIMENTS.current()
document.documentElement.style.setProperty('--acc', r.color)

/* Cycled tilts so the sheet looks hand-laid rather than gridded — fixed values
   rather than random, so it lands the same way on every reload. */
const TILTS = [-1.4, 1.1, -0.7, 1.6, -1.9, 0.8, -1.1, 1.3]

const stickers = r.compliments.map((c, i) => `
  <div class="st" style="--i:${i};--tilt:${TILTS[i % TILTS.length]}deg">
    <span class="gloss"></span>
    <span class="no">${String(i + 1).padStart(2, '0')}</span>
    <span class="mark${c.icon ? '' : ' tick'}">${c.icon || '✓'}</span>
    <span class="txt">${c.text}</span>
    <span class="peel"></span>
  </div>`).join('')

document.getElementById('sheet').innerHTML = `
  <div class="head">
    <div>
      <div class="eye">Compliments</div>
      <h1>Peel off the perks</h1>
    </div>
    <div class="meta">
      <b>${r.name}</b>
      ${r.date}
    </div>
  </div>
  <div class="grid">${stickers}</div>
  <div class="foot">
    <span>${r.organizer !== 'Self' ? `Included with <b>${r.organizer}</b>` : 'Self organised'}</span>
    <span>${r.registration ? `Entry <b>${r.registration}</b>` : `${r.compliments.length} inclusions`}</span>
  </div>`
</script>
</body>
</html>
