<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rides · 8 · Deck Swipe</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════
   DECK SWIPE — a physical stack you throw.

   Every other design asks you to scroll or click. This one you grab.
   The top card follows the pointer with real weight: it rotates about a
   pivot below the card the way a held card does, the badges fade in as
   you commit to a direction, and past the threshold it flies off on the
   velocity you actually threw it with rather than a canned animation.
   Throw right to open a ride, left to pass, and the deck restacks behind.

   Cards are dealt in ride order, so the deck reads as a chronology: the
   three that are ridden, then the one that is six days away, then the
   two with no date at all. Empty the deck and the summary is what is
   left — which is the honest end state for a garage with more road ahead
   of it than behind.

   Keyboard and buttons do the same job for anyone not throwing things.
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#120b1f; --bg2:#1b1030; --ink:#0c0715;
  --off:#faf7ff; --d1:rgba(250,247,255,0.68); --d2:rgba(250,247,255,0.44);
  --d3:rgba(250,247,255,0.24); --bd:rgba(250,247,255,0.14);
  --lime:#c3f53c; --pink:#ff5d8f; --cy:#4dd9ff;
  --disp:'Space Grotesk',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.9,.25,1); --c:#ef4444;
}
html,body{height:100%}
body{background:var(--bg);color:var(--d1);font-family:var(--disp);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(62vw 62vh at 78% 8%,rgba(195,245,60,0.09),transparent 64%),
    radial-gradient(58vw 58vh at 12% 92%,rgba(255,93,143,0.11),transparent 66%)}
::selection{background:var(--lime);color:var(--ink)}

.room{height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:clamp(12px,2.4vw,26px);gap:clamp(10px,1.8vw,18px)}

/* ── head ── */
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.head h1{font-weight:700;font-size:clamp(1.1rem,2.6vw,1.6rem);color:var(--off);
  letter-spacing:-0.03em;line-height:1}
.head h1 em{font-style:normal;color:var(--lime)}
.head .meter{margin-left:auto;display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:0.64rem;color:var(--d2);letter-spacing:0.08em}
.head .meter .pips{display:flex;gap:4px}
.head .meter .pips i{width:20px;height:4px;border-radius:2px;background:var(--bd);
  transition:.35s var(--ease)}
.head .meter .pips i.done{background:var(--lime)}
.head .meter .pips i.now{background:var(--off);box-shadow:0 0 10px var(--off)}
.head a{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--d2);text-decoration:none;border:1px solid var(--bd);border-radius:99px;
  padding:7px 13px;transition:.24s}
.head a:hover{color:var(--ink);background:var(--off);border-color:var(--off)}

/* ── the table ── */
.table{position:relative;display:grid;place-items:center;min-height:0}
.deck{position:relative;width:min(92vw,392px);aspect-ratio:0.74;max-height:100%}

.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--bg2);
  border:1px solid var(--bd);cursor:grab;touch-action:none;user-select:none;
  box-shadow:0 30px 60px -26px rgba(0,0,0,0.9);
  display:flex;flex-direction:column;
  transform-origin:50% 140%;
  will-change:transform,opacity}
.card.settling{transition:transform .5s var(--ease),opacity .5s var(--ease)}
.card.gone{transition:transform .58s cubic-bezier(.3,.1,.5,1),opacity .45s linear}
.card:active{cursor:grabbing}
.card.behind{pointer-events:none}

/* the art panel */
.art{position:relative;flex:0 0 46%;background:var(--ink);overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .tier{position:absolute;top:13px;left:13px;z-index:2;display:inline-flex;align-items:center;
  gap:6px;font-family:var(--mono);font-size:0.52rem;letter-spacing:0.16em;text-transform:uppercase;
  padding:5px 10px;border-radius:99px;background:rgba(12,7,21,0.68);backdrop-filter:blur(6px)}
.art .tier i{width:6px;height:6px;border-radius:50%;background:currentColor;
  box-shadow:0 0 9px currentColor}
.art .big{position:absolute;right:13px;bottom:11px;z-index:2;font-weight:700;
  font-size:clamp(1.7rem,7vw,2.5rem);color:var(--off);letter-spacing:-0.04em;line-height:0.9;
  text-shadow:0 3px 20px rgba(0,0,0,0.7)}
.art .big small{font-size:0.36em;color:var(--d2);letter-spacing:0.08em;margin-left:3px;
  font-family:var(--mono);font-weight:400}

/* the body */
.body{flex:1;padding:16px 17px 15px;display:flex;flex-direction:column;gap:9px;min-height:0}
.body .route{font-family:var(--mono);font-size:0.56rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--c);display:flex;align-items:center;gap:7px}
.body .route span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body h2{font-weight:700;font-size:clamp(1.05rem,3.4vw,1.32rem);color:var(--off);line-height:1.14;
  letter-spacing:-0.025em}
.body p{font-size:0.8rem;line-height:1.6;color:var(--d1);flex:1;overflow:hidden}
.body .stats{display:flex;gap:0;border-top:1px solid var(--bd);padding-top:10px}
.body .stats div{flex:1;min-width:0}
.body .stats k{display:block;font-family:var(--mono);font-size:0.46rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--d3);margin-bottom:4px}
.body .stats v{display:block;font-weight:600;font-size:0.9rem;color:var(--off);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the throw badges */
.badge{position:absolute;top:22px;z-index:5;padding:8px 16px;border-radius:9px;
  font-family:var(--mono);font-weight:500;font-size:0.78rem;letter-spacing:0.18em;
  text-transform:uppercase;border:2.5px solid currentColor;opacity:0;pointer-events:none}
.badge.yes{right:20px;color:var(--lime);transform:rotate(11deg)}
.badge.no{left:20px;color:var(--pink);transform:rotate(-11deg)}

/* the empty state behind the deck */
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:16px;padding:22px}
.done.on{display:flex;animation:pop .6s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.93)}}
.done h3{font-weight:700;font-size:clamp(1.4rem,4.4vw,2.1rem);color:var(--off);
  letter-spacing:-0.035em;line-height:1.05}
.done p{font-size:0.86rem;line-height:1.7;max-width:30ch;color:var(--d1)}
.done .tot{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.done .tot div k{display:block;font-family:var(--mono);font-size:0.46rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--d3);margin-bottom:5px}
.done .tot div v{display:block;font-weight:700;font-size:1.5rem;color:var(--lime)}
.done button{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--ink);background:var(--lime);border:0;border-radius:99px;padding:12px 22px;
  cursor:pointer;transition:.26s var(--ease)}
.done button:hover{transform:translateY(-3px);box-shadow:0 14px 28px -10px var(--lime)}

/* the kept list */
.kept{position:absolute;left:0;bottom:0;display:flex;flex-direction:column;gap:5px;
  font-family:var(--mono);font-size:0.56rem;color:var(--d3);pointer-events:none;max-width:40%}
.kept b{display:block;font-size:0.46rem;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--d3);margin-bottom:2px}
.kept span{color:var(--lime);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  animation:slide .4s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}}

/* ── controls ── */
.ctrl{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.4vw,18px)}
.cb{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--bd);background:rgba(27,16,48,0.8);
  color:var(--off);font-size:1.15rem;cursor:pointer;display:grid;place-items:center;
  transition:.24s var(--ease)}
.cb:hover{transform:translateY(-4px) scale(1.06)}
.cb.no:hover{border-color:var(--pink);color:var(--pink);box-shadow:0 12px 26px -12px var(--pink)}
.cb.yes:hover{border-color:var(--lime);color:var(--lime);box-shadow:0 12px 26px -12px var(--lime)}
.cb.undo{width:44px;height:44px;font-size:0.9rem;color:var(--d2)}
.cb.undo:hover{border-color:var(--cy);color:var(--cy)}
.cb:disabled{opacity:0.28;cursor:not-allowed;transform:none;box-shadow:none}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;
  font-family:var(--mono);font-size:0.54rem;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--d3);white-space:nowrap;pointer-events:none}

@media(max-width:560px){
  .deck{width:94vw}
  .kept{display:none}
  .head h1{font-size:1rem}
  .cb{width:50px;height:50px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="room">
  <header class="head">
    <h1>Rides &amp; <em>Journeys</em></h1>
    <div class="meter">
      <span id="pos">01 / 06</span>
      <span class="pips" id="pips"></span>
    </div>
    <a href="#">← Garage</a>
  </header>

  <section class="table">
    <div class="deck" id="deck">
      <div class="done" id="done">
        <h3>That's the deck.</h3>
        <p id="donep"></p>
        <div class="tot" id="tot"></div>
        <button id="again">Shuffle and deal again</button>
      </div>
    </div>
    <div class="kept" id="kept"></div>
  </section>

  <div class="ctrl">
    <button class="cb undo" id="bUndo" title="Put the last card back">↺</button>
    <button class="cb no" id="bNo" title="Pass">✕</button>
    <button class="cb yes" id="bYes" title="Open this ride">★</button>
    <span class="hint">Throw the card · ← → · or tap below</span>
  </div>
</div>

<script src="rides-data.js"></script>
<script>
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches
const S = RD.summary
const AW = 360, AH = 230        // art panel user space

let queue = []       // cards still to see, last is the top of the deck
let history = []     // {ride, dir} so undo can put one back
let kept = []

/* ── art: the route, or a burst for the ride with no route ────────────── */
function art(r) {
  if (!r.mapped) {
    const rays = Array.from({ length: 22 }, (_, i) => {
      const a = (i / 22) * Math.PI * 2
      const len = 58 + (i % 3) * 30
      return `<line x1="${AW / 2}" y1="${AH / 2}"
        x2="${(AW / 2 + Math.cos(a) * len).toFixed(1)}" y2="${(AH / 2 + Math.sin(a) * len).toFixed(1)}"
        stroke="${r.color}" stroke-width="${i % 2 ? 1.2 : 2.4}" opacity="${i % 2 ? 0.3 : 0.6}"
        stroke-linecap="round"/>`
    }).join('')
    return `<svg viewBox="0 0 ${AW} ${AH}" preserveAspectRatio="xMidYMid slice">
      <rect width="${AW}" height="${AH}" fill="url(#g${r.id})"/>
      <defs><radialGradient id="g${r.id}"><stop offset="0" stop-color="${r.color}" stop-opacity="0.34"/>
        <stop offset="1" stop-color="${r.color}" stop-opacity="0.04"/></radialGradient></defs>
      ${rays}
      <circle cx="${AW / 2}" cy="${AH / 2}" r="9" fill="none" stroke="${r.color}" stroke-width="2.6"/>
      <circle cx="${AW / 2}" cy="${AH / 2}" r="3.6" fill="${r.color}"/>
    </svg>`
  }
  const P = RD.one(r, AW, AH, 46)
  const d = RD.curve(P.pts)
  const pins = P.pts.map((pt, i) => {
    const edge = i === 0 || i === P.pts.length - 1
    return `<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="${edge ? 6 : 3.6}"
      fill="${edge ? r.color : 'rgba(250,247,255,0.65)'}" stroke="#0c0715" stroke-width="1.8"/>`
  }).join('')
  return `<svg viewBox="0 0 ${AW} ${AH}" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="w${r.id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${r.color}" stop-opacity="0.3"/>
        <stop offset="1" stop-color="${r.color}" stop-opacity="0.04"/>
      </linearGradient>
    </defs>
    <rect width="${AW}" height="${AH}" fill="url(#w${r.id})"/>
    <path d="${d}" fill="none" stroke="rgba(12,7,21,0.5)" stroke-width="9"
      stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="${r.color}" stroke-width="4.2"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${pins}
  </svg>`
}

/* ── build one card ───────────────────────────────────────────────────── */
function make(r) {
  const el = document.createElement('article')
  el.className = 'card'
  el.dataset.id = r.id
  el.style.setProperty('--c', r.color)
  const dest = r.tbd && /decided/i.test(r.toCity) ? 'Anywhere' : r.toCity
  el.innerHTML = `
    <span class="badge yes">Open</span>
    <span class="badge no">Pass</span>
    <div class="art">
      ${art(r)}
      <span class="tier" style="color:${r.tier.color}"><i></i>${r.tier.label}</span>
      <span class="big">${r.tbd ? 'TBD' : r.km}${r.tbd ? '' : '<small>KM</small>'}</span>
    </div>
    <div class="body">
      <div class="route"><span>${r.fromCity}</span>→<span>${dest}</span></div>
      <h2>${r.name}</h2>
      <p>${r.description}</p>
      <div class="stats">
        <div><k>When</k><v>${r.date}</v></div>
        <div><k>Heading</k><v>${r.mapped ? r.compass + ' ' + r.bearing.toFixed(0) + '°' : 'Open'}</v></div>
        <div><k>${r.time ? 'Time' : r.estimated ? 'Est.' : 'Stops'}</k>
          <v>${r.time || (r.estimated ? r.estimate : r.stops.length)}</v></div>
      </div>
    </div>`
  return el
}

/* ── deal ─────────────────────────────────────────────────────────────── */
const deck = document.getElementById('deck')

function deal() {
  deck.querySelectorAll('.card').forEach(c => c.remove())
  /* last in the list is the top of the pile, so render in reverse */
  queue = RD.rides.slice()
  queue.slice().reverse().forEach(r => deck.appendChild(make(r)))
  history = []; kept = []
  document.getElementById('done').classList.remove('on')
  document.getElementById('kept').innerHTML = ''
  restack()
}

/* the three cards you can see get a slight offset and scale */
function restack() {
  const cards = [...deck.querySelectorAll('.card')]
  const n = cards.length
  cards.forEach((c, i) => {
    const depth = n - 1 - i            // 0 = top
    c.classList.toggle('behind', depth !== 0)
    c.classList.add('settling')
    if (depth > 2) { c.style.opacity = 0; c.style.transform = 'translateY(26px) scale(.9)'; return }
    c.style.opacity = 1
    c.style.transform = `translateY(${depth * 11}px) scale(${1 - depth * 0.045})`
    c.style.zIndex = 10 - depth
    c.style.filter = depth ? `brightness(${1 - depth * 0.16})` : 'none'
  })
  const seen = RD.rides.length - n
  document.getElementById('pos').textContent =
    String(Math.min(seen + 1, RD.rides.length)).padStart(2, '0') + ' / ' +
    String(RD.rides.length).padStart(2, '0')
  document.getElementById('pips').innerHTML = RD.rides.map((r, i) =>
    `<i class="${i < seen ? 'done' : i === seen ? 'now' : ''}"></i>`).join('')
  document.getElementById('bUndo').disabled = !history.length
  document.getElementById('bNo').disabled = !n
  document.getElementById('bYes').disabled = !n
  if (!n) finish()
  bind()
}

function top() { return deck.querySelector('.card:last-of-type') }

/* ── throw ────────────────────────────────────────────────────────────── */
let drag = null

function bind() {
  const c = top()
  if (!c || c.dataset.bound) return
  c.dataset.bound = '1'
  c.addEventListener('pointerdown', e => {
    if (c !== top()) return
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), vx: 0, lx: e.clientX }
    c.classList.remove('settling')
    c.setPointerCapture(e.pointerId)
  })
  c.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0
    drag.vx = e.clientX - drag.lx
    drag.lx = e.clientX
    /* rotation comes from the pivot below the card, so it swings rather
       than spinning about its middle */
    const rot = dx / 14
    c.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg)`
    const k = Math.min(1, Math.abs(dx) / 110)
    c.querySelector('.badge.yes').style.opacity = dx > 0 ? k : 0
    c.querySelector('.badge.no').style.opacity = dx < 0 ? k : 0
  })
  const release = e => {
    if (!drag || (e && e.pointerId !== drag.id)) return
    const dx = e ? e.clientX - drag.x0 : 0
    /* a short but fast flick counts as a throw; a long slow drag counts too */
    const flick = Math.abs(drag.vx) > 9 && Math.abs(dx) > 24
    const dir = dx >= 0 ? 1 : -1
    drag = null
    if (Math.abs(dx) > 96 || flick) throwOut(c, dir, dx)
    else spring(c)
  }
  c.addEventListener('pointerup', release)
  c.addEventListener('pointercancel', release)
}

function spring(c) {
  c.classList.add('settling')
  c.style.transform = 'translateY(0) scale(1)'
  c.querySelectorAll('.badge').forEach(b => b.style.opacity = 0)
}

function throwOut(c, dir, dx) {
  if (!c) return
  const r = RD.byId(c.dataset.id)
  c.classList.remove('settling')
  c.classList.add('gone')
  c.style.pointerEvents = 'none'
  const fly = dir * (innerWidth * 1.15)
  c.style.transform = `translate(${fly}px, ${(Math.abs(dx || 0) * 0.2 + 40)}px) rotate(${dir * 34}deg)`
  c.style.opacity = 0
  history.push({ id: r.id, dir })
  if (dir > 0) {
    kept.push(r)
    paintKept()
  }
  setTimeout(() => { c.remove(); restack() }, REDUCED ? 0 : 380)
}

function paintKept() {
  document.getElementById('kept').innerHTML = kept.length
    ? `<b>Opened</b>` + kept.map(r => `<span>★ ${r.name}</span>`).join('')
    : ''
}

/* ── undo ─────────────────────────────────────────────────────────────── */
document.getElementById('bUndo').addEventListener('click', () => {
  const last = history.pop()
  if (!last) return
  const r = RD.byId(last.id)
  if (last.dir > 0) { kept = kept.filter(k => k.id !== r.id); paintKept() }
  const el = make(r)
  el.style.transform = `translate(${last.dir * innerWidth}px,40px) rotate(${last.dir * 30}deg)`
  el.style.opacity = 0
  deck.appendChild(el)
  document.getElementById('done').classList.remove('on')
  requestAnimationFrame(() => { el.classList.add('settling'); restack() })
})

document.getElementById('bNo').addEventListener('click', () => throwOut(top(), -1, 130))
document.getElementById('bYes').addEventListener('click', () => throwOut(top(), 1, 130))
document.getElementById('again').addEventListener('click', deal)

addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') throwOut(top(), -1, 130)
  if (e.key === 'ArrowRight') throwOut(top(), 1, 130)
  if (e.key === 'Backspace') { e.preventDefault(); document.getElementById('bUndo').click() }
})

/* ── the end of the deck ──────────────────────────────────────────────── */
function finish() {
  const d = document.getElementById('done')
  d.classList.add('on')
  document.getElementById('donep').textContent = kept.length
    ? `You pulled ${kept.length} to open: ${kept.map(r => r.name).join(', ')}.`
    : 'Nothing pulled — pass through again, or open the full list.'
  document.getElementById('tot').innerHTML = [
    ['Ridden', S.doneKm + ' km'],
    ['Ahead', S.aheadKm + ' km'],
    ['Waypoints', S.stopCount],
  ].map(([k, v]) => `<div><k>${k}</k><v>${v}</v></div>`).join('')
}

deal()
</script>
</body>
</html>
