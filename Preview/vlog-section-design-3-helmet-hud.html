<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vlogs · 3 · Helmet HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════
   HELMET HUD — the section reads as the action-cam's own
   viewfinder. Corner brackets, a REC clock, a scanline sweep and
   channel tiles that lock focus one at a time. Changing channel
   costs an RGB-split glitch, the way a cut in the footage would.
   Everything is keyboard-drivable: 1-9 jumps straight to a tile.
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#0d0c14; --card2:#141220;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --hud:#8affd4;                 /* the viewfinder's own green */
  --rec:#ff4d4d;
  --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--hud);color:#04120d}
.page{width:90%;max-width:1240px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:22px clamp(16px,3vw,26px) 26px;overflow:hidden;font-family:var(--mono);
  opacity:0;transform:translateY(32px);animation:rise .8s var(--ease) .1s forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* ── viewfinder furniture ── */
.sec .corner{position:absolute;width:26px;height:26px;border:2px solid var(--hud);opacity:.5;z-index:4;pointer-events:none;
  animation:brk 3.4s ease-in-out infinite}
.sec .c1{top:12px;left:12px;border-right:0;border-bottom:0}
.sec .c2{top:12px;right:12px;border-left:0;border-bottom:0;animation-delay:.2s}
.sec .c3{bottom:12px;left:12px;border-right:0;border-top:0;animation-delay:.4s}
.sec .c4{bottom:12px;right:12px;border-left:0;border-top:0;animation-delay:.6s}
@keyframes brk{0%,100%{opacity:.5;transform:none}50%{opacity:.85;transform:scale(1.1)}}

/* scanline sweep across the whole panel */
.sec .scan{position:absolute;left:0;right:0;height:120px;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(138,255,212,0.055),transparent);
  animation:sweep 6.5s linear infinite}
@keyframes sweep{0%{top:-120px}100%{top:100%}}
.sec .lines{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0.028) 0 1px,transparent 1px 3px)}

/* ── top strip ── */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:6px 20px 14px;border-bottom:1px solid var(--bd);margin-bottom:16px}
.bar .rec{display:flex;align-items:center;gap:7px;font-size:0.6rem;letter-spacing:0.2em;color:var(--rec);font-weight:700}
.bar .rec i{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.bar .clock{font-size:0.6rem;letter-spacing:0.14em;color:var(--hud)}
.bar .tag{font-size:0.55rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--d2);
  padding:3px 9px;border:1px solid var(--bd2);border-radius:4px}
.bar .bat{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:0.58rem;color:var(--d2);letter-spacing:0.12em}
.bar .bat .cell{width:26px;height:11px;border:1px solid var(--d2);border-radius:2px;position:relative;padding:1.5px}
.bar .bat .cell::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:var(--d2)}
.bar .bat .cell i{display:block;height:100%;width:72%;background:var(--hud);border-radius:1px;
  animation:drain 9s ease-in-out infinite alternate}
@keyframes drain{to{width:46%}}

.title{position:relative;z-index:5;padding:0 20px;margin-bottom:18px}
.title h2{font-family:var(--sans);font-size:clamp(1.25rem,3.3vw,1.8rem);font-weight:800;color:var(--off);
  letter-spacing:-0.02em;line-height:1.1}
.title h2 em{font-style:normal;color:var(--hud)}
.title .note{font-size:0.68rem;color:var(--d2);line-height:1.7;max-width:440px;margin-top:8px;letter-spacing:0.03em}

/* ── channel legend ──
   The section carries five channels; the rest of the rig's feeds are on the
   vlog page, so the row reads as a legend with a way out, not a filter. */
.chans{position:relative;z-index:5;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  padding:0 20px;margin-bottom:16px}
.chans span{padding:6px 12px;border-radius:4px;border:1px solid var(--bd2);color:var(--d2);
  font-family:var(--mono);font-size:0.56rem;letter-spacing:0.16em;text-transform:uppercase}
.chans span::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--hud);margin-right:7px;vertical-align:middle;opacity:.7}
.chans a{margin-left:auto;padding:6px 14px;border-radius:4px;border:1px solid var(--hud);
  background:rgba(138,255,212,.08);color:var(--hud);text-decoration:none;font-family:var(--mono);
  font-size:0.56rem;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;
  transition:.3s var(--ease)}
.chans a:hover{background:var(--hud);color:#04120d;transform:translateY(-2px)}

/* ══ the grid of channels ══ */
.grid{position:relative;z-index:5;display:grid;gap:10px;padding:0 20px;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.ch{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:#000;
  border:1px solid var(--bd2);cursor:pointer;padding:0;
  transition:transform .4s var(--ease),border-color .3s,box-shadow .4s var(--ease);
  animation:pop .55s var(--ease) backwards;animation-delay:calc(var(--k) * .045s)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
.ch.hide{display:none}
.ch:hover,.ch:focus-visible{transform:translateY(-4px);border-color:var(--hud);outline:0;
  box-shadow:0 18px 34px -16px rgba(0,0,0,.9),0 0 0 1px var(--hud),0 0 26px -8px rgba(138,255,212,.5)}
.ch img,.ch video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:saturate(.55) contrast(1.1) brightness(.7);transition:filter .45s ease}
.ch:hover img,.ch:hover video{filter:saturate(1) contrast(1) brightness(.95)}
.ch video{opacity:0;transition:opacity .45s ease,filter .45s ease}
.ch.roll video{opacity:1}
.ch .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 45%,rgba(0,0,0,.85))}
/* focus brackets that snap in on hover */
.ch .fx{position:absolute;inset:9px;pointer-events:none;opacity:0;transform:scale(1.14);
  transition:.38s var(--ease)}
.ch:hover .fx{opacity:1;transform:none}
.ch .fx i{position:absolute;width:13px;height:13px;border:1.5px solid var(--hud)}
.ch .fx i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.ch .fx i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.ch .fx i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.ch .fx i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}

.ch .id{position:absolute;top:7px;left:8px;font-size:0.52rem;letter-spacing:0.16em;color:var(--hud);
  text-shadow:0 1px 6px #000}
.ch .dur{position:absolute;top:7px;right:8px;font-size:0.52rem;padding:2px 6px;border-radius:3px;
  background:rgba(0,0,0,.7);color:#fff;border:1px solid rgba(255,255,255,.15)}
.ch .lab{position:absolute;left:0;right:0;bottom:0;padding:9px 10px 10px;text-align:left}
.ch .lab b{display:block;font-family:var(--sans);font-size:0.76rem;font-weight:700;color:#fff;line-height:1.28;
  text-shadow:0 1px 10px rgba(0,0,0,.85);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch .lab s{display:block;text-decoration:none;font-size:0.5rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--hud);margin-top:5px;opacity:.85}

/* ── the sixth tile: everything the section is not showing ── */
.ch.more{background:linear-gradient(140deg,#111a18,#0a0d12);text-decoration:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  border-color:rgba(138,255,212,.28)}
.ch.more .big{font-family:var(--sans);font-size:1.7rem;font-weight:800;color:var(--off);line-height:1}
.ch.more .sub{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--hud);text-align:center;line-height:1.7}
.ch.more .btn{margin-top:3px;padding:6px 14px;border-radius:4px;border:1px solid rgba(138,255,212,.4);
  font-family:var(--mono);font-size:0.52rem;letter-spacing:0.16em;text-transform:uppercase;color:#fff;
  transition:.3s var(--ease)}
.ch.more:hover .btn{background:var(--hud);border-color:var(--hud);color:#04120d}
/* a scanning sweep, so the tile is alive without a picture in it */
.ch.more::after{content:'';position:absolute;left:0;right:0;height:34px;
  background:linear-gradient(180deg,transparent,rgba(138,255,212,.09),transparent);
  animation:sweep2 3.2s linear infinite}
@keyframes sweep2{0%{top:-34px}100%{top:100%}}

/* ══ the lock-on viewer ══ */
.lock{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;
  background:rgba(4,4,9,0.9);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .35s}
.lock.on{opacity:1;pointer-events:auto}
.lock .win{position:relative;width:min(940px,100%);border:1px solid var(--hud);border-radius:8px;
  background:var(--card);overflow:hidden;font-family:var(--mono);
  transform:scale(.94);opacity:0;transition:transform .45s var(--ease),opacity .3s}
.lock.on .win{transform:none;opacity:1}
.lock .feed{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.lock .feed video,.lock .feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* the RGB split that fires on every channel change */
.lock .feed.glitch{animation:glitch .42s steps(3)}
@keyframes glitch{
  0%{filter:none;transform:none}
  20%{filter:hue-rotate(70deg) saturate(2);transform:translateX(-5px) skewX(-1.5deg)}
  40%{filter:invert(.12) saturate(1.6);transform:translateX(6px)}
  60%{filter:hue-rotate(-50deg);transform:translateX(-3px) skewX(1deg)}
  100%{filter:none;transform:none}
}
.lock .hudline{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:14px 16px;
  display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
  background:linear-gradient(transparent,rgba(4,4,9,.9))}
.lock .hudline h3{font-family:var(--sans);font-size:clamp(1rem,2.4vw,1.4rem);color:#fff;font-weight:800;
  letter-spacing:-0.01em;line-height:1.2;flex:1 1 260px}
.lock .telem{display:flex;gap:14px;font-size:0.55rem;letter-spacing:0.14em;color:var(--hud)}
.lock .telem span b{display:block;color:#fff;font-size:0.72rem;font-weight:700;margin-top:3px;letter-spacing:0.06em}
.lock .foot{padding:15px 16px 17px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-top:1px solid var(--bd)}
.lock .foot p{flex:1 1 320px;font-family:var(--sans);font-size:0.8rem;line-height:1.65;color:var(--d1)}
.lock .foot a{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:5px;
  background:var(--hud);color:#04120d;text-decoration:none;font-size:0.62rem;font-weight:700;
  letter-spacing:0.16em;text-transform:uppercase;transition:.3s var(--ease)}
.lock .foot a:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(138,255,212,.9)}
.lock .nav{display:flex;gap:6px}
.lock .nav button{width:34px;height:34px;border:1px solid var(--bd2);background:transparent;color:var(--d1);
  border-radius:5px;cursor:pointer;transition:.28s}
.lock .nav button:hover{border-color:var(--hud);color:var(--hud);background:rgba(138,255,212,.08)}
.lock .x{position:absolute;top:10px;right:10px;z-index:6;width:32px;height:32px;border-radius:5px;
  border:1px solid rgba(255,255,255,.22);background:rgba(4,4,9,.7);color:#fff;cursor:pointer;
  font-size:.95rem;transition:.28s}
.lock .x:hover{background:var(--rec);border-color:var(--rec);transform:rotate(90deg)}

/* ── empty state ── */
.empty{position:relative;z-index:5;margin:0 20px;border:1px dashed var(--bd2);border-radius:8px;
  background:var(--card2);padding:clamp(34px,6vw,56px) 24px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:11px;overflow:hidden}
.empty .noise{position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px);
  animation:roll 1.1s linear infinite}
@keyframes roll{to{transform:translateY(4px)}}
.empty > *{position:relative;z-index:2}
.empty .ico{font-size:1.9rem;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.empty .lab{font-size:0.6rem;letter-spacing:0.24em;text-transform:uppercase;color:var(--hud);font-weight:700}
.empty p{font-family:var(--sans);font-size:0.8rem;color:var(--d2);max-width:420px;line-height:1.65}

@media(max-width:760px){
  .page{width:94%;padding:40px 0 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .bar .bat{margin-left:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div class="page">
  <div class="stub">↑ Accessories &amp; Add-ons</div>

  <section class="sec">
    <span class="corner c1"></span><span class="corner c2"></span>
    <span class="corner c3"></span><span class="corner c4"></span>
    <span class="scan"></span><span class="lines"></span>

    <div class="bar">
      <span class="rec"><i></i>REC</span>
      <span class="clock" id="clock">00:00:00</span>
      <span class="tag">5.7K · 60FPS</span>
      <span class="tag" id="rig">INSTA360 X5</span>
      <span class="bat"><span class="cell"><i></i></span><span id="batn">72%</span></span>
    </div>

    <div class="title">
      <h2 id="h2"></h2>
      <div class="note" id="note"></div>
    </div>

    <div id="body"></div>
  </section>

  <div class="stub">↓ Ride Gallery</div>
</div>

<!-- lock-on viewer -->
<div class="lock" id="lock">
  <div class="win">
    <button class="x" id="lx" aria-label="Close">×</button>
    <div class="feed" id="feed">
      <div class="hudline">
        <h3 id="lt"></h3>
        <div class="telem" id="ltel"></div>
      </div>
    </div>
    <div class="foot">
      <p id="lp"></p>
      <div class="nav">
        <button id="lprev" aria-label="Previous">‹</button>
        <button id="lnext" aria-label="Next">›</button>
      </div>
      <a id="lgo" target="_blank" rel="noopener">Watch ↗</a>
    </div>
  </div>
</div>

<script src="vlog-data.js"></script>
<script>
const V = window.VLOG
document.getElementById('h2').innerHTML = `Latest <em>Vlogs</em>`
document.getElementById('note').textContent = V.note

/* running clock in the top strip — a viewfinder that is not counting is dead */
;(function clock() {
  const el = document.getElementById('clock')
  let s = 0
  setInterval(() => {
    s++
    const h = String(Math.floor(s / 3600)).padStart(2, '0')
    const m = String(Math.floor(s / 60) % 60).padStart(2, '0')
    el.textContent = `${h}:${m}:${String(s % 60).padStart(2, '0')}`
  }, 1000)
})()

if (V.isEmpty) {
  document.getElementById('body').innerHTML = `
    <div class="empty">
      <div class="noise"></div>
      <div class="ico">📡</div>
      <div class="lab">No signal on any channel</div>
      <p>The rig is mounted and armed. The first ride footage takes over this grid
         the moment it is cut.</p>
    </div>`
} else {
  build()
}

function build() {
  document.getElementById('body').innerHTML = `
    <div class="chans" id="chans"></div>
    <div class="grid" id="grid"></div>`

  document.getElementById('chans').innerHTML =
    V.cats.map(c => `<span>${c}</span>`).join('') +
    `<a href="${V.page}">All ${V.count} feeds ↗</a>`

  document.getElementById('grid').innerHTML = V.shown.map((v, k) => `
    <button class="ch" data-i="${v.i}" data-cat="${v.cat}" style="--k:${k}">
      <img src="${v.poster}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${v.still}'" />
      ${v.clip ? `<video src="${v.clip}" muted loop playsinline preload="none"></video>` : ''}
      <span class="veil"></span>
      <span class="fx"><i></i><i></i><i></i><i></i></span>
      <span class="id">CH ${String(v.n).padStart(2, '0')}</span>
      <span class="dur">${v.duration}</span>
      <span class="lab"><b>${v.title}</b><s>${v.cat} · ${v.when.short}</s></span>
    </button>`).join('') + `
    <a class="ch more" href="${V.page}" style="--k:${V.shown.length}">
      <span class="big">+${V.more}</span>
      <span class="sub">more feeds<br />off this rig</span>
      <span class="btn">Open vlogs →</span>
    </a>`

  wire()
}

function wire() {
  const grid = document.getElementById('grid')

  /* ── hover rolls the clip ── */
  grid.addEventListener('pointerover', e => {
    const t = e.target.closest('.ch'); if (!t) return
    const vid = t.querySelector('video'); if (!vid) return
    vid.play().then(() => t.classList.add('roll')).catch(() => {})
  })
  grid.addEventListener('pointerout', e => {
    const t = e.target.closest('.ch'); if (!t || t.contains(e.relatedTarget)) return
    const vid = t.querySelector('video'); if (!vid) return
    t.classList.remove('roll'); vid.pause(); vid.currentTime = 0
  })

  /* the "more" tile is an anchor, not a channel — it has no data-i */
  grid.addEventListener('click', e => {
    const t = e.target.closest('.ch'); if (!t?.dataset.i) return
    lockOn(+t.dataset.i)
  })

  /* number keys jump to a channel, the way a camera's channel keys would */
  window.addEventListener('keydown', e => {
    if (/^[1-9]$/.test(e.key)) {
      const v = V.shown[+e.key - 1]; if (v) lockOn(v.i)
    }
  })
}

/* ══ lock-on viewer ══ */
const lock = document.getElementById('lock')
const feed = document.getElementById('feed')
let at = 0

function lockOn(i) {
  at = i
  const v = V.all[i]

  /* the media sits behind the HUD line that is already in the markup */
  feed.querySelectorAll('video,img').forEach(n => n.remove())
  const media = v.clip
    ? Object.assign(document.createElement('video'),
        { src: v.clip, autoplay: true, muted: true, loop: true, playsInline: true })
    : Object.assign(document.createElement('img'), { src: v.posterBig, alt: v.title })
  if (!v.clip) media.onerror = () => { media.onerror = null; media.src = v.still }
  feed.prepend(media)

  document.getElementById('lt').textContent = v.title
  document.getElementById('ltel').innerHTML = `
    <span>RUN<b>${v.duration}</b></span>
    <span>SHOT<b>${v.when.short.toUpperCase()}</b></span>
    <span>VIEWS<b>${v.views}</b></span>
    <span>CH<b>${String(v.n).padStart(2, '0')}</b></span>`
  document.getElementById('lp').textContent = v.blurb
  document.getElementById('lgo').href = v.url

  feed.classList.remove('glitch')
  void feed.offsetWidth
  feed.classList.add('glitch')

  lock.classList.add('on')
}
function shut() {
  lock.classList.remove('on')
  setTimeout(() => feed.querySelectorAll('video,img').forEach(n => n.remove()), 380)
}
document.getElementById('lx').onclick = shut
lock.addEventListener('click', e => { if (e.target === lock) shut() })
/* the viewer only cycles what the section is actually showing — walking past
   the fifth would be browsing a list that is not on the page */
const N = V.shown.length
document.getElementById('lprev').onclick = () => lockOn((at - 1 + N) % N)
document.getElementById('lnext').onclick = () => lockOn((at + 1) % N)
window.addEventListener('keydown', e => {
  if (!lock.classList.contains('on')) return
  if (e.key === 'Escape') shut()
  if (e.key === 'ArrowRight') lockOn((at + 1) % N)
  if (e.key === 'ArrowLeft')  lockOn((at - 1 + N) % N)
})
</script>
</body>
</html>
