<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vlogs · 8 · Split-Flap Board</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════
   SPLIT-FLAP BOARD — the vlogs as a departures board. Five rows
   in the timetable, one big flap display above them. Pick a row
   and the display clatters over to it letter by letter, the way
   a real board does, while the monitor beside it cuts to that
   clip. The last row on the board is the way to the full list.
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --amber:#ffc247;              /* the board's own lamp colour */
  --flap:#191622; --flap2:#0e0c15;
  --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--amber);color:#100d16}
.page{width:90%;max-width:1240px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:24px clamp(14px,2.6vw,26px) 26px;overflow:hidden;
  opacity:0;transform:translateY(32px);animation:rise .8s var(--ease) .1s forwards}
@keyframes rise{to{opacity:1;transform:none}}

.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.kick{font-family:var(--mono);font-size:0.56rem;letter-spacing:0.26em;text-transform:uppercase;
  color:var(--amber);display:block;margin-bottom:7px}
.head h2{font-size:clamp(1.25rem,3.3vw,1.8rem);font-weight:800;color:var(--off);letter-spacing:-0.02em;line-height:1.1}
.head .clock{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:var(--mono);
  font-size:0.62rem;letter-spacing:0.16em;color:var(--amber)}
.head .clock i{width:6px;height:6px;border-radius:50%;background:var(--amber);font-style:normal;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.head .all{font-size:0.68rem;color:var(--acc2);text-decoration:none;padding:7px 14px;border-radius:999px;
  border:1px solid rgba(167,139,250,0.28);transition:.3s var(--ease);white-space:nowrap}
.head .all:hover{background:var(--acc);color:#fff;border-color:var(--acc);transform:translateY(-2px)}

/* ══ the display ══ */
.display{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:14px;margin-bottom:16px}
.board{background:linear-gradient(180deg,#0d0b13,#08070d);border:1px solid var(--bd2);border-radius:10px;
  padding:16px clamp(12px,2vw,20px) 18px;min-width:0;display:flex;flex-direction:column;gap:12px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.04),0 24px 46px -30px #000}
.board .strip{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:0.53rem;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--d3)}
.board .strip b{color:var(--amber);font-weight:600}
.board .strip .st{margin-left:auto;padding:3px 10px;border-radius:3px;background:rgba(255,194,71,.14);
  border:1px solid rgba(255,194,71,.3);color:var(--amber);letter-spacing:0.16em}

/* the flap line itself */
.flaps{display:flex;flex-wrap:wrap;gap:3px}
.fl{position:relative;width:clamp(19px,2.6vw,30px);height:clamp(28px,3.8vw,44px);border-radius:3px;
  background:linear-gradient(180deg,var(--flap) 0 50%,var(--flap2) 50% 100%);
  border:1px solid rgba(255,255,255,.07);overflow:hidden;perspective:200px}
/* the seam across the middle, which is what makes it read as a flap */
.fl::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.85);z-index:3}
.fl b{display:grid;place-items:center;width:100%;height:100%;font-family:var(--mono);font-weight:700;
  font-size:clamp(.8rem,1.9vw,1.25rem);color:var(--amber);text-shadow:0 0 12px rgba(255,194,71,.4);
  transform-origin:50% 50%;
  animation:flip .34s var(--ease) backwards;animation-delay:calc(var(--i) * .035s)}
@keyframes flip{
  0%{transform:rotateX(-90deg);opacity:0;filter:blur(2px)}
  60%{transform:rotateX(12deg);opacity:1;filter:none}
  100%{transform:none;opacity:1}
}
.fl.sp{background:none;border-color:transparent;width:clamp(8px,1.1vw,13px)}
.fl.sp::after{display:none}

.board .under{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--mono);
  font-size:0.55rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--d2)}
.board .under u{text-decoration:none;padding:3px 9px;border-radius:3px;background:rgba(255,255,255,.05);
  border:1px solid var(--bd);color:var(--d1)}
.board .under a{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:8px 15px;
  border-radius:4px;background:var(--amber);color:#100d16;text-decoration:none;font-weight:700;
  font-size:0.56rem;letter-spacing:0.16em;transition:.3s var(--ease)}
.board .under a:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(255,194,71,.85)}

/* the monitor beside the board */
.mon{position:relative;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--bd2);
  aspect-ratio:16/10;min-height:150px}
.mon video,.mon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .5s ease}
.mon.on video,.mon.on img{opacity:1}
.mon .cut{position:absolute;inset:0;z-index:3;background:#0b0912;pointer-events:none;opacity:0}
.mon.cutting .cut{animation:cut .38s steps(2)}
@keyframes cut{0%,100%{opacity:0}30%,60%{opacity:1}}
.mon .grille{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.mon .tag{position:absolute;left:10px;bottom:9px;z-index:5;font-family:var(--mono);font-size:0.5rem;
  letter-spacing:0.18em;text-transform:uppercase;color:var(--amber);text-shadow:0 1px 8px #000}

/* ══ the timetable ══ */
.table{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card2)}
.tr{display:grid;grid-template-columns:46px minmax(0,1fr) 116px 78px 96px 74px;align-items:center;
  gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd);background:transparent;border-left:0;
  border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  transition:.3s var(--ease);position:relative;overflow:hidden}
.tr:last-child{border-bottom:0}
.thead{cursor:default;background:rgba(255,255,255,.03);font-family:var(--mono);font-size:0.5rem;
  letter-spacing:0.2em;text-transform:uppercase;color:var(--d3)}
.tr.pick::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);
  transform:scaleY(0);transform-origin:center;transition:transform .4s var(--ease)}
.tr.pick:hover{background:rgba(255,255,255,.04)}
.tr.pick.on{background:rgba(255,194,71,.09)}
.tr.pick.on::before{transform:scaleY(1)}
.tr .no{font-family:var(--mono);font-size:0.68rem;color:var(--d2)}
.tr.on .no{color:var(--amber)}
.tr .ttl{min-width:0;font-size:0.82rem;font-weight:600;color:var(--off);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:9px}
.tr .ttl em{font-style:normal;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.14em;
  padding:2px 7px;border-radius:3px;background:rgba(139,92,246,.16);color:var(--acc2);flex:none}
.tr .cell{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.08em;color:var(--d2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .stat{font-family:var(--mono);font-size:0.52rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--d3);text-align:right}
.tr.on .stat{color:var(--amber)}
/* a lamp test that runs down the board once on arrival */
.tr.pick{animation:lamp .5s var(--ease) backwards;animation-delay:calc(var(--k) * .07s + .2s)}
@keyframes lamp{from{opacity:0;transform:translateY(-8px)}}

/* the last row: everything not on the board */
.trmore{display:flex;align-items:center;gap:12px;padding:13px 14px;text-decoration:none;
  background:rgba(139,92,246,.06);border-top:1px dashed rgba(167,139,250,.3);transition:.3s var(--ease)}
.trmore:hover{background:rgba(139,92,246,.15)}
.trmore b{font-family:var(--mono);font-size:0.72rem;color:var(--acc2);font-weight:700;min-width:46px}
.trmore span{font-size:0.8rem;color:var(--off);font-weight:600}
.trmore s{text-decoration:none;font-family:var(--mono);font-size:0.53rem;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--d2)}
.trmore i{margin-left:auto;font-style:normal;color:var(--acc2);transition:transform .3s var(--ease)}
.trmore:hover i{transform:translateX(5px)}

/* ── empty state ── */
.empty{position:relative;border:1px dashed var(--bd2);border-radius:12px;background:var(--card2);
  padding:clamp(34px,6vw,58px) 24px;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:12px;overflow:hidden}
.empty .blanks{display:flex;gap:3px;margin-bottom:4px}
.empty .blanks i{width:22px;height:32px;border-radius:3px;
  background:linear-gradient(180deg,var(--flap) 0 50%,var(--flap2) 50% 100%);
  border:1px solid rgba(255,255,255,.07);animation:idle 2.6s var(--ease) infinite}
.empty .blanks i:nth-child(2){animation-delay:.12s}
.empty .blanks i:nth-child(3){animation-delay:.24s}
.empty .blanks i:nth-child(4){animation-delay:.36s}
.empty .blanks i:nth-child(5){animation-delay:.48s}
@keyframes idle{0%,70%,100%{transform:rotateX(0)}80%{transform:rotateX(-70deg)}}
.empty .lab{font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--amber);font-weight:700}
.empty p{font-size:0.82rem;color:var(--d2);max-width:420px;line-height:1.7}

@media(max-width:920px){
  .display{grid-template-columns:1fr}
  .mon{order:-1}
  .tr{grid-template-columns:38px minmax(0,1fr) 82px}
  .tr .cell.hidey,.tr .stat{display:none}
}
@media(max-width:760px){.page{width:94%;padding:40px 0 60px}.head .clock{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div class="page">
  <div class="stub">↑ Accessories &amp; Add-ons</div>

  <section class="sec">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="h2"></h2>
      </div>
      <span class="clock"><i></i><span id="clock">--:--:--</span></span>
      <a class="all" id="all">All vlogs →</a>
    </div>
    <div id="body"></div>
  </section>

  <div class="stub">↓ Ride Gallery</div>
</div>

<script src="vlog-data.js"></script>
<script>
const V = window.VLOG
document.getElementById('kick').textContent = V.kicker
document.getElementById('h2').textContent   = V.heading
document.getElementById('all').href         = V.page

/* the board's clock — a departures board that is not keeping time is a poster */
setInterval(() => {
  const d = new Date()
  document.getElementById('clock').textContent =
    [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':')
}, 1000)

if (V.isEmpty) {
  document.getElementById('body').innerHTML = `
    <div class="empty">
      <div class="blanks"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="lab">No departures</div>
      <p>The board is blank until the first ride is filmed. Every vlog that lands
         takes the top row and pushes the rest down.</p>
    </div>`
} else {
  build()
}

function build() {
  document.getElementById('body').innerHTML = `
    <div class="display">
      <div class="board">
        <div class="strip">
          <b>Now showing</b><span id="sub"></span>
          <span class="st" id="st">On air</span>
        </div>
        <div class="flaps" id="flaps"></div>
        <div class="under" id="under"></div>
      </div>
      <div class="mon" id="mon">
        <span class="cut"></span>
        <span class="grille"></span>
        <span class="tag" id="montag"></span>
      </div>
    </div>

    <div class="table">
      <div class="tr thead">
        <span>№</span><span>Title</span><span class="cell hidey">Kind</span>
        <span class="cell">Runs</span><span class="cell hidey">Filmed</span><span>Status</span>
      </div>
      ${V.shown.map(v => `
      <button class="tr pick" data-i="${v.i}" style="--k:${v.n}">
        <span class="no">${String(v.n).padStart(2, '0')}</span>
        <span class="ttl">${v.title}${v.fav ? '<em>Pick</em>' : ''}</span>
        <span class="cell hidey">${v.cat}</span>
        <span class="cell">${v.duration}</span>
        <span class="cell hidey">${v.when.short}</span>
        <span class="stat">Ready</span>
      </button>`).join('')}
      <a class="trmore" href="${V.page}">
        <b>+${V.more}</b><span>More departures</span>
        <s>the whole timetable</s><i>→</i>
      </a>
    </div>`

  wire()
}

/* ══ split-flap ══
   One tile per character, each flipping a beat after the one before it, so the
   line clatters left to right instead of snapping over all at once. */
function flap(el, text) {
  el.innerHTML = [...text].map((c, i) =>
    c === ' '
      ? `<span class="fl sp"></span>`
      : `<span class="fl" style="--i:${i}"><b>${c === '&' ? '&amp;' : c}</b></span>`
  ).join('')
}

/** The board has a fixed number of tiles, so a long title is cut to fit. */
function fit(s, n) {
  const up = s.toUpperCase().replace(/[^A-Z0-9 ,.'&-]/g, '')
  return up.length <= n ? up : up.slice(0, n - 1).trimEnd() + '…'
}

function wire() {
  const rows = [...document.querySelectorAll('.tr.pick')]
  const mon  = document.getElementById('mon')
  let at = -1

  function pick(i) {
    if (i === at) return
    at = i
    const v = V.all[i]

    rows.forEach(r => {
      const on = +r.dataset.i === i
      r.classList.toggle('on', on)
      r.querySelector('.stat').textContent = on ? 'On air' : 'Ready'
    })

    flap(document.getElementById('flaps'), fit(v.title, 22))
    document.getElementById('sub').textContent = `· ${v.cat}`
    document.getElementById('under').innerHTML =
      `<u>${v.type === 'short' ? 'Short' : 'Full film'}</u><u>${v.duration}</u>` +
      `<u>${v.when.label}</u><u>${v.views} views</u>` +
      `<a href="${v.url}" target="_blank" rel="noopener">Watch ↗</a>`

    /* the monitor cuts rather than crossfades — it is a board, not a cinema */
    mon.classList.remove('on')
    mon.classList.add('cutting')
    document.getElementById('montag').textContent = `№ ${String(v.n).padStart(2, '0')} · ${v.when.short}`
    setTimeout(() => {
      mon.querySelectorAll('video,img').forEach(n => n.remove())
      const media = v.clip
        ? Object.assign(document.createElement('video'),
            { src: v.clip, autoplay: true, muted: true, loop: true, playsInline: true })
        : Object.assign(document.createElement('img'), { src: v.posterBig, alt: v.title })
      if (!v.clip) media.onerror = () => { media.onerror = null; media.src = v.still }
      mon.prepend(media)
      mon.classList.add('on')
    }, 160)
    setTimeout(() => mon.classList.remove('cutting'), 420)
  }

  document.querySelector('.table').addEventListener('click', e => {
    const r = e.target.closest('.tr.pick'); if (!r) return
    pick(+r.dataset.i)
  })
  /* hovering a row previews nothing — a board does not preview. It selects. */
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') pick((at + 1) % V.shown.length)
    if (e.key === 'ArrowUp')   pick((at - 1 + V.shown.length) % V.shown.length)
  })

  pick(0)
}
</script>
</body>
</html>
