<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Next Ride · 10 · Visor HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════
   VISOR HUD — the next ride as it would appear projected on the visor.

   A helmet display has rules that a web card does not, and following
   them is what makes this read as a HUD rather than as a dark card with
   cyan text:

   · IT IS PROJECTED, NOT PRINTED. Everything glows outward — text carries
     its own halo, rules are hairlines, and nothing has a solid fill. A
     filled button would read as an object behind the visor, not light on
     it.
   · IT IS CORNERED, NOT BOXED. Instrument overlays bracket their panels
     at the corners instead of ruling all four sides, because a full box
     eats sightline.
   · IT FLICKERS AND SCANS. A slow scanline crawls down and the whole
     panel has a barely-there refresh flicker — enough to read as live,
     far short of distracting.

   The readouts are the ones a rider actually wants before setting off:
   time to muster, distance, the organiser, the fee. No route drawing —
   this is the instrument layer, not the navigation layer.
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#04070a; --glass:rgba(8,16,20,0.72);
  --hud:#4fe3c1; --hud2:#7ef0d6; --warn:#ffb020;
  --off:#e6fbf6; --d1:rgba(230,251,246,0.6); --d2:rgba(230,251,246,0.38);
  --d3:rgba(230,251,246,0.2); --bd:rgba(79,227,193,0.22); --bd2:rgba(79,227,193,0.4);
  --disp:'Chakra Petch',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1);
  --c:#dc2626;
}
body{background:var(--ink);color:var(--d1);font-family:var(--disp);min-height:100vh;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:clamp(16px,4vw,42px)}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(70vw 60vh at 22% 18%,rgba(255,196,120,0.12),transparent 62%),
    radial-gradient(60vw 60vh at 82% 78%,rgba(120,90,220,0.12),transparent 64%),
    linear-gradient(160deg,#101420,#04070a 60%)}
::selection{background:var(--hud);color:var(--ink)}

/* ── the visor ── */
.visor{position:relative;z-index:2;width:min(100%,452px);
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  /* the aperture: flatter at the top, curved at the chin, like a real visor */
  border-radius:26px 26px 40px 40px/22px 22px 64px 64px;
  border:1px solid var(--bd);overflow:hidden;
  padding:clamp(20px,3.4vw,28px) clamp(18px,3vw,24px) clamp(18px,3vw,24px);
  box-shadow:0 34px 70px -28px rgba(0,0,0,0.9),inset 0 0 60px rgba(79,227,193,0.06)}
/* scanlines */
.visor::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  background:repeating-linear-gradient(rgba(79,227,193,0.05) 0 1px,transparent 1px 3px);
  opacity:0.6}
/* the crawling refresh line */
.visor::after{content:'';position:absolute;left:0;right:0;height:52px;z-index:7;
  pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(79,227,193,0.09),transparent);
  animation:scan 5.5s linear infinite}
@keyframes scan{0%{top:-60px}100%{top:100%}}

.flick{animation:flick 7s steps(1,end) infinite}
@keyframes flick{0%,97%{opacity:1}97.5%{opacity:.82}98%{opacity:1}98.5%{opacity:.88}99%{opacity:1}}

/* corner brackets */
.br{position:absolute;width:16px;height:16px;border:1.6px solid var(--hud);opacity:0.55;
  pointer-events:none;z-index:5}
.br.tl{top:11px;left:11px;border-right:0;border-bottom:0}
.br.tr{top:11px;right:11px;border-left:0;border-bottom:0}
.br.bl{bottom:11px;left:11px;border-right:0;border-top:0}
.br.br2{bottom:11px;right:11px;border-left:0;border-top:0}

/* ── head ── */
.top{position:relative;display:flex;align-items:center;gap:9px;margin-bottom:16px;z-index:3}
.top .lbl{font-weight:600;font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--hud);text-shadow:0 0 10px rgba(79,227,193,0.6)}
.top .sig{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:0.52rem;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--d2)}
.top .sig i{width:3px;border-radius:1px;background:var(--hud);display:block;
  box-shadow:0 0 6px var(--hud)}
.top .sig i:nth-child(1){height:5px}.top .sig i:nth-child(2){height:8px}
.top .sig i:nth-child(3){height:11px}.top .sig i:nth-child(4){height:14px;opacity:.3}

/* ── the primary readout ── */
.prime{position:relative;z-index:3;text-align:center;margin-bottom:18px}
.prime .k{font-size:0.52rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--d2);
  margin-bottom:8px}
.prime .clock{display:flex;align-items:baseline;justify-content:center;gap:3px;
  font-variant-numeric:tabular-nums}
.prime .clock b{font-size:clamp(2.2rem,8vw,3.1rem);font-weight:700;color:var(--off);
  line-height:1;letter-spacing:-0.01em;text-shadow:0 0 18px rgba(79,227,193,0.55)}
.prime .clock em{font-style:normal;font-size:0.72rem;color:var(--hud);margin-right:9px;
  letter-spacing:0.08em}
.prime .bar{margin-top:12px;height:3px;background:rgba(79,227,193,0.14);position:relative;
  overflow:hidden}
.prime .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hud);
  box-shadow:0 0 10px var(--hud);transition:width 1s var(--ease)}
.prime .scale{display:flex;justify-content:space-between;margin-top:6px;font-size:0.46rem;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--d3)}

/* ── target block ── */
.target{position:relative;z-index:3;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);
  padding:14px 0;margin-bottom:16px}
.target .k{font-size:0.48rem;letter-spacing:0.24em;text-transform:uppercase;color:var(--d2);
  margin-bottom:7px}
.target h2{font-weight:700;font-size:clamp(1.5rem,5vw,2rem);color:var(--off);line-height:1.02;
  letter-spacing:0.005em;text-transform:uppercase;text-shadow:0 0 16px rgba(79,227,193,0.4);
  margin-bottom:6px}
.target .sub{font-size:0.6rem;color:var(--d2);letter-spacing:0.05em;line-height:1.5}

/* ── readouts ── */
.reads{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-bottom:16px}
.rd{position:relative;padding:10px 11px}
/* bracketed, not boxed */
.rd::before,.rd::after{content:'';position:absolute;width:9px;height:9px;
  border:1.4px solid var(--bd2);pointer-events:none}
.rd::before{top:0;left:0;border-right:0;border-bottom:0}
.rd::after{bottom:0;right:0;border-left:0;border-top:0}
.rd k{display:block;font-size:0.44rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--d3);margin-bottom:6px}
.rd v{display:block;font-weight:600;font-size:1rem;color:var(--off);line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 0 10px rgba(79,227,193,0.3)}
.rd.warn v{color:var(--warn);text-shadow:0 0 10px rgba(255,176,32,0.4)}

/* ── the foot ── */
.foot{position:relative;z-index:3;display:flex;align-items:center;gap:10px;margin-bottom:15px}
.foot .badge{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;
  border:1px solid var(--bd2);overflow:hidden;position:relative}
.foot .badge img{width:100%;height:100%;object-fit:contain;padding:4px;
  filter:brightness(0) invert(1) drop-shadow(0 0 4px rgba(79,227,193,0.5))}
.foot .badge span{font-weight:700;font-size:0.68rem;color:var(--hud)}
.foot .tx{min-width:0}
.foot .tx b{display:block;font-size:0.74rem;font-weight:600;color:var(--off);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot .tx u{display:block;text-decoration:none;font-size:0.44rem;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--d3);margin-top:3px}
.foot .fee{margin-left:auto;text-align:right;flex-shrink:0}
.foot .fee b{display:block;font-weight:700;font-size:1.1rem;color:var(--hud);line-height:1;
  text-shadow:0 0 10px rgba(79,227,193,0.5)}
.foot .fee u{display:block;text-decoration:none;font-size:0.42rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--d3);margin-top:4px}

/* projected light, not a printed button */
.go{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:13px;border:1.4px solid var(--hud);color:var(--hud);text-decoration:none;
  font-weight:600;font-size:0.72rem;letter-spacing:0.22em;text-transform:uppercase;
  background:rgba(79,227,193,0.07);transition:.3s var(--ease);
  text-shadow:0 0 10px rgba(79,227,193,0.5)}
.go:hover{background:var(--hud);color:var(--ink);text-shadow:none;
  box-shadow:0 0 26px -4px var(--hud)}
.go:hover .arrow{transform:translateX(5px)}
.arrow{transition:transform .3s var(--ease);display:inline-block}

.switch{position:relative;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  justify-content:center;font-family:var(--sans);font-size:0.6rem;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--d3)}
.switch button{font-family:var(--sans);font-size:0.6rem;letter-spacing:0.1em;padding:7px 13px;
  border-radius:99px;border:1px solid var(--bd2);background:transparent;color:var(--d2);
  cursor:pointer;transition:.24s var(--ease)}
.switch button.on{background:var(--hud);color:var(--ink);border-color:var(--hud);font-weight:700}
.switch button:hover{color:var(--off)}
.switch button.on:hover{color:var(--ink)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<article class="visor flick">
  <span class="br tl"></span><span class="br tr"></span>
  <span class="br bl"></span><span class="br br2"></span>

  <div class="top">
    <span class="lbl">Next ride</span>
    <span class="sig"><i></i><i></i><i></i><i></i>Live</span>
  </div>

  <div class="prime">
    <div class="k" id="primeK">Time to muster</div>
    <div class="clock" id="clock"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="scale"><span>30 days</span><span>Ride day</span></div>
  </div>

  <div class="target">
    <div class="k">Target</div>
    <h2 id="dest"></h2>
    <div class="sub" id="sub"></div>
  </div>

  <div class="reads">
    <div class="rd"><k>Distance</k><v id="km"></v></div>
    <div class="rd"><k>Date</k><v id="dateV"></v></div>
    <div class="rd" id="tRd"><k id="tk">Stops</k><v id="tv"></v></div>
    <div class="rd"><k>Region</k><v id="region"></v></div>
  </div>

  <div class="foot">
    <div class="badge" id="badge"></div>
    <div class="tx"><b id="orgName"></b><u>Organiser</u></div>
    <div class="fee" id="feeBox"></div>
  </div>

  <a class="go" href="#">Explore ride <em class="arrow">→</em></a>
</article>

<div class="switch" id="switch"><span>Preview with:</span></div>

<script src="nextride-data.js"></script>
<script>
let ride = NR.next

const sw = document.getElementById('switch')
NR.rides.forEach(r => {
  const b = document.createElement('button')
  b.textContent = r.name.split(' ').slice(0, 2).join(' ')
  b.dataset.id = r.id
  b.onclick = () => { ride = r; paint(); tick() }
  sw.appendChild(b)
})

function paint() {
  document.documentElement.style.setProperty('--c', ride.color)
  document.getElementById('dest').textContent = ride.dest
  document.getElementById('sub').textContent = ride.loop
    ? `Loop · out of ${ride.fromCity} and back · ${ride.stopCount} stops`
    : `From ${ride.fromCity} · ${ride.stopCount} stops`

  document.getElementById('km').textContent = ride.distance
  document.getElementById('dateV').textContent = ride.date.replace(/ \d{4}$/, '')
  document.getElementById('region').textContent = ride.states.join(' · ')

  const tk = document.getElementById('tk'), tv = document.getElementById('tv')
  const rd = document.getElementById('tRd')
  if (ride.assemble) { tk.textContent = 'Assemble'; tv.textContent = ride.assemble; rd.classList.add('warn') }
  else if (ride.rideStart) { tk.textContent = 'Rolls out'; tv.textContent = ride.rideStart; rd.classList.add('warn') }
  else { tk.textContent = 'Day'; tv.textContent = NR.weekday(ride); rd.classList.remove('warn') }

  /* the primary label follows what is actually being counted to */
  document.getElementById('primeK').textContent =
    ride.assemble ? 'Time to muster' : 'Time to first light'

  const badge = document.getElementById('badge')
  badge.innerHTML = ride.logo
    ? `<img src="${ride.logo}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${ride.initials}'}))" />`
    : `<span>${ride.initials}</span>`
  document.getElementById('orgName').textContent = ride.organizer
  document.getElementById('feeBox').innerHTML =
    ride.fee ? `<b>${ride.fee}</b><u>Entry</u>` : ''

  document.querySelectorAll('.switch button').forEach(b =>
    b.classList.toggle('on', b.dataset.id === ride.id))
}

function tick() {
  const c = NR.countdown(ride)
  const clock = document.getElementById('clock')

  if (c.phase === 'riding') clock.innerHTML = `<b>GO</b>`
  else if (c.phase === 'past') clock.innerHTML = `<b>—</b>`
  else clock.innerHTML =
    `<b>${c.d}</b><em>d</em><b>${NR.pad(c.h)}</b><em>h</em><b>${NR.pad(c.m)}</b><em>m</em><b>${NR.pad(c.s)}</b><em>s</em>`

  const WINDOW = 30 * 86400000
  const done = Math.max(0, Math.min(1, 1 - c.total / WINDOW))
  document.getElementById('bar').style.width = (done * 100).toFixed(1) + '%'
}

paint()
tick()
setInterval(tick, 1000)
</script>
</body>
</html>
