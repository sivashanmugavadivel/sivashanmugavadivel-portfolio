<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mileage · 8 · Repack</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════
   REPACK — one reading, and you choose which way round to read it.

   Promote any figure and the whole wall re-packs around it. Every
   card is measured before the layout changes and again after, then
   put back where it was with a transform and released — First, Last,
   Invert, Play. Nothing jumps, nothing cross-fades, and the browser
   only ever animates transform, so a full re-pack costs the
   compositor nothing.

   The part most FLIP work gets wrong: scaling a box scales the type
   inside it, and text that stretches on the way across reads as a
   video glitch. Every card's content is counter-scaled by the exact
   inverse each frame, so the box grows while the words hold still.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828; --well:#0d0b15;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --honey:#e0bb3c;
  --good:#4ade80; --bad:#fb7185;
  --sans:'Inter',sans-serif; --serif:'Playfair Display',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--honey);color:#161018}
.page{width:90%;max-width:1180px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:26px clamp(14px,3vw,30px) 32px;overflow:hidden}
.sec::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 0%,rgba(224,187,60,0.08),transparent 70%)}

.head{position:relative;z-index:2;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.kick{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--honey);display:block;margin-bottom:7px}
.head h2{font-family:var(--serif);font-size:clamp(1.35rem,3.6vw,2rem);font-weight:700;color:var(--off);line-height:1.1}
.head .note{font-size:0.76rem;color:var(--d2);line-height:1.65;max-width:440px;margin-top:8px}

.tip{position:relative;z-index:2;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--d3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tip i{width:15px;height:15px;border-radius:4px;border:1px solid var(--d3);display:grid;
  place-items:center;font-style:normal;font-size:.55rem}

/* ══ the wall ══ */
.wall{position:relative;z-index:2;display:grid;gap:9px;
  grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(96px,auto)}

.cell{position:relative;background:var(--card2);border:1px solid var(--bd);border-radius:14px;
  cursor:pointer;text-align:left;font-family:var(--sans);overflow:hidden;
  /* transform is owned by the FLIP; only the paint properties transition */
  transition:border-color .35s var(--ease),background .35s var(--ease),box-shadow .35s var(--ease);
  will-change:transform}
.cell:hover{border-color:rgba(224,187,60,.3)}
.cell:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* the counter-scaled layer — everything readable lives in here */
.in{position:absolute;inset:0;padding:14px 16px;display:flex;flex-direction:column;
  justify-content:flex-end;transform-origin:top left;will-change:transform}

.cell s{display:block;text-decoration:none;font-family:var(--mono);font-size:0.45rem;
  letter-spacing:0.2em;text-transform:uppercase;color:var(--d3)}
.cell .v{display:block;font-family:var(--mono);font-weight:700;color:var(--off);
  line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  font-size:1.3rem;margin-top:8px;white-space:nowrap}
.cell .v u{text-decoration:none;font-size:0.6rem;color:var(--d2);margin-left:4px;font-weight:400;letter-spacing:0}
.cell em{display:block;font-style:normal;font-size:0.56rem;color:var(--d3);margin-top:7px;line-height:1.5}
.cell .say{display:none}
.cell.up .v{color:var(--good)}
.cell.dn .v{color:var(--bad)}

/* ── promoted ──
   Two columns by three rows, which is the one shape that packs the
   other six exactly: three down the free column beside it, three
   across the row beneath. Two-by-two leaves a card stranded alone on
   a fourth row. */
.cell.hero{grid-column:span 2;grid-row:span 3;
  background:
    radial-gradient(120% 90% at 100% 0%,rgba(224,187,60,.13),transparent 62%),
    var(--card2);
  border-color:rgba(224,187,60,.24)}
.cell.hero .in{padding:clamp(18px,3vw,26px);justify-content:space-between}
.cell.hero s{font-size:0.52rem;color:var(--honey)}
.cell.hero .v{font-size:clamp(2.6rem,8.5vw,4.4rem);margin-top:0;letter-spacing:-.045em}
.cell.hero .v u{font-size:.9rem}
.cell.hero em{font-size:0.66rem;margin-top:10px}
.cell.hero .say{display:block;font-size:0.71rem;line-height:1.7;color:var(--d2);
  border-left:2px solid rgba(224,187,60,.45);padding-left:11px;margin-top:14px;max-width:340px}
/* the middle block of a promoted card floats, so the figure sits
   optically centred rather than jammed against the label */
.cell.hero .mid{margin:auto 0}

/* two across: the hero takes the full width for two rows, and the
   remaining six fall into three clean rows of two */
@media(max-width:820px){
  .wall{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell.hero{grid-column:span 2;grid-row:span 2}
}
@media(max-width:460px){
  .wall{grid-template-columns:1fr}
  .cell.hero{grid-column:span 1;grid-row:span 2}
}

/* ══ empty ══ */
.none{position:relative;z-index:2;border:1px dashed var(--bd2);border-radius:14px;
  padding:38px 26px;text-align:center;color:var(--d2);font-size:0.8rem;line-height:1.75;max-width:470px;margin:0 auto}
.none b{display:block;font-family:var(--mono);font-size:0.56rem;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--honey);margin-bottom:12px}
.none .box{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:190px;margin:0 auto 18px}
.none .box i{height:28px;border-radius:7px;background:rgba(255,255,255,.04);
  border:1px dashed var(--bd);display:block}
</style>
</head>
<body>
<div class="page">
  <div class="stub">section above</div>

  <section class="sec" aria-labelledby="mh">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="mh"></h2>
        <p class="note" id="note"></p>
      </div>
    </div>
    <div id="body"></div>
  </section>

  <div class="stub">section below</div>
</div>

<script src="mileage-data.js"></script>
<script src="mileage-motion.js"></script>
<script>
document.getElementById('kick').textContent = MILEAGE_COPY.kicker
document.getElementById('mh').textContent   = MILEAGE_COPY.title
document.getElementById('note').textContent = MILEAGE_COPY.note

const body = document.getElementById('body')

if (MILEAGE_EMPTY) {
  body.innerHTML = `<div class="none">
      <div class="box"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <b>Nothing to pack</b>
      ${MILEAGE_COPY.empty}
    </div>`
} else {

/* The reading itself leads the wall, then everything it implies. Each
   carries the sentence it would want to say if it were the one being
   read first. */
const CELLS = [
  { key: 'kmpl', label: 'Mileage', value: MILEAGE.kmpl.toFixed(1), unit: 'km/l',
    sub: `measured ${MILEAGE.date}`, say: MILEAGE.method },
  ...MILEAGE_FACTS.map((f) => ({
    key: f.key, label: f.label, value: f.value, unit: f.unit, sub: f.sub, tone: f.tone,
    say: {
      range:  `At ${MILEAGE.kmpl} km/l a brimmed ${MILEAGE_BIKE.tank} L tank is worth ${MILEAGE.range} km — comfortably a day out and back without looking for a pump.`,
      cost:   `Every kilometre costs ${MILEAGE_BIKE.currency}${MILEAGE.costPerKm.toFixed(2)} in fuel at today's rate. A hundred kilometres is ${MILEAGE_BIKE.currency}${Math.round(MILEAGE.costPerKm * 100)}.`,
      fill:   `Filling it costs ${MILEAGE_BIKE.currency}${MILEAGE.tankCost.toLocaleString('en-IN')} — ${MILEAGE_BIKE.tank} litres at ${MILEAGE_BIKE.currency}${MILEAGE.rate.toFixed(2)}.`,
      claim:  `The brochure says ${MILEAGE_BIKE.claimed} km/l. Measured brim to brim it returns ${MILEAGE.kmpl} — ${MILEAGE.vsClaimed >= 0 ? 'a little over' : 'a little under'}.`,
      odo:    `${fmtKm(MILEAGE.odo)} km on it when the reading was taken, on ${MILEAGE.date}.`,
      per100: `Turned round the other way: ${MILEAGE.per100} litres to cover a hundred kilometres.`,
    }[f.key] || f.sub,
  })),
]

const wall = document.getElementById('body').appendChild(document.createElement('div'))
body.insertAdjacentHTML('afterbegin',
  `<p class="tip"><i>↹</i> promote any figure — the wall re-packs around it</p>`)
wall.className = 'wall'
wall.id = 'wall'

wall.innerHTML = CELLS.map((c, i) => `
  <button class="cell ${c.tone || ''}" data-i="${i}" aria-pressed="false">
    <span class="in">
      <s>${c.label}</s>
      <span class="mid">
        <span class="v">${c.value}${c.unit ? `<u>${c.unit}</u>` : ''}</span>
        <em>${c.sub}</em>
      </span>
      <span class="say">${c.say}</span>
    </span>
  </button>`).join('')

const cells = [...wall.querySelectorAll('.cell')]

/* ── FLIP with counter-scaled content ────────────────────────────
   The generic helper in mileage-motion.js animates one element. Here
   each card is two: the box, which is allowed to scale, and the layer
   inside it, which must not. The inner layer runs the exact inverse
   of the outer scale on the same curve, so the two cancel and the
   words hold their size while the box travels and grows. */
function repack(mutate) {
  const first = new Map()
  for (const el of cells) first.set(el, el.getBoundingClientRect())

  mutate()

  if (MM.REDUCED) return

  /* Ordered so the cards that move furthest lead — the eye follows the
     biggest movement, and everything else reads as settling behind it. */
  const moves = cells.map((el) => {
    const f = first.get(el)
    const l = el.getBoundingClientRect()
    return {
      el,
      dx: f.left - l.left,
      dy: f.top - l.top,
      sx: l.width ? f.width / l.width : 1,
      sy: l.height ? f.height / l.height : 1,
      dist: Math.hypot(f.left - l.left, f.top - l.top),
    }
  }).sort((a, b) => b.dist - a.dist)

  const D = 640
  moves.forEach((m, rank) => {
    const still = !m.dx && !m.dy
      && Math.abs(m.sx - 1) < 0.001 && Math.abs(m.sy - 1) < 0.001
    if (still) return
    const delay = rank * 22
    m.el.animate([
      { transform: `translate(${m.dx}px, ${m.dy}px) scale(${m.sx}, ${m.sy})` },
      { transform: 'none' },
    ], { duration: D, easing: MM.EASE.out, delay, fill: 'both', composite: 'replace' })

    /* the inverse, on the same curve and the same delay — anything else
       and the two drift apart mid-flight and the type breathes */
    const inner = m.el.querySelector('.in')
    inner.animate([
      { transform: `scale(${(1 / m.sx).toFixed(5)}, ${(1 / m.sy).toFixed(5)})` },
      { transform: 'none' },
    ], { duration: D, easing: MM.EASE.out, delay, fill: 'both' })
  })
}

/* ── promotion ───────────────────────────────────────────────────── */
let heroI = -1
function promote(i) {
  if (i === heroI) return
  heroI = i
  repack(() => {
    cells.forEach((el, j) => {
      el.classList.toggle('hero', j === i)
      el.setAttribute('aria-pressed', j === i ? 'true' : 'false')
    })
  })
}

wall.addEventListener('click', (e) => {
  const c = e.target.closest('.cell')
  if (c) promote(Number(c.dataset.i))
})

/* ── the entrance ────────────────────────────────────────────────
   The same machinery, so the arrival and the re-pack are visibly the
   same move. The wall starts as a single stacked column and unfolds
   into the grid — which is a layout change, so FLIP animates it for
   free rather than it needing an entrance of its own. */
function enter() {
  if (MM.REDUCED) {
    cells[0].classList.add('hero')
    cells[0].setAttribute('aria-pressed', 'true')
    heroI = 0
    wall.style.gridTemplateColumns = ''
    return
  }
  /* measure the stacked state, then release into the real grid */
  wall.style.gridTemplateColumns = '1fr'
  cells.forEach((el) => { el.style.gridColumn = 'auto'; el.style.gridRow = 'auto' })
  void wall.offsetWidth

  repack(() => {
    wall.style.gridTemplateColumns = ''
    cells.forEach((el) => { el.style.gridColumn = ''; el.style.gridRow = '' })
    cells[0].classList.add('hero')
    cells[0].setAttribute('aria-pressed', 'true')
    heroI = 0
  })
}

/* Laid out stacked from the start so the first measurement is real —
   measuring a grid and then pretending it was a column would animate
   from somewhere the cards have never been. */
wall.style.gridTemplateColumns = '1fr'

new IntersectionObserver((es, ob) => {
  es.forEach((e) => {
    if (!e.isIntersecting) return
    ob.unobserve(e.target)
    requestAnimationFrame(enter)
  })
}, { threshold: 0.25 }).observe(wall)
}
</script>
</body>
</html>
