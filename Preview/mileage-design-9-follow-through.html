<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mileage · 9 · Follow-Through</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════
   FOLLOW-THROUGH — the section hung from a pivot.

   Five plates on a chain. Each is nested inside the one above it, so
   rotations compound the way they do on a real linkage, and each is
   trying to hang vertically — which means correcting for everything
   its parents are doing, one beat late. Disturb the top and the
   correction travels down as a wave: the plates do not all start
   moving at once, they do not all stop at once, and the last one is
   still settling long after the first has stopped. That is overlapping
   action, and it is the difference between a thing that has parts and
   a thing that is a picture of a thing that has parts.

   Push it with the pointer. Scrolling past hands it an impulse too,
   proportional to how fast you went by.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828; --well:#0d0b15;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --honey:#e0bb3c;
  --good:#4ade80; --bad:#fb7185;
  --sans:'Inter',sans-serif; --serif:'Playfair Display',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--honey);color:#161018}
.page{width:90%;max-width:1180px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:26px clamp(14px,3vw,30px) 34px;overflow:hidden}
.sec::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 0%,rgba(224,187,60,0.08),transparent 70%)}

.head{position:relative;z-index:2;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.kick{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--honey);display:block;margin-bottom:7px}
.head h2{font-family:var(--serif);font-size:clamp(1.35rem,3.6vw,2rem);font-weight:700;color:var(--off);line-height:1.1}
.head .note{font-size:0.76rem;color:var(--d2);line-height:1.65;max-width:440px;margin-top:8px}

/* ══ the rig ══ */
.rig{position:relative;z-index:2;padding-top:26px;touch-action:pan-y;
  cursor:grab;user-select:none}
.rig:active{cursor:grabbing}

/* the mounting point everything hangs from */
.pivot{position:absolute;left:50%;top:8px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#5a5470,#211e2e 70%);
  border:1px solid var(--bd2);z-index:9;
  box-shadow:0 3px 8px rgba(0,0,0,.7)}
.pivot::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
  border-radius:50%;background:var(--honey);opacity:.7}

/* a link: rotates about its own top-centre, and carries the next one */
.link{position:relative;transform-origin:50% 0;will-change:transform}
/* the wire between one plate and the next */
.wire{position:relative;width:1px;height:16px;margin:0 auto;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.07))}

.plate{position:relative;background:var(--card2);border:1px solid var(--bd);border-radius:13px;
  padding:14px 18px;box-shadow:0 18px 34px -26px #000;
  transition:border-color .3s var(--ease)}
.rig.pushed .plate{border-color:rgba(224,187,60,.22)}

/* Plate 1 — who this is. The plates are deliberately not all the same
   width: a chain that widens as it descends has a silhouette, and each
   plate's width is also its moment of inertia, so the narrow ones at
   the top move first and the wide ones below lag. */
.p-who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  max-width:min(400px,92%);margin:0 auto}
.p-who b{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--off)}
.p-who s{text-decoration:none;font-family:var(--mono);font-size:0.48rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--d3)}

/* plate 2 — the reading */
.p-read{display:flex;align-items:flex-end;justify-content:center;gap:10px;
  max-width:min(480px,94%);margin:0 auto;
  padding:clamp(14px,2.6vw,22px) clamp(18px,3vw,28px);
  background:
    radial-gradient(110% 90% at 50% 0%,rgba(224,187,60,.12),transparent 66%),
    var(--card2);
  border-color:rgba(224,187,60,.22)}
.p-read b{font-family:var(--mono);font-size:clamp(2.6rem,9vw,4.2rem);font-weight:700;color:var(--off);
  line-height:.9;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.p-read span{font-family:var(--mono);font-size:clamp(.65rem,1.7vw,.9rem);letter-spacing:0.2em;
  text-transform:uppercase;color:var(--honey);padding-bottom:clamp(5px,1.2vw,10px)}

/* plates 3 and 4 — the figures, three across */
.p-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;
  background:transparent;border:0;padding:0;box-shadow:none}
.cellx{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;
  box-shadow:0 16px 30px -26px #000;transition:border-color .3s var(--ease)}
.cellx s{display:block;text-decoration:none;font-family:var(--mono);font-size:0.45rem;
  letter-spacing:0.18em;text-transform:uppercase;color:var(--d3);margin-bottom:6px}
.cellx b{display:block;font-family:var(--mono);font-size:1.02rem;font-weight:700;color:var(--off);
  line-height:1;font-variant-numeric:tabular-nums}
.cellx b u{text-decoration:none;font-size:0.56rem;color:var(--d2);margin-left:3px;font-weight:400}
.cellx em{display:block;font-style:normal;font-size:0.55rem;color:var(--d3);margin-top:6px;line-height:1.5}
.cellx.up b{color:var(--good)}
.cellx.dn b{color:var(--bad)}
@media(max-width:640px){ .p-row{grid-template-columns:1fr} }

/* plate 5 — the sentence, and the lightest thing on the chain, so it
   swings furthest and settles last */
.p-say{display:flex;gap:10px;align-items:flex-start;font-size:0.71rem;line-height:1.7;color:var(--d1);
  max-width:520px;margin:0 auto}
.p-say i{flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--honey);opacity:.55}

/* ── the bench ── */
.bench{position:relative;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:clamp(20px,4vw,30px);padding-top:14px;border-top:1px solid var(--bd)}
.bench .lab{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--d3)}
.bench button{padding:7px 14px;border:1px solid var(--bd2);background:transparent;color:var(--d2);
  border-radius:99px;cursor:pointer;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.16em;
  text-transform:uppercase;transition:.25s var(--ease)}
.bench button:hover{color:var(--honey);border-color:rgba(224,187,60,.45);background:rgba(224,187,60,.06)}
.bench button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* the phase readout — how far behind each link is running */
.phase{margin-left:auto;display:flex;gap:3px;align-items:flex-end;height:22px}
.phase i{width:7px;border-radius:2px 2px 0 0;background:var(--honey);opacity:.55;display:block;
  height:2px;transform-origin:50% 100%}

/* ══ empty ══ */
.none{position:relative;z-index:2;border:1px dashed var(--bd2);border-radius:14px;
  padding:38px 26px;text-align:center;color:var(--d2);font-size:0.8rem;line-height:1.75;max-width:470px;margin:0 auto}
.none b{display:block;font-family:var(--mono);font-size:0.56rem;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--honey);margin-bottom:12px}
.none .hook{width:2px;height:56px;margin:0 auto 16px;background:var(--bd2);position:relative;
  transform-origin:50% 0;animation:sway 4s cubic-bezier(.45,0,.55,1) infinite}
.none .hook::after{content:'';position:absolute;left:50%;bottom:-9px;width:18px;height:18px;
  margin-left:-9px;border-radius:4px;border:1px dashed rgba(224,187,60,.4)}
@keyframes sway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}

@media(prefers-reduced-motion:reduce){
  .none .hook{animation:none;transform:none}
  .rig{cursor:default}
}
</style>
</head>
<body>
<div class="page">
  <div class="stub">section above</div>

  <section class="sec" aria-labelledby="mh">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="mh"></h2>
        <p class="note" id="note"></p>
      </div>
    </div>
    <div id="body"></div>
  </section>

  <div class="stub">section below</div>
</div>

<script src="mileage-data.js"></script>
<script src="mileage-motion.js"></script>
<script>
document.getElementById('kick').textContent = MILEAGE_COPY.kicker
document.getElementById('mh').textContent   = MILEAGE_COPY.title
document.getElementById('note').textContent = MILEAGE_COPY.note

const body = document.getElementById('body')

if (MILEAGE_EMPTY) {
  body.innerHTML = `<div class="none">
      <div class="hook"></div>
      <b>Nothing on the hook</b>
      ${MILEAGE_COPY.empty}
    </div>`
} else {

const F = MILEAGE_FACTS
const cell = (f) => `
  <div class="cellx ${f.tone || ''}">
    <s>${f.label}</s>
    <b>${f.value}${f.unit ? `<u>${f.unit}</u>` : ''}</b>
    <em>${f.sub}</em>
  </div>`

/* Five links, nested. Nesting is the whole mechanism: a child inherits
   its parent's rotation, so the chain compounds without any of the
   maths having to know about world space. */
body.innerHTML = `
  <div class="rig" id="rig">
    <div class="pivot"></div>

    <div class="link" data-l="0">
      <div class="plate p-who">
        <b>${MILEAGE_BIKE.name}</b>
        <s>brim to brim · ${MILEAGE.date}</s>
      </div>

      <div class="link" data-l="1">
        <div class="wire"></div>
        <div class="plate p-read">
          <b id="big">0.0</b>
          <span>km / l</span>
        </div>

        <div class="link" data-l="2">
          <div class="wire"></div>
          <div class="plate p-row">${F.slice(0, 3).map(cell).join('')}</div>

          <div class="link" data-l="3">
            <div class="wire"></div>
            <div class="plate p-row">${F.slice(3, 6).map(cell).join('')}</div>

            <div class="link" data-l="4">
              <div class="wire"></div>
              <div class="plate p-say"><i></i><span>${MILEAGE.method}</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bench">
    <span class="lab">Give it a push</span>
    <button id="nudge">Nudge</button>
    <button id="shove">Shove</button>
    <div class="phase" id="phase" aria-hidden="true"></div>
  </div>
`

const rig   = document.getElementById('rig')
const links = [...rig.querySelectorAll('.link')]
const big   = document.getElementById('big')
const phase = document.getElementById('phase')
phase.innerHTML = links.map(() => '<i></i>').join('')
const bars = [...phase.querySelectorAll('i')]

/* ── the chain ───────────────────────────────────────────────────
   Each link has an angle, a velocity, and a wish to hang vertically.
   Hanging vertically means undoing everything its parents are doing —
   and because it can only ever be *heading* for that, never at it, the
   correction always runs a beat late. That lateness, compounded down
   five links, is the whole effect.

   Lower links are given less stiffness and less damping, so they swing
   further and ring longer: a chain is heaviest where it is held. */
const N = links.length
const ang = new Float64Array(N)      // local angle, degrees
const vel = new Float64Array(N)
const K = [180, 150, 122, 100, 82]   // stiffness down the chain
const C = [17, 14.5, 12.5, 11, 9.5]  // damping down the chain

let driven = 0                        // what the hand is doing to link 0
let holding = false

const STEP = 1 / 240
const MAX_FRAME = 1 / 20
let acc = 0, raf = 0, prev = 0, asleep = true

function integrate(dt) {
  acc += dt
  let guard = 0
  while (acc >= STEP && guard++ < 64) {
    let world = 0
    for (let i = 0; i < N; i++) {
      /* where this link wants to sit: whatever cancels its parents.
         Link 0 answers to the hand instead. */
      const rest = i === 0 ? driven : -world * 0.62
      const f = -K[i] * (ang[i] - rest) - C[i] * vel[i]
      vel[i] += f * STEP
      ang[i] += vel[i] * STEP
      world += ang[i]
    }
    acc -= STEP
  }
}

function paint() {
  for (let i = 0; i < N; i++) {
    links[i].style.transform = `rotate(${ang[i].toFixed(3)}deg)`
    const h = Math.min(20, Math.abs(ang[i]) * 2.6 + 2)
    bars[i].style.height = h.toFixed(1) + 'px'
    bars[i].style.opacity = (0.28 + Math.min(0.62, Math.abs(ang[i]) / 9)).toFixed(2)
  }
}

function atRest() {
  if (holding) return false
  for (let i = 0; i < N; i++) {
    if (Math.abs(vel[i]) > 0.06) return false
    if (Math.abs(ang[i]) > 0.02) return false
  }
  return true
}

function loop(now) {
  const dt = Math.min((now - prev) / 1000, MAX_FRAME)
  prev = now
  integrate(dt)
  paint()
  if (atRest()) {
    /* park it exactly straight rather than leaving a hundredth of a
       degree of lean on every plate forever */
    ang.fill(0); vel.fill(0); paint()
    raf = 0; asleep = true
    rig.classList.remove('pushed')
    return
  }
  raf = requestAnimationFrame(loop)
}
function wake() {
  if (!asleep) return
  asleep = false
  prev = performance.now()
  rig.classList.add('pushed')
  raf = requestAnimationFrame(loop)
}

function impulse(v) {
  if (MM.REDUCED) return
  vel[0] += v
  wake()
}

/* ── the hand ────────────────────────────────────────────────────
   Dragging sets link 0's rest angle directly; everything below it is
   left to work out what that means for itself. Releasing hands the
   pointer's own velocity to the chain, so a flick carries through. */
const track = MM.tracker()
let grabX = 0, grabA = 0

rig.addEventListener('pointerdown', (e) => {
  if (MM.REDUCED) return
  holding = true
  rig.setPointerCapture?.(e.pointerId)
  grabX = e.clientX
  grabA = driven
  track.reset(); track.add(driven)
  wake()
})
window.addEventListener('pointermove', (e) => {
  if (!holding) return
  /* degrees per pixel, with the far ends stiffening so it never feels
     unhinged */
  const raw = grabA + (e.clientX - grabX) * 0.07
  driven = Math.max(-13, Math.min(13, raw)) + (Math.abs(raw) > 13 ? Math.sign(raw) * (Math.abs(raw) - 13) * 0.18 : 0)
  track.add(driven)
})
function release() {
  if (!holding) return
  holding = false
  const v = track.velocity()
  driven = 0
  vel[0] += Math.max(-260, Math.min(260, v))
  wake()
}
window.addEventListener('pointerup', release)
window.addEventListener('pointercancel', release)

document.getElementById('nudge').addEventListener('click', () => impulse(34))
document.getElementById('shove').addEventListener('click', () => impulse(115))

/* ── scrolling past hands it an impulse ──────────────────────────
   Proportional to how fast you went by, and only while the rig is on
   screen, so it is a consequence of passing rather than an animation
   that fires at a scroll position. */
let lastY = window.scrollY, lastT = performance.now(), onScreen = false
window.addEventListener('scroll', () => {
  if (!onScreen || MM.REDUCED) return
  const now = performance.now()
  const dt = now - lastT
  if (dt < 24) return
  const v = (window.scrollY - lastY) / dt      // px per ms
  lastY = window.scrollY; lastT = now
  const kick = Math.max(-42, Math.min(42, v * 13))
  if (Math.abs(kick) > 1.4) impulse(kick)
}, { passive: true })

/* ── the figure ──────────────────────────────────────────────────── */
function countUp(ms) {
  const t0 = performance.now()
  const step = (t) => {
    const k = Math.min(1, (t - t0) / ms)
    big.textContent = (MILEAGE.kmpl * (1 - Math.pow(1 - k, 4))).toFixed(1)
    if (k < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}

/* ── the entrance ────────────────────────────────────────────────
   Hung crooked and let go. Nothing is animated into place: the chain
   is simply released from a lean and finds vertical on its own, which
   is both the arrival and a demonstration of what it does. */
new IntersectionObserver((es, ob) => {
  es.forEach((e) => {
    if (!e.isIntersecting) return
    onScreen = true
    ob.unobserve(e.target)
    if (MM.REDUCED) { big.textContent = MILEAGE.kmpl.toFixed(1); return }
    ang[0] = -9.5
    for (let i = 1; i < N; i++) ang[i] = 4.2 / i
    wake()
    setTimeout(() => countUp(1000), 180)
  })
}, { threshold: 0.3 }).observe(rig)
}
</script>
</body>
</html>
