<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mileage · 6 · Bento Cluster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════
   BENTO CLUSTER — the quiet one. A mosaic with the reading holding
   the big tile and everything it implies packed around it, each in
   the shape of the thing it measures: fuel fills a glass, range runs
   down a road, the odometer turns on drums.

   No sequence to sit through — the tiles deal themselves in on a
   stagger and each one's own graphic plays once behind its number.
   The cheapest of the six to drop into the page, and the one that
   survives being read at a glance.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828; --well:#0d0b15;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --honey:#e0bb3c;
  --good:#4ade80; --bad:#fb7185;
  --sans:'Inter',sans-serif; --serif:'Playfair Display',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--honey);color:#161018}
.page{width:90%;max-width:1180px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:26px clamp(14px,3vw,30px) 30px;overflow:hidden;
  opacity:0;transform:translateY(32px);animation:rise .8s var(--ease) .1s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.sec::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 0%,rgba(224,187,60,0.08),transparent 70%)}

.head{position:relative;z-index:2;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.kick{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--honey);display:block;margin-bottom:7px}
.head h2{font-family:var(--serif);font-size:clamp(1.35rem,3.6vw,2rem);font-weight:700;color:var(--off);line-height:1.1}
.head .note{font-size:0.76rem;color:var(--d2);line-height:1.65;max-width:440px;margin-top:8px}

/* ══ the mosaic ══ */
.bento{position:relative;z-index:2;display:grid;gap:9px;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-auto-rows:minmax(104px,auto)}
/* --d is the deal-in stagger, and it is scoped to the two properties
   the entrance uses. On the whole shorthand it would delay hovers too. */
.t{position:relative;background:var(--card2);border:1px solid var(--bd);border-radius:14px;
  padding:15px 16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  opacity:0;transform:translateY(16px) scale(.985);
  transition:opacity .6s var(--ease) var(--d,0s),transform .6s var(--ease) var(--d,0s),
             border-color .3s,box-shadow .4s var(--ease)}
.bento.in .t{opacity:1;transform:none}
.t:hover{border-color:rgba(224,187,60,.35);box-shadow:0 20px 40px -28px rgba(224,187,60,.55)}
.t s{position:relative;z-index:3;display:block;text-decoration:none;font-family:var(--mono);
  font-size:0.45rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--d3)}
.t b{position:relative;z-index:3;display:block;font-family:var(--mono);font-size:1.4rem;font-weight:700;
  color:var(--off);line-height:1;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t b u{text-decoration:none;font-size:0.62rem;color:var(--d2);margin-left:4px;font-weight:400;letter-spacing:0}
.t em{position:relative;z-index:3;display:block;font-style:normal;font-size:0.56rem;color:var(--d3);
  margin-top:7px;line-height:1.5}

/* ── the hero ── */
.t.hero{grid-column:span 2;grid-row:span 2;justify-content:space-between;
  padding:clamp(18px,3vw,26px);
  background:
    radial-gradient(120% 90% at 100% 0%,rgba(224,187,60,.12),transparent 62%),
    var(--card2);
  border-color:rgba(224,187,60,.2)}
.t.hero .top{position:relative;z-index:3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.t.hero .top s{margin:0}
.t.hero .top .badge{margin-left:auto;font-family:var(--mono);font-size:0.46rem;letter-spacing:0.14em;
  text-transform:uppercase;padding:4px 10px;border-radius:99px;
  border:1px solid rgba(74,222,128,.3);color:var(--good);background:rgba(74,222,128,.08)}
.t.hero .top .badge.dn{border-color:rgba(251,113,133,.3);color:var(--bad);background:rgba(251,113,133,.08)}
.t.hero .fig{position:relative;z-index:3;display:flex;align-items:flex-end;gap:8px;margin:auto 0}
.t.hero .fig b{font-size:clamp(3rem,10vw,4.6rem);margin:0;letter-spacing:-.045em}
.t.hero .fig span{font-family:var(--mono);font-size:0.66rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--honey);padding-bottom:clamp(8px,2vw,14px)}
.t.hero .said{position:relative;z-index:3;font-size:0.71rem;line-height:1.7;color:var(--d2);
  border-left:2px solid rgba(224,187,60,.45);padding-left:11px;max-width:330px;margin-top:16px}
/* the claimed line, ruled behind the hero figure */
.t.hero .vs{position:relative;z-index:3;margin-top:14px}
.t.hero .vs .rail{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden}
.t.hero .vs .rail i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:99px;width:0;
  background:linear-gradient(90deg,rgba(224,187,60,.3),var(--honey));
  transition:width 1.4s var(--ease) .35s}
.bento.in .t.hero .vs .rail i{width:var(--w)}
.t.hero .vs .mark{position:absolute;top:-4px;width:1px;height:14px;background:rgba(255,255,255,.45)}
.t.hero .vs .lab{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);
  font-size:0.44rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--d3)}

/* ── the range tile: a road with the bike running it ──
   The road owns the bottom 34px, so the tile's own text is padded clear
   of it — otherwise the dashes run straight through the caption. */
.t.range{grid-column:span 2;padding-bottom:42px}
.t.range .rd{position:absolute;left:0;right:0;bottom:0;height:34px;overflow:hidden;z-index:1;opacity:.85}
.t.range .rd::before{content:'';position:absolute;left:0;right:0;top:16px;height:3px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 18px,transparent 18px 40px);
  animation:run 2.4s linear infinite}
@keyframes run{to{background-position:-58px 0}}
.t.range .rd .b{position:absolute;bottom:14px;left:-14%;font-size:1.05rem;
  animation:cross 7s cubic-bezier(.4,0,.6,1) infinite;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.8))}
@keyframes cross{0%{left:-14%}88%,100%{left:106%}}

/* ── the fuel tile: a small glass that fills ── */
.t.fuel .glass{position:absolute;right:14px;top:14px;bottom:14px;width:26px;z-index:2;
  border:1px solid var(--bd2);border-top:0;border-radius:3px 3px 6px 6px;overflow:hidden}
.t.fuel .glass i{position:absolute;left:0;right:0;bottom:0;height:0;display:block;
  background:linear-gradient(180deg,rgba(224,187,60,.7),rgba(224,187,60,.24));
  transition:height 1.5s cubic-bezier(.16,.84,.32,1) .5s}
.bento.in .t.fuel .glass i{height:84%}
.t.fuel .glass i::after{content:'';position:absolute;left:-50%;right:-50%;top:-5px;height:10px;
  background:radial-gradient(50% 100% at 50% 100%,rgba(224,187,60,.9) 40%,transparent 41%);
  background-size:26px 10px;animation:wv 2.6s linear infinite}
@keyframes wv{to{transform:translateX(26px)}}

/* ── the odometer tile: three drums ── */
.t.odo .drums{position:relative;z-index:3;display:flex;gap:2px;margin-top:8px}
.t.odo .w{position:relative;width:19px;height:28px;overflow:hidden;border-radius:3px;
  background:linear-gradient(180deg,#07060c,#1c1a2a 50%,#07060c);border:1px solid var(--bd)}
.t.odo .w strip{position:absolute;left:0;right:0;top:0;display:block;
  transition:transform 1.6s var(--ease) .3s}
.t.odo .w strip span{display:flex;align-items:center;justify-content:center;height:28px;
  font-family:var(--mono);font-size:0.8rem;font-weight:700;color:var(--honey)}
.t.odo .w::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.8),transparent 36%,transparent 64%,rgba(0,0,0,.8))}

/* ── the delta tile ──
   No ring here. One reading against one claim is a single comparison,
   and a ring drawn to 30.4 / 30.0 closes completely — which reads as
   "100%" of something. The hero's rail already carries the comparison
   honestly; this tile just states it. */
.t.delta b{color:var(--good)}
.t.delta.dn b{color:var(--bad)}
.t.delta .arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:2;
  font-size:1.6rem;line-height:1;color:var(--good);opacity:.22}
.t.delta.dn .arrow{color:var(--bad)}

/* ── the per-100 tile ── */
.t.per{grid-column:span 2}
.t.per em{margin-top:6px}

/* the stagger */
.bento .t:nth-child(1){--d:.02s}
.bento .t:nth-child(2){--d:.09s}
.bento .t:nth-child(3){--d:.16s}
.bento .t:nth-child(4){--d:.23s}
.bento .t:nth-child(5){--d:.30s}
.bento .t:nth-child(6){--d:.37s}
.bento .t:nth-child(7){--d:.44s}

@media(max-width:820px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .t.hero,.t.range,.t.per{grid-column:span 2}
}
@media(max-width:440px){
  .bento{grid-template-columns:1fr}
  .t.hero,.t.range,.t.per{grid-column:span 1}
}

/* ══ empty ══ */
.none{position:relative;z-index:2;border:1px dashed var(--bd2);border-radius:14px;
  padding:38px 26px;text-align:center;color:var(--d2);font-size:0.8rem;line-height:1.75;max-width:470px;margin:0 auto}
.none b{display:block;font-family:var(--mono);font-size:0.56rem;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--honey);margin-bottom:12px}
.none .box{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:200px;margin:0 auto 18px}
.none .box i{height:30px;border-radius:7px;background:rgba(255,255,255,.04);
  border:1px dashed var(--bd);display:block;animation:breathe 3.6s ease-in-out infinite}
.none .box i:nth-child(2){animation-delay:.3s}
.none .box i:nth-child(3){animation-delay:.6s}
.none .box i:nth-child(4){animation-delay:.9s}
.none .box i:nth-child(5){animation-delay:1.2s}
.none .box i:nth-child(6){animation-delay:1.5s}
@keyframes breathe{50%{opacity:.35}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .sec{opacity:1;transform:none}
  .bento .t{opacity:1;transform:none}
  /* the bike is not travelling, so park it on the road rather than
     letting the killed animation snap it to its off-screen end frame */
  .t.range .rd .b{animation:none;left:8%}
  .t.range .rd::before{animation:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="stub">section above</div>

  <section class="sec" aria-labelledby="mh">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="mh"></h2>
        <p class="note" id="note"></p>
      </div>
    </div>
    <div id="body"></div>
  </section>

  <div class="stub">section below</div>
</div>

<script src="mileage-data.js"></script>
<script>
document.getElementById('kick').textContent = MILEAGE_COPY.kicker
document.getElementById('mh').textContent   = MILEAGE_COPY.title
document.getElementById('note').textContent = MILEAGE_COPY.note

const body = document.getElementById('body')

if (MILEAGE_EMPTY) {
  body.innerHTML = `<div class="none">
      <div class="box"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <b>Nothing to pack yet</b>
      ${MILEAGE_COPY.empty}
    </div>`
} else {

/* the hero rail runs to a headroom above whichever is larger — the
   reading or the claim — so the claim mark always lands inside it */
const TOP = Math.max(MILEAGE.kmpl, MILEAGE_BIKE.claimed) * 1.14
const railPct = (v) => (v / TOP) * 100

/* as many drums as the odometer has digits, so a five-figure reading
   is not quietly shown as its last three */
const odoDigits = String(MILEAGE.odo).split('')

body.innerHTML = `
  <div class="bento" id="bento">

    <div class="t hero">
      <div class="top">
        <s>${MILEAGE_BIKE.name}</s>
        <span class="badge ${MILEAGE.vsClaimed >= 0 ? '' : 'dn'}">
          ${MILEAGE.vsClaimed >= 0 ? '+' : ''}${MILEAGE.vsClaimed}% vs claimed
        </span>
      </div>
      <div class="fig">
        <b id="hero">0.0</b>
        <span>km / litre</span>
      </div>
      <div class="vs">
        <div class="rail" style="--w:${railPct(MILEAGE.kmpl).toFixed(1)}%">
          <i></i>
          <span class="mark" style="left:${railPct(MILEAGE_BIKE.claimed).toFixed(1)}%"></span>
        </div>
        <div class="lab">
          <span>measured ${MILEAGE.kmpl}</span>
          <span>claimed ${MILEAGE_BIKE.claimed}</span>
        </div>
      </div>
      <p class="said">${MILEAGE.method}</p>
    </div>

    <div class="t range">
      <div class="rd" aria-hidden="true"><span class="b">🏍️</span></div>
      <s>Range on a tank</s>
      <b id="rangeN">0<u>km</u></b>
      <em>${MILEAGE_BIKE.tank} L filled to the brim</em>
    </div>

    <div class="t fuel">
      <div class="glass" aria-hidden="true"><i></i></div>
      <s>A full tank</s>
      <b>${MILEAGE_BIKE.currency}${MILEAGE.tankCost.toLocaleString('en-IN')}</b>
      <em>${MILEAGE_BIKE.tank} L at ${MILEAGE_BIKE.currency}${MILEAGE.rate.toFixed(2)}</em>
    </div>

    <div class="t cost">
      <s>Cost per km</s>
      <b>${MILEAGE_BIKE.currency}${MILEAGE.costPerKm.toFixed(2)}</b>
      <em>at ${MILEAGE_BIKE.currency}${MILEAGE.rate.toFixed(2)} a litre</em>
    </div>

    <div class="t delta ${MILEAGE.vsClaimed >= 0 ? '' : 'dn'}">
      <span class="arrow" aria-hidden="true">${MILEAGE.vsClaimed >= 0 ? '▲' : '▼'}</span>
      <s>Against the claim</s>
      <b>${MILEAGE.vsClaimed >= 0 ? '+' : ''}${MILEAGE.vsClaimed}<u>%</u></b>
      <em>maker says ${MILEAGE_BIKE.claimed}</em>
    </div>

    <div class="t odo">
      <s>Odometer</s>
      <div class="drums" id="drums" aria-hidden="true"></div>
      <em>read ${MILEAGE.date}</em>
    </div>

    <div class="t per">
      <s>Per 100 km</s>
      <b>${MILEAGE.per100.toFixed(2)}<u>L</u></b>
      <em>the other way round</em>
    </div>

  </div>
`

/* the odometer drums, rolling in */
const drums = document.getElementById('drums')
drums.innerHTML = odoDigits.map(() =>
  `<div class="w"><strip>${Array.from({ length: 30 }, (_, d) => `<span>${d % 10}</span>`).join('')}</strip></div>`
).join('')

/* ── deal the tiles in when the section arrives ─────────────────── */
const bento = document.getElementById('bento')
const hero = document.getElementById('hero')
const rangeN = document.getElementById('rangeN')

function countTo(el, to, ms, dp, suffix = '') {
  const t0 = performance.now()
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / ms)
    const e = 1 - Math.pow(1 - k, 3)
    el.innerHTML = (to * e).toFixed(dp) + suffix
    if (k < 1) requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick)
}

new IntersectionObserver((es, ob) => {
  es.forEach((e) => {
    if (!e.isIntersecting) return
    ob.unobserve(e.target)
    bento.classList.add('in')

    /* two laps plus the digit, so every drum visibly turns. This runs
       either way — under reduced motion the transition is instant, but
       the drums still have to arrive at the reading rather than sit on
       zeros. */
    drums.querySelectorAll('strip').forEach((strip, i) => {
      strip.style.transitionDelay = MILEAGE_REDUCED ? '0s' : `${0.3 + i * 0.12}s`
      strip.style.transform = `translateY(-${(20 + Number(odoDigits[i])) * 28}px)`
    })

    if (MILEAGE_REDUCED) {
      hero.textContent = MILEAGE.kmpl.toFixed(1)
      rangeN.innerHTML = `${MILEAGE.range}<u>km</u>`
      return
    }
    countTo(hero, MILEAGE.kmpl, 1300, 1)
    countTo(rangeN, MILEAGE.range, 1500, 0, '<u>km</u>')
  })
}, { threshold: 0.25 }).observe(bento)
}
</script>
</body>
</html>
