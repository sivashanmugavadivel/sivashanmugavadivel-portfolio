<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rides · 23 · Odometer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════
   ODOMETER — scrolling is the riding. The page is 768 km long.

   The conceit is the whole design: one pixel of scroll is a fixed number
   of metres, and the counter pinned to the screen is a real odometer
   reading it out. Rides are not laid out evenly — each one occupies its
   true share of the page, so the 450 km Chennai haul takes nearly three
   times the scrolling of the 168 km already ridden put together. You
   feel the proportions in your scroll wheel.

   The digits roll like mechanical drums. Each place is a strip of 0-9
   translated vertically, and the units drum moves continuously rather
   than snapping, so it blurs between numbers exactly as the real thing
   does. Tens carry over a fraction later than units, which is the detail
   that makes a drum read as mechanical rather than digital.

   The band across the middle changes from ridden to planned at 168 km,
   which is where the real riding currently stops.
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#121214; --case:#1b1b1f; --case2:#242429; --drum:#0a0a0c;
  --cream:#f3efe4; --off:#f3efe4;
  --d1:rgba(243,239,228,0.6); --d2:rgba(243,239,228,0.38); --d3:rgba(243,239,228,0.2);
  --bd:rgba(243,239,228,0.12); --brass:#c9a227;
  --disp:'Bricolage Grotesque',system-ui,sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.9,.25,1); --c:#ef4444;
}
body{background:var(--bg);color:var(--d1);font-family:var(--mono);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(80vw 50vh at 50% 0%,rgba(201,162,39,0.06),transparent 62%)}
::selection{background:var(--brass);color:var(--bg)}

/* ── the pinned instrument ── */
.instr{position:fixed;top:0;left:0;right:0;z-index:60;
  padding:clamp(10px,2vw,18px) clamp(12px,3vw,30px) 0;pointer-events:none}
.instr .case{max-width:1180px;margin:0 auto;background:var(--case);border:1px solid var(--bd);
  border-radius:10px;padding:clamp(10px,1.6vw,15px) clamp(12px,2vw,20px);
  display:flex;align-items:center;gap:clamp(10px,2vw,22px);flex-wrap:wrap;
  box-shadow:0 18px 40px -20px rgba(0,0,0,0.9),inset 0 1px 0 rgba(255,255,255,0.05);
  pointer-events:auto}
.instr .mk{font-family:var(--disp);font-weight:800;font-size:0.82rem;color:var(--off);
  letter-spacing:-0.02em;line-height:1.2;flex-shrink:0}
.instr .mk span{display:block;font-family:var(--mono);font-size:0.48rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--d3);margin-top:4px;font-weight:400}

/* the drums */
.odo{display:flex;align-items:stretch;gap:2px;background:var(--drum);padding:5px;
  border-radius:5px;box-shadow:inset 0 2px 8px rgba(0,0,0,0.85);flex-shrink:0}
.dg{position:relative;width:clamp(20px,3.4vw,30px);height:clamp(34px,5.4vw,46px);
  overflow:hidden;background:linear-gradient(var(--case2),#17171b 46%,#101013 54%,var(--case2));
  border-radius:2px}
.dg .strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.dg .strip b{display:flex;align-items:center;justify-content:center;
  height:clamp(34px,5.4vw,46px);font-family:var(--mono);font-weight:700;
  font-size:clamp(1.1rem,2.8vw,1.6rem);color:var(--cream);
  text-shadow:0 1px 2px rgba(0,0,0,0.6)}
.dg.tenth .strip b{color:var(--brass)}
.dg.tenth{background:linear-gradient(#2a2318,#1d1810 46%,#141009 54%,#2a2318)}
/* the glass across the drums */
.odo::after{content:'';position:absolute;inset:0;pointer-events:none}
.odoWrap{position:relative}
.odoWrap .unit{position:absolute;right:-30px;top:50%;transform:translateY(-50%);
  font-size:0.56rem;letter-spacing:0.16em;color:var(--d2)}

.instr .now{flex:1;min-width:130px}
.instr .now k{display:block;font-size:0.46rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--d3);margin-bottom:5px}
.instr .now v{display:block;font-family:var(--disp);font-weight:600;font-size:0.92rem;
  color:var(--off);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instr .now .state{font-size:0.5rem;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--sc,var(--d2));margin-top:5px;display:block}
.instr a{font-size:0.54rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--d2);
  text-decoration:none;border:1px solid var(--bd);border-radius:99px;padding:7px 12px;
  transition:.22s;flex-shrink:0}
.instr a:hover{background:var(--off);color:var(--bg);border-color:var(--off)}

/* the trip bar under the case */
.trip{max-width:1180px;margin:8px auto 0;height:4px;background:rgba(243,239,228,0.08);
  border-radius:3px;overflow:hidden;position:relative}
.trip .done{position:absolute;left:0;top:0;bottom:0;background:var(--c);
  box-shadow:0 0 14px var(--c);transition:background .6s var(--ease)}
.trip .split{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--brass);opacity:0.8}

/* ── opening ── */
.open{min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:150px clamp(16px,5vw,64px) 70px;max-width:900px;margin:0 auto}
.open .kick{font-size:0.56rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--brass);
  margin-bottom:20px;opacity:0;animation:fade .9s var(--ease) .2s forwards}
@keyframes fade{to{opacity:1}}
.open h1{font-family:var(--disp);font-weight:800;color:var(--off);
  font-size:clamp(2.2rem,8vw,5.2rem);line-height:0.92;letter-spacing:-0.045em;margin-bottom:22px}
.open h1 .w{display:block;overflow:hidden}
.open h1 .w i{display:block;font-style:normal;transform:translateY(104%);
  animation:rise 1.05s var(--ease) forwards}
@keyframes rise{to{transform:none}}
.open h1 em{font-style:normal;color:var(--brass)}
.open p{max-width:46ch;font-size:0.92rem;line-height:1.85;
  opacity:0;animation:fade .9s var(--ease) .7s forwards}
.open .cue{margin-top:34px;font-size:0.54rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--d3);display:flex;align-items:center;gap:11px;
  opacity:0;animation:fade .9s var(--ease) .95s forwards}
.open .cue i{width:1px;height:30px;background:linear-gradient(var(--brass),transparent);
  animation:drop 2s var(--ease) infinite}
@keyframes drop{50%{transform:translateY(9px)}}

/* ── the road: one long column, rides at their true share ── */
.road{position:relative;max-width:1180px;margin:0 auto;
  padding:0 clamp(14px,4vw,44px)}
/* the centre line runs the whole length */
.road::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;
  transform:translateX(-50%);
  background:repeating-linear-gradient(rgba(243,239,228,0.22) 0 26px,transparent 26px 52px)}

.leg{position:relative;display:flex;align-items:center;padding:0;
  /* height is set inline, in proportion to the ride's distance */}
.leg .marker{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:7px}
.leg .marker i{width:15px;height:15px;border-radius:50%;background:var(--bg);
  border:3px solid var(--mc);box-shadow:0 0 0 4px var(--bg),0 0 18px var(--mc)}
.leg .marker b{font-size:0.54rem;letter-spacing:0.14em;color:var(--d2);white-space:nowrap;
  background:var(--bg);padding:2px 8px}

.leg .card{width:min(440px,calc(50% - 54px));
  background:var(--case);border:1px solid var(--bd);border-radius:12px;
  padding:clamp(16px,2.4vw,26px);position:relative;z-index:2;
  opacity:0;transform:translateY(40px);
  transition:opacity .85s var(--ease),transform .85s var(--ease)}
.leg.live .card{opacity:1;transform:none}
.leg.L{justify-content:flex-start}
.leg.R{justify-content:flex-end}
.leg .card::after{content:'';position:absolute;top:50%;width:40px;height:1px;
  background:var(--bd)}
.leg.L .card::after{right:-40px}
.leg.R .card::after{left:-40px}

.card .tier{display:inline-flex;align-items:center;gap:8px;font-size:0.5rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--tc);margin-bottom:11px}
.card .tier i{width:6px;height:6px;border-radius:50%;background:currentColor}
.card .band{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.card .band b{font-family:var(--disp);font-weight:800;font-size:clamp(1.6rem,3.6vw,2.4rem);
  color:var(--c);line-height:1;letter-spacing:-0.04em}
.card .band u{text-decoration:none;font-size:0.54rem;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--d3)}
.card h2{font-family:var(--disp);font-weight:600;color:var(--off);
  font-size:clamp(1.1rem,2.4vw,1.5rem);line-height:1.16;letter-spacing:-0.028em;margin-bottom:9px}
.card .route{font-size:0.58rem;letter-spacing:0.07em;color:var(--d2);line-height:1.75;
  margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid var(--bd)}
.card p{font-size:0.8rem;line-height:1.8;margin-bottom:15px}
.card .figs{display:flex;flex-wrap:wrap;gap:0;margin-bottom:15px}
.card .figs div{padding-right:16px;margin-right:16px;border-right:1px solid var(--bd)}
.card .figs div:last-child{border-right:0;margin-right:0;padding-right:0}
.card .figs k{display:block;font-size:0.44rem;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--d3);margin-bottom:5px}
.card .figs v{display:block;font-family:var(--disp);font-weight:600;font-size:1.02rem;
  color:var(--off);line-height:1}
.card .go{display:inline-flex;align-items:center;gap:9px;font-size:0.54rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--off);text-decoration:none;border-bottom:1px solid var(--bd);
  padding-bottom:5px;transition:.28s var(--ease)}
.card .go:hover{color:var(--c);border-color:var(--c);gap:15px}

/* the point where riding stops and planning begins */
.frontier{position:relative;z-index:4;text-align:center;padding:30px 0}
.frontier span{display:inline-block;background:var(--bg);padding:9px 18px;
  border:1px dashed var(--brass);color:var(--brass);font-size:0.54rem;letter-spacing:0.2em;
  text-transform:uppercase}

/* ── closing ── */
.close{text-align:center;padding:clamp(50px,9vw,110px) clamp(16px,6vw,60px)
  calc(80px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.close h2{font-family:var(--disp);font-weight:800;color:var(--off);
  font-size:clamp(1.8rem,6vw,3.4rem);line-height:0.98;letter-spacing:-0.04em;margin-bottom:16px}
.close p{font-size:0.9rem;line-height:1.9;margin-bottom:26px}
.close a{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:99px;
  background:var(--off);color:var(--bg);text-decoration:none;font-size:0.58rem;font-weight:700;
  letter-spacing:0.18em;text-transform:uppercase;transition:.28s var(--ease)}
.close a:hover{background:var(--brass);transform:translateY(-3px)}

@media(max-width:820px){
  .road::before{left:26px}
  .leg .marker{left:26px}
  .leg.L,.leg.R{justify-content:flex-end}
  .leg .card{width:calc(100% - 62px)}
  .leg.L .card::after,.leg.R .card::after{left:-36px;right:auto;width:36px}
  .instr .now{order:3;flex-basis:100%}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .open h1 .w i{transform:none}
  .leg .card{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="instr">
  <div class="case">
    <div class="mk">Bear 650<span>Trip</span></div>
    <div class="odoWrap">
      <div class="odo" id="odo"></div>
      <span class="unit">KM</span>
    </div>
    <div class="now">
      <k id="nowK">On the road</k>
      <v id="nowV">—</v>
      <span class="state" id="nowS"></span>
    </div>
    <a href="#">← Garage</a>
  </div>
  <div class="trip"><div class="done" id="tripDone"></div><div class="split" id="tripSplit"></div></div>
</div>

<section class="open">
  <div class="kick">My Garage · Bear 650 · Kangayam</div>
  <h1>
    <span class="w"><i>This page is</i></span>
    <span class="w"><i style="animation-delay:.13s"><em id="hKm">768 km</em> long</i></span>
  </h1>
  <p id="lede"></p>
  <div class="cue"><i></i>Scroll — the counter is real</div>
</section>

<main class="road" id="road"></main>

<section class="close">
  <h2 id="closeH"></h2>
  <p id="closeP"></p>
  <a href="#">← Back to My Garage</a>
</section>

<script src="rides-data.js"></script>
<script>
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches
const S = RD.summary
const TOTAL = S.doneKm + S.aheadKm
const DIGITS = 4          // 0768 — room for the whole book

document.getElementById('hKm').textContent = TOTAL + ' km'
document.getElementById('lede').textContent =
  `Every ride takes up its true share of the scroll, so the ${S.aheadKm} km still planned really ` +
  `is most of the page. ${RD.tally} — and the counter above reads out exactly where you are in it.`
document.getElementById('closeH').textContent = TOTAL + ' km, end to end'
document.getElementById('closeP').textContent =
  `${S.doneKm} km of that has actually been ridden. The rest is drawn, measured, and waiting for a date.`

/* ── the drums ────────────────────────────────────────────────────────── */
/* Each place is a 0-9 strip. The units drum moves continuously so it
   blurs between numbers; each higher place carries a fraction later,
   which is what makes a drum read as mechanical. */
const odo = document.getElementById('odo')
odo.innerHTML = Array.from({ length: DIGITS }, (_, i) =>
  `<div class="dg${i === DIGITS - 1 ? ' tenth' : ''}" data-p="${i}">
     <div class="strip">${Array.from({ length: 11 }, (_, n) => `<b>${n % 10}</b>`).join('')}</div>
   </div>`).join('')
const strips = [...odo.querySelectorAll('.strip')]

function setOdo(value) {
  const dh = odo.querySelector('.dg').clientHeight || 40
  /* last drum is tenths of a km */
  const scaled = value * 10
  for (let i = 0; i < DIGITS; i++) {
    const place = Math.pow(10, DIGITS - 1 - i)
    const v = scaled / place
    const d = Math.floor(v) % 10
    /* carry: only roll while the places below are at their maximum */
    const frac = (v % 1)
    const roll = frac > 0.92 ? (frac - 0.92) / 0.08 : 0
    const pos = i === DIGITS - 1 ? v % 10 : d + roll
    strips[i].style.transform = `translateY(${(-pos * dh).toFixed(2)}px)`
  }
}

/* ── lay the rides out by distance ────────────────────────────────────── */
/* PX_PER_KM sets how long the document is. Tuned so the whole book is a
   long but finite scroll rather than an endurance test. */
const PX_PER_KM = 3.1
let run = 0
const legs = RD.rides.map((r, i) => {
  const from = run
  run += r.km
  return { r, i, from, to: run }
})

/* The card carries `description` — the one-line hook — not `story`. The
   full write-up is what "Open the ride" is for, and a whole paragraph here
   buries the card on a phone, where these sit in a 440px column. */
document.getElementById('road').innerHTML = legs.map(({ r, i, from, to }) => {
  const side = i % 2 ? 'R' : 'L'
  const dest = r.tbd && /decided/i.test(r.toCity) ? 'anywhere' : r.toCity
  /* a TBD ride has no length to occupy, so it gets a readable minimum */
  const h = Math.max(360, r.km * PX_PER_KM)
  return `<section class="leg ${side}" data-i="${i}" data-from="${from}" data-to="${to}"
      style="height:${h}px;--c:${r.color};--mc:${r.color};--tc:${r.tier.color}">
    <div class="marker"><i></i><b>${Math.round(from)} km</b></div>
    <div class="card">
      <span class="tier"><i></i>${r.tier.label} · ${r.date}</span>
      <div class="band"><b>${r.tbd ? 'TBD' : r.km}</b><u>${r.tbd ? 'no distance yet' : 'km on this leg'}</u></div>
      <h2>${r.name}</h2>
      <div class="route">${r.fromCity} → ${dest}${r.via.length ? '<br/>via ' + r.via.join(' · ') : ''}</div>
      <p>${r.description}</p>
      <div class="figs">
        <div><k>Heading</k><v>${r.mapped ? r.compass : 'Open'}</v></div>
        <div><k>Stops</k><v>${r.stops.length}</v></div>
        <div><k>${r.time ? 'Saddle' : r.estimated ? 'Est.' : 'States'}</k>
          <v>${r.time || r.estimate || r.states.length}</v></div>
      </div>
      <a class="go" href="#">Open the ride →</a>
    </div>
  </section>`
}).join('')

/* mark where the riding actually stops */
const frontierAfter = legs.filter(l => l.r.done).length - 1
if (frontierAfter >= 0 && frontierAfter < legs.length - 1) {
  const el = document.querySelectorAll('.leg')[frontierAfter]
  el.insertAdjacentHTML('afterend',
    `<div class="frontier"><span>${S.doneKm} km — everything past here is still to ride</span></div>`)
}

document.getElementById('tripSplit').style.left = (S.doneKm / TOTAL * 100) + '%'

/* ── scroll ───────────────────────────────────────────────────────────── */
const road = document.getElementById('road')
const legEls = [...document.querySelectorAll('.leg')]
let ticking = false

function frame() {
  ticking = false
  const r = road.getBoundingClientRect()
  const line = innerHeight * 0.42          // the reading line on screen

  /* how far into the road column that line has travelled */
  const into = Math.max(0, Math.min(r.height, line - r.top))
  const p = r.height ? into / r.height : 0
  const km = p * TOTAL

  setOdo(km)
  document.getElementById('tripDone').style.width = (p * 100) + '%'

  /* which leg the line is inside */
  let cur = null
  legEls.forEach(el => {
    const b = el.getBoundingClientRect()
    el.classList.toggle('live', b.top < innerHeight * 0.86 && b.bottom > innerHeight * 0.1)
    if (b.top <= line && b.bottom >= line) cur = el
  })

  if (cur) {
    const ride = RD.rides[+cur.dataset.i]
    const from = +cur.dataset.from, to = +cur.dataset.to
    const within = to > from ? Math.max(0, Math.min(1, (km - from) / (to - from))) : 0
    document.documentElement.style.setProperty('--c', ride.color)
    document.documentElement.style.setProperty('--sc', ride.tier.color)
    document.getElementById('nowK').textContent =
      ride.tbd ? 'No distance logged' : Math.round(within * 100) + '% through this leg'
    document.getElementById('nowV').textContent = ride.name
    document.getElementById('nowS').textContent = ride.tier.label + ' · ' + ride.date
  } else {
    document.getElementById('nowK').textContent = km < 1 ? 'Not moving yet' : 'Trip complete'
    document.getElementById('nowV').textContent = km < 1 ? 'Kariya Kattu Valasu' : TOTAL + ' km'
    document.getElementById('nowS').textContent = ''
  }
}

addEventListener('scroll', () => {
  if (!ticking) { ticking = true; requestAnimationFrame(frame) }
}, { passive: true })
addEventListener('resize', frame)
frame()
</script>
</body>
</html>
