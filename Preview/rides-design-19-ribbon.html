<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rides · 19 · Ribbon</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════
   RIBBON — one road runs the whole page, and scrolling rides it.

   A single continuous line is drawn down the entire document. It is not
   decoration behind the content: it is the spine the content hangs off,
   it draws itself at exactly your scroll position, and a marker travels
   along it with a real heading, turning as the road turns.

   The scroll mechanic is stroke-dashoffset locked to scroll progress,
   with the marker placed by getPointAtLength on the same path — so the
   drawn end of the line and the marker are the same point by
   construction, never two things approximately agreeing.

   The ribbon's length is mapped to the 768 km on the books, so the
   figure beside the marker is a real distance, and each ride's node sits
   at its true cumulative position along that total. Passing a node is
   passing that ride.

   Entries alternate sides and rise with a soft parallax, offset from the
   ribbon so the eye zigzags down the page rather than tracking straight.
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#070a14; --ink2:#0d1220; --off:#eef2ff;
  --d1:rgba(238,242,255,0.62); --d2:rgba(238,242,255,0.4); --d3:rgba(238,242,255,0.2);
  --bd:rgba(238,242,255,0.1);
  --glow:#7c8cff; --glow2:#c084fc; --gold:#e8c38a;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1); --c:#ef4444;
}
body{background:var(--ink);color:var(--d1);font-family:var(--sans);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(70vw 50vh at 78% 2%,rgba(124,140,255,0.11),transparent 62%),
    radial-gradient(60vw 50vh at 10% 60%,rgba(192,132,252,0.08),transparent 64%)}
::selection{background:var(--glow);color:var(--ink)}

/* ── fixed chrome ── */
.hud{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:clamp(13px,2.2vw,22px) clamp(16px,4vw,42px);pointer-events:none;
  background:linear-gradient(var(--ink) 6%,rgba(7,10,20,0.72) 60%,transparent)}
.hud > *{pointer-events:auto}
.hud .mk{font-family:var(--serif);font-size:1.05rem;color:var(--off);letter-spacing:0.005em}
.hud .mk em{font-style:italic;color:var(--gold)}
.hud .odo{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.hud .odo b{display:block;font-family:var(--serif);font-size:clamp(1.2rem,2.6vw,1.7rem);
  color:var(--off);line-height:1}
.hud .odo u{display:block;text-decoration:none;font-size:0.5rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--d3);margin-top:4px}
.hud a{font-size:0.58rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--d2);
  text-decoration:none;border:1px solid var(--bd);border-radius:99px;padding:8px 14px;
  transition:.24s}
.hud a:hover{color:var(--ink);background:var(--off);border-color:var(--off)}

/* the thin progress hair at the very top */
.hair{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;
  background:linear-gradient(90deg,var(--glow),var(--glow2));box-shadow:0 0 14px var(--glow)}

/* ── opening ── */
.open{min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:120px clamp(18px,6vw,80px) 80px;max-width:1100px;margin:0 auto;position:relative;z-index:3}
.open .kick{font-size:0.58rem;letter-spacing:0.34em;text-transform:uppercase;color:var(--glow);
  margin-bottom:20px;opacity:0;animation:fade .9s var(--ease) .2s forwards}
@keyframes fade{to{opacity:1}}
.open h1{font-family:var(--serif);font-weight:400;color:var(--off);
  font-size:clamp(2.6rem,9vw,6.4rem);line-height:0.94;letter-spacing:-0.02em;margin-bottom:24px}
.open h1 em{font-style:italic;
  background:linear-gradient(96deg,var(--glow),var(--glow2),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.open h1 .w{display:block;overflow:hidden}
.open h1 .w i{display:block;font-style:normal;transform:translateY(104%);
  animation:rise 1.15s var(--ease) forwards}
.open h1 .w i em{font-style:italic}
@keyframes rise{to{transform:none}}
.open p{max-width:46ch;font-size:clamp(0.92rem,1.6vw,1.06rem);line-height:1.85;
  opacity:0;animation:fade 1s var(--ease) .8s forwards}
.open .cue{display:flex;align-items:center;gap:12px;margin-top:40px;font-size:0.56rem;
  letter-spacing:0.24em;text-transform:uppercase;color:var(--d3);
  opacity:0;animation:fade 1s var(--ease) 1.05s forwards}
.open .cue i{width:1px;height:36px;background:linear-gradient(var(--glow),transparent);
  animation:drop 2.2s var(--ease) infinite}
@keyframes drop{50%{transform:translateY(10px)}}

/* ── the ribbon track ── */
.track{position:relative;max-width:1180px;margin:0 auto;
  padding:0 clamp(14px,4vw,48px) clamp(60px,10vw,130px)}
.ribbon{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:1;
  pointer-events:none}
.ribbon svg{display:block;overflow:visible}
.ribbon .bed{fill:none;stroke:rgba(238,242,255,0.07);stroke-width:2;
  stroke-dasharray:3 9;stroke-linecap:round}
.ribbon .glowline{fill:none;stroke:url(#grad);stroke-width:11;stroke-linecap:round;
  filter:blur(10px);opacity:0.5}
.ribbon .road{fill:none;stroke:url(#grad);stroke-width:3;stroke-linecap:round}
.ribbon .node{fill:var(--ink);stroke-width:2.4;transition:r .45s var(--ease)}
.ribbon .pulse{fill:none;stroke-width:1.4;opacity:0}
.ribbon .nodeLabel{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:600;
  letter-spacing:0.14em;text-transform:uppercase;fill:rgba(238,242,255,0.38);
  transition:fill .45s var(--ease)}
.ribbon g.nd.on .node{r:9}
.ribbon g.nd.on .nodeLabel{fill:var(--off)}
.ribbon g.nd.on .pulse{opacity:0.7;animation:ping 2.6s var(--ease) infinite}
@keyframes ping{0%{r:9;opacity:.7}80%{r:26;opacity:0}100%{opacity:0}}

/* the travelling marker */
.marker{transition:none}
.marker .body{fill:var(--off)}
.marker .ring{fill:none;stroke:var(--off);stroke-width:1.2;opacity:0.5}
.marker .tail{fill:none;stroke:var(--off);stroke-width:1.6;opacity:0.35}

/* ── entries ── */
.entry{position:relative;z-index:2;min-height:clamp(420px,62vh,560px);
  display:flex;align-items:center;padding:clamp(26px,5vw,60px) 0}
.entry .card{width:min(420px,calc(50% - clamp(46px,7vw,92px)));
  opacity:0;transform:translateY(46px);
  transition:opacity 1s var(--ease),transform 1s var(--ease)}
.entry.live .card{opacity:1;transform:translateY(var(--par,0px))}
.entry.L{justify-content:flex-start}
.entry.R{justify-content:flex-end}

.card .tag{display:inline-flex;align-items:center;gap:8px;font-size:0.52rem;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--tc);margin-bottom:14px}
.card .tag i{width:6px;height:6px;border-radius:50%;background:currentColor;
  box-shadow:0 0 10px currentColor}
.card .km{font-family:var(--serif);font-size:clamp(2.6rem,6vw,4.4rem);line-height:0.85;
  color:transparent;-webkit-text-stroke:1px rgba(238,242,255,0.26);margin-bottom:10px;
  letter-spacing:-0.02em}
.card .km b{-webkit-text-stroke:0;color:var(--c);font-weight:400}
.card h2{font-family:var(--serif);font-weight:400;color:var(--off);
  font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1.08;letter-spacing:-0.014em;margin-bottom:10px}
.card .route{font-size:0.62rem;letter-spacing:0.1em;color:var(--d2);line-height:1.75;
  margin-bottom:16px}
.card .route em{font-style:normal;color:var(--gold)}
.card p{font-size:0.86rem;line-height:1.85;color:var(--d1);margin-bottom:18px}
.card .figs{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--bd);margin-bottom:18px}
.card .figs div{padding:13px 18px 0 0;margin-right:18px;border-right:1px solid var(--bd)}
.card .figs div:last-child{border-right:0;margin-right:0;padding-right:0}
.card .figs k{display:block;font-size:0.46rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--d3);margin-bottom:6px}
.card .figs v{display:block;font-family:var(--serif);font-size:1.32rem;color:var(--off);
  line-height:1}
.card .go{display:inline-flex;align-items:center;gap:10px;font-size:0.58rem;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--off);text-decoration:none;padding-bottom:6px;
  border-bottom:1px solid var(--bd);transition:.3s var(--ease)}
.card .go:hover{border-color:var(--c);color:var(--c);gap:16px}

/* the little plate on the opposite side of the ribbon */
.entry .plate{position:absolute;top:50%;width:min(300px,32%);aspect-ratio:1.3;
  transform:translateY(-50%);opacity:0;transition:opacity 1.1s var(--ease) .15s}
.entry.live .plate{opacity:1}
.entry.L .plate{right:0}
.entry.R .plate{left:0}
.entry .plate svg{width:100%;height:100%;overflow:visible}

/* ── closing ── */
.close{position:relative;z-index:3;text-align:center;padding:clamp(50px,9vw,110px)
  clamp(18px,6vw,60px) calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.close h2{font-family:var(--serif);font-weight:400;color:var(--off);
  font-size:clamp(1.8rem,5.4vw,3.2rem);line-height:1.04;letter-spacing:-0.02em;margin-bottom:16px}
.close h2 em{font-style:italic;color:var(--gold)}
.close p{font-size:0.9rem;line-height:1.9;margin-bottom:28px}
.close a{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:99px;
  background:var(--off);color:var(--ink);text-decoration:none;font-size:0.62rem;font-weight:600;
  letter-spacing:0.18em;text-transform:uppercase;transition:.3s var(--ease)}
.close a:hover{transform:translateY(-3px);box-shadow:0 18px 36px -14px var(--glow)}

@media(max-width:860px){
  .ribbon{left:26px;transform:none}
  .entry{min-height:auto;padding:22px 0}
  .entry.L,.entry.R{justify-content:flex-end}
  .entry .card{width:calc(100% - 62px)}
  .entry .plate{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .open h1 .w i{transform:none}
  .entry .card{opacity:1;transform:none}
  .entry .plate{opacity:1}
}
</style>
</head>
<body>

<div class="hair" id="hair"></div>

<header class="hud">
  <span class="mk">Rides &amp; <em>Journeys</em></span>
  <span class="odo"><b id="odo">0 km</b><u id="odoLab">of 768 on the books</u></span>
  <a href="#">← Garage</a>
</header>

<section class="open">
  <div class="kick">My Garage · Bear 650 · Kangayam</div>
  <h1>
    <span class="w"><i>One road,</i></span>
    <span class="w"><i style="animation-delay:.13s">all the way</i></span>
    <span class="w"><i style="animation-delay:.26s"><em>down</em></i></span>
  </h1>
  <p id="lede"></p>
  <div class="cue"><i></i>Scroll to ride it</div>
</section>

<main class="track" id="track">
  <div class="ribbon" id="ribbon"></div>
  <div id="entries"></div>
</main>

<section class="close">
  <h2>The line keeps <em>going</em></h2>
  <p id="closeP"></p>
  <a href="#">← Back to My Garage</a>
</section>

<script src="rides-data.js"></script>
<script>
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches
const S = RD.summary
const TOTAL = S.doneKm + S.aheadKm

document.getElementById('lede').textContent =
  `${RD.tally.replace(/^./, c => c.toUpperCase())}. One continuous line, ${TOTAL} km long, ` +
  `with every ride sitting at its true distance along it. ${S.doneKm} km of it has actually been ridden.`
document.getElementById('closeP').textContent =
  `${S.open} of the six are still ahead. The ribbon is drawn from the real figures in the ride ` +
  `files — where it runs out is simply where the riding has got to.`
document.getElementById('odoLab').textContent = `of ${TOTAL} on the books`

/* ── entries ──────────────────────────────────────────────────────────── */
/* Each ride sits at its cumulative share of the total, so the gaps down
   the page are the real gaps between rides in kilometres. */
let run = 0
const marks = RD.rides.map(r => {
  const at = run
  run += r.km
  return { r, at, t: TOTAL ? (at + r.km / 2) / TOTAL : 0 }
})

document.getElementById('entries').innerHTML = RD.rides.map((r, i) => {
  const side = i % 2 ? 'R' : 'L'
  const dest = r.tbd && /decided/i.test(r.toCity) ? 'anywhere' : r.toCity
  return `<article class="entry ${side}" data-i="${i}" data-id="${r.id}"
      style="--c:${r.color};--tc:${r.tier.color}">
    <div class="card">
      <span class="tag"><i></i>${r.tier.label} · ${r.date}</span>
      <div class="km">${r.tbd ? '<b>TBD</b>' : `<b>${r.km}</b> km`}</div>
      <h2>${r.name}</h2>
      <div class="route">${r.fromCity} <em>→</em> ${dest}${
        r.via.length ? '<br/>via ' + r.via.join(' · ') : ''}</div>
      <p>${r.story}</p>
      <div class="figs">
        <div><k>Heading</k><v>${r.mapped ? r.compass : 'Open'}</v></div>
        <div><k>Waypoints</k><v>${r.stops.length}</v></div>
        <div><k>${r.time ? 'Saddle' : r.estimated ? 'Est.' : 'States'}</k>
          <v>${r.time || r.estimate || r.states.length}</v></div>
      </div>
      <a class="go" href="#">Open the ride →</a>
    </div>
    <div class="plate">${plate(r)}</div>
  </article>`
}).join('')

/* a loose drawing of the route, on the opposite side of the ribbon */
function plate(r) {
  const w = 300, h = 230
  if (!r.mapped) {
    return `<svg viewBox="0 0 ${w} ${h}">
      ${Array.from({ length: 5 }, (_, i) =>
        `<circle cx="${w / 2}" cy="${h / 2}" r="${22 + i * 21}" fill="none"
          stroke="rgba(238,242,255,${(0.2 - i * 0.032).toFixed(3)})" stroke-width="1.2"
          stroke-dasharray="${i % 2 ? '2 7' : 'none'}"/>`).join('')}
      <circle cx="${w / 2}" cy="${h / 2}" r="6" fill="${r.color}"/></svg>`
  }
  const P = RD.one(r, w, h, 44)
  return `<svg viewBox="0 0 ${w} ${h}">
    <path d="${RD.curve(P.pts)}" fill="none" stroke="${r.color}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    ${P.pts.map((p, i) => {
      const edge = i === 0 || i === P.pts.length - 1
      return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${edge ? 4.4 : 2.6}"
        fill="${edge ? r.color : 'rgba(238,242,255,0.5)'}"/>`
    }).join('')}</svg>`
}

/* ── build the ribbon ─────────────────────────────────────────────────── */
/* Drawn at native pixel size — no viewBox scaling — so the marker, the
   nodes and the entries all live in the same coordinate space. */
const RW = 300
const ribbon = document.getElementById('ribbon')
const track = document.getElementById('track')
let road = null, roadLen = 0, nodeAt = []

function buildRibbon() {
  const H = track.offsetHeight
  const entries = [...document.querySelectorAll('.entry')]
  const trackTop = track.getBoundingClientRect().top + scrollY

  /* one gentle S per entry, swinging toward whichever side that entry is on */
  let d = `M${RW / 2} 0`
  nodeAt = []
  entries.forEach((el, i) => {
    const r = el.getBoundingClientRect()
    const mid = r.top + scrollY - trackTop + r.height / 2
    const end = r.top + scrollY - trackTop + r.height
    const swing = i % 2 ? RW * 0.78 : RW * 0.22
    d += ` C${RW / 2} ${(mid - r.height * 0.3).toFixed(1)}, ${swing.toFixed(1)} ${(mid - r.height * 0.2).toFixed(1)}, ${swing.toFixed(1)} ${mid.toFixed(1)}`
    nodeAt.push({ i, x: swing, y: mid, r: RD.rides[i] })
    d += ` C${swing.toFixed(1)} ${(mid + r.height * 0.2).toFixed(1)}, ${RW / 2} ${(end - r.height * 0.1).toFixed(1)}, ${RW / 2} ${Math.min(end, H).toFixed(1)}`
  })
  d += ` L${RW / 2} ${H}`

  ribbon.innerHTML = `<svg width="${RW}" height="${H}" viewBox="0 0 ${RW} ${H}">
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7c8cff"/>
        <stop offset="0.5" stop-color="#c084fc"/>
        <stop offset="1" stop-color="#e8c38a"/>
      </linearGradient>
    </defs>
    <path class="bed" d="${d}"/>
    <path class="glowline" id="glowline" d="${d}"/>
    <path class="road" id="road" d="${d}"/>
    ${nodeAt.map((n, k) => `<g class="nd" data-i="${k}">
      <circle class="pulse" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="9"
        stroke="${n.r.color}"/>
      <circle class="node" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="6"
        stroke="${n.r.color}"/>
      <text class="nodeLabel" x="${(n.x + (n.i % 2 ? -14 : 14)).toFixed(1)}"
        y="${(n.y + 3).toFixed(1)}" text-anchor="${n.i % 2 ? 'end' : 'start'}">${
          n.r.tbd ? 'TBD' : n.r.km + ' km'}</text>
    </g>`).join('')}
    <g class="marker" id="marker">
      <path class="tail" d="M0 16 L0 30"/>
      <circle class="ring" r="13"/>
      <circle class="body" r="5.5"/>
    </g>
  </svg>`

  road = document.getElementById('road')
  roadLen = road.getTotalLength()
  road.style.strokeDasharray = roadLen
  const gl = document.getElementById('glowline')
  gl.style.strokeDasharray = roadLen
  onScroll()
}

/* ── scroll ───────────────────────────────────────────────────────────── */
const marker = () => document.getElementById('marker')
let ticking = false

function onScroll() {
  ticking = false
  if (!road) return

  const docH = document.documentElement.scrollHeight - innerHeight
  document.getElementById('hair').style.width = (docH > 0 ? scrollY / docH * 100 : 0) + '%'

  /* how far the ribbon has been revealed: the viewport middle against
     the track's own top and bottom */
  const tr = track.getBoundingClientRect()
  const mid = innerHeight * 0.52
  const p = Math.max(0, Math.min(1, (mid - tr.top) / (tr.height || 1)))

  road.style.strokeDashoffset = roadLen * (1 - p)
  const gl = document.getElementById('glowline')
  if (gl) gl.style.strokeDashoffset = roadLen * (1 - p)

  /* the marker sits exactly at the drawn end of the line */
  const m = marker()
  if (m) {
    const at = road.getPointAtLength(roadLen * p)
    const back = road.getPointAtLength(Math.max(0, roadLen * p - 6))
    const deg = Math.atan2(at.y - back.y, at.x - back.x) * 180 / Math.PI - 90
    m.setAttribute('transform',
      `translate(${at.x.toFixed(1)} ${at.y.toFixed(1)}) rotate(${deg.toFixed(1)})`)
    m.style.opacity = p > 0.001 && p < 0.999 ? 1 : 0.25
  }

  /* the odometer reads the ribbon as distance */
  document.getElementById('odo').textContent = Math.round(p * TOTAL) + ' km'

  /* entries: live when they reach the middle band, with a gentle parallax */
  document.querySelectorAll('.entry').forEach((el, i) => {
    const r = el.getBoundingClientRect()
    const seen = r.top < innerHeight * 0.82 && r.bottom > innerHeight * 0.12
    el.classList.toggle('live', seen)
    if (seen && !REDUCED) {
      /* -1 → 1 across the viewport, scaled to a few px of drift */
      const c = (r.top + r.height / 2 - innerHeight / 2) / innerHeight
      el.querySelector('.card').style.setProperty('--par', (c * -22).toFixed(1) + 'px')
      const pl = el.querySelector('.plate')
      if (pl) pl.style.transform = `translateY(calc(-50% + ${(c * 34).toFixed(1)}px))`
    }
    /* light the node whose ride is centred */
    const nd = document.querySelector(`.nd[data-i="${i}"]`)
    if (nd) nd.classList.toggle('on',
      r.top < innerHeight * 0.6 && r.bottom > innerHeight * 0.4)
  })
}

addEventListener('scroll', () => {
  if (!ticking) { ticking = true; requestAnimationFrame(onScroll) }
}, { passive: true })

let rt = 0
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(buildRibbon, 180) })

/* clicking a node jumps to its entry */
document.addEventListener('click', e => {
  const nd = e.target.closest('.nd')
  if (!nd) return
  const el = document.querySelector(`.entry[data-i="${nd.dataset.i}"]`)
  if (el) el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' })
})

/* fonts change the measured heights, so rebuild once they have landed */
buildRibbon()
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildRibbon)
addEventListener('load', buildRibbon)
</script>
</body>
</html>
