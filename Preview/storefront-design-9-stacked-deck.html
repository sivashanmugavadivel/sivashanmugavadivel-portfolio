<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Storefront · 9 · Stacked Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=General+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@300,400,500,600&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════
   STACKED DECK — every part is a full card that sticks in
   place while the next one slides up over it, so the page
   builds a physical pile as you scroll. The card behind
   shrinks and dims; the one in front is always the one you
   are reading. Same behaviour, tighter geometry, on phones.
   ══════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0e0f13; --bg2:#15171d; --off:#f5f6f8;
  --d1:rgba(245,246,248,0.62); --d2:rgba(245,246,248,0.38); --d3:rgba(245,246,248,0.2);
  --bd:rgba(255,255,255,0.1); --bd2:rgba(255,255,255,0.2);
  --mint:#7cf5c4; --coral:#ff8a6b; --ink:#0b0c0f;
  --disp:'Clash Display','Space Grotesk',sans-serif; --sans:'General Sans','Inter',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --card-h:min(640px,80vh);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--mint);color:var(--ink)}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(56vw 56vw at 76% 12%,rgba(124,245,196,0.08),transparent 66%),
             radial-gradient(50vw 50vw at 14% 84%,rgba(255,138,107,0.07),transparent 68%)}

/* ── minimal fixed chrome ── */
.hud{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:14px clamp(14px,4vw,38px);background:linear-gradient(to bottom,rgba(14,15,19,0.94),transparent);
  backdrop-filter:blur(6px);pointer-events:none}
.hud > *{pointer-events:auto}
.hud .mark{font-family:var(--disp);font-weight:600;font-size:0.92rem;color:var(--off);letter-spacing:-0.01em}
.hud .mark em{font-style:normal;color:var(--mint)}
.hud .count{margin-left:auto;font-size:0.68rem;letter-spacing:0.14em;color:var(--d2);font-variant-numeric:tabular-nums}
.hud .count b{color:var(--off);font-weight:500}
.hud .exit{padding:7px 14px;border:1px solid var(--bd);border-radius:999px;color:var(--d2);
  text-decoration:none;font-size:0.68rem;transition:.25s}
.hud .exit:hover{color:var(--off);border-color:var(--bd2)}
.progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--mint);z-index:70;transition:width .1s linear}

/* ── opening ── */
.open{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding:90px clamp(18px,5vw,72px) 60px;position:relative;z-index:2}
.open .kick{font-size:0.64rem;font-weight:600;letter-spacing:0.28em;text-transform:uppercase;color:var(--mint);
  opacity:0;animation:fade .8s var(--ease) .15s forwards}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(2.5rem,10vw,7rem);line-height:0.92;
  letter-spacing:-0.04em;color:var(--off)}
h1 .w{display:block;overflow:hidden}
h1 .w span{display:block;transform:translateY(104%);animation:rise 1.05s var(--ease) forwards}
h1 em{font-style:normal;color:var(--coral)}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
.open p{max-width:460px;font-size:1rem;line-height:1.75;
  opacity:0;transform:translateY(16px);animation:up .9s var(--ease) .78s forwards}
@keyframes up{to{opacity:1;transform:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;
  opacity:0;transform:translateY(16px);animation:up .9s var(--ease) .92s forwards}
.chips a{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;
  border:1px solid var(--bd);background:var(--bg2);color:var(--d1);text-decoration:none;
  font-size:0.76rem;transition:.3s var(--ease)}
.chips a:hover{border-color:var(--mint);color:var(--off);transform:translateY(-3px)}
.chips a u{text-decoration:none;font-size:0.66rem;color:var(--d3)}
.cue{display:flex;align-items:center;gap:11px;font-size:0.64rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--d3);margin-top:8px;
  opacity:0;animation:fade .9s var(--ease) 1.1s forwards}
.cue i{display:block;width:1px;height:30px;background:linear-gradient(var(--mint),transparent);
  animation:drop 2s var(--ease) infinite}
@keyframes drop{50%{transform:translateY(8px)}}

/* ── chapter divider ── */
.chapter{position:sticky;top:0;z-index:5;padding:56px clamp(18px,5vw,72px) 24px;
  background:linear-gradient(to bottom,var(--bg) 62%,transparent);pointer-events:none}
.chapter .in{display:flex;align-items:baseline;gap:14px}
.chapter .n{font-family:var(--disp);font-weight:700;font-size:1.6rem;color:var(--coral);line-height:1}
.chapter h2{font-family:var(--disp);font-weight:600;font-size:clamp(1.3rem,4vw,2.2rem);color:var(--off);
  letter-spacing:-0.025em}
.chapter .qty{margin-left:auto;font-size:0.64rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--d3)}

/* ── the stack ── */
.deck{position:relative;z-index:2;padding:0 clamp(12px,4vw,48px)}
.slot{height:var(--card-h);position:relative;margin-bottom:22px}
.slot:last-child{margin-bottom:0}
.card{position:sticky;top:calc((100svh - var(--card-h)) / 2);height:var(--card-h);
  border-radius:26px;overflow:hidden;background:var(--bg2);border:1px solid var(--bd);
  display:grid;grid-template-columns:1.05fr 1fr;
  box-shadow:0 40px 70px -34px rgba(0,0,0,0.95);
  transform-origin:50% 0;will-change:transform,filter}

.card .visual{position:relative;background:
  radial-gradient(circle at 50% 42%,rgba(255,255,255,0.06),transparent 62%),#101218;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.card .visual img{max-width:100%;max-height:100%;object-fit:contain;padding:clamp(18px,3vw,46px);
  transition:transform .7s var(--ease),opacity .25s}
.card .visual:hover img{transform:scale(1.05)}
.card .visual .none{font-size:3rem;opacity:0.18}
.card .visual .idx{position:absolute;top:16px;left:18px;font-family:var(--disp);font-weight:700;
  font-size:0.8rem;letter-spacing:0.1em;color:var(--d2)}
.card .visual .fl{position:absolute;top:16px;right:18px;padding:5px 12px;border-radius:999px;
  background:var(--mint);color:var(--ink);font-size:0.58rem;font-weight:600;letter-spacing:0.12em;
  text-transform:uppercase}
.card .visual .zoom{position:absolute;bottom:16px;right:18px;padding:6px 12px;border-radius:999px;
  background:rgba(11,12,15,0.72);border:1px solid var(--bd);font-size:0.6rem;color:var(--d1);
  opacity:0;transform:translateY(6px);transition:.3s var(--ease);backdrop-filter:blur(6px)}
.card .visual:hover .zoom{opacity:1;transform:none}

.card .side{padding:clamp(20px,3vw,40px);display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.card .side .cat{font-size:0.62rem;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--coral)}
.card .side h3{font-family:var(--disp);font-weight:600;font-size:clamp(1.3rem,3vw,2.2rem);line-height:1.06;
  letter-spacing:-0.03em;color:var(--off)}
.card .side .facts{border-top:1px solid var(--bd)}
.card .side .facts div{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:0.8rem}
.card .side .facts k{flex:0 0 88px;font-size:0.6rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--d3)}
.card .side .facts v{color:var(--off)}
.card .side .facts v.g{color:var(--mint)}
.card .side .reel{display:flex;gap:7px;flex-wrap:wrap}
.card .side .reel button{width:50px;height:50px;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;
  border:1px solid var(--bd);background:#101218;opacity:0.5;transition:.28s var(--ease)}
.card .side .reel button:hover{opacity:0.9;transform:translateY(-3px)}
.card .side .reel button.on{opacity:1;border-color:var(--mint)}
.card .side .reel img{width:100%;height:100%;object-fit:cover}
.card .side .buys{display:flex;gap:9px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.buy{flex:1 1 auto;text-align:center;padding:13px 20px;border-radius:999px;text-decoration:none;
  font-size:0.78rem;font-weight:500;transition:.32s var(--ease);white-space:nowrap}
.buy.p{background:var(--off);color:var(--ink)}
.buy.p:hover{background:var(--mint);transform:translateY(-3px)}
.buy.s{border:1px solid var(--bd2);color:var(--off)}
.buy.s:hover{border-color:var(--coral);color:var(--coral);transform:translateY(-3px)}
.soon{font-size:0.78rem;color:var(--d3);font-style:italic}

/* ── closing ── */
.close{min-height:70svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:20px;padding:80px clamp(18px,5vw,60px) calc(70px + env(safe-area-inset-bottom));
  position:relative;z-index:2}
.close h2{font-family:var(--disp);font-weight:700;font-size:clamp(2rem,7vw,4.4rem);color:var(--off);
  letter-spacing:-0.035em;line-height:1}
.close p{max-width:440px;font-size:0.95rem;line-height:1.8}
.back{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;
  background:var(--off);color:var(--ink);text-decoration:none;font-size:0.8rem;font-weight:500;
  transition:.32s var(--ease)}
.back:hover{background:var(--mint);transform:translateY(-3px)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:99;background:rgba(8,9,12,0.97);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:clamp(16px,6vw,56px)}
.lb.on{display:flex;animation:fade2 .3s}
@keyframes fade2{from{opacity:0}}
.lb img{max-width:90vw;max-height:74vh;object-fit:contain;border-radius:16px;animation:pop .42s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.lb .cap{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:0.7rem;
  letter-spacing:0.14em;color:var(--mint);padding:0 16px}
.lb button{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd2);
  background:rgba(21,23,29,0.9);color:var(--off);font-size:1.05rem;cursor:pointer;transition:.22s}
.lb button:hover{background:var(--off);color:var(--ink)}
.lb .x{top:18px;right:18px}.lb .prev{left:14px;top:50%}.lb .next{right:14px;top:50%}

/* ── phones: the card goes vertical, photo on top ── */
@media(max-width:820px){
  :root{--card-h:min(560px,78svh)}
  .card{grid-template-columns:1fr;grid-template-rows:minmax(0,0.9fr) minmax(0,1.1fr);border-radius:20px}
  .card .visual img{padding:16px}
  .card .side{padding:16px 16px 18px;gap:10px}
  .card .side .facts div{padding:8px 0;font-size:0.76rem}
  .card .side .facts k{flex:0 0 74px}
  .card .side .reel button{width:42px;height:42px}
  .buy{padding:12px 16px;font-size:0.74rem}
  .chapter{padding:40px 16px 18px}
  .deck{padding:0 12px}
  .slot{margin-bottom:16px}
}
@media(max-width:420px){
  .card .side .facts div:nth-child(n+4){display:none}
  .card .side .reel{display:none}
}
/* honour reduced motion: drop the stacking transform, keep it a plain list */
@media(prefers-reduced-motion:reduce){
  .card{position:relative;top:0!important;transform:none!important;filter:none!important}
  h1 .w span,.open .kick,.open p,.chips,.cue{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="progress" id="progress"></div>

<header class="hud">
  <div class="mark">The <em>Storefront</em></div>
  <div class="count"><b id="cNow">00</b> / <span id="cAll">00</span></div>
  <a class="exit" href="#">✕ Garage</a>
</header>

<section class="open">
  <div class="kick">Deal them out one at a time</div>
  <h1>
    <span class="w"><span style="animation-delay:.16s">The whole</span></span>
    <span class="w"><span style="animation-delay:.3s"><em>deck</em> of parts</span></span>
  </h1>
  <p id="lede"></p>
  <div class="chips" id="chips"></div>
  <div class="cue"><i></i>Scroll to deal</div>
</section>

<main id="deck"></main>

<section class="close">
  <h2>That's the last card.</h2>
  <p>Every part in the stack is bolted to the bike right now. Nothing sponsored, nothing in a box waiting to be fitted.</p>
  <a class="back" href="#">← Back to My Garage</a>
</section>

<div class="lb" id="lb">
  <button class="x" onclick="closeLb()">✕</button>
  <button class="prev" onclick="stepLb(-1)">‹</button>
  <button class="next" onclick="stepLb(1)">›</button>
  <img id="lbImg" alt="" />
  <div class="cap" id="lbCap"></div>
</div>

<script src="storefront-data.js"></script>
<script>
document.getElementById('lede').textContent = SF.note
document.getElementById('cAll').textContent = String(SF.count).padStart(2, '0')
document.getElementById('chips').innerHTML = SF.cats.map(c =>
  `<a href="#ch-${c.id}">${c.icon} ${c.label} <u>${c.items.length}</u></a>`).join('')

/* build: a chapter header then one sticky slot per part */
let seq = 0
document.getElementById('deck').innerHTML = SF.cats.map((c, ci) => `
  <div class="chapter" id="ch-${c.id}">
    <div class="in">
      <span class="n">${String(ci + 1).padStart(2, '0')}</span>
      <h2>${c.icon} ${c.label}</h2>
      <span class="qty">${c.items.length} ${c.items.length === 1 ? 'card' : 'cards'}</span>
    </div>
  </div>
  ${c.items.map(it => slot(it, c, ++seq)).join('')}`).join('')

function slot(it, c, n) {
  const imgs = it.imgs.map(f => SF.url(f))
  return `<div class="slot">
    <article class="card" data-n="${n}" data-imgs='${JSON.stringify(imgs)}' data-name="${it.name}">
      <div class="visual" onclick="openLb(this)">
        <span class="idx">${String(n).padStart(2, '0')} / ${String(SF.count).padStart(2, '0')}</span>
        ${it.featured ? '<span class="fl">Headline</span>' : ''}
        ${imgs.length ? `<img src="${imgs[0]}" alt="${it.name}" loading="lazy" />` : `<span class="none">${c.icon}</span>`}
        ${imgs.length ? '<span class="zoom">⤢ Tap to enlarge</span>' : ''}
      </div>
      <div class="side">
        <div class="cat">${c.icon} ${c.label}</div>
        <h3>${it.name}</h3>
        <div class="facts">
          <div><k>Plates</k><v>${String(imgs.length).padStart(2, '0')}</v></div>
          <div><k>Source</k><v>${it.links.map(l => l[0]).join(', ') || '—'}</v></div>
          <div><k>Status</k><v class="g">${it.featured ? 'Fitted · headline pick' : 'Fitted'}</v></div>
        </div>
        ${imgs.length > 1 ? `<div class="reel">${imgs.map((s, k) =>
          `<button class="${k === 0 ? 'on' : ''}" onclick="pick(event,this,${k})"><img src="${s}" alt="" loading="lazy" /></button>`).join('')}</div>` : ''}
        <div class="buys">
          ${it.links.length ? it.links.map(([v, u], k) =>
            `<a class="buy ${k === 0 ? 'p' : 's'}" href="${u}" target="_blank" rel="noopener noreferrer">${k === 0 ? 'Buy on ' + v : v} ↗</a>`).join('')
            : '<span class="soon">Link coming soon</span>'}
        </div>
      </div>
    </article>
  </div>`
}

function pick(e, btn, k) {
  e.stopPropagation()
  const card = btn.closest('.card')
  const imgs = JSON.parse(card.dataset.imgs)
  const img = card.querySelector('.visual img')
  img.style.opacity = 0
  setTimeout(() => { img.src = imgs[k]; img.style.opacity = 1 }, 150)
  card.querySelectorAll('.reel button').forEach((b, j) => b.classList.toggle('on', j === k))
  card.dataset.at = k
}

/* ── the pile effect: a stuck card shrinks and dims as the next rides over it ── */
const cards = [...document.querySelectorAll('.card')]
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
let raf = 0

function frame() {
  raf = 0
  const mid = innerHeight / 2
  let live = 0
  cards.forEach((card, i) => {
    const slot = card.parentElement
    const r = slot.getBoundingClientRect()
    /* how far this slot has been scrolled past its resting place, 0 → 1 */
    const past = Math.min(1, Math.max(0, -r.top / Math.max(1, r.height)))
    if (!reduce) {
      card.style.transform = `scale(${1 - past * 0.09}) translateY(${past * -26}px)`
      card.style.filter = `brightness(${1 - past * 0.42})`
    }
    if (r.top <= mid && r.bottom >= 0) live = i + 1
  })
  document.getElementById('cNow').textContent = String(live).padStart(2, '0')
  const h = document.body.scrollHeight - innerHeight
  document.getElementById('progress').style.width = (h > 0 ? scrollY / h * 100 : 0) + '%'
}
addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(frame) }, { passive: true })
addEventListener('resize', () => { if (!raf) raf = requestAnimationFrame(frame) })
frame()

/* lightbox */
let set = [], at = 0, who = ''
function openLb(vis) {
  const card = vis.closest('.card')
  set = JSON.parse(card.dataset.imgs); if (!set.length) return
  at = +(card.dataset.at || 0); who = card.dataset.name
  paint(); document.getElementById('lb').classList.add('on')
}
function paint() {
  document.getElementById('lbImg').src = set[at]
  document.getElementById('lbCap').textContent = `${who} — plate ${at + 1} of ${set.length}`
}
function stepLb(d) { at = (at + d + set.length) % set.length; paint() }
function closeLb() { document.getElementById('lb').classList.remove('on') }
document.getElementById('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLb() })
addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('on')) return
  if (e.key === 'Escape') closeLb()
  if (e.key === 'ArrowRight') stepLb(1)
  if (e.key === 'ArrowLeft') stepLb(-1)
})
</script>
</body>
</html>
