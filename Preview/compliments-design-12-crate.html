<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Compliments — Crate</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════════
   CRATE — the perks unpacked in front of you.

   The one design with a beginning, a middle and an end. The crate opens, the
   contents come out, they settle into a shelf. Everything is on one timeline,
   so it plays as a single event rather than as five elements each animating on
   their own schedule.

   THE TIMELINE, in seconds, and why it is worth stating once:
     0.0  the crate lands
     0.5  the lid lifts, tips and slides off to the left
     0.9  straw puffs up out of the opening
     1.1  items rise, ONE EVERY 0.14s, arcing up and settling
     ...  each item overshoots its resting place slightly and comes back

   ITEMS ARE THROWN, NOT FADED. Each one travels up from behind the crate with
   a rotation that unwinds as it goes, and its shadow arrives late — a thing
   that has just landed keeps a faint bounce for a moment. Fading them in at
   their final positions costs nothing in code and loses the whole idea.

   The overshoot is a single cubic-bezier with a y2 above 1. It is the only
   reason the landing reads as weight.
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0b10;--wood:#7a5330;--wood2:#5e3e23;--wood3:#946640;
  --off:#f4efe4;--d2:rgba(244,239,228,.42);--acc:#eab308;--straw:#d8b871}
body{background:radial-gradient(70% 55% at 50% 10%,rgba(234,179,8,.07),transparent 70%),var(--bg);
  font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;
  padding:clamp(14px,3vw,34px)}

.dock{position:relative;width:100%;max-width:880px;border-radius:16px;overflow:hidden;
  background:linear-gradient(178deg,#16131c,#0e0c12);border:1px solid rgba(255,255,255,.07);
  box-shadow:0 32px 64px -24px #000;
  padding:clamp(22px,4vw,36px) clamp(16px,3vw,30px) clamp(18px,3vw,28px);
  animation:in .8s cubic-bezier(.16,1,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(20px)}}

.head{text-align:center;margin-bottom:clamp(18px,3vw,28px)}
.head .eye{font-size:.54rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
  color:var(--acc);margin-bottom:8px}
.head h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.9rem,6vw,3.1rem);line-height:.92;
  color:var(--off);letter-spacing:.02em}
.head .sub{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--d2);margin-top:6px}

/* ── the shelf the contents land on ─────────────────────────────────────── */
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));
  gap:clamp(12px,2.2vw,20px);margin-bottom:clamp(20px,3.4vw,32px)}

.item{position:relative;text-align:center;padding:16px 12px 14px;border-radius:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.08);
  /* ITEMS ARE THROWN — the overshoot lives in this curve */
  animation:lift .78s cubic-bezier(.2,1.5,.42,1) both;
  animation-delay:calc(1.1s + var(--i) * .14s)}
@keyframes lift{
  from{opacity:0;transform:translateY(190px) rotate(var(--spin)) scale(.62)}
  60%{opacity:1}
  to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
.item .obj{width:clamp(52px,9vw,66px);height:clamp(52px,9vw,66px);margin:0 auto 11px;
  color:var(--acc);transition:transform .35s cubic-bezier(.16,1,.3,1)}
.item:hover .obj{transform:translateY(-5px) scale(1.06)}
.item .txt{font-size:.76rem;font-weight:600;color:var(--off);line-height:1.42}
.item .no{position:absolute;top:9px;right:11px;font-family:'Bebas Neue',sans-serif;
  font-size:.74rem;color:var(--d2)}
/* the shadow arrives late and settles — see ITEMS ARE THROWN */
.item::after{content:'';position:absolute;left:50%;bottom:-7px;width:58%;height:10px;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent);
  opacity:0;animation:land .5s ease-out both;
  animation-delay:calc(1.5s + var(--i) * .14s)}
@keyframes land{from{opacity:0;transform:translateX(-50%) scaleX(.4)}to{opacity:.8}}

/* ── the crate ───────────────────────────────────────────────────────────── */
.crate{position:relative;width:clamp(190px,32vw,280px);height:clamp(76px,12vw,104px);
  margin:0 auto;perspective:600px}

.lid{position:absolute;left:0;right:0;top:-13px;height:20px;border-radius:4px;z-index:4;
  background:repeating-linear-gradient(90deg,var(--wood3) 0 26px,var(--wood) 26px 28px);
  border:1px solid rgba(0,0,0,.45);transform-origin:0% 100%;
  box-shadow:0 5px 10px -4px rgba(0,0,0,.8);
  animation:lid 1.1s cubic-bezier(.4,0,.25,1) .5s both}
@keyframes lid{
  0%{transform:translate(0,0) rotate(0)}
  45%{transform:translate(-6%,-26px) rotate(-11deg)}
  100%{transform:translate(-62%,-6px) rotate(-27deg);opacity:.9}}

.box{position:absolute;inset:0;border-radius:4px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,transparent 0 44px,rgba(0,0,0,.3) 44px 47px),
    linear-gradient(170deg,var(--wood),var(--wood2));
  border:1px solid rgba(0,0,0,.5);
  box-shadow:inset 0 8px 16px rgba(0,0,0,.55),0 16px 26px -12px rgba(0,0,0,.9)}
/* the diagonal braces every crate has */
.box::before{content:'';position:absolute;inset:6px;
  background:
    linear-gradient(to bottom right,transparent calc(50% - 2px),rgba(0,0,0,.24) 50%,transparent calc(50% + 2px)),
    linear-gradient(to bottom left,transparent calc(50% - 2px),rgba(0,0,0,.24) 50%,transparent calc(50% + 2px))}
.box .stencil{position:absolute;left:0;right:0;bottom:9px;text-align:center;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(.8rem,2.2vw,1.05rem);letter-spacing:.22em;
  color:rgba(20,12,4,.5)}
/* the dark opening, revealed once the lid is off */
.mouth{position:absolute;left:5px;right:5px;top:2px;height:13px;border-radius:3px;z-index:3;
  background:linear-gradient(#100a04,#241704);opacity:0;
  animation:fade .5s ease .95s both}
@keyframes fade{to{opacity:1}}

/* straw, puffing up out of the opening */
.straw{position:absolute;left:50%;top:0;width:0;height:0;z-index:5}
.straw i{position:absolute;width:12px;height:2.5px;border-radius:2px;background:var(--straw);
  opacity:0;transform-origin:0 50%;
  animation:puff 1.5s cubic-bezier(.2,.9,.3,1) .9s both}
@keyframes puff{
  0%{opacity:0;transform:translate(0,0) rotate(var(--a)) scale(.5)}
  25%{opacity:.9}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(calc(var(--a) + 160deg)) scale(1)}}

.foot{margin-top:clamp(16px,2.6vw,24px);text-align:center;font-size:.58rem;
  letter-spacing:.2em;text-transform:uppercase;color:var(--d2);font-weight:700}
.foot b{color:var(--acc);letter-spacing:.05em;font-size:.74rem;text-transform:none}

@media(prefers-reduced-motion:reduce){
  .dock,.item,.item::after,.lid,.mouth,.straw i{animation:none;opacity:1}
  .lid{transform:translate(-62%,-6px) rotate(-27deg)}
  .straw{display:none}
}
</style>
</head>
<body>
<div class="dock" id="dock"></div>

<script src="compliments-data.js"></script>
<script src="compliments-scenes.js"></script>
<script>
const r = window.COMPLIMENTS.current()
document.documentElement.style.setProperty('--acc', r.color)

/* cycled spins, so every unpacking looks the same twice running */
const SPINS = [-22, 16, -12, 24, -18, 11, -25, 19]

const items = r.compliments.map((c, i) => `
  <div class="item" style="--i:${i};--spin:${SPINS[i % SPINS.length]}deg">
    <span class="no">${String(i + 1).padStart(2, '0')}</span>
    <div class="obj">${window.SCENES.sceneFor(c.text)}</div>
    <div class="txt">${c.text}</div>
  </div>`).join('')

/* straw, thrown out of the opening on a fixed seed */
let h = 20260827
const rnd = () => ((h = (h * 1103515245 + 12345) >>> 0) % 1000) / 1000
const straw = Array.from({ length: 16 }, () =>
  `<i style="--a:${(rnd() * 360).toFixed(0)}deg;
     --dx:${(rnd() * 150 - 75).toFixed(0)}px;
     --dy:${(-30 - rnd() * 55).toFixed(0)}px"></i>`).join('')

document.getElementById('dock').innerHTML = `
  <div class="head">
    <div class="eye">Compliments</div>
    <h1>Straight out of the crate</h1>
    <div class="sub">${r.name} · ${r.date}</div>
  </div>
  <div class="shelf">${items}</div>
  <div class="crate">
    <span class="mouth"></span>
    <span class="straw">${straw}</span>
    <span class="lid"></span>
    <div class="box"><div class="stencil">${r.organizer !== 'Self' ? r.organizer : 'Self packed'}</div></div>
  </div>
  <div class="foot">
    ${r.compliments.length} inclusions
    ${r.registration ? ` · Entry <b>${r.registration}</b>` : ''}
  </div>`
</script>
</body>
</html>
