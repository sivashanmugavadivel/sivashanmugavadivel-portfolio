<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mileage · 19 · Refuel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════
   REFUEL — designs 13 and 14, on a forecourt.

   The nozzle is never conjured and never vanishes. It starts where a
   nozzle actually lives: holstered on the dispenser, hose already
   attached. It is lifted out, carried over on an arc, put into the
   filler, run, and then hung back up. The hose stays connected to the
   pump the whole time and is redrawn every frame from the pump's
   outlet to wherever the nozzle currently is, so it behaves like one
   continuous thing rather than a shape that happens to follow.

   The dispenser counts up as it pours, because that is the other half
   of what refuelling looks like: the litres and the money.

   Only when the nozzle is back on its hook does the mileage come up.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828; --well:#0d0b15;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --honey:#e0bb3c;
  --good:#4ade80; --bad:#fb7185;
  --sans:'Inter',sans-serif; --serif:'Playfair Display',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--honey);color:#161018}
.page{width:90%;max-width:1180px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:26px clamp(14px,3vw,30px) 30px;overflow:hidden}
.sec::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 0%,rgba(224,187,60,0.08),transparent 70%)}

.head{position:relative;z-index:2;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:4px}
.kick{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--honey);display:block;margin-bottom:7px}
.head h2{font-family:var(--serif);font-size:clamp(1.35rem,3.6vw,2rem);font-weight:700;color:var(--off);line-height:1.1}
.head .note{font-size:0.76rem;color:var(--d2);line-height:1.65;max-width:440px;margin-top:8px}

/* ══ the forecourt ══ */
.rig{position:relative;z-index:2;width:100%;max-width:1000px;margin:0 auto;aspect-ratio:1020 / 560}
.rig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

#bike{filter:brightness(.42) saturate(.48) contrast(1.05);transition:filter 1.6s var(--ease)}
.rig.lit #bike{filter:brightness(.64) saturate(.76) contrast(1.02)}
#trigger{transform-box:fill-box;transform-origin:52% 5%}

/* ══ the readout ══ */
.float{position:absolute;z-index:6;transform:translate(-50%,-100%);pointer-events:none;
  will-change:transform,opacity;opacity:0}
.float.up{opacity:1}
.chip{display:flex;align-items:flex-end;gap:7px;padding:9px 14px 10px;border-radius:13px;
  background:rgba(12,10,18,.88);border:1px solid rgba(224,187,60,.45);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 20px 40px -22px #000,0 0 30px -6px rgba(224,187,60,.45);white-space:nowrap}
.chip b{font-family:var(--mono);font-size:clamp(1.3rem,3.6vw,2.1rem);font-weight:700;color:var(--off);
  line-height:.9;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.chip s{text-decoration:none;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--honey);padding-bottom:3px}
.tether{position:absolute;left:50%;top:100%;width:1px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(224,187,60,.75),rgba(224,187,60,.05))}
.tether::after{content:'';position:absolute;left:50%;bottom:-3px;width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--honey);
  box-shadow:0 0 12px 2px rgba(224,187,60,.6)}

.caption{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:7;
  font-family:var(--mono);font-size:0.5rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--d3);white-space:nowrap;transition:color .3s}
.caption.on{color:var(--honey)}

/* The tile grid of derived figures and the method-and-replay bar that
   used to sit under the scene are gone, along with everything that
   styled them. The section is the reading and the shot that measures
   it — the numbers those tiles carried are still derived in
   mileage-data.js for the designs that do show them. */

/* ══ empty ══ */
.none{position:relative;z-index:2;border:1px dashed var(--bd2);border-radius:14px;
  padding:38px 26px;text-align:center;color:var(--d2);font-size:0.8rem;line-height:1.75;max-width:470px;margin:0 auto}
.none b{display:block;font-family:var(--mono);font-size:0.56rem;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--honey);margin-bottom:12px}
.none img{width:200px;max-width:62%;display:block;margin:0 auto 14px;
  filter:brightness(.38) saturate(.28) grayscale(.5)}
</style>
</head>
<body>
<div class="page">
  <div class="stub">section above</div>

  <section class="sec" aria-labelledby="mh">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="mh"></h2>
        <p class="note" id="note"></p>
      </div>
    </div>
    <div id="body"></div>
  </section>

  <div class="stub">section below</div>
</div>

<script src="mileage-data.js"></script>
<script src="mileage-motion.js"></script>
<script>
document.getElementById('kick').textContent = MILEAGE_COPY.kicker
document.getElementById('mh').textContent   = MILEAGE_COPY.title
document.getElementById('note').textContent = MILEAGE_COPY.note

const BIKE = '../public/bear650/wild-honey06.png'
/* the name the cluster shows while it boots */
const CLUSTER_INTRO = '../public/Interceptor-bear-650-intro.png'
const body = document.getElementById('body')

if (MILEAGE_EMPTY) {
  body.innerHTML = `<div class="none">
      <img src="${BIKE}" alt="">
      <b>Nothing in the tank</b>
      ${MILEAGE_COPY.empty}
    </div>`
} else {

/* ── the scene ───────────────────────────────────────────────────
   Sized off the motorcycle. The Bear is 2.1 m long, so at this scale
   one metre is BS * 800 / 2.1 pixels — which is what sets how tall the
   dispenser is. Guessing at the pump's size instead is what makes a
   scene like this read as a collage. */
/* ── two arrangements ────────────────────────────────────────────
   A phone column is roughly a third as wide as it is tall; this scene
   is nearly twice as wide as it is tall. Squeezed into one, the whole
   thing becomes a strip — the motorcycle lands about 215px across and
   the cluster about 66, well under what the odometer needs to be read
   at all. So a phone gets its own arrangement rather than a shrunken
   copy of the desktop one: dispenser stacked above the motorcycle,
   cluster in the space that leaves to the right.

   Only the numbers below differ between the two. Everything
   downstream is derived from them, so the hose, the carry arc, the
   filler neck and the tank cutaway all follow without a second
   version of any of them existing.

   Stacking does need one thing the desktop scene never had to say.
   There the dispenser and the bike share a floor, so a single GROUND
   meant both bases at once; here they stand on different lines, and
   the dispenser's own base has to be named separately. */
const NARROW = window.matchMedia('(max-width: 700px)')
const PORTRAIT = NARROW.matches
/* The scene is built once from these numbers, so crossing the
   breakpoint later — turning a phone on its side, dragging a window —
   would otherwise leave the wrong arrangement in place until a reload.
   On a preview page, reloading IS the reload. */
NARROW.addEventListener('change', () => location.reload())

const VB = PORTRAIT ? { w: 640, h: 928 } : { w: 1020, h: 560 }
const BS = PORTRAIT ? 0.78 : 0.72     // bike scale
const BX = PORTRAIT ? 8 : 400         // bike placement
const BY = PORTRAIT ? 530 : 185
const GROUND = PORTRAIT ? 897 : 505   // the floor the motorcycle stands on
const PBASE = PORTRAIT ? 520 : GROUND // and the one the dispenser stands on
const M = (BS * 800) / 2.1            // pixels per metre

/* the tank cut, in the product frame's own 800 x 501 space */
const TANK = 'M 366 176 C 378 164 398 150 420 141 C 436 134 448 130 456 129 ' +
             'C 462 133 464 146 464 160 C 464 174 462 184 459 189 ' +
             'L 375 190 C 368 188 365 182 366 176 Z'
const FUEL = { top: 132, bottom: 188 }
const FULL = 0.92

/* bike space → stage space */
const bx = (x) => BX + x * BS
const by = (y) => BY + y * BS

/* ── the dispenser ───────────────────────────────────────────────
   Drawn in the same flat-illustration language as the nozzle — the
   same reds, the same whites, the same dark steel — because a bright
   flat nozzle hanging on a dark UI-styled cabinet read as two
   different drawings sharing a frame. 1.68 m tall, 0.78 m wide:
   dispenser proportions, not phone proportions. */
const PUMP = { x: PORTRAIT ? 40 : 130, y: PBASE - 1.68 * M,
               w: 0.78 * M, h: 1.68 * M }
/* the boot the nozzle actually sits in, on the cabinet's right flank */
const BOOT = { x: PUMP.x + PUMP.w - 4, y: PUMP.y + 206 }
/* The hose enters the cabinet LOW, near the plinth — in the reference
   the hose falls from the nozzle in one long loop to the base, and an
   outlet at chest height cannot produce that shape. */
const OUTLET = { x: PUMP.x + PUMP.w - 12, y: PBASE - 52 }
/* The grade buttons, read off the shared reading rather than typed
   here, so the cabinet can never offer something the fill note does not
   claim. The colours are only three distinguishable buttons. */
const GRADE_INK = [
  { fill: '#ED3237', ink: '#FFFFFF' },
  { fill: '#E8B33A', ink: '#2A2410' },
  { fill: '#3DBB4E', ink: '#0B2A12' },
]
const GRADES = MILEAGE_BIKE.grade.split('/').map((s, i) => ({
  name: s.trim().toUpperCase(), ...GRADE_INK[i % GRADE_INK.length],
}))

/* the printer slot's mouth, and the slip that comes out of it */
const SLIP = { x: PUMP.x + PUMP.w - 76, y: PUMP.y + 254, w: 32, h: 52 }
const SLIP_IN = -(SLIP.h + 6)         // fully back inside the machine

/* ── the nozzle ──────────────────────────────────────────────────
   Drawn in the reference artwork's own 650 x 345 space and placed by
   its spout tip, so the tip can be aimed at the holster or the filler
   and the rest of it follows. */
const TIPG = { x: 606, y: 160 }
const GS = 0.26

/* The two poses it moves between: hung in the boot, and in the filler.

   The docked pose is MIRRORED (m: -1). In the reference machine the
   nozzle hangs spout-down with the grip leaning up and OUT and the
   trigger guard facing away from the cabinet — and that pose is the
   mirror image of the gun artwork. Rotation alone can never produce
   it: turning the unmirrored gun spout-down parks the guard against
   the cabinet and points the hose connection at the sky, which is
   exactly the upside-down look that was reported. */
const NECK = { x: bx(452), y: by(127) }
/* One gun, two poses — same artwork, same size, docked and filling.

   The docked pose is per the pump-icon reference: the gun hangs
   VERTICAL and FACES THE MACHINE — nose at the top bent left into the
   slot, trigger below it also toward the machine, grip at the bottom
   with the hose falling away. Facing left is a mirrored orientation of
   this artwork (m: -1); no rotation alone reaches it. The gun turns
   over in the hand during the carry, which is what a person does with
   a nozzle anyway. */
const POSE = {
  /* Docked on the diagonal: nozzle and trigger on ONE straight line at
     ~25 degrees — nose tucked down-left into the slot, body and grip
     rising up-right OUT of the machine, trigger clear of the cabinet.
     Still mirrored (facing the machine), so the carry keeps its
     left-to-right turn. */
  dock: { x: BOOT.x - 2, y: BOOT.y + 14, a: 65, m: -1 },
  fill: { x: NECK.x, y: NECK.y + 5, a: 22, m: 1 },
}
/* carried over on an arc — nobody moves a nozzle in a straight line */
const carry = MM.arc(POSE.dock.x, POSE.dock.y, POSE.fill.x, POSE.fill.y, -0.17)

/* One place builds the transform, whatever needs it: mirror about the
   tip first (innermost), then rotate about the tip, then scale and
   place the tip. The mirror must live inside the rotation, or flipping
   would also throw the gun to the other side of its own tip. */
function poseTransform(p) {
  return `translate(${(p.x - TIPG.x * GS).toFixed(2)}, ${(p.y - TIPG.y * GS).toFixed(2)}) `
       + `scale(${GS}) rotate(${p.a.toFixed(2)}, ${TIPG.x}, ${TIPG.y}) `
       + `translate(${TIPG.x}, ${TIPG.y}) scale(${p.m.toFixed(4)}, 1) `
       + `translate(${-TIPG.x}, ${-TIPG.y})`
}

/* The docked placement, baked into the markup itself. Without it the
   nozzle has no transform until the first animation frame runs, and
   the first paint shows it at raw drawing coordinates — enormous, and
   nowhere near the machine. That was a real bug, not a styling one. */
const dockTransform = poseTransform(POSE.dock)


body.innerHTML = `
  <div class="rig" id="rig">
    <svg viewBox="0 0 ${VB.w} ${VB.h}" role="img"
         aria-label="A Royal Enfield Bear 650 at a pump, its cut-away tank being filled, ending at ${MILEAGE.kmpl} kilometres per litre.">
      <defs>
        <clipPath id="tankClip"><path d="${TANK}"/></clipPath>
        <!-- the mouth of the printer slot: the slip is only visible
             below this line, which is what makes it emerge -->
        <clipPath id="slipClip">
          <rect x="${SLIP.x - 3}" y="${SLIP.y}" width="${SLIP.w + 6}" height="${SLIP.h + 14}"/>
        </clipPath>
        <!-- The fuel is a 95-octane premium, and those are dyed a deep
             orange rather than the straw colour of regular. Everything
             that IS the fuel takes its colour from here or from the two
             below — the body in the tank, the waves on its surface, the
             stream, the drips, the spill glow — so they cannot drift
             apart into two different liquids. -->
        <!-- Only the top slice of this gradient is ever seen — the tank
             cutaway shows about a third of the fuel body — so the deep
             end has to arrive early or the whole thing reads as a pale
             amber however dark the bottom stop is. -->
        <linearGradient id="fuelGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#FF8A1E"/>
          <stop offset=".14" stop-color="#DB5D07"/>
          <stop offset="1"   stop-color="#5E2203"/>
        </linearGradient>
        <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"   stop-color="rgba(255,255,255,.14)"/>
          <stop offset=".45" stop-color="rgba(255,255,255,.02)"/>
          <stop offset="1"   stop-color="rgba(0,0,0,.3)"/>
        </linearGradient>
        <!-- the cabinet face: the reference machine's grey, lit from the
             left and turning away on the right -->
        <linearGradient id="pumpFace" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#C6CED7"/>
          <stop offset=".65" stop-color="#AEB7C1"/>
          <stop offset="1"   stop-color="#8F98A3"/>
        </linearGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="rgba(242,116,14,.5)"/>
          <stop offset="1" stop-color="rgba(242,116,14,0)"/>
        </radialGradient>
        <radialGradient id="dropShine" cx=".34" cy=".28" r=".74">
          <stop offset="0"   stop-color="#FFC071"/>
          <stop offset=".42" stop-color="#F8830F"/>
          <stop offset="1"   stop-color="#C25405"/>
        </radialGradient>
      </defs>

      <!-- The forecourt floor. Stacked, the two do not share it, so the
           dispenser gets a short line of its own to stand on rather
           than appearing to float above the motorcycle. -->
      <line x1="0" y1="${GROUND}" x2="${VB.w}" y2="${GROUND}"
            stroke="rgba(255,255,255,.07)" stroke-width="1"/>
      ${PORTRAIT ? `<line x1="${PUMP.x - 46}" y1="${PBASE}"
            x2="${PUMP.x + PUMP.w + 46}" y2="${PBASE}"
            stroke="rgba(255,255,255,.07)" stroke-width="1"/>` : ''}
      <ellipse cx="${PUMP.x + PUMP.w / 2}" cy="${PBASE + 3}" rx="${PUMP.w * 0.8}" ry="9"
               fill="rgba(0,0,0,.5)" style="filter:blur(5px)"/>
      <ellipse cx="${bx(430)}" cy="${GROUND + 4}" rx="${210 * BS}" ry="11"
               fill="rgba(0,0,0,.45)" style="filter:blur(7px)"/>

      <!-- ══ the dispenser ══
           Rebuilt against the reference machine (Preview/_ref-pump.png):
           overhanging red cap, grey cabinet, one dark fascia holding a
           WHITE sale screen with the amount on a green bar, a row of
           coloured buttons with a card slot and a knob, a red lower
           panel, and a wide grey plinth. Redrawn as vectors rather than
           embedding the image — it is watermarked stock, and a raster
           could not hold a live counter anyway. -->
      <g id="pump">
        <!-- plinth: two grey slabs, widest at the floor -->
        <rect x="${PUMP.x - 26}" y="${PBASE - 14}" width="${PUMP.w + 52}" height="15"
              rx="4" fill="#8D96A1"/>
        <rect x="${PUMP.x - 15}" y="${PBASE - 27}" width="${PUMP.w + 30}" height="15"
              rx="4" fill="#B4BDC7"/>

        <!-- cabinet -->
        <rect x="${PUMP.x}" y="${PUMP.y + 26}" width="${PUMP.w}" height="${PBASE - 26 - (PUMP.y + 26)}"
              rx="10" fill="url(#pumpFace)"/>

        <!-- the cap: red, overhanging the cabinet on both sides -->
        <rect x="${PUMP.x - 9}" y="${PUMP.y + 2}" width="${PUMP.w + 18}" height="36"
              rx="7" fill="#ED3237"/>
        <rect x="${PUMP.x - 9}" y="${PUMP.y + 2}" width="${PUMP.w + 18}" height="11"
              rx="5" fill="#F4696D"/>
        <text x="${PUMP.x + PUMP.w / 2}" y="${PUMP.y + 29}" text-anchor="middle"
              font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.8"
              fill="#F4F7FA">POWER PETROL</text>

        <!-- one dark fascia holds the screen and the controls -->
        <rect x="${PUMP.x + 16}" y="${PUMP.y + 52}" width="${PUMP.w - 32}" height="232"
              rx="12" fill="#454D57"/>
        <rect x="${PUMP.x + 16}" y="${PUMP.y + 52}" width="${PUMP.w - 32}" height="6"
              rx="3" fill="#59626D"/>

        <!-- the sale screen: white, like the reference, not a dark VFD -->
        <rect x="${PUMP.x + 26}" y="${PUMP.y + 64}" width="${PUMP.w - 52}" height="108"
              rx="6" fill="#F2F5F1"/>
        <text x="${PUMP.x + 34}" y="${PUMP.y + 82}" font-family="monospace" font-size="8"
              letter-spacing="1.8" fill="#6B7366">SALE</text>
        <!-- just the rate. The grade used to be named here too, but the
             buttons below now say it in bigger type and mark which one
             is chosen, so repeating it above only crowded the line. -->
        <text x="${PUMP.x + PUMP.w - 34}" y="${PUMP.y + 82}" text-anchor="end"
              font-family="monospace" font-size="8" letter-spacing="1"
              fill="#98A090">${MILEAGE_BIKE.currency}${MILEAGE.rate.toFixed(2)}/L</text>
        <!-- the amount rides the green bar -->
        <rect x="${PUMP.x + 34}" y="${PUMP.y + 90}" width="${PUMP.w - 68}" height="26"
              rx="6" fill="#3DBB4E"/>
        <text x="${PUMP.x + 42}" y="${PUMP.y + 108}" font-family="monospace" font-size="11"
              fill="rgba(255,255,255,.75)">${MILEAGE_BIKE.currency}</text>
        <text id="dAmt" x="${PUMP.x + PUMP.w - 42}" y="${PUMP.y + 109}" text-anchor="end"
              font-family="monospace" font-size="16" font-weight="700" fill="#FFFFFF">0</text>
        <!-- litres, large and dark -->
        <text x="${PUMP.x + 34}" y="${PUMP.y + 138}" font-family="monospace" font-size="8"
              letter-spacing="1.8" fill="#6B7366">LITRES</text>
        <text id="dLit" x="${PUMP.x + PUMP.w - 36}" y="${PUMP.y + 162}" text-anchor="end"
              font-family="monospace" font-size="24" font-weight="700" fill="#2E3947">0.00</text>

        <!-- the controls: the three grades this bike actually takes, a
             wide button, a knob, and the card slot -->
        ${GRADES.map((g, i) => {
          const pad = 26, gap = 7
          const w = (PUMP.w - pad * 2 - gap * 2) / 3
          const x = PUMP.x + pad + i * (w + gap)
          /* All three stay lit. Dimming the two that are not selected
             cost more than it bought: at this size the labels are only
             a few pixels tall, and knocking them back to under half
             opacity made them unreadable, which is worse than the
             ambiguity it was solving. The chosen grade is marked by an
             outline instead, which costs the label nothing. */
          const on = g.name === MILEAGE_BIKE.gradeOnPump.toUpperCase()
          return `<rect x="${x.toFixed(1)}" y="${PUMP.y + 184}" width="${w.toFixed(1)}"
                        height="21" rx="5" fill="${g.fill}"
                        ${on ? 'stroke="#F4F7FA" stroke-width="1.6"' : ''}/>
                  <text x="${(x + w / 2).toFixed(1)}" y="${PUMP.y + 197.5}" text-anchor="middle"
                        font-family="monospace" font-size="8.4" font-weight="700"
                        letter-spacing=".3" fill="${g.ink}">${g.name}</text>`
        }).join('')}
        <rect x="${PUMP.x + 30}" y="${PUMP.y + 212}" width="70" height="16" rx="5" fill="#E8ECEF"/>
        <circle cx="${PUMP.x + 46}" cy="${PUMP.y + 252}" r="11" fill="#E8ECEF"/>
        <circle cx="${PUMP.x + 46}" cy="${PUMP.y + 252}" r="4.5" fill="#B7BFC8"/>
        <rect x="${PUMP.x + PUMP.w - 88}" y="${PUMP.y + 236}" width="56" height="30"
              rx="5" fill="#262C33"/>
        <rect x="${PUMP.x + PUMP.w - 78}" y="${PUMP.y + 248}" width="36" height="6"
              rx="3" fill="#0B0F14"/>

        <!-- the red lower panel, with the delivery lamp -->
        <rect x="${PUMP.x + 14}" y="${PUMP.y + 296}" width="${PUMP.w - 28}"
              height="${PBASE - 36 - (PUMP.y + 296)}" rx="10" fill="#ED3237"/>
        <rect x="${PUMP.x + 14}" y="${PBASE - 50}" width="${PUMP.w - 28}" height="14"
              rx="7" fill="#D42B2E"/>
        <circle id="pumpLamp" cx="${PUMP.x + 40}" cy="${PUMP.y + 320}" r="6.5"
                fill="#8f2a26" stroke="#F4F7FA" stroke-width="2.4"/>
        <text x="${PUMP.x + 56}" y="${PUMP.y + 325}" font-family="monospace"
              font-size="9" letter-spacing="1.6" fill="#F4F7FA">FUEL</text>

        <!-- The nozzle housing, as the close-up reference has it: a
             recessed cavity with a light rim, dark inside, that the
             whole nozzle hangs within — not a plate it hangs against. -->
        <rect x="${BOOT.x - 14}" y="${BOOT.y - 24}" width="78" height="168" rx="12" fill="#9AA3AE"/>
        <rect x="${BOOT.x - 7}" y="${BOOT.y - 17}" width="64" height="154" rx="9" fill="#1E242C"/>
        <rect x="${BOOT.x - 7}" y="${BOOT.y - 17}" width="64" height="9" rx="4" fill="#12161C"/>
        <!-- the slot the nose tucks into, low on the machine side, so
             the gun can lie along its 25-degree diagonal -->
        <rect x="${BOOT.x - 6}" y="${BOOT.y + 8}" width="28" height="18" rx="5" fill="#0C1014"/>

        <!-- ══ the receipt ══
             Printed when the delivery ends. The slip is drawn at its
             full length and clipped to the mouth of the slot, then slid
             down through it — so it comes OUT of the machine instead of
             appearing below it, and no part of it exists above the slot
             while it is still inside. Drawn last in the cabinet so it
             hangs over the red panel rather than behind it. -->
        <g clip-path="url(#slipClip)">
          <g id="slip" transform="translate(0, ${SLIP_IN})">
            <rect x="${SLIP.x}" y="${SLIP.y}" width="${SLIP.w}" height="${SLIP.h}" fill="#F4F5F0"/>
            <!-- the torn edge, eight teeth across the paper's width -->
            <path d="M ${SLIP.x} ${SLIP.y + SLIP.h} ${
              Array.from({ length: SLIP.w / 4 }, () => 'l 2 3 l 2 -3').join(' ')} Z"
                  fill="#F4F5F0"/>
            <rect x="${SLIP.x + 4}" y="${SLIP.y + 7}" width="24" height="2.4" rx="1.2" fill="#3A3F45"/>
            <rect x="${SLIP.x + 4}" y="${SLIP.y + 13}" width="15" height="1.6" rx=".8" fill="#AAB0B6"/>
            <rect x="${SLIP.x + 4}" y="${SLIP.y + 17}" width="19" height="1.6" rx=".8" fill="#AAB0B6"/>
            <text x="${SLIP.x + 4}" y="${SLIP.y + 31}" font-family="monospace" font-size="7"
                  fill="#2E3947">${MILEAGE_BIKE.tank.toFixed(2)}L</text>
            <text x="${SLIP.x + 4}" y="${SLIP.y + 42}" font-family="monospace" font-size="7"
                  font-weight="700" fill="#1A1F26">${MILEAGE_BIKE.currency}${MILEAGE.tankCost.toLocaleString('en-IN')}</text>
            <rect x="${SLIP.x + 4}" y="${SLIP.y + 47}" width="13" height="1.6" rx=".8" fill="#AAB0B6"/>
          </g>
        </g>
      </g>

      <!-- ══ the bike, and the tank cut into it ══ -->
      <g transform="translate(${BX}, ${BY}) scale(${BS})">
        <image id="bike" href="${BIKE}" x="0" y="0" width="800" height="501"/>
        <ellipse id="spill" cx="415" cy="${FUEL.bottom}" rx="120" ry="52"
                 fill="url(#glow)" opacity="0"/>
        <g clip-path="url(#tankClip)">
          <rect x="350" y="118" width="130" height="84" fill="#07060b"/>
          <g id="fuelG" transform="translate(0, ${FUEL.bottom})">
            <path fill="url(#fuelGrad)" d="M 340 0 L 500 0 L 500 120 L 340 120 Z"/>
            <!-- These two are not a thin band on the surface: each is
                 filled all the way down, so between them they cover
                 nearly all the fuel the cutaway shows and it is THEIR
                 colour that reads as the fuel, not the gradient's. -->
            <path id="wave1" fill="#B94E06" opacity=".95" d=""/>
            <path id="wave2" fill="#E88A38" opacity=".35" d=""/>
          </g>
          <rect x="350" y="118" width="130" height="84" fill="url(#glassGrad)"/>
        </g>
        <path d="${TANK}" fill="none" stroke="rgba(224,187,60,.85)" stroke-width="2.2"
              id="cutEdge" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        <g id="marks" opacity="0"></g>
      </g>

      <!-- ══ the Tripper dash ══
           The Bear's round pod, traced off the reference photograph
           rather than sketched: in that image the white face is a
           circle of radius 205px centred at (304.5, 284), so every
           figure below is that measurement times 70/205 — the face
           here is r=70 and everything else follows from it.

           Angles are screen degrees throughout: 0 is three o'clock and
           they grow CLOCKWISE, so 90 points straight down. The scale
           runs 1 at 147.3° round to 9 at 330.8°, 22.94° a number.

           The odometer reads THIS page's real figure, and the fuel
           telltale is live — it blinks while the tank below is empty
           and goes steady once the fill completes.

           Two things the real pod shows are deliberately left out —
           the clock-and-temperature row and the road-speed readout.
           See the note beside the pill. -->
      <!-- Stacked, the cluster is the one thing with room to grow: it
           sits in open space beside the dispenser, so it is carried a
           fifth larger there and dropped a little to sit lower in that
           gap. Scaling about the group's own origin means the whole
           dial grows off its centre and nothing inside needs redoing. -->
      <g id="tripper"
         transform="${PORTRAIT ? 'translate(494, 411) scale(1.2)'
                               : 'translate(906, 133) scale(1.44)'}"
         font-family="'Segoe UI', Inter, Roboto, Arial, sans-serif">
        <defs>
          <!-- the face is a circle with its bottom sliced off flat,
               where the badge plate starts -->
          <clipPath id="triFace">
            <path d="M -33.8 61.3 A 70 70 0 1 1 33.8 61.3 Z"/>
          </clipPath>
          <!-- the bezel's reflection rings catch the light at the
               sides and go dark across the middle -->
          <!-- A ring of polished black only catches the light where it
               turns edge-on to the viewer, which on a dial photographed
               square is the far left and far right and nowhere else. So
               the ring stroke is painted with this: bright in the outer
               twentieth of its width at each side, black by a sixth. -->
          <linearGradient id="triRing" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#AEB4BA"/>
            <stop offset=".13"  stop-color="#22262B"/>
            <stop offset=".5"   stop-color="#07080A"/>
            <stop offset=".87"  stop-color="#22262B"/>
            <stop offset="1"    stop-color="#AEB4BA"/>
          </linearGradient>
          <!-- the crown highlight has to die away at its ends, or it
               reads as a band laid on the bezel rather than light on it -->
          <linearGradient id="triCrown" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#C0C4CA" stop-opacity="0"/>
            <stop offset=".28" stop-color="#C0C4CA" stop-opacity=".85"/>
            <stop offset=".72" stop-color="#C0C4CA" stop-opacity=".85"/>
            <stop offset="1"   stop-color="#C0C4CA" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="triWord" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#E8E8E6"/>
            <stop offset=".5"  stop-color="#C4C4C2"/>
            <stop offset="1"   stop-color="#8E8E8C"/>
          </linearGradient>
        </defs>

        <!-- ── bezel ──
             Near-black, with the reflection rings the photograph shows:
             bright where a ring runs edge-on at the sides and gone by
             the top and bottom, which is what the gradient above does.
             The radii and the brightness of each are the ones measured
             straight across the reference at its own mid-height. -->
        <circle r="88.1" fill="#030405"/>
        <circle r="86" fill="none" stroke="url(#triRing)" stroke-width="1.1" opacity=".3"/>
        <circle r="83.8" fill="none" stroke="url(#triRing)" stroke-width="1.8" opacity=".92"/>
        <circle r="79.4" fill="none" stroke="url(#triRing)" stroke-width="1.3" opacity=".55"/>
        <circle r="74.8" fill="none" stroke="url(#triRing)" stroke-width="1.1" opacity=".48"/>
        <!-- the lit rim across the crown, which the photograph shows
             running roughly ten o'clock to two -->
        <path d="M -58 -66 A 87.9 87.9 0 0 1 58 -66" fill="none"
              stroke="url(#triCrown)" stroke-width="3.6"/>

        <!-- ── the badge plate across the bottom ──
             Barely lifted off the bezel: in the photograph the plate is
             only legible where it cuts the white face, and merges with
             the bezel to either side of that chord. -->
        <path d="M -63.3 61.3 L 63.3 61.3 A 88.1 88.1 0 0 1 -63.3 61.3 Z"
              fill="#0B0A0B"/>
        <path d="M -52 74 A 88.1 88.1 0 0 0 52 74" fill="none"
              stroke="#5A5D62" stroke-width="2.2" opacity=".2"/>
        <!-- the logotype itself, at the size it holds in the photograph -->
        <g transform="translate(-28.8, 64.5) scale(0.19009)">
          <path fill="url(#triWord)" d="M98.3,6.8H89v0.1c0.3,0.5,0.5,1.2,0.5,1.9c0,1.1-0.7,3.1-0.9,4l-5.9,17c-0.8,2.2-0.9,2.8-2.3,4.9v0.1h7.7v-0.1c-0.4-0.7-0.6-1.3-0.6-2c0-1.1,0.5-2.6,0.8-3.4l0.4-1.2h8.4c0,0,0.5,1.5,0.9,2.4c0.3,0.8,0.4,1.6,0.4,2.1c0,0.6-0.1,1.1-0.4,2.1v0.1h11.2v-0.1c-1.2-1.5-1.8-3.2-2.8-6L98.3,6.8z M90.2,23.5l2.6-7.8l0,0l2.7,7.8H90.2z M75.6,28.6c0,2.5,0.2,4.8,1,6.1v0.1h-11v-0.1c1.1-1.9,0.9-3.8,0.9-6v-4.6V23L65,20.1l-5.3-9.9c-0.7-1.4-1.3-2.3-2.4-3.3V6.8h9.6v0.1l5.7,11.6c0,0,1.3-2.6,1.6-3.2c0.6-1.2,1.3-2.6,1.6-3.2c0.5-0.9,1-2.2,1-3.2S76.5,7.4,76.2,7V6.8h7.6v0.1l-7.7,15.2l-0.6,1.1L75.6,28.6L75.6,28.6z M130.9,34.8h-19.7v-0.1c0.8-1.8,0.9-3.3,0.9-6V12.9c0-3.3-0.3-4.6-0.9-5.9V6.9h10.7V7c-0.7,1.9-0.8,3-0.8,6v16.1c1.2,0.2,2.6,0.4,4.1,0.4c3.2,0,4.9-0.3,6.1-0.8h0.3L130.9,34.8z M44.3,6.1c-8.7,0-14.7,5.4-14.7,13c0,11.1,11.8,12.7,15.9,9.1l-0.7-1.4c-3.6,0.7-6.8-2-6.8-8.1c0-4.9,2.6-8,6.2-8c4.2,0,6.8,4.2,6.8,10.3c0,6.9-4,12.1-11.4,12.1c-8.5,0-14.9-6.7-18.9-13.4c4.4-1.7,7-5,7-9.5c0-5.8-4.4-9.9-12.3-9.9h-15v0.1c0.6,1.3,0.9,3.7,0.9,7v21.3c0,2.7-0.1,4.2-0.9,6v0.1h11.1v-0.1c-0.7-1.7-0.9-4-0.9-6c0-3.3,0-5.9,0-5.9c0.1,0,1.2,0,1.4,0c7.7,11.3,16.5,16,25.9,16c13.6,0,21.6-8.6,21.6-18.1C59.5,12.6,53.4,6.1,44.3,6.1z M10.7,18.3V5.6h3.1c3.6,0,5.1,2.1,5.1,5.5c0,4.1-2.4,7.3-6.3,7.3C12,18.3,10.9,18.3,10.7,18.3z M197.2,6.9c-0.6,1.3-0.9,2.7-0.9,5.9v17.4c0.1,1.8,0.2,3,0.9,4.4v0.1h-0.9h-1.8h-3.8c-1.4-0.6-2.9-2.3-4.9-4.4c-1.6-1.7-9.1-10.4-9.1-10.4h-0.1c0,0,0,8.2,0,8.3c-2.2,0.2-4.8,0.8-6.8,1.3v-1.8v-15c0-3.3-0.3-4.6-0.9-5.9V6.7h5.6h2.3l12.7,15.4l0,0v-9.2c0-3.3-0.3-4.6-0.9-5.9V6.9h5.9H197.2L197.2,6.9z M184.1,34.8c-11.1,0.1-13.7,6.1-27.8,6.1c-6.8,0-12.8-1.8-12.8-1.8V39c0.8-1.8,0.9-3.2,0.9-5.9V7.4c0-3.3-0.3-5.7-0.9-7V0.3h22.7l0.7,6.3h0c-1.7-0.7-3.8-0.9-6.8-0.9h-6v10.9h2.9c4.5,0,7.1-0.3,7.8-0.5h0.2v6.6h-0.1c-0.9-0.3-4-0.6-7.7-0.6h-3V33c0,0,3.5,0.8,6.7,0.8c8.4,0,12-3,20.3-3c0.3,0,0.5,0,0.7,0c1.6,1.9,3,3.4,3.6,4C184.9,34.8,184.9,34.8,184.1,34.8z M232.4,12.9v15.9c0,2.7,0.1,4.2,0.9,6v0.1h-10.8v-0.1c0.8-1.8,0.9-3.3,0.9-6V12.9c0-3.3-0.3-4.6-0.9-5.9V6.9h10.8V7C232.7,8.3,232.4,9.6,232.4,12.9z M210.7,19L210.7,19h0.8c4,0,5.3-0.3,5.9-0.4h0.2v5.8h-0.2c-0.8-0.3-2.5-0.6-5.8-0.6h-0.9v3.4v1.4c0,2.8,0.1,4.7,1,6.1v0.1h-10.9v-0.1c0.8-1.8,0.9-3.3,0.9-6V12.9c0-3.3-0.3-4.6-0.9-5.9V6.9h18.6l0.7,5.7H220c-1.3-0.6-3-0.9-5.7-0.9h-3.6v4.6V19z M256.9,29l-0.7,5.8h-12.9l0,0H237v-0.1c0.8-1.8,0.9-3.3,0.9-6V12.9c0-3.3-0.3-4.6-0.9-5.9V6.9h18.6l0.7,5.7h-0.1c-1.3-0.6-3-0.9-5.7-0.9h-3.6v6.4l0,0l0,0h0.7c4,0,5.3-0.3,5.9-0.4h0.2v5.8h-0.2c-0.8-0.3-2.5-0.6-5.8-0.6h-0.9v6.6c1.3,0.2,2.2,0.3,3.7,0.3c3.4,0,4.6-0.2,6-0.8C256.5,29,256.9,29,256.9,29z M306.4,21.7c0,9.6-7,17.1-18.8,17.1c-9.1,0-12-4-23.3-4l0,0h-4.7v-0.1c0.8-1.8,0.9-3.3,0.9-6V12.8c0-3.3-0.3-4.6-0.9-5.9V6.8h10.8v0.1c-0.6,1.3-0.9,3.4-0.9,6v17c6.7,0,9.7,2,15.6,2c8.2,0,12.2-4.5,12.2-10.9c0-5.5-2.8-9.6-7.7-9.6c-0.9,0-2.2,0-3.2,0v17.3c-3,0.1-6.5-0.3-9-1.2V12.8c0-3.3-0.3-4.6-0.9-5.9V6.8h12.7C299.7,6.8,306.4,13.3,306.4,21.7z"/>
        </g>

        <!-- ── the white face ── -->
        <path d="M -33.8 61.3 A 70 70 0 1 1 33.8 61.3 Z" fill="#FFFFFF"/>

        <!-- everything on the face is cut off where the plate begins,
             including the pill, which runs off the right-hand side
             with no cap on it — exactly as it does on the real pod -->
        <g clip-path="url(#triFace)">
         <!-- The dial proper. It starts hidden: on a cold start the
              screen is dark, the name comes up, and only then does the
              instrument appear behind it. -->
         <g id="triDial" opacity="0">
          <!-- the outer scale: one long dash per number, the breaks
               sitting under the numerals (paths built in script) -->
          <path id="triTicks" fill="none" stroke="#969696" stroke-width="2.39"/>
          <!-- the sweep lights the ticks it has passed, in the same
               three bands the needle takes its own colour from -->
          <path id="triRevK" fill="none" stroke="#000000" stroke-width="2.39"/>
          <path id="triRevO" fill="none" stroke="#EF8A17" stroke-width="2.39"/>
          <path id="triRevR" fill="none" stroke="#D91F11" stroke-width="2.39"/>
          <g id="triNums" font-size="7.85" font-weight="600" fill="#000000"
             text-anchor="middle"></g>
          <text x="0.3" y="-44" text-anchor="middle" font-size="4.35"
                letter-spacing=".16" fill="#A6A8A9">rpm x 1000</text>

          <!-- the inner bar: filled black to where the reference had
               it, grey the rest of the way, broken three times -->
          <path id="triBarK" fill="none" stroke="#000000" stroke-width="2.22"/>
          <path id="triBarG" fill="none" stroke="#969696" stroke-width="2.22"/>
          <!-- and the thin gold sweep outside it -->
          <path id="triGold" fill="none" stroke="#7E6E49" stroke-width="1.2"
                stroke-linecap="round"/>

          <!-- the needle: a broad wedge off the butt that collapses to
               a thin shaft about two-thirds along, with a hairline
               slit down it. No pivot shows — on the real pod it hangs
               clear of the bar, reading a shade under 1. -->
          <!-- the needle takes its colour from the group, so the sweep
               can recolour the blade without touching the hairline -->
          <g id="triNeedle" fill="#000000">
            <path d="M -28.25 21.66 L -36.08 28.79 L -39.01 33.18 L -47.90 41.24
                     L -48.83 43.20 L -46.77 42.52 L -37.68 34.68 L -32.97 32.31
                     L -24.94 25.40 Z"/>
            <path d="M -29.20 25.10 L -47.38 41.52" fill="none"
                  stroke="#FFFFFF" stroke-width=".45" stroke-linecap="round"/>
          </g>

          <!-- the low-fuel telltale, tucked beside the needle's butt -->
          <g id="dashFuel" transform="translate(-22.02, 19.12)">
            <rect x="0" y="0" width="3.4" height="6.15" rx=".45" fill="#000000"/>
            <rect x=".62" y=".85" width="2.1" height="1.7" rx=".22" fill="#FFFFFF"/>
            <path d="M 3.75 1.25 L 4.85 2.2 L 4.85 4.4 A .6 .6 0 0 0 5.9 4 L 5.9 2.55"
                  fill="none" stroke="#000000" stroke-width=".7"
                  stroke-linejoin="round" stroke-linecap="round"/>
          </g>

          <!-- The reference pod carries a signal-time-temperature row
               above the pill here, and a speed readout at the pill's
               right end. Both are dropped: this dash is standing in a
               mileage section, where a clock and a road speed are noise
               against the one figure the section exists to show. -->

          <!-- the pill: twin gold lines, capped on the left about the
               dial's own centre and open-ended on the right. The cap is
               a shade wider than it is tall in the photograph — 48px
               across against 49.25 high — so it is drawn as a half
               ellipse rather than forced round. -->
          <g transform="translate(0, .26)" fill="none" stroke="#7A6736">
            <path d="M 80 -16.82 L 0 -16.82 A 16.39 16.82 0 0 0 0 16.82 L 80 16.82"
                  stroke-width="2.3"/>
            <path d="M 80 -14.43 L 0 -14.43 A 14.17 14.43 0 0 0 0 14.43 L 80 14.43"
                  stroke-width="1.2"/>
          </g>

          <text x=".34" y="5.46" text-anchor="middle" font-size="15.2"
                font-weight="700" fill="#00812A">N</text>
          <text x="10.1" y="2.39" font-size="6.5" font-weight="600"
                letter-spacing="-.27" fill="#0D0F10">Side Stand</text>

          <!-- the odometer. The label is fixed and the reading is
               right-aligned against it, so a shorter number closes up
               from the left the way the real readout does. -->
          <text x="24.1" y="24.59" font-size="4.55" font-weight="600"
                fill="#000000">ODO</text>
          <!-- The digits on the real readout are narrower than this
               face's, so the reading is condensed to the width the
               reference gives a character — 2.62 units — rather than
               crushed together with negative tracking, which closes the
               gaps without narrowing the glyphs and reads as a mistake.

               NO THOUSANDS SEPARATOR. Odometers do not have one, and
               the reference bears that out: it reads 1475.5km. Running
               the figure through the page's number formatter added a
               comma, which is a whole extra character in a field with
               none to spare, and at four digits it pushed the reading
               back into the ODO label.

               The width is also capped, because dropping the comma
               only buys one character and this counts up forever. Past
               about six characters the reading condenses to fit rather
               than colliding — the label stays put and the field holds. -->
          <text x="59.6" y="24.59" text-anchor="end" fill="#000000"><tspan
            font-size="6.2" font-weight="700" lengthAdjust="spacingAndGlyphs"
            textLength="${Math.min((MILEAGE.odo + '.0').length * 2.62, 16.4).toFixed(2)}"
            >${MILEAGE.odo}.0</tspan><tspan
            dx=".35" font-size="6" font-weight="600">km</tspan></text>
         </g>

          <!-- ══ the boot screen ══
               A dark panel over the face with the model name on it, the
               way the real pod comes up when the ignition is turned on.
               It sits ABOVE the dial and fades away to reveal it, which
               is why the dial can be drawn in full underneath from the
               first frame and still not be seen.

               The artwork is a light grey wordmark on transparency, so
               it only reads against something dark — hence the panel
               rather than the white face. The image is mostly padding:
               its ink is 95% of the width but only 38% of the height,
               and centred, so a 96-unit box puts a 91-unit wordmark
               across the middle of a 140-unit face. -->
          <path id="triBootBg" d="M -33.8 61.3 A 70 70 0 1 1 33.8 61.3 Z"
                fill="#0B0C0E"/>
          <!-- the backlight. One flash of this is the screen waking:
               a panel lights before it has anything to draw. -->
          <path id="triBootFlash" d="M -33.8 61.3 A 70 70 0 1 1 33.8 61.3 Z"
                fill="#6E7A88" opacity="0"/>
          <image id="triBootLogo" href="${CLUSTER_INTRO}" opacity="0"
                 x="-48" y="-45.71" width="96" height="91.43"/>
        </g>
      </g>

      <!-- the filler opening, under the spout -->
      <ellipse id="neckHole" cx="${NECK.x}" cy="${NECK.y}" rx="10" ry="4"
               fill="#07060b" opacity="0"/>

      <!-- the stream and what it throws up -->
      <g id="pour" opacity="0">
        <path id="stream" stroke="url(#fuelGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path id="streamHi" stroke="#FFC071" stroke-width="1.8" fill="none"
              stroke-linecap="round" opacity=".7"/>
      </g>
      <g id="splash"></g>
      <path id="drip" fill="url(#dropShine)" d=""/>

      <path id="hoseOuter" fill="none" stroke="#39434F" stroke-width="8" stroke-linecap="round"/>

/* ── the Tripper's dial ──────────────────────────────────────────────
   The three arcs and the nine numerals, all off the same two figures
   the reference photograph gave up: the scale starts at 147.3° and
   steps 22.94° a number, so the breaks in the outer scale fall under
   the numbers rather than beside them. Angles are screen degrees —
   0 at three o'clock, growing clockwise. */
let setGauge = () => {}
let setRev = () => {}
/* where the needle sits with the engine off — a shade under 1, which is
   exactly where the reference photograph caught it */
const REV_REST = 0.616
{
  const A0 = 147.3, STEP = 22.94
  const pol = (r, t) => [r * Math.cos(t * Math.PI / 180),
                         r * Math.sin(t * Math.PI / 180)]
  const arc = (r, t0, t1) => {
    const [x0, y0] = pol(r, t0), [x1, y1] = pol(r, t1)
    return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 `
         + `${t1 - t0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} `
  }

  /* outer scale — 64.2 out, running 136° to 331°. The dash pattern is
     stated in degrees and converted, so the gaps stay under the
     numerals however the radius is tuned. */
  const TR = 64.2, GAP = 3.0, per = (Math.PI / 180) * TR
  const ticks = document.getElementById('triTicks')
  ticks.setAttribute('d', arc(TR, 136, 331))
  ticks.setAttribute('stroke-dasharray',
    `${((STEP - GAP) * per).toFixed(2)} ${(GAP * per).toFixed(2)}`)
  const DASH = (STEP - GAP) * per, GAPLEN = GAP * per
  const OFF = ((STEP - GAP) - (A0 - GAP / 2 - 136)) * per
  ticks.setAttribute('stroke-dashoffset', `${OFF.toFixed(2)}`)

  /* ── the rev sweep ──
     Needle and lit scale run off one number, the reading on the dial.
     The lit overlay carries the same dash pattern as the grey scale
     beneath it, so it blackens the existing ticks rather than drawing
     a second set over the top — which is why its dash offset is
     measured from where the scale starts at 136°, not from where the
     lit run starts.

     The scale is three overlays rather than one, because a single path
     cannot change colour part way along itself — so the bands are cut
     at 4 and 6 and each is given its own. Their dash offsets are all
     measured from 136° for the reason above: measured from each band's
     own start the patterns would drift apart and the ticks would
     double where the bands meet. */
  const REV_A = (v) => A0 + (v - 1) * STEP
  const LIT0 = REV_A(REV_REST)
  const needleG = document.getElementById('triNeedle')
  /* Each looked up by a LITERAL id, never through a variable. This file
     is the source the app copy is generated from, and that generator
     prefixes every id to keep it unique on a page with other sections —
     it can only rewrite lookups it can actually see. Hiding the name
     behind a variable leaves the markup renamed and the lookup not, so
     the ported scene finds nothing and takes the whole page down with
     it — which a build will not catch, because it fails at run time. */
  const BANDS = [
    { el: document.getElementById('triRevK'), from: LIT0, to: REV_A(4) },
    { el: document.getElementById('triRevO'), from: REV_A(4), to: REV_A(6) },
    { el: document.getElementById('triRevR'), from: REV_A(6), to: REV_A(9) },
  ]
  for (const b of BANDS) {
    b.el.setAttribute('stroke-dasharray', `${DASH.toFixed(2)} ${GAPLEN.toFixed(2)}`)
    b.el.setAttribute('stroke-dashoffset', `${(OFF + (b.from - 136) * per).toFixed(2)}`)
  }
  let revAt = -999, inkAt = '#000000'
  setRev = (v, exact) => {
    const a = REV_A(v)
    /* A quarter of a degree is a quarter of a pixel out here, so mid
       sweep it is not worth rebuilding three arcs for. The resting
       state is different: skipping the last update of a sweep left the
       needle parked a fraction off and a hairline of the first band
       still lit, so whoever settles the dial says so and is never
       skipped. */
    if (!exact && Math.abs(a - revAt) < 0.25) return
    revAt = a
    for (const b of BANDS) {
      b.el.setAttribute('d', a <= b.from ? '' : arc(TR, b.from, Math.min(a, b.to)))
    }
    needleG.setAttribute('transform', `rotate(${(a - LIT0).toFixed(2)})`)
    /* black to 4, amber to 6, red to the stop — the same three the
       scale above is banded into, so blade and ticks always agree */
    const ink = v >= 6 ? '#D91F11' : v >= 4 ? '#EF8A17' : '#000000'
    if (ink !== inkAt) { needleG.setAttribute('fill', (inkAt = ink)) }
  }
  /* at rest nothing is lit and the needle sits where it was drawn */
  setRev(REV_REST, true)

  /* ── the fuel gauge ──
     The segmented bar hugging the pill is the tank gauge, and the
     telltale sits at its empty end for the same reason the E sits at
     the bottom of any fuel gauge. It reads from 139° round to 312°:
     black for what is in the tank, grey for what is not. The reference
     photograph caught it a shade under half full, which is the only
     reason that image shows the changeover at 207°.

     Here it is not a fixed angle at all — it reads the same spring the
     cutaway tank reads, so the needle in the cluster and the fuel in
     the tank rise together and settle together. */
  const IR = 31.67, GAUGE_E = 139, GAUGE_F = 312
  const SEGS = [[139, 178], [182, 223.5], [227.5, 269], [273, 312]]
  const barK = document.getElementById('triBarK')
  const barG = document.getElementById('triBarG')
  let shownAt = -1
  setGauge = (k) => {
    const fill = GAUGE_E + Math.max(0, Math.min(1, k)) * (GAUGE_F - GAUGE_E)
    /* rebuilding four arcs for a gauge that has not visibly moved is
       wasted work every frame; a third of a degree here is a third of
       a pixel on screen */
    if (Math.abs(fill - shownAt) < 0.33) return
    shownAt = fill
    let dK = '', dG = ''
    for (const [a, b] of SEGS) {
      if (b <= fill) dK += arc(IR, a, b)
      else if (a >= fill) dG += arc(IR, a, b)
      else { dK += arc(IR, a, fill); dG += arc(IR, fill, b) }
    }
    barK.setAttribute('d', dK)
    barG.setAttribute('d', dG)
  }
  /* empty before anything has run, so the very first paint agrees with
     the empty tank underneath it */
  setGauge(0)

  /* the gold sweep outside it */
  document.getElementById('triGold').setAttribute('d', arc(34.06, 135, 312))

  /* 1 round to 9. The +2.83 drops the baseline half a cap-height so
     each numeral sits centred on its point rather than hanging off it. */
  let tk = ''
  for (let n = 1; n <= 9; n++) {
    const [x, y] = pol(56.7, A0 + (n - 1) * STEP)
    tk += `<text x="${x.toFixed(2)}" y="${(y + 2.83).toFixed(2)}">${n}</text>`
  }
  document.getElementById('triNums').innerHTML = tk
}

/* ── where a point of the nozzle ends up ─────────────────────────
   The nozzle is placed by its spout tip: rotate about the tip, scale,
   then move the tip where it belongs. This runs that same arithmetic
   for any other point on it — which is how the hose knows where the
   nozzle's inlet is without having to guess. */
function gunPoint(gx, gy, pose) {
  const r = pose.a * Math.PI / 180
  /* mirror first, then rotate — the same order the transform applies */
  const dx = (gx - TIPG.x) * pose.m, dy = gy - TIPG.y
  return {
    x: pose.x + (dx * Math.cos(r) - dy * Math.sin(r)) * GS,
    y: pose.y + (dx * Math.sin(r) + dy * Math.cos(r)) * GS,
  }
}
function setGun(pose) {
  gun.setAttribute('transform', poseTransform(pose))
}

/* ── the hose ────────────────────────────────────────────────────
   From the pump's outlet to the nozzle's inlet, sagging in between.
   Because both ends are computed rather than drawn, it stays attached
   at the pump and attached at the nozzle for every frame of the trip —
   which is the whole reason the nozzle no longer needs to appear out
   of nowhere. The sag grows with the distance, the way slack does. */
function drawHose(pose) {
  /* one gun, so one connection point: its own inlet, wherever it is */
  const inlet = gunPoint(126, 202, pose)
  const dist = Math.hypot(inlet.x - OUTLET.x, inlet.y - OUTLET.y)
  /* One smooth arch at every distance. The hose sags below the line
     between its two ends by an amount that grows with the slack, and
     the sag is clamped just above the floor — so filling, it still
     dips to the concrete and sweeps up to the nozzle, while docked it
     bows in one gentle J from the grip to the outlet. The previous
     floor-pinned control points folded the short docked hose into a
     hard right-angle at the bottom, and no hose bends like that. Both
     controls lean toward the sag point, so the curve leaves each end
     softly instead of cornering. */
  /* Which way the hose leaves the nozzle. Read off the nozzle's live
     pose rather than fixed, so it stays true through the whole carry;
     both arrangements use it for the far end, because arriving along
     the fitting is what stops the hose doubling back into it. */
  const back = gunPoint(84.3, 245.1, pose)   // 60 units down the spigot
  const bl = Math.hypot(back.x - inlet.x, back.y - inlet.y) || 1
  const ix = (back.x - inlet.x) / bl, iy = (back.y - inlet.y) / bl

  let c1x, c1y, c2x, c2y
  if (PORTRAIT) {
    /* Stacked, the outlet and the nozzle sit almost vertically above
       one another, and a sag point between two ends that are already
       in line barely bends the curve at all — the hose came out as a
       rod dropped from the cabinet.

       So build it from its two tangents instead of from a low point.
       It leaves the pump's flank pointing OUT of the cabinet, and it
       arrives along the nozzle's own hose spigot; those two directions
       disagree, and the disagreement is the S. Both are derived rather
       than fixed — the arrival direction is read off the nozzle's live
       pose — so the hose keeps its shape through the whole carry
       instead of only looking right parked at either end. */
    /* The nozzle-end handle is the longer of the two, and longer than
       the gap between the ends. Shorter, the curve turned off the
       spigot almost as soon as it left it and the bend at the nozzle
       came out pinched — an S on paper, a kink to look at. Holding the
       spigot's line for longer is what opens that half out. */
    const h1 = dist * 0.75, h2 = dist * 1.0
    c1x = OUTLET.x + h1          // straight out of the cabinet
    c1y = OUTLET.y + h1 * 0.1    // barely falling as it leaves
    c2x = inlet.x + ix * h2
    c2y = inlet.y + iy * h2
  } else {
    /* Beside the machine the hose has room to fall, and the low point
       just above the concrete is what gives it its sweep along the
       floor. That end was right and keeps its sag point.

       The far end was not. Leaning the second control toward the same
       low point dragged the curve underneath the nozzle, so it turned
       up INTO the fitting through a tight hook. It now leaves along
       the spigot like the stacked one does, which opens that bend out
       without touching the floor sweep. */
    const sag = 34 + dist * 0.3
    const sx = (OUTLET.x + inlet.x) / 2 + 20
    const sy = Math.min(GROUND - 6, Math.max(OUTLET.y, inlet.y) + sag)
    /* c1 leans nearly all the way onto the low point, because with the
       far control no longer pulling down there is nothing else left to
       hold the hose against the concrete. */
    c1x = OUTLET.x + (sx - OUTLET.x) * 0.7
    c1y = OUTLET.y + (sy - OUTLET.y) * 0.88
    const h2 = dist * 0.34
    c2x = inlet.x + ix * h2
    c2y = inlet.y + iy * h2
  }
  const d = `M ${OUTLET.x} ${OUTLET.y}`
          + ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)},`
          + ` ${c2x.toFixed(1)} ${c2y.toFixed(1)},`
          + ` ${inlet.x.toFixed(1)} ${inlet.y.toFixed(1)}`
  hoseO.setAttribute('d', d)
  hoseI.setAttribute('d', d)
}

/* ── the fuel surface ────────────────────────────────────────────── */
const X0 = 340, X1 = 500, STEPS = 34
function wavePath(t, amp, len, speed, phase, depth) {
  let d = `M ${X0} 0`
  for (let i = 0; i <= STEPS; i++) {
    const x = X0 + ((X1 - X0) * i) / STEPS
    d += ` L ${x.toFixed(1)} ${(Math.sin(x / len + t * speed + phase) * amp).toFixed(2)}`
  }
  return d + ` L ${X1} ${depth} L ${X0} ${depth} Z`
}

const level = new MM.Spring({ stiffness: 26, damping: 13, from: 0, to: 0 })
/* The cluster gauge gets its own, much softer spring rather than reading
   the tank's directly. A real fuel gauge is heavily damped — it drifts
   up and settles a beat after the tank actually fills, and reading the
   tank one-for-one made it snap across in the time the fuel took to
   rise. Same targets, same moments; only the pace differs. */
const gaugeLevel = new MM.Spring({ stiffness: 12, damping: 10, from: 0, to: 0 })
let t = 0, raf = 0, running = false, onScreen = false, pouring = false
let pose = { x: POSE.dock.x, y: POSE.dock.y, a: POSE.dock.a, m: POSE.dock.m }

const surfaceAt = (k) => FUEL.bottom - (FUEL.bottom - FUEL.top) * FULL * k
const surfaceY = () => by(surfaceAt(level.x))

function draw() {
  const k = level.x
  const sy = surfaceAt(k)
  const churn = pouring ? 2.6 : 0
  const a1 = 1.4 + churn
  const a2 = 0.85 + churn * 0.6

  fuelG.setAttribute('transform', `translate(0, ${sy.toFixed(2)})`)
  wave1.setAttribute('d', wavePath(t, a1, 13, 1.5, 0, 120))
  wave2.setAttribute('d', wavePath(t, a2, 8.5, -2.3, 1.7, 120))
  spill.setAttribute('cy', sy.toFixed(1))
  spill.setAttribute('opacity', (k * 0.85).toFixed(3))
  marks.setAttribute('opacity', (Math.min(1, k * 2) * 0.9).toFixed(3))

  /* the cluster, on its own slower reading of the same tank: the gauge
     bar drifts up behind the fuel, and the low-fuel lamp blinks until
     the gauge itself says full — the two are one instrument, so they
     answer to the same number */
  const gk = gaugeLevel.x
  setGauge(gk)
  dashFuel.setAttribute('opacity',
    gk >= 0.98 ? '1' : (0.3 + 0.7 * Math.abs(Math.sin(t * 3))).toFixed(2))

  setGun(pose)
  drawHose(pose)

  if (pouring) {
    const wob = Math.sin(t * 9) * 1.3
    const end = Math.max(pose.y + 5, surfaceY())
    stream.setAttribute('d',
      `M ${pose.x.toFixed(1)} ${(pose.y + 3).toFixed(1)} Q ${(pose.x + wob).toFixed(1)} ${((pose.y + end) / 2).toFixed(1)} ${(pose.x + wob * 0.4).toFixed(1)} ${end.toFixed(1)}`)
    streamHi.setAttribute('d',
      `M ${(pose.x - 1.1).toFixed(1)} ${(pose.y + 5).toFixed(1)} Q ${(pose.x + wob - 1.1).toFixed(1)} ${((pose.y + end) / 2).toFixed(1)} ${(pose.x + wob * 0.4 - 0.8).toFixed(1)} ${(end - 2).toFixed(1)}`)
  }

  const bob = Math.sin(t * 1.5) * a1 * 0.5
  const fy = by(sy) + bob * BS
  floatEl.style.left = ((NECK.x / VB.w) * 100).toFixed(3) + '%'
  floatEl.style.top = ((fy / VB.h) * 100).toFixed(3) + '%'
  tether.style.height = Math.max(0, (fy - by(FUEL.top)) * 0.22) + 'px'
}

function frame() {
  t += 0.016
  draw()
  if (!onScreen) { running = false; raf = 0; return }
  raf = requestAnimationFrame(frame)
}
function start() { if (running || MM.REDUCED) return; running = true; raf = requestAnimationFrame(frame) }
function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0 }

/* Paint the resting scene NOW — nozzle docked, hose hung, tank shut —
   rather than leaving everything unplaced until the section scrolls
   into view and the observer gets round to running the shot. */
setCarry(0)
draw()

/* ── carrying the nozzle ─────────────────────────────────────────
   u = 0 on the hook, u = 1 in the filler. The tip follows the arc; the
   angle turns over the same span but on its own curve, so the nozzle
   rotates upright as it travels rather than snapping at either end. */
/* The mirror lerp that used to live here is gone with cause: it served
   a docking approach that no longer exists (the hanging look is its own
   drawing now, both poses are m: 1), and its FLIP_SPAN constant —
   declared below a hoisted function that ran at load — was a temporal
   dead zone that killed the whole script the moment the page opened. */
/* The carry, in the three moves a person actually makes. The old
   version lerped the angle across the whole trip, so the gun pinwheeled
   clockwise through the air — direction change by somersault. Here the
   direction changes the way it really does: a turn about the gun's own
   vertical axis, left to right, with the posture held.

     A  off the hook   the hang levels out into carrying posture,
                       still facing the machine — the only in-plane
                       rotation, and it happens AT the machine
     B  the turn       facing machine → facing tank, scaleX through
                       zero: seen edge-on for an instant, as a thing
                       genuinely turning around is
     C  the approach   carried nose-first, tipping onto the filler

   One piecewise function of u, continuous at the seams, so the return
   trip plays the same three moves backwards for free. */
function smoothK(k) { return k * k * (3 - 2 * k) }
function setCarry(u) {
  const e = u < 0 ? 0 : u > 1 ? 1 : u
  const p = carry(e)
  pose.x = p.x
  pose.y = p.y

  /* The turn owns HALF the trip (20%..70%) — at the slower carry that
     is ~700ms of visible turning, a hand's pace rather than a blink. */
  const CARRY_A = 24
  if (e < 0.2) {
    /* A — off the hook: all the reorientation, done AT the machine */
    const k = smoothK(e / 0.2)
    pose.a = POSE.dock.a + (CARRY_A - POSE.dock.a) * k
    pose.m = POSE.dock.m
  } else if (e < 0.7) {
    /* B — the glide: posture held. The mirror lerp reads the poses
       rather than hardcoding sides, so if the two ever face different
       ways again this becomes the left-to-right turn; with both facing
       the tank it holds still. */
    const k = smoothK((e - 0.2) / 0.5)
    pose.a = CARRY_A
    pose.m = POSE.dock.m + (POSE.fill.m - POSE.dock.m) * k
  } else {
    /* C — facing the tank, easing the nose onto the filler */
    const k = smoothK((e - 0.7) / 0.3)
    pose.a = CARRY_A + (POSE.fill.a - CARRY_A) * k
    pose.m = 1
  }
}
/* Returns a cancel function, and that is the point. The old version
   could not be stopped: replaying mid-carry left the previous run's
   tween alive, silently dragging the nozzle back to the tank AFTER the
   new sequence had docked it — and nothing ever brought it home again.
   A motion that cannot be cancelled is a motion that will eventually
   fight its successor. */
function tween(from, to, ms, ease, onUpdate, done) {
  let alive = true
  const t0 = performance.now()
  const step = (now) => {
    if (!alive) return
    /* Clamped at BOTH ends. A frame timestamp that lands before the
       tween's own start — the clocks are not guaranteed to agree — used
       to give a negative k, and easeOut of -0.85 is -5.4, not 0: the
       pump counted down to minus seven thousand rupees. */
    const k = Math.max(0, Math.min(1, (now - t0) / ms))
    /* Interpolated between from and to — the whole job of a tween, and
       the line this function shipped without. It passed raw ease(k)
       through, so every tween ran 0 to 1 whatever it was asked: the
       outbound trips worked by coincidence, and the carry HOME teleported
       the nozzle to the dock, animated it back out to the tank, and let
       the completion snap yank it home — the exact three-step stutter
       reported. The earlier "stuck at the tank" bug was this same line. */
    onUpdate(from + (to - from) * ease(k))
    if (k < 1) requestAnimationFrame(step)
    else if (done) done()
  }
  requestAnimationFrame(step)
  return () => { alive = false }
}
let carryTween = null
let pumpTween = null
let revTween = null
let slipTween = null

/* ── the cluster's cold start ─────────────────────────────────────────
   Three layers cross over: the dark panel, the name on it, and the dial
   underneath. Their fades are plain tweens like everything else here,
   collected so a replay can kill them mid-crossfade and put the screen
   back to black rather than leaving it half lit. */
const dialG     = document.getElementById('triDial')
const bootBg    = document.getElementById('triBootBg')
const bootFlash = document.getElementById('triBootFlash')
const bootLogo  = document.getElementById('triBootLogo')
const bootFades = []
const op = (el, v) => el.setAttribute('opacity', String(v))
function fade(el, from, to, ms, ease) {
  bootFades.push(tween(from, to, ms, ease || easeOut, (v) => op(el, v.toFixed(3))))
}

/* ── a breath ──────────────────────────────────────────────────────
   One slow swell and settle: nothing at either end, `peak` in the
   middle, and no corner anywhere because the shape is half a sine
   rather than a fade run forwards and then backwards. A blink was
   what this used to be, and at ninety milliseconds it read as a
   glitch rather than a screen waking up. */
function breathe(el, peak, ms) {
  bootFades.push(tween(0, 1, ms, (k) => k,
    (k) => op(el, (peak * Math.sin(k * Math.PI)).toFixed(3))))
}

/* screen dark, nothing up yet */
function bootDark() {
  bootFades.forEach((kill) => kill())
  bootFades.length = 0
  op(dialG, 0); op(bootBg, 1); op(bootFlash, 0); op(bootLogo, 0)
}
/* booted: panel gone, dial up */
function bootDone() {
  bootFades.forEach((kill) => kill())
  bootFades.length = 0
  op(dialG, 1); op(bootBg, 0); op(bootFlash, 0); op(bootLogo, 0)
}
/* Every run gets an id, and every delayed callback checks it. A timer
   that outlives its own run — the cap re-opening, a drip falling from
   a nozzle that has already been docked — is acting out a scene that
   was cancelled. */
let shotId = 0
let capTimer = 0
const dripTimers = []
const easeOut = (k) => 1 - Math.pow(1 - k, 3)
const easeInOut = (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)

/* ── the dispenser's own counters ────────────────────────────────── */
function setPump(k) {
  dLit.textContent = (MILEAGE_BIKE.tank * k).toFixed(2)
  dAmt.textContent = Math.round(MILEAGE.tankCost * k).toLocaleString('en-IN')
}

function splashOnce() {
  const n = 2 + (Math.random() * 2 | 0)
  for (let i = 0; i < n; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
    c.setAttribute('cx', pose.x.toFixed(1))
    c.setAttribute('cy', surfaceY().toFixed(1))
    c.setAttribute('r', (0.7 + Math.random() * 1.2).toFixed(2))
    c.setAttribute('fill', '#FFA347')
    splash.appendChild(c)
    const dx = (Math.random() - 0.5) * 26
    const dy = -6 - Math.random() * 13
    c.animate([
      { transform: 'translate(0,0)', opacity: .95 },
      { transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`, opacity: .8, offset: .45 },
      { transform: `translate(${(dx * 1.5).toFixed(1)}px, 8px)`, opacity: 0 },
    ], { duration: 400 + Math.random() * 200, easing: 'cubic-bezier(.3,.7,.6,1)' })
      .finished.then(() => c.remove()).catch(() => {})
  }
}
let splashTimer = 0

function dripOnce(delay) {
  const id = shotId
  dripTimers.push(setTimeout(() => {
    if (id !== shotId) return
    const sx = pose.x, sy0 = pose.y + 3
    const t0 = performance.now()
    const step = (now) => {
      if (id !== shotId) { dripEl.setAttribute('d', ''); return }
      const el = (now - t0) / 1000
      const y = sy0 + 0.5 * 620 * el * el
      const r = 2.6, stretch = 1 + Math.min(.8, el * 1.6)
      dripEl.setAttribute('d',
        `M ${sx} ${(y - r * stretch * 1.7).toFixed(1)}`
        + ` C ${sx + r * .7} ${(y - r * .6).toFixed(1)}, ${sx + r} ${(y - r * .5).toFixed(1)}, ${sx + r} ${y.toFixed(1)}`
        + ` A ${r} ${(r * stretch).toFixed(1)} 0 1 1 ${sx - r} ${y.toFixed(1)}`
        + ` C ${sx - r} ${(y - r * .5).toFixed(1)}, ${sx - r * .7} ${(y - r * .6).toFixed(1)}, ${sx} ${(y - r * stretch * 1.7).toFixed(1)} Z`)
      if (y < surfaceY()) requestAnimationFrame(step)
      else { dripEl.setAttribute('d', ''); splashOnce() }
    }
    requestAnimationFrame(step)
  }, delay))
}

function countUp(ms) {
  const t0 = performance.now()
  const step = (now) => {
    const k = Math.max(0, Math.min(1, (now - t0) / ms))
    big.textContent = (MILEAGE.kmpl * (1 - Math.pow(1 - k, 4))).toFixed(1)
    if (k < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}

function say(text, lit) {
  caption.textContent = text
  caption.classList.toggle('on', !!lit)
}

/* ── the shot ────────────────────────────────────────────────────── */
let cancel = null

function reset() {
  shotId++
  if (cancel) cancel()
  /* kill any motion still in flight from the previous run — the
     sequence timers alone are not enough, the tweens run on their own */
  if (carryTween) { carryTween(); carryTween = null }
  if (pumpTween) { pumpTween(); pumpTween = null }
  if (revTween) { revTween(); revTween = null }
  if (slipTween) { slipTween(); slipTween = null }
  setSlip(SLIP_IN)
  bootDark()
  clearTimeout(capTimer)
  dripTimers.forEach(clearTimeout)
  dripTimers.length = 0
  clearInterval(splashTimer)
  pouring = false
  level.snap(0)
  gaugeLevel.snap(0)
  setCarry(0)
  setPump(0)
  setRev(REV_REST, true)
  big.textContent = '0.0'
  rig.classList.remove('lit')
  floatEl.classList.remove('up')
  floatEl.getAnimations().forEach((a) => a.cancel())
  pour.setAttribute('opacity', '0')
  dripEl.setAttribute('d', '')
  splash.innerHTML = ''
  pumpLamp.setAttribute('fill', '#8f2a26')
  trigger.getAnimations().forEach((a) => a.cancel())
  trigger.style.transform = ''
  ;[neckHole, neckLip].forEach((el) => {
    el.getAnimations().forEach((a) => a.cancel())
    el.setAttribute('opacity', '0')
  })
  cutEdge.style.transition = 'none'
  cutEdge.style.strokeDashoffset = '1'
  void cutEdge.getBoundingClientRect()
  draw()
}

function play() {
  reset()

  if (MM.REDUCED) {
    cutEdge.style.strokeDashoffset = '0'
    bootDone()
    level.snap(1); gaugeLevel.snap(1); setPump(1); setCarry(0); setSlip(0)
    big.textContent = MILEAGE.kmpl.toFixed(1)
    rig.classList.add('lit')
    floatEl.classList.add('up')
    say('Full tank · ' + MILEAGE.kmpl + ' km/l', true)
    draw()
    return
  }

  start()

  cancel = MM.sequence([
    /* ── ignition ──────────────────────────────────────────────────
       Two and a half seconds, and every part of it breathes: the
       backlight swells and settles, the name rises on the same easing
       either side of its hold, and the dial comes up as the name
       goes. The holds below total 700 + 1180 + 620 — exactly 2500 —
       so the nozzle lifts off the machine as the boot ends. */

    /* the screen wakes: one breath of the backlight */
    [0, () => { breathe(bootFlash, 0.5, 700) }],
    700,

    /* the name rises and holds long enough to be read */
    [0, () => { fade(bootLogo, 0, 1, 620, easeInOut) }],
    1180,

    /* the name goes and the dial rises behind it */
    [0, () => {
      fade(bootLogo, 1, 0, 480, easeInOut)
      fade(bootBg, 1, 0, 480, easeInOut)
      fade(dialG, 0, 1, 520, easeInOut)
    }],
    620,

    /* The screen is up, and the screen is all the refuelling was
       waiting on. The needle sweeps from here on its own time — an
       instrument checking itself while the work gets underway, not a
       step in the work. Note there is no hold after this beat: the
       tank opens on the very same tick. */
    [0, () => {
      revTween = tween(REV_REST, 9, 880, easeOut, setRev, () => {
        revTween = tween(9, REV_REST, 760, easeInOut, setRev, () => {
          setRev(REV_REST, true)
          revTween = null
        })
      })
    }],

    /* 1 — the tank is opened */
    [0, () => {
      say('Tank empty')
      cutEdge.style.transition = 'stroke-dashoffset 850ms cubic-bezier(.22,1,.36,1)'
      cutEdge.style.strokeDashoffset = '0'
      rig.classList.add('lit')
    }],
    950,

    /* 2 — the nozzle is lifted off the hook and carried over */
    [0, () => {
      say('Nozzle off the hook')
      carryTween = tween(0, 1, 1500, easeInOut, setCarry)
      /* the cap comes off as it arrives, not before */
      capTimer = setTimeout(() => {
        neckHole.animate([{ opacity: 0 }, { opacity: 1 }],
          { duration: 300, easing: MM.EASE.out, fill: 'forwards' })
        neckLip.animate([{ opacity: 0 }, { opacity: .85 }],
          { duration: 300, easing: MM.EASE.out, fill: 'forwards' })
      }, 1000)
    }],
    1600,

    /* 3 — trigger, and it runs */
    [0, () => {
      say('Filling', true)
      trigger.animate([{ transform: 'none' }, { transform: 'rotate(9deg)' }],
        { duration: 180, easing: MM.EASE.out, fill: 'forwards' })
      pumpLamp.setAttribute('fill', '#4ade80')
      pour.setAttribute('opacity', '1')
      pouring = true
      level.to(1)
      gaugeLevel.to(1)
      pumpTween = tween(0, 1, 2800, easeOut, setPump)
      splashTimer = setInterval(splashOnce, 90)
    }],
    2900,

    /* 4 — off, and the last of it drips */
    [0, () => {
      say('Full')
      trigger.animate([{ transform: 'rotate(9deg)' }, { transform: 'none' }],
        { duration: 240, easing: MM.EASE.overshoot, fill: 'forwards' })
      pumpLamp.setAttribute('fill', '#8f2a26')
      pour.setAttribute('opacity', '0')
      clearInterval(splashTimer)
      pouring = false
      setPump(1)
      /* the delivery is over, so the machine prints. Easing out means
         the paper leaves quickly and finishes slowly, which is what a
         feed roller sounds like it is doing. */
      slipTween = tween(SLIP_IN, 0, 950, easeOut, setSlip)
      dripOnce(160); dripOnce(500)
    }],
    950,

    /* 5 — and it goes back on the hook, the way it came */
    [0, () => {
      say('Back on the hook')
      ;[neckHole, neckLip].forEach((el) => el.animate(
        [{ opacity: el === neckLip ? .85 : 1 }, { opacity: 0 }],
        { duration: 500, easing: MM.EASE.out, delay: 300, fill: 'forwards' }))
      /* the carry home ends by snapping to the dock EXACTLY — the tween
         should land there anyway, but the resting state of the scene is
         not something to leave to whatever a motion got round to */
      carryTween = tween(1, 0, 1500, easeInOut, setCarry, () => setCarry(0))
    }],
    1600,

    /* 6 — only now the figure. Docked first, unconditionally: whatever
       happened to the carry, the shot ends with the nozzle on the
       machine, because that is the fact the scene rests on. */
    [0, () => {
      setCarry(0)
      say('Measured over the tank that follows', true)
      floatEl.classList.add('up')
      floatEl.animate(
        [{ transform: 'translate(-50%, -40%) scale(.86)', opacity: 0 },
         { transform: 'translate(-50%, -108%) scale(1.04)', opacity: 1, offset: .7 },
         { transform: 'translate(-50%, -100%) scale(1)', opacity: 1 }],
        { duration: 820, easing: MM.EASE.out, fill: 'both' },
      )
      countUp(950)
    }],
  ])
}

/* The section used to carry a "Fill it again" button; with it gone, the
   scene itself is the way to watch the shot a second time. */
rig.style.cursor = 'pointer'
rig.addEventListener('click', play)

/* The shot runs every time the section is scrolled to, not once a page
   load — but only after it has properly gone away and come back.

   That is what `armed` is for. Without it the observer would restart
   the pour on every crossing of the trigger line, so a scroll that
   loiters at the section's edge, or a flick that overshoots and
   settles back, would keep cutting the animation off and starting it
   again. Arriving re-plays; only leaving the viewport ENTIRELY re-arms
   it, which is a line the reader has to actually cross. */
let armed = true
new IntersectionObserver((es) => {
  es.forEach((e) => {
    onScreen = e.isIntersecting
    if (!onScreen) { stop(); armed = true; return }
    start()
    if (e.intersectionRatio >= 0.25 && armed) { armed = false; play() }
  })
}, { threshold: [0, 0.25] }).observe(rig)
}
</script>
</body>
</html>
