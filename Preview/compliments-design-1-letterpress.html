<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Compliments — Letterpress</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════════════
   LETTERPRESS — the inclusions list as a printed gig poster.

   The only light design in the set, and that is the point of it: a compliments
   list is the one part of a ride page that comes off a piece of paper in the
   real world, so this one looks like the paper. Cream stock, black ink, the
   ride's colour as the single spot ink a small press run could afford.

   Three things do the work:
     GRAIN      an SVG turbulence layer over everything, so flat CSS colour
                reads as fibre rather than screen.
     DEBOSS     every rule and letter carries a 1px light shadow below it,
                which is what pressed type actually looks like.
     INK BLEED  rows arrive blurred and out of register, then settle sharp —
                the press catching up with itself.
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f2ece0; --paper2:#e6dece; --ink:#17140f; --ink2:#4a4438;
  --rule:rgba(23,20,15,0.22); --spot:#eab308;
}
body{
  background:#0a0910; font-family:'Inter',system-ui,sans-serif;
  min-height:100vh; display:grid; place-items:center; padding:clamp(14px,3vw,34px);
}
.sheet{
  position:relative; width:100%; max-width:780px; overflow:hidden;
  background:linear-gradient(168deg,var(--paper),var(--paper2));
  padding:clamp(26px,5vw,46px);
  box-shadow:0 34px 70px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.5);
  /* the sheet itself lifts in, once */
  animation:sheet-in .9s cubic-bezier(.16,1,.3,1) both;
}
@keyframes sheet-in{from{opacity:0;transform:translateY(26px) scale(.985)}}

/* ── the two overlays that make it paper ─────────────────────────────────── */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;z-index:4}
/* a spotlight that follows the pointer, as if the sheet were held under a lamp */
.lamp{position:absolute;inset:0;pointer-events:none;z-index:3;transition:background .3s;
  background:radial-gradient(38% 46% at var(--mx,50%) var(--my,26%),
    rgba(255,255,255,.55), rgba(255,255,255,0) 68%)}

.inner{position:relative;z-index:5;border:2px solid var(--ink);padding:clamp(20px,4vw,34px)}
/* the second hairline is what stops the border reading as a CSS box */
.inner::after{content:'';position:absolute;inset:5px;border:1px solid var(--rule);pointer-events:none}

.eyebrow{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:16px}
.eyebrow i{flex:1;height:2px;background:var(--ink);max-width:90px}
.eyebrow span{font-size:.6rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink);white-space:nowrap}

h1{font-family:'Bebas Neue',sans-serif;text-align:center;color:var(--ink);
  font-size:clamp(2.4rem,9vw,4.6rem);line-height:.84;letter-spacing:.01em;
  text-shadow:0 1px 0 rgba(255,255,255,.65);
  animation:press .8s cubic-bezier(.16,1,.3,1) .1s both}
@keyframes press{from{opacity:0;letter-spacing:.16em;filter:blur(5px)}}
h1 em{font-style:normal;display:block;color:var(--spot);
  -webkit-text-stroke:1px rgba(23,20,15,.35)}

.dateline{text-align:center;margin:12px 0 26px;font-size:.64rem;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.dateline b{color:var(--ink)}

/* ── the list: a tracklist, not cards ────────────────────────────────────── */
ol{list-style:none;counter-reset:perk}
li{counter-increment:perk;display:flex;align-items:baseline;gap:14px;
  padding:13px 4px;border-top:1px solid var(--rule);
  /* out of register, then settling — see INK BLEED above */
  animation:bleed .7s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(.34s + var(--i) * .085s)}
li:last-child{border-bottom:1px solid var(--rule)}
@keyframes bleed{from{opacity:0;transform:translateX(-10px);filter:blur(4px)}}
li .no{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;color:var(--spot);
  min-width:2ch;line-height:1;
  /* the counter, so the numbering can never drift from the list */
  }
li .no::before{content:counter(perk,decimal-leading-zero)}
li .mark{font-size:1rem;line-height:1;filter:grayscale(.25)}
li .txt{flex:1;font-size:clamp(.82rem,2vw,.95rem);font-weight:500;color:var(--ink);
  line-height:1.5;text-shadow:0 1px 0 rgba(255,255,255,.5)}
/* a hairline that draws itself across the row on hover — press furniture */
li{position:relative}
li:hover .txt{color:#000}
li .rule{position:absolute;left:4px;right:4px;bottom:0;height:2px;background:var(--spot);
  transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.16,1,.3,1)}
li:hover .rule{transform:scaleX(1)}

.foot{margin-top:26px;padding-top:16px;border-top:2px solid var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.foot b{color:var(--ink);letter-spacing:.08em;font-size:.72rem}
.price{background:var(--ink);color:var(--paper);padding:5px 11px;letter-spacing:.14em}

@media(max-width:520px){
  .eyebrow i{max-width:34px}
  li{gap:10px}
}
@media(prefers-reduced-motion:reduce){
  .sheet,h1,li{animation:none}
  .lamp{display:none}
}
</style>
</head>
<body>
<div class="sheet">
  <div class="lamp" id="lamp"></div>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" /></filter>
    <rect width="100%" height="100%" filter="url(#g)" opacity="0.34" />
  </svg>
  <div class="inner" id="inner"></div>
</div>

<script src="compliments-data.js"></script>
<script>
const r = window.COMPLIMENTS.current()
document.documentElement.style.setProperty('--spot', r.color)

const rows = r.compliments.map((c, i) => `
  <li style="--i:${i}">
    <span class="no"></span>
    ${c.icon ? `<span class="mark">${c.icon}</span>` : ''}
    <span class="txt">${c.text}</span>
    <span class="rule"></span>
  </li>`).join('')

document.getElementById('inner').innerHTML = `
  <div class="eyebrow"><i></i><span>Compliments</span><i></i></div>
  <h1>What the ride<em>comes with</em></h1>
  <div class="dateline"><b>${r.name}</b> · ${r.date}</div>
  <ol>${rows}</ol>
  <div class="foot">
    <span>${r.organizer !== 'Self' ? `Included with <b>${r.organizer}</b>` : 'Self organised'}</span>
    ${r.registration ? `<span class="price">Entry ${r.registration}</span>` : ''}
  </div>`

/* the lamp follows the pointer; on a touch screen it simply never moves */
const lamp = document.getElementById('lamp')
addEventListener('pointermove', e => {
  lamp.style.setProperty('--mx', (e.clientX / innerWidth * 100) + '%')
  lamp.style.setProperty('--my', (e.clientY / innerHeight * 100) + '%')
}, { passive: true })
</script>
</body>
</html>
