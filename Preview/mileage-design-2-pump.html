<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mileage · 2 · Pump Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════
   PUMP TERMINAL — the section as the dispenser at the pump. Three
   seven-segment displays, built segment by segment rather than typed
   in a font, roll up from zero the way the real ones do: amount
   fastest, volume behind it, rate fixed because the rate does not
   move while you fill.

   One tank goes in. The hose carries fuel, the nozzle clicks off,
   and the receipt prints itself out of the slot with the figure on
   it. The mileage is the thing you are handed at the end.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828; --steel:#221f31;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --honey:#e0bb3c;
  --led:#ff8a3d;            /* the orange of a dispenser display */
  --led-dim:rgba(255,138,61,0.09);
  --paper:#e8e3d6;
  --sans:'Inter',sans-serif; --serif:'Playfair Display',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--honey);color:#161018}
.page{width:90%;max-width:1180px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:26px clamp(14px,3vw,30px) 32px;overflow:hidden;
  opacity:0;transform:translateY(32px);animation:rise .8s var(--ease) .1s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.sec::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 0%,rgba(255,138,61,0.07),transparent 70%)}

.head{position:relative;z-index:2;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.kick{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--led);display:block;margin-bottom:7px}
.head h2{font-family:var(--serif);font-size:clamp(1.35rem,3.6vw,2rem);font-weight:700;color:var(--off);line-height:1.1}
.head .note{font-size:0.76rem;color:var(--d2);line-height:1.65;max-width:440px;margin-top:8px}

.rig{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,282px);
  gap:clamp(16px,3vw,26px);align-items:start}

/* ══ the dispenser ══ */
.pump{position:relative;background:linear-gradient(180deg,var(--steel),#16141f);
  border:1px solid var(--bd2);border-radius:18px;padding:clamp(14px,2.6vw,22px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 50px -30px #000}
.plate{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.plate b{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--off)}
.plate s{text-decoration:none;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--d3);margin-left:auto}
.plate .grade{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.16em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;border:1px solid rgba(255,138,61,.3);color:var(--led);
  background:rgba(255,138,61,.08)}

/* the display well */
.screen{position:relative;background:#0a0810;border:1px solid #000;border-radius:12px;
  padding:clamp(12px,2.4vw,18px);box-shadow:inset 0 4px 22px rgba(0,0,0,.95);
  display:flex;flex-direction:column;gap:clamp(9px,1.8vw,14px)}
/* the plastic in front of the LEDs */
.screen::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.05),transparent 40%),
             repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px)}

.row{display:flex;align-items:center;gap:10px}
.row .lab{font-family:var(--mono);font-size:0.47rem;letter-spacing:0.2em;text-transform:uppercase;
  color:rgba(255,138,61,.45);writing-mode:vertical-rl;transform:rotate(180deg);
  align-self:stretch;display:flex;align-items:center;flex:none}
.row .unit{font-family:var(--mono);font-size:0.52rem;letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(255,138,61,.5);align-self:flex-end;padding-bottom:4px;flex:none}
.digits{display:flex;gap:clamp(3px,.7vw,6px);margin-left:auto}

/* ── one seven-segment digit ──
   Seven bars, each lit or unlit. The unlit ones stay faintly visible,
   which is what makes an LED display read as hardware rather than type. */
.dg{position:relative;flex:none;transform:skewX(-6deg);--t:calc(100% / 9)}
.dg.s1{width:clamp(17px,3.3vw,27px);height:clamp(31px,6vw,49px)}
.dg.s2{width:clamp(13px,2.5vw,20px);height:clamp(23px,4.4vw,36px)}
.dg i{position:absolute;display:block;border-radius:1px;background:var(--led-dim);
  transition:background .09s linear,box-shadow .09s linear}
.dg i.on{background:var(--led);box-shadow:0 0 7px 0 rgba(255,138,61,.75)}
.dg i.a{left:var(--t);right:var(--t);top:0;height:var(--t)}
.dg i.g{left:var(--t);right:var(--t);top:calc(50% - var(--t) / 2);height:var(--t)}
.dg i.d{left:var(--t);right:var(--t);bottom:0;height:var(--t)}
.dg i.f{left:0;top:var(--t);height:calc(50% - var(--t) * 1.5);width:var(--t)}
.dg i.b{right:0;top:var(--t);height:calc(50% - var(--t) * 1.5);width:var(--t)}
.dg i.e{left:0;bottom:var(--t);height:calc(50% - var(--t) * 1.5);width:var(--t)}
.dg i.c{right:0;bottom:var(--t);height:calc(50% - var(--t) * 1.5);width:var(--t)}
.dot{align-self:flex-end;width:clamp(5px,1vw,8px);height:clamp(5px,1vw,8px);border-radius:50%;
  background:var(--led);box-shadow:0 0 7px rgba(255,138,61,.7);margin:0 1px clamp(3px,.6vw,5px)}
.dot.s2{width:clamp(4px,.8vw,6px);height:clamp(4px,.8vw,6px)}

/* the flow bar under the displays — fuel actually moving */
.flow{position:relative;height:7px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden}
.flow i{position:absolute;inset:0;display:block;border-radius:99px;transform-origin:0 50%;
  transform:scaleX(0);background:linear-gradient(90deg,rgba(255,138,61,.35),var(--led));
  transition:transform .12s linear}
.flow i::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.3) 0 6px,transparent 6px 14px);
  animation:crawl .5s linear infinite;opacity:0;transition:opacity .3s}
.pump.run .flow i::after{opacity:1}
@keyframes crawl{to{background-position:20px 0}}

/* ── nozzle and hose ── */
.hose{position:relative;height:78px;margin-top:14px}
.hose svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hose .pipe{fill:none;stroke:#2e2a40;stroke-width:9;stroke-linecap:round}
.hose .juice{fill:none;stroke:var(--led);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:9 15;opacity:0;filter:drop-shadow(0 0 5px rgba(255,138,61,.8))}
.pump.run .hose .juice{opacity:.95;animation:pour .5s linear infinite}
@keyframes pour{to{stroke-dashoffset:-24}}
.nozzle{position:absolute;right:2%;top:6px;width:60px;height:34px;
  transform-origin:80% 60%;transform:rotate(9deg);transition:transform .55s var(--ease)}
.pump.run .nozzle{transform:rotate(-4deg)}
.nozzle b{position:absolute;left:0;top:9px;width:46px;height:15px;border-radius:4px 3px 3px 6px;
  background:linear-gradient(180deg,#4a4360,#2a2539);border:1px solid var(--bd2);display:block}
.nozzle u{position:absolute;left:-16px;top:12px;width:20px;height:8px;border-radius:3px;
  background:linear-gradient(180deg,#5b5375,#332e46);display:block}
.nozzle em{position:absolute;right:2px;top:0;width:15px;height:20px;border-radius:4px;
  background:var(--led);opacity:.25;display:block;transition:opacity .3s}
.pump.run .nozzle em{opacity:.9;box-shadow:0 0 12px rgba(255,138,61,.7)}
/* the drip that lands once the nozzle clicks off */
.drip{position:absolute;right:calc(2% + 46px);top:26px;width:5px;height:5px;border-radius:50%;
  background:var(--led);opacity:0}
.pump.done .drip{animation:fall .9s ease-in forwards}
@keyframes fall{0%{opacity:.9;transform:translateY(0) scale(.7)}
                70%{opacity:.9;transform:translateY(30px) scale(1)}
                100%{opacity:0;transform:translateY(38px) scale(.3)}}

/* the trigger */
.lever{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.lever button{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;
  padding:11px 20px;border-radius:10px;cursor:pointer;color:#160f08;font-weight:700;
  border:0;background:linear-gradient(180deg,#ffb066,var(--led));
  box-shadow:0 5px 0 #a8471a,0 12px 22px -10px rgba(255,138,61,.7);
  transition:.18s var(--ease)}
.lever button:hover{filter:brightness(1.07)}
.lever button:active{transform:translateY(4px);box-shadow:0 1px 0 #a8471a}
.lever button:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
.lever .status{font-family:var(--mono);font-size:0.53rem;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--d3);display:flex;align-items:center;gap:7px}
.lever .status i{width:7px;height:7px;border-radius:50%;background:var(--d3);transition:.3s}
.pump.run .lever .status i{background:var(--led);box-shadow:0 0 9px var(--led);animation:blip .7s infinite}
@keyframes blip{50%{opacity:.25}}

/* ══ the receipt roll ══ */
.slot{position:relative;background:var(--card2);border:1px solid var(--bd);border-radius:14px;
  padding:14px 14px 0;overflow:hidden;display:flex;flex-direction:column}
.slot > s{text-decoration:none;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--d3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.slot > s::after{content:'';flex:1;height:1px;background:var(--bd)}
/* the mouth the paper comes out of */
.mouth{height:6px;border-radius:3px;background:#000;box-shadow:inset 0 1px 3px rgba(0,0,0,.9);
  margin-bottom:-3px;position:relative;z-index:3}

.paper{position:relative;background:var(--paper);color:#221c14;border-radius:2px 2px 8px 8px;
  padding:16px 15px 22px;font-family:var(--mono);font-size:0.63rem;line-height:1.8;
  box-shadow:0 16px 30px -18px rgba(0,0,0,.9);
  /* printing: the sheet unrolls downward out of the mouth */
  clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--ease)}
.paper.out{clip-path:inset(0 0 0 0)}
/* the torn bottom edge */
.paper::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:8px;background:var(--paper);
  -webkit-mask:radial-gradient(6px 8px at 6px -2px,transparent 98%,#000) repeat-x;
          mask:radial-gradient(6px 8px at 6px -2px,transparent 98%,#000) repeat-x;
  -webkit-mask-size:12px 8px;mask-size:12px 8px}
.paper h4{font-size:0.68rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center;
  font-weight:700;margin-bottom:2px}
.paper .sub{text-align:center;font-size:0.53rem;letter-spacing:0.1em;color:#6a5f4d;margin-bottom:10px}
.paper hr{border:0;border-top:1px dashed rgba(34,28,20,.35);margin:8px 0}
.paper .l{display:flex;justify-content:space-between;gap:10px}
.paper .l span:last-child{font-weight:700}
.paper .big{display:flex;justify-content:space-between;font-size:0.86rem;font-weight:700;margin:4px 0}
.paper .stamp{margin-top:11px;text-align:center;font-size:0.5rem;letter-spacing:0.18em;
  text-transform:uppercase;color:#6a5f4d}
/* the figure the whole receipt exists to hand over */
.paper .kmpl{margin-top:11px;text-align:center;border:1.5px solid #221c14;border-radius:6px;
  padding:9px 6px;transform:rotate(-1.4deg)}
.paper .kmpl b{display:block;font-size:1.35rem;letter-spacing:-.02em;line-height:1.1}
.paper .kmpl u{text-decoration:none;font-size:0.48rem;letter-spacing:0.2em;text-transform:uppercase;color:#6a5f4d}
.paper .note{margin-top:10px;font-size:0.56rem;line-height:1.6;color:#4a4034;font-style:italic}

/* ══ what the tank buys — the derived figures, under the pump ══ */
.facts{position:relative;z-index:2;margin-top:20px;display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:760px){ .facts{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:440px){ .facts{grid-template-columns:1fr} }
/* --d is the entrance stagger, scoped to the two properties the
   entrance uses — on the whole shorthand it would delay hovers too */
.fact{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:13px 15px;
  opacity:0;transform:translateY(12px);
  transition:opacity .55s ease var(--d,0s),transform .55s var(--ease) var(--d,0s),
             border-color .3s,box-shadow .35s var(--ease)}
.fact.in{opacity:1;transform:none}
.fact:hover{border-color:rgba(255,138,61,.35);box-shadow:0 14px 28px -20px rgba(255,138,61,.6)}
.fact s{display:block;text-decoration:none;font-family:var(--mono);font-size:0.45rem;
  letter-spacing:0.18em;text-transform:uppercase;color:var(--d3);margin-bottom:6px}
.fact b{display:block;font-family:var(--mono);font-size:1.06rem;font-weight:700;color:var(--off);
  line-height:1;font-variant-numeric:tabular-nums}
.fact b u{text-decoration:none;font-size:0.56rem;color:var(--d2);margin-left:3px;font-weight:400}
.fact em{display:block;font-style:normal;font-size:0.55rem;color:var(--d3);margin-top:6px;line-height:1.5}
.fact.up b{color:#4ade80}
.fact.dn b{color:#fb7185}

/* ══ empty ══ */
.none{position:relative;z-index:2;border:1px dashed var(--bd2);border-radius:14px;
  padding:38px 26px;text-align:center;color:var(--d2);font-size:0.8rem;line-height:1.75;max-width:470px;margin:0 auto}
.none b{display:block;font-family:var(--mono);font-size:0.56rem;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--led);margin-bottom:12px}
.none .zeros{display:flex;gap:5px;justify-content:center;margin-bottom:18px}

@media(max-width:860px){ .rig{grid-template-columns:1fr} }
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .sec{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="stub">section above</div>

  <section class="sec" aria-labelledby="mh">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="mh"></h2>
        <p class="note" id="note"></p>
      </div>
    </div>
    <div id="body"></div>
  </section>

  <div class="stub">section below</div>
</div>

<script src="mileage-data.js"></script>
<script>
document.getElementById('kick').textContent = MILEAGE_COPY.kicker
document.getElementById('mh').textContent   = MILEAGE_COPY.title
document.getElementById('note').textContent = MILEAGE_COPY.note

const body = document.getElementById('body')

/* ── segment map ──────────────────────────────────────────────────
   Which of the seven bars are lit for each character. A space is a
   digit with nothing on, which is how a dispenser shows a leading gap. */
const SEG = {
  '0':'abcdef', '1':'bc', '2':'abged', '3':'abgcd', '4':'fgbc',
  '5':'afgcd', '6':'afgedc', '7':'abc', '8':'abcdefg', '9':'abcdfg', ' ':'',
}
const BARS = ['a','b','c','d','e','f','g']

function digit(size) {
  return `<div class="dg ${size}">${BARS.map(b => `<i class="${b}" data-s="${b}"></i>`).join('')}</div>`
}
/* n digits, with a decimal point before the last `dp` of them */
function display(n, dp, size) {
  let out = ''
  for (let i = 0; i < n; i++) {
    out += digit(size)
    if (dp && i === n - dp - 1) out += `<span class="dot ${size}"></span>`
  }
  return out
}
function show(el, value, n, dp) {
  const s = value.toFixed(dp).replace('.', '').padStart(n, ' ').slice(-n)
  el.querySelectorAll('.dg').forEach((d, i) => {
    const on = SEG[s[i]] || ''
    d.querySelectorAll('i').forEach((bar) => bar.classList.toggle('on', on.includes(bar.dataset.s)))
  })
}
/* every segment on — the lamp test a dispenser runs before it starts */
function allOn(el, state) {
  el.querySelectorAll('.dg i').forEach(bar => bar.classList.toggle('on', state))
}

if (MILEAGE_EMPTY) {
  body.innerHTML = `<div class="none">
      <div class="zeros" id="z0"></div>
      <b>Nozzle on the hook</b>
      ${MILEAGE_COPY.empty}
    </div>`
  const z = document.getElementById('z0')
  z.innerHTML = display(4, 2, 's2')
  show(z, 0, 4, 2)
} else {

/* one full tank, at the rate the reading was taken at */
const LITRES = MILEAGE_BIKE.tank
const AMOUNT = +(LITRES * MILEAGE.rate).toFixed(2)

/* Wide enough for the figure it has to carry. A full tank runs past a
   thousand rupees, and a display one digit short silently drops the
   leading one — ₹1413.84 would read as 413.84. */
const AMT_DIGITS = String(Math.floor(AMOUNT)).length + 2

body.innerHTML = `
  <div class="rig">
    <div class="pump" id="pump">
      <div class="plate">
        <b>${MILEAGE_BIKE.name}</b>
        <span class="grade">${MILEAGE_BIKE.grade}</span>
        <s>Brim to brim · ${MILEAGE.date}</s>
      </div>

      <div class="screen">
        <div class="row">
          <span class="lab">Amount</span>
          <span class="unit">${MILEAGE_BIKE.currency}</span>
          <div class="digits" id="dAmt">${display(AMT_DIGITS, 2, 's1')}</div>
        </div>
        <div class="row">
          <span class="lab">Volume</span>
          <span class="unit">litre</span>
          <div class="digits" id="dLit">${display(4, 2, 's2')}</div>
        </div>
        <div class="row">
          <span class="lab">Rate</span>
          <span class="unit">${MILEAGE_BIKE.currency}/L</span>
          <div class="digits" id="dRate">${display(5, 2, 's2')}</div>
        </div>
        <div class="flow"><i id="flow"></i></div>
      </div>

      <div class="hose">
        <svg viewBox="0 0 400 78" preserveAspectRatio="none" aria-hidden="true">
          <path class="pipe"  d="M 14 6 C 14 62 96 74 200 68 C 292 63 330 46 360 24"/>
          <path class="juice" d="M 14 6 C 14 62 96 74 200 68 C 292 63 330 46 360 24"/>
        </svg>
        <div class="nozzle" aria-hidden="true"><u></u><b></b><em></em></div>
        <div class="drip" aria-hidden="true"></div>
      </div>

      <div class="lever">
        <button id="go">Fill the tank</button>
        <span class="status"><i></i><span id="stat">ready</span></span>
      </div>
    </div>

    <div class="slot">
      <s>Receipt</s>
      <div class="mouth"></div>
      <div class="paper" id="paper"></div>
    </div>
  </div>

  <div class="facts" id="facts"></div>
`

document.getElementById('facts').innerHTML = MILEAGE_FACTS.map((f, i) => `
  <div class="fact ${f.tone || ''}" style="--d:${(MILEAGE_REDUCED ? 0 : i * 70)}ms">
    <s>${f.label}</s>
    <b>${f.value}${f.unit ? `<u>${f.unit}</u>` : ''}</b>
    <em>${f.sub}</em>
  </div>`).join('')

const pump  = document.getElementById('pump')
const dAmt  = document.getElementById('dAmt')
const dLit  = document.getElementById('dLit')
const dRate = document.getElementById('dRate')
const flow  = document.getElementById('flow')
const paper = document.getElementById('paper')
const stat  = document.getElementById('stat')
const facts = document.getElementById('facts')

function print() {
  paper.innerHTML = `
    <h4>Fuel Receipt</h4>
    <div class="sub">${MILEAGE_BIKE.name} · ${MILEAGE.date}</div>
    <hr>
    <div class="l"><span>Product</span><span>${MILEAGE_BIKE.fuel}</span></div>
    <div class="l"><span>Rate / L</span><span>${MILEAGE_BIKE.currency}${MILEAGE.rate.toFixed(2)}</span></div>
    <div class="l"><span>Volume</span><span>${LITRES.toFixed(2)} L</span></div>
    <div class="big"><span>Total</span><span>${MILEAGE_BIKE.currency}${AMOUNT.toFixed(2)}</span></div>
    <hr>
    <div class="l"><span>Odometer</span><span>${fmtKm(MILEAGE.odo)} km</span></div>
    <div class="l"><span>Range on it</span><span>${fmtKm(MILEAGE.range)} km</span></div>
    <div class="l"><span>Cost / km</span><span>${MILEAGE_BIKE.currency}${MILEAGE.costPerKm.toFixed(2)}</span></div>
    <div class="kmpl">
      <b>${MILEAGE.kmpl.toFixed(1)}</b>
      <u>km per litre</u>
    </div>
    <p class="note">${MILEAGE.method}</p>
    <div class="stamp">Claimed ${MILEAGE_BIKE.claimed} · measured ${MILEAGE.kmpl}</div>`
  requestAnimationFrame(() => paper.classList.add('out'))
}

/* the delivered state, handed over at once — reduced motion gets this
   instead of sitting through a two-second pour */
function settle() {
  show(dRate, MILEAGE.rate, 5, 2)
  show(dAmt, AMOUNT, AMT_DIGITS, 2)
  show(dLit, LITRES, 4, 2)
  flow.style.transform = 'scaleX(1)'
  stat.textContent = 'nozzle off'
  print()
  facts.querySelectorAll('.fact').forEach(f => f.classList.add('in'))
}

/* ── the delivery ────────────────────────────────────────────────
   Amount and volume climb together over one window, so the two
   displays stay in the ratio a real dispenser holds them in. */
const RUN = 2300
let raf = 0, timers = []

function fill() {
  if (MILEAGE_REDUCED) { settle(); return }
  cancelAnimationFrame(raf)
  timers.forEach(clearTimeout); timers = []
  pump.classList.remove('done', 'run')
  paper.classList.remove('out')
  facts.querySelectorAll('.fact').forEach(f => f.classList.remove('in'))

  /* the lamp test first — every segment on, then blank, then go */
  stat.textContent = 'lamp test'
  ;[dAmt, dLit, dRate].forEach(d => allOn(d, true))

  timers.push(setTimeout(() => {
    ;[dAmt, dLit, dRate].forEach(d => allOn(d, false))
    show(dRate, MILEAGE.rate, 5, 2)
    show(dAmt, 0, AMT_DIGITS, 2)
    show(dLit, 0, 4, 2)
  }, 620))

  timers.push(setTimeout(() => {
    pump.classList.add('run')
    stat.textContent = 'delivering'
    const t0 = performance.now()
    const step = (t) => {
      const k = Math.min(1, (t - t0) / RUN)
      /* eases in off the trigger and slows as the tank fills, the way
         a hand on a nozzle actually behaves */
      const e = k < .1 ? (k / .1) * .05 : .05 + (1 - Math.pow(1 - (k - .1) / .9, 2.4)) * .95
      show(dAmt, AMOUNT * e, AMT_DIGITS, 2)
      show(dLit, LITRES * e, 4, 2)
      flow.style.transform = `scaleX(${(0.12 + 0.88 * Math.sin(k * Math.PI)).toFixed(3)})`
      if (k < 1) { raf = requestAnimationFrame(step); return }

      show(dAmt, AMOUNT, AMT_DIGITS, 2)
      show(dLit, LITRES, 4, 2)
      flow.style.transform = 'scaleX(1)'
      pump.classList.remove('run')
      pump.classList.add('done')
      stat.textContent = 'nozzle off'
      print()
      facts.querySelectorAll('.fact').forEach(f => f.classList.add('in'))
    }
    raf = requestAnimationFrame(step)
  }, 860))
}

document.getElementById('go').addEventListener('click', fill)

/* fill when the section arrives, not while it is still below the fold */
new IntersectionObserver((es, ob) => {
  es.forEach((e) => {
    if (!e.isIntersecting) return
    ob.unobserve(e.target)
    setTimeout(fill, 300)
  })
}, { threshold: 0.3 }).observe(pump)
}
</script>
</body>
