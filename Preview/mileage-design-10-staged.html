<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mileage · 10 · Staged</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════════
   STAGED — the reveal directed as a shot rather than played as a
   transition.

   The thesis is the pauses. Amateur motion never stops moving: every
   element is always on its way somewhere, so nothing has emphasis and
   the eye has nowhere to rest. This one holds — twice, hard, for long
   enough to feel deliberate — and every move is preceded by a wind-up
   in the opposite direction, because a move with no anticipation reads
   as a cut rather than as a movement.

   The beat sheet under it is the real timing, drawn to scale, holds
   marked. Run it at a quarter speed and every decision is inspectable.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828; --well:#0d0b15;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --honey:#e0bb3c;
  --good:#4ade80; --bad:#fb7185;
  --sans:'Inter',sans-serif; --serif:'Playfair Display',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--honey);color:#161018}
.page{width:90%;max-width:1180px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:26px clamp(14px,3vw,30px) 30px;overflow:hidden}
.sec::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 0%,rgba(224,187,60,0.08),transparent 70%)}

.head{position:relative;z-index:2;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.kick{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--honey);display:block;margin-bottom:7px}
.head h2{font-family:var(--serif);font-size:clamp(1.35rem,3.6vw,2rem);font-weight:700;color:var(--off);line-height:1.1}
.head .note{font-size:0.76rem;color:var(--d2);line-height:1.65;max-width:440px;margin-top:8px}

/* ══ the stage ══ */
.stage{position:relative;z-index:2;min-height:clamp(230px,34vw,300px);
  display:grid;place-items:center;padding:clamp(10px,2vw,18px) 0}

/* the frame — one element that is the whole first act. It begins as a
   dot, draws out to a rule, squeezes, then opens into the panel. */
.frame{position:relative;width:0;height:2px;border-radius:2px;
  background:var(--honey);box-shadow:0 0 18px 1px rgba(224,187,60,.55);
  overflow:hidden;will-change:width,height}
.frame.open{background:var(--well);border:1px solid rgba(224,187,60,.2);
  box-shadow:inset 0 -40px 80px -60px #000,0 30px 60px -40px #000}

/* the contents, held back until the frame has finished opening */
.inner{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(8px,1.6vw,14px);
  padding:clamp(14px,3vw,26px);opacity:0}
.frame.open .inner{opacity:1}

.label{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.28em;text-transform:uppercase;
  color:var(--honey);opacity:0;will-change:transform,opacity}

/* each character is its own element so it can be struck on its own beat */
.digits{display:flex;align-items:flex-end;gap:0}
.digits span{display:block;font-family:var(--mono);font-weight:700;color:var(--off);
  font-size:clamp(3rem,11vw,5.4rem);line-height:.88;letter-spacing:-.045em;
  transform-origin:50% 100%;opacity:0;will-change:transform,opacity}
.digits span.dot{width:.34em;text-align:center}
.unit{font-family:var(--mono);font-size:clamp(.65rem,1.7vw,.92rem);letter-spacing:0.22em;
  text-transform:uppercase;color:var(--honey);opacity:0;will-change:transform,opacity}
.sayline{font-size:0.71rem;line-height:1.7;color:var(--d2);text-align:center;max-width:340px;
  opacity:0;will-change:transform,opacity}

/* ── the figures, cascading in under the frame ── */
.facts{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;margin-top:clamp(14px,2.6vw,20px)}
@media(max-width:760px){ .facts{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:440px){ .facts{grid-template-columns:1fr} }
.fact{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:13px 15px;
  opacity:0;will-change:transform,opacity;
  transition:border-color .3s,box-shadow .35s var(--ease)}
.fact:hover{border-color:rgba(224,187,60,.35);box-shadow:0 14px 28px -20px rgba(224,187,60,.6)}
.fact s{display:block;text-decoration:none;font-family:var(--mono);font-size:0.45rem;
  letter-spacing:0.18em;text-transform:uppercase;color:var(--d3);margin-bottom:6px}
.fact b{display:block;font-family:var(--mono);font-size:1.04rem;font-weight:700;color:var(--off);
  line-height:1;font-variant-numeric:tabular-nums}
.fact b u{text-decoration:none;font-size:0.56rem;color:var(--d2);margin-left:3px;font-weight:400}
.fact em{display:block;font-style:normal;font-size:0.55rem;color:var(--d3);margin-top:6px;line-height:1.5}
.fact.up b{color:var(--good)}
.fact.dn b{color:var(--bad)}

/* ══ the beat sheet ══ */
.sheet{position:relative;z-index:2;margin-top:clamp(18px,3.4vw,26px);
  padding-top:14px;border-top:1px solid var(--bd)}
.sheetbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.sheetbar .lab{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--d3)}
.sheetbar .total{font-family:var(--mono);font-size:0.48rem;color:var(--d3);letter-spacing:.1em}
.rates{display:flex;gap:1px;background:var(--bd);border-radius:8px;overflow:hidden;margin-left:auto}
.rates button{padding:6px 11px;border:0;background:var(--card2);color:var(--d2);cursor:pointer;
  font-family:var(--mono);font-size:0.52rem;letter-spacing:.1em;transition:.2s}
.rates button:hover{color:var(--off)}
.rates button.on{background:var(--honey);color:#161018;font-weight:700}
.rates button:focus-visible{outline:2px solid var(--acc2);outline-offset:-2px}
.replay{padding:6px 14px;border:1px solid var(--bd2);background:transparent;color:var(--d2);
  border-radius:99px;cursor:pointer;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.16em;
  text-transform:uppercase;transition:.25s var(--ease)}
.replay:hover{color:var(--honey);border-color:rgba(224,187,60,.45);background:rgba(224,187,60,.06)}
.replay:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* the track, drawn to scale */
.track{position:relative;display:flex;height:34px;border-radius:8px;overflow:hidden;
  background:rgba(255,255,255,.03);border:1px solid var(--bd)}
.beat{position:relative;display:flex;align-items:center;justify-content:center;
  border-right:1px solid rgba(0,0,0,.5);min-width:0;overflow:hidden}
.beat:last-child{border-right:0}
.beat b{font-family:var(--mono);font-size:0.44rem;letter-spacing:0.1em;text-transform:uppercase;
  white-space:nowrap;padding:0 5px;color:var(--d2);font-weight:600}
.beat.move{background:rgba(224,187,60,.16)}
.beat.move b{color:var(--honey)}
/* a hold is drawn as a hold: hatched, empty, and as wide as it really is */
.beat.hold{background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 4px,transparent 4px 9px)}
.beat.hold b{color:var(--d3)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--off);left:0;
  box-shadow:0 0 10px 1px rgba(240,238,246,.5);opacity:0;pointer-events:none}
.playhead.run{opacity:1}
.legend{display:flex;gap:14px;margin-top:8px;font-family:var(--mono);font-size:0.44rem;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--d3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:9px;border-radius:2px;display:block}
.legend i.m{background:rgba(224,187,60,.4)}
.legend i.h{background:repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px);
  border:1px solid var(--bd)}

/* ══ empty ══ */
.none{position:relative;z-index:2;border:1px dashed var(--bd2);border-radius:14px;
  padding:38px 26px;text-align:center;color:var(--d2);font-size:0.8rem;line-height:1.75;max-width:470px;margin:0 auto}
.none b{display:block;font-family:var(--mono);font-size:0.56rem;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--honey);margin-bottom:12px}
.none .rule{width:70px;height:2px;margin:0 auto 20px;background:rgba(224,187,60,.4);border-radius:2px;
  animation:breathe 3.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes breathe{0%,100%{width:36px;opacity:.4}50%{width:96px;opacity:.85}}

@media(prefers-reduced-motion:reduce){
  .none .rule{animation:none;width:70px}
}
</style>
</head>
<body>
<div class="page">
  <div class="stub">section above</div>

  <section class="sec" aria-labelledby="mh">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="mh"></h2>
        <p class="note" id="note"></p>
      </div>
    </div>
    <div id="body"></div>
  </section>

  <div class="stub">section below</div>
</div>

<script src="mileage-data.js"></script>
<script src="mileage-motion.js"></script>
<script>
document.getElementById('kick').textContent = MILEAGE_COPY.kicker
document.getElementById('mh').textContent   = MILEAGE_COPY.title
document.getElementById('note').textContent = MILEAGE_COPY.note

const body = document.getElementById('body')

if (MILEAGE_EMPTY) {
  body.innerHTML = `<div class="none">
      <div class="rule"></div>
      <b>Nothing to stage</b>
      ${MILEAGE_COPY.empty}
    </div>`
} else {

const CHARS = MILEAGE.kmpl.toFixed(1).split('')

body.innerHTML = `
  <div class="stage">
    <div class="frame" id="frame">
      <div class="inner">
        <span class="label" id="label">${MILEAGE_BIKE.name}</span>
        <div class="digits" id="digits">
          ${CHARS.map((c) => `<span class="${c === '.' ? 'dot' : ''}">${c}</span>`).join('')}
        </div>
        <span class="unit" id="unit">kilometres per litre</span>
        <p class="sayline" id="sayline">${MILEAGE.method}</p>
      </div>
    </div>
  </div>

  <div class="facts" id="facts"></div>

  <div class="sheet">
    <div class="sheetbar">
      <span class="lab">Beat sheet</span>
      <span class="total" id="total"></span>
      <button class="replay" id="replay">Replay</button>
      <div class="rates" role="group" aria-label="Playback rate">
        <button data-r="1" class="on">1×</button>
        <button data-r="0.5">½×</button>
        <button data-r="0.25">¼×</button>
      </div>
    </div>
    <div class="track" id="track"><div class="playhead" id="playhead"></div></div>
    <div class="legend">
      <span><i class="m"></i> movement</span>
      <span><i class="h"></i> hold — nothing moves</span>
    </div>
  </div>
`

document.getElementById('facts').innerHTML = MILEAGE_FACTS.map((f) => `
  <div class="fact ${f.tone || ''}">
    <s>${f.label}</s>
    <b>${f.value}${f.unit ? `<u>${f.unit}</u>` : ''}</b>
    <em>${f.sub}</em>
  </div>`).join('')

const frame   = document.getElementById('frame')
const label   = document.getElementById('label')
const unit    = document.getElementById('unit')
const sayline = document.getElementById('sayline')
const digits  = [...document.querySelectorAll('.digits span')]
const facts   = [...document.querySelectorAll('.fact')]
const track   = document.getElementById('track')
const playhead = document.getElementById('playhead')

/* how big the frame opens to — measured, so it fits whatever the
   section is actually given */
function targetBox() {
  const stage = document.querySelector('.stage')
  return {
    w: Math.min(stage.clientWidth, 620),
    h: Math.max(200, Math.min(stage.clientHeight - 20, 268)),
  }
}

/* ── the beat sheet ──────────────────────────────────────────────
   The single source of truth for the timing. The sequencer reads it,
   and so does the drawing underneath — so the picture cannot drift
   out of step with what actually happens, which is the usual fate of
   a timing diagram maintained by hand. */
const BEATS = [
  { id: 'draw',   ms: 380, kind: 'move', name: 'rule draws' },
  { id: 'hold1',  ms: 300, kind: 'hold', name: 'hold' },
  { id: 'squeeze',ms: 130, kind: 'move', name: 'wind-up' },
  { id: 'open',   ms: 340, kind: 'move', name: 'frame opens' },
  { id: 'hold2',  ms: 240, kind: 'hold', name: 'hold' },
  { id: 'strike', ms: 420, kind: 'move', name: 'digits strike' },
  { id: 'hold3',  ms: 180, kind: 'hold', name: 'hold' },
  { id: 'tail',   ms: 300, kind: 'move', name: 'unit + line' },
  { id: 'cascade',ms: 480, kind: 'move', name: 'figures cascade' },
]
const TOTAL = BEATS.reduce((s, b) => s + b.ms, 0)
document.getElementById('total').textContent = TOTAL + ' ms · ' +
  BEATS.filter(b => b.kind === 'hold').reduce((s, b) => s + b.ms, 0) + ' ms of it held'

track.insertAdjacentHTML('afterbegin', BEATS.map((b) => `
  <div class="beat ${b.kind}" style="flex:${b.ms} 0 0"><b>${b.name}</b></div>`).join(''))

/* ── the shot ────────────────────────────────────────────────────── */
let rate = 1
let cancel = null
let headAnim = null

function reset() {
  if (cancel) cancel()
  if (headAnim) headAnim.cancel()
  frame.getAnimations().forEach(a => a.cancel())
  digits.concat(facts, [label, unit, sayline]).forEach((el) => {
    el.getAnimations().forEach(a => a.cancel())
    el.style.opacity = '0'
    el.style.transform = ''
  })
  frame.classList.remove('open')
  frame.style.width = '0px'
  frame.style.height = '2px'
  frame.style.borderRadius = '2px'
  playhead.classList.remove('run')
  playhead.style.left = '0'
}

function play() {
  reset()
  const box = targetBox()

  /* the playhead runs the real duration at the real rate, so what it
     shows is the shot and not a picture of the shot */
  playhead.classList.add('run')
  headAnim = playhead.animate(
    [{ left: '0%' }, { left: '100%' }],
    { duration: TOTAL / rate, easing: 'linear', fill: 'forwards' },
  )

  const D = (id) => BEATS.find(b => b.id === id).ms / rate

  cancel = MM.sequence([
    /* 1 — a dot draws out into a rule. Fast out of the gate, easing to
       a stop, so the line arrives rather than halting. */
    [0, () => {
      frame.animate(
        [{ width: '0px' }, { width: box.w * 0.52 + 'px' }],
        { duration: D('draw'), easing: MM.EASE.out, fill: 'forwards' },
      )
    }],
    BEATS[0].ms,

    /* 2 — HOLD. Nothing at all. This is the beat that makes the next
       move read as a decision rather than as momentum. */
    BEATS[1].ms,

    /* 3 — the wind-up: it pulls IN before it opens out. */
    [0, () => {
      frame.animate(
        [{ width: box.w * 0.52 + 'px' }, { width: box.w * 0.36 + 'px' }],
        { duration: D('squeeze'), easing: MM.EASE.inOut, fill: 'forwards' },
      )
    }],
    BEATS[2].ms,

    /* 4 — and releases into the frame. Width and height on different
       curves: the height overshoots slightly and settles, the width
       does not, so the box unfolds instead of inflating. */
    [0, () => {
      frame.classList.add('open')
      frame.animate(
        [{ width: box.w * 0.36 + 'px' }, { width: box.w + 'px' }],
        { duration: D('open'), easing: MM.EASE.out, fill: 'forwards' },
      )
      /* Height and corner together: a 2px rule has 2px corners, and a
         panel has 16px ones. Left to the class change the radius pops
         at the first frame, which is the one giveaway that the rule and
         the frame were never really the same object. */
      frame.animate(
        [{ height: '2px', borderRadius: '2px' },
         { height: box.h + 'px', borderRadius: '16px' }],
        { duration: D('open') * 1.12, easing: MM.EASE.overshoot, fill: 'forwards' },
      )
      label.animate(
        [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
        { duration: D('open'), easing: MM.EASE.out, delay: D('open') * 0.5, fill: 'forwards' },
      )
    }],
    BEATS[3].ms,

    /* 5 — HOLD again, and longer than feels comfortable to write. */
    BEATS[4].ms,

    /* 6 — the digits are struck, one per beat, each squashed flat on
       arrival and recovering. Volume preserving: wide when short. */
    [0, () => {
      const stag = MM.stagger(digits.length, { each: D('strike') / (digits.length + 1) })
      digits.forEach((el, i) => {
        el.animate([
          { opacity: 0, transform: 'translateY(-26px) scale(.82, 1.34)' },
          { opacity: 1, transform: 'translateY(3px) scale(1.16, .8)', offset: .55 },
          { opacity: 1, transform: 'translateY(0) scale(.97, 1.03)', offset: .8 },
          { opacity: 1, transform: 'none' },
        ], { duration: 380 / rate, easing: MM.EASE.out, delay: stag[i], fill: 'forwards' })
      })
    }],
    BEATS[5].ms,

    /* 7 — HOLD. The number is allowed to be looked at. */
    BEATS[6].ms,

    /* 8 — the tail: unit and sentence, quietly, from behind the number */
    [0, () => {
      unit.animate(
        [{ opacity: 0, transform: 'translateY(-10px) scale(.9)' }, { opacity: 1, transform: 'none' }],
        { duration: D('tail'), easing: MM.EASE.out, fill: 'forwards' },
      )
      sayline.animate(
        [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
        { duration: D('tail'), easing: MM.EASE.out, delay: D('tail') * 0.35, fill: 'forwards' },
      )
    }],
    BEATS[7].ms,

    /* 9 — and the figures cascade, overlapping, from the middle out, so
       the group arrives as one wave rather than six separate arrivals */
    [0, () => {
      const stag = MM.stagger(facts.length, { each: 52 / rate, from: 'center' })
      facts.forEach((el, i) => {
        el.animate([
          { opacity: 0, transform: 'translateY(20px) scale(.97)' },
          { opacity: 1, transform: 'none' },
        ], { duration: 460 / rate, easing: MM.EASE.out, delay: stag[i], fill: 'forwards' })
      })
    }],
  ], { rate })
}

/* the end state, with no shot at all */
function settle() {
  reset()
  const box = targetBox()
  frame.classList.add('open')
  frame.style.width = box.w + 'px'
  frame.style.height = box.h + 'px'
  frame.style.borderRadius = '16px'
  digits.concat(facts, [label, unit, sayline]).forEach((el) => { el.style.opacity = '1' })
}

document.getElementById('replay').addEventListener('click', () => {
  if (MM.REDUCED) { settle(); return }
  play()
})
document.querySelector('.rates').addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b) return
  rate = Number(b.dataset.r)
  document.querySelectorAll('.rates button').forEach(x => x.classList.toggle('on', x === b))
  if (!MM.REDUCED) play()
})

/* the frame is sized from a measurement, so a resize has to re-take it */
let rt = 0
window.addEventListener('resize', () => {
  clearTimeout(rt)
  rt = setTimeout(() => {
    if (frame.classList.contains('open')) {
      const box = targetBox()
      frame.style.width = box.w + 'px'
      frame.style.height = box.h + 'px'
    }
  }, 160)
})

new IntersectionObserver((es, ob) => {
  es.forEach((e) => {
    if (!e.isIntersecting) return
    ob.unobserve(e.target)
    if (MM.REDUCED) settle()
    else play()
  })
}, { threshold: 0.35 }).observe(document.querySelector('.stage'))
}
</script>
</body>
</html>
