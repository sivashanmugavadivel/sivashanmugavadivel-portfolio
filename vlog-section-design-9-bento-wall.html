<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vlogs · 9 · Bento Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════
   BENTO WALL — a mosaic where exactly one tile is open at a time.
   Pick another and the whole wall re-packs around it: every tile
   measures where it was, the grid re-flows, and each one is then
   animated from its old box to its new one, so nothing jumps. The
   sixth tile is the one that opens the full list.
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.13);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --sans:'Inter',sans-serif; --serif:'Playfair Display',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --cell:clamp(112px,15vw,168px);
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--acc);color:#fff}
.page{width:90%;max-width:1180px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:26px clamp(16px,3vw,28px) 28px;overflow:hidden;
  opacity:0;transform:translateY(32px);animation:rise .8s var(--ease) .1s forwards}
@keyframes rise{to{opacity:1;transform:none}}

.head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.kick{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--acc2);display:block;margin-bottom:7px}
.head h2{font-family:var(--serif);font-size:clamp(1.3rem,3.4vw,1.85rem);font-weight:700;color:var(--off);line-height:1.1}
.head .note{font-size:0.75rem;color:var(--d2);line-height:1.6;max-width:400px;margin-top:8px}
.head .all{margin-left:auto;font-size:0.7rem;color:var(--acc2);text-decoration:none;padding:7px 15px;
  border-radius:999px;border:1px solid rgba(167,139,250,0.28);transition:.3s var(--ease);white-space:nowrap}
.head .all:hover{background:var(--acc);color:#fff;border-color:var(--acc);transform:translateY(-2px)}

/* ══ the wall ══
   Three columns of fixed-height cells. The open tile takes a 2 × 2 block and
   the other five fill the remaining cells exactly, so the wall is always a
   solid rectangle whichever tile is open. */
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:var(--cell);gap:10px;grid-auto-flow:dense}

.t{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--bd2);
  cursor:pointer;padding:0;text-align:left;font:inherit;color:inherit;
  transition:border-color .35s,box-shadow .4s var(--ease);
  animation:pop .6s var(--ease) backwards;animation-delay:calc(var(--k) * .06s)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.t.open{grid-column:span 2;grid-row:span 2;border-color:rgba(167,139,250,.4);
  box-shadow:0 30px 56px -28px #000,0 0 0 1px rgba(167,139,250,.28)}
.t:not(.open):hover{border-color:rgba(167,139,250,.45);box-shadow:0 18px 32px -18px #000}

.t img,.t video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .8s var(--ease),filter .5s ease;filter:brightness(.62) saturate(.8)}
.t.open img,.t.open video{filter:brightness(.9) saturate(1)}
.t:not(.open):hover img{transform:scale(1.07);filter:brightness(.8) saturate(.95)}
.t video{opacity:0;transition:opacity .5s ease,filter .5s ease}
.t.rolling video{opacity:1}
.t .veil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 34%,rgba(0,0,0,.86))}

/* the whole inner block is counter-animated during a re-pack, so the words
   never stretch while the box is being resized */
.t .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:12px 13px 13px;gap:6px;transform-origin:0 0}
.t.open .in{padding:clamp(16px,2.4vw,24px)}
.t .n{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.16em;
  color:rgba(255,255,255,.62);text-shadow:0 1px 6px #000}
.t .dur{position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:0.5rem;padding:2px 7px;
  border-radius:999px;background:rgba(0,0,0,.68);color:#fff;border:1px solid rgba(255,255,255,.14)}
.t h3{font-size:0.78rem;font-weight:700;color:#fff;line-height:1.28;
  text-shadow:0 1px 10px rgba(0,0,0,.85);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t.open h3{font-family:var(--serif);font-size:clamp(1.05rem,2.4vw,1.55rem);-webkit-line-clamp:3}
.t .cat{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--acc2)}
/* the blurb and button only exist on the open tile — no wasted words on a thumbnail */
.t .more{max-height:0;opacity:0;overflow:hidden;
  transition:max-height .5s var(--ease),opacity .35s ease}
.t.open .more{max-height:170px;opacity:1;transition-delay:.18s}
.t .more p{font-size:0.8rem;line-height:1.65;color:rgba(255,255,255,.76);max-width:46ch;margin-bottom:10px}
.t .more .go{display:inline-flex;align-items:center;gap:8px;padding:9px 17px;border-radius:999px;
  background:#fff;color:#12101c;text-decoration:none;font-size:0.72rem;font-weight:700;
  transition:.3s var(--ease)}
.t .more .go:hover{background:var(--acc);color:#fff;transform:translateY(-2px)}
.t .meta{display:flex;gap:9px;font-family:var(--mono);font-size:0.5rem;letter-spacing:0.12em;
  color:rgba(255,255,255,.55)}

/* the tile that is not a vlog */
.t.rest{background:linear-gradient(150deg,#1d1834,#0f0c19);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;text-align:center;text-decoration:none;padding:14px}
.t.rest .big{font-family:var(--serif);font-size:1.8rem;font-weight:700;color:var(--off);line-height:1}
.t.rest .cap{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--acc2);line-height:1.8}
.t.rest .arrow{margin-top:4px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(167,139,250,.4);color:var(--acc2);transition:.3s var(--ease)}
.t.rest:hover .arrow{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateX(3px)}
.t.rest::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 60% at 50% 50%,rgba(139,92,246,.16),transparent 70%);
  animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}

.legend{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);
  font-size:0.53rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--d3);flex-wrap:wrap}
.legend b{color:var(--d1);font-weight:500}
.legend s{margin-left:auto;text-decoration:none}

/* ── empty state ── */
.empty{position:relative;border:1px dashed var(--bd2);border-radius:14px;background:var(--card2);
  padding:clamp(36px,7vw,60px) 24px;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:12px;overflow:hidden}
.empty .cells{position:absolute;inset:14px;display:grid;grid-template-columns:repeat(3,1fr);
  grid-auto-rows:1fr;gap:8px;pointer-events:none;opacity:.32}
.empty .cells i{border:1px solid var(--bd);border-radius:10px;animation:tile 3.6s var(--ease) infinite}
.empty .cells i:nth-child(1){grid-column:span 2;grid-row:span 2}
.empty .cells i:nth-child(2){animation-delay:.2s}
.empty .cells i:nth-child(3){animation-delay:.4s}
.empty .cells i:nth-child(4){animation-delay:.6s}
.empty .cells i:nth-child(5){animation-delay:.8s}
@keyframes tile{0%,100%{opacity:.4}50%{opacity:1}}
.empty > *:not(.cells){position:relative;z-index:2}
.empty .ico{font-size:2rem;animation:bob 2.7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.empty .lab{font-size:0.62rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--acc2);font-weight:700}
.empty p{font-size:0.83rem;color:var(--d2);max-width:420px;line-height:1.7}

@media(max-width:720px){
  .wall{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{width:94%;padding:40px 0 60px}
  .head .all{margin-left:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div class="page">
  <div class="stub">↑ Accessories &amp; Add-ons</div>

  <section class="sec">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="h2"></h2>
        <div class="note" id="note"></div>
      </div>
      <a class="all" id="all">All vlogs →</a>
    </div>
    <div id="body"></div>
  </section>

  <div class="stub">↓ Ride Gallery</div>
</div>

<script src="vlog-data.js"></script>
<script>
const V = window.VLOG
document.getElementById('kick').textContent = V.kicker
document.getElementById('h2').textContent   = V.heading
document.getElementById('note').textContent = V.note
document.getElementById('all').href         = V.page

if (V.isEmpty) {
  document.getElementById('body').innerHTML = `
    <div class="empty">
      <div class="cells"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="ico">🧩</div>
      <div class="lab">Wall not built yet</div>
      <p>The mosaic packs itself around whatever is in it. Nothing to pack until
         the first ride video is cut.</p>
    </div>`
} else {
  build()
}

function build() {
  document.getElementById('body').innerHTML = `
    <div class="wall" id="wall"></div>
    <div class="legend">
      <b>${V.LIMIT}</b> on the wall<b>·</b>click any tile to open it
      <s>${V.count} in total</s>
    </div>`

  document.getElementById('wall').innerHTML = V.shown.map((v, k) => `
    <button class="t" data-i="${v.i}" style="--k:${k}">
      <img src="${v.poster}" alt="${v.title}" loading="lazy"
           onerror="this.onerror=null;this.src='${v.still}'" />
      ${v.clip ? `<video src="${v.clip}" muted loop playsinline preload="none"></video>` : ''}
      <span class="veil"></span>
      <span class="n">${String(v.n).padStart(2, '0')}</span>
      <span class="dur">${v.duration}</span>
      <span class="in">
        <span class="cat">${v.cat}${v.fav ? ' · ★' : ''}</span>
        <h3>${v.title}</h3>
        <span class="more">
          <p>${v.blurb}</p>
          <a class="go" href="${v.url}" target="_blank" rel="noopener">▶ Watch on YouTube</a>
        </span>
        <span class="meta">${v.type === 'short' ? 'Short' : 'Full film'} · ${v.when.label} · ${v.views} views</span>
      </span>
    </button>`).join('') + `
    <a class="t rest" href="${V.page}" style="--k:${V.shown.length}">
      <span class="big">+${V.more}</span>
      <span class="cap">more<br />vlogs</span>
      <span class="arrow">→</span>
    </a>`

  wire()
}

function wire() {
  const wall  = document.getElementById('wall')
  const tiles = [...wall.children]
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  let at = -1

  /* ══ re-pack the wall ══
     Grid cannot transition a span change, so the move is done by hand:
     measure every tile, let the grid re-flow instantly, measure again, then
     play each tile from where it was to where it landed. The inner block gets
     the inverse scale so the type does not stretch on the way. */
  function open(i) {
    if (i === at) return
    at = i

    const first = tiles.map(t => t.getBoundingClientRect())
    tiles.forEach(t => t.classList.toggle('open', +t.dataset.i === i))
    const last = tiles.map(t => t.getBoundingClientRect())

    if (!reduce) tiles.forEach((t, k) => {
      const a = first[k], b = last[k]
      const dx = a.left - b.left, dy = a.top - b.top
      const sx = a.width / b.width, sy = a.height / b.height
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) return
      const opts = { duration: 620, easing: 'cubic-bezier(.22,1,.36,1)' }
      t.animate([{ transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` },
                 { transform: 'none' }], opts)
      t.querySelector('.in')?.animate(
        [{ transform: `scale(${1 / sx},${1 / sy})` }, { transform: 'none' }], opts)
    })

    /* only the open tile rolls its clip */
    tiles.forEach(t => {
      const vid = t.querySelector('video'); if (!vid) return
      if (t.classList.contains('open')) vid.play().then(() => t.classList.add('rolling')).catch(() => {})
      else { t.classList.remove('rolling'); vid.pause(); vid.currentTime = 0 }
    })
  }

  wall.addEventListener('click', e => {
    const t = e.target.closest('.t')
    /* clicks on the open tile's own link must not be swallowed by the re-pack */
    if (!t?.dataset.i || e.target.closest('a')) return
    open(+t.dataset.i)
  })

  /* a closed tile still previews on hover — it is the only motion it gets */
  wall.addEventListener('pointerover', e => {
    const t = e.target.closest('.t')
    if (!t?.dataset.i || t.classList.contains('open')) return
    const vid = t.querySelector('video'); if (!vid) return
    vid.play().then(() => t.classList.add('rolling')).catch(() => {})
  })
  wall.addEventListener('pointerout', e => {
    const t = e.target.closest('.t')
    if (!t?.dataset.i || t.classList.contains('open') || t.contains(e.relatedTarget)) return
    const vid = t.querySelector('video'); if (!vid) return
    t.classList.remove('rolling'); vid.pause(); vid.currentTime = 0
  })

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') open((at + 1) % V.shown.length)
    if (e.key === 'ArrowLeft')  open((at - 1 + V.shown.length) % V.shown.length)
  })

  open(0)
}
</script>
</body>
</html>
