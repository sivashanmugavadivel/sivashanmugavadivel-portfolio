<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Visualization Picker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#16141a;--bg2:#1e1c24;--text:#9ca3af;--text-h:#f3f0ff;--accent:#a78bfa;--accent2:#7c3aed;--border:#2e2a38;--sans:'Inter',sans-serif;--mono:ui-monospace,'Cascadia Code',monospace}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
    .layout{display:flex;height:100vh}
    .sidebar{width:260px;flex-shrink:0;background:#13111e;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0;z-index:10}
    .sidebar-title{font-size:0.68rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);padding:0 16px 14px;border-bottom:1px solid var(--border)}
    .design-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
    .design-btn{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--sans);font-size:0.78rem;text-align:left;transition:all 0.2s;cursor:pointer}
    .design-btn:hover{border-color:var(--accent);color:var(--text-h);background:rgba(167,139,250,0.06)}
    .design-btn.active{border-color:var(--accent);background:rgba(167,139,250,0.12);color:var(--text-h)}
    .btn-name{font-weight:600;display:block;margin-bottom:2px}
    .btn-desc{font-size:0.65rem;opacity:0.55;display:block}
    .badge{font-size:0.58rem;padding:2px 7px;border-radius:99px;background:rgba(124,58,237,0.2);color:var(--accent);border:1px solid rgba(167,139,250,0.25);font-weight:600;margin-top:4px;display:inline-block}
    .preview{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;overflow:auto}
    .preview-inner{max-width:600px;width:100%}
    .pick-btn{margin:10px;padding:11px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;border-radius:10px;color:#fff;font-family:var(--sans);font-size:0.78rem;font-weight:600;cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;flex-shrink:0;transition:filter 0.2s;width:calc(100% - 20px)}
    .pick-btn:hover{filter:brightness(1.15)}
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#1e1c24;border:1px solid var(--accent);color:var(--text-h);padding:9px 22px;border-radius:99px;font-size:0.8rem;transition:transform 0.4s,opacity 0.4s;opacity:0;z-index:999;white-space:nowrap}
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">Skill Viz Picker</div>
    <div class="design-list" id="list"></div>
    <button class="pick-btn" id="pickBtn">Pick This Design</button>
  </div>
  <div class="preview"><div class="preview-inner" id="preview"></div></div>
</div>
<div id="toast"></div>

<script>
const skills = [
  { name:'PLC Programming', level:90 },
  { name:'Industrial Automation', level:85 },
  { name:'React / JavaScript', level:80 },
  { name:'Node.js', level:75 },
  { name:'OPC UA / Modbus', level:88 },
  { name:'Python', level:70 },
  { name:'UI/UX Design', level:65 },
  { name:'DevOps / CI-CD', level:60 },
]

const previewEl = document.getElementById('preview')
let activeId = null
let animFrame = null

const DESIGNS = []
function reg(d){ DESIGNS.push(d) }

// ═══════════════════════════════
// A — Radar / Spider Chart
// ═══════════════════════════════
reg({ id:'A', name:'Radar Chart', desc:'Hexagonal spider web with animated fill', badge:'Classic',
  render(){
    const size=400, cx=size/2, cy=size/2, r=150
    const n=skills.length
    const angles=skills.map((_,i)=>(Math.PI*2/n)*i - Math.PI/2)
    let svg=`<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:400px;margin:0 auto;display:block">`
    // Grid rings
    for(let ring=1;ring<=5;ring++){
      const rr=r*ring/5
      let pts=angles.map(a=>`${cx+Math.cos(a)*rr},${cy+Math.sin(a)*rr}`).join(' ')
      svg+=`<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.5"/>`
    }
    // Axis lines
    angles.forEach(a=>{ svg+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="var(--border)" stroke-width="0.5" opacity="0.3"/>` })
    // Data fill
    let dataPts=skills.map((s,i)=>{
      const pr=r*s.level/100
      return `${cx+Math.cos(angles[i])*pr},${cy+Math.sin(angles[i])*pr}`
    }).join(' ')
    svg+=`<polygon points="${dataPts}" fill="rgba(167,139,250,0.15)" stroke="var(--accent)" stroke-width="2" style="animation:radarFill 1.5s ease-out forwards;opacity:0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    </polygon>`
    // Dots + labels
    skills.forEach((s,i)=>{
      const pr=r*s.level/100
      const dx=cx+Math.cos(angles[i])*pr, dy=cy+Math.sin(angles[i])*pr
      const lx=cx+Math.cos(angles[i])*(r+22), ly=cy+Math.sin(angles[i])*(r+22)
      svg+=`<circle cx="${dx}" cy="${dy}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="1.5">
        <animate attributeName="r" from="0" to="4" dur="0.5s" begin="${i*0.1}s" fill="freeze"/>
      </circle>`
      const anchor = angles[i]>Math.PI/2-0.1&&angles[i]<Math.PI*1.5+0.1?'end':'start'
      svg+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" style="font-size:10px;fill:var(--text-h);font-family:var(--sans);font-weight:500">${s.name}</text>`
      svg+=`<text x="${lx}" y="${ly+13}" text-anchor="middle" style="font-size:9px;fill:var(--accent);font-family:var(--mono)">${s.level}%</text>`
    })
    svg+=`</svg>`
    previewEl.innerHTML=svg
  }
})

// ═══════════════════════════════
// B — Circular Progress Rings
// ═══════════════════════════════
reg({ id:'B', name:'Progress Rings', desc:'Individual circular rings for each skill', badge:'Elegant',
  render(){
    let html='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px">'
    skills.forEach((s,i)=>{
      const r=40, c=2*Math.PI*r
      const offset=c*(1-s.level/100)
      html+=`<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="position:relative;width:90px;height:90px">
          <svg viewBox="0 0 100 100" style="transform:rotate(-90deg);width:100%;height:100%">
            <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--border)" stroke-width="6" opacity="0.3"/>
            <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="${c}" stroke-dashoffset="${c}" style="animation:ringFill${i} 1.5s ${i*0.12}s ease-out forwards">
              <animate attributeName="stroke-dashoffset" from="${c}" to="${offset}" dur="1.2s" begin="${i*0.12}s" fill="freeze"/>
            </circle>
          </svg>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
            <span style="font-family:var(--mono);font-size:0.85rem;font-weight:700;color:var(--text-h)">${s.level}%</span>
          </div>
        </div>
        <span style="font-size:0.7rem;color:var(--text-h);font-weight:500;text-align:center">${s.name}</span>
      </div>`
    })
    html+='</div>'
    previewEl.innerHTML=html
  }
})

// ═══════════════════════════════
// C — Horizontal Bars
// ═══════════════════════════════
reg({ id:'C', name:'Horizontal Bars', desc:'Bars that fill left to right with glow', badge:'Minimal',
  render(){
    let html='<div style="display:flex;flex-direction:column;gap:16px">'
    skills.forEach((s,i)=>{
      html+=`<div>
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:0.78rem;font-weight:500;color:var(--text-h)">${s.name}</span>
          <span style="font-family:var(--mono);font-size:0.75rem;color:var(--accent)">${s.level}%</span>
        </div>
        <div style="height:8px;background:var(--border);border-radius:99px;overflow:hidden;position:relative">
          <div style="height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 10px rgba(167,139,250,0.4);animation:barFill 1.2s ${i*0.1}s ease-out forwards"></div>
        </div>
      </div>
      <style>@keyframes barFill{to{width:${s.level}%}}</style>`
    })
    html+='</div>'
    previewEl.innerHTML=html
  }
})

// ═══════════════════════════════
// D — Glowing Dots Grid
// ═══════════════════════════════
reg({ id:'D', name:'Dot Matrix', desc:'Grid of dots that light up based on level', badge:'Creative',
  render(){
    let html='<div style="display:flex;flex-direction:column;gap:18px">'
    skills.forEach((s,i)=>{
      const dots=10, filled=Math.round(s.level/10)
      html+=`<div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:0.75rem;font-weight:500;color:var(--text-h);width:140px;text-align:right;flex-shrink:0">${s.name}</span>
        <div style="display:flex;gap:5px">`
      for(let d=0;d<dots;d++){
        const on=d<filled
        html+=`<div style="width:14px;height:14px;border-radius:50%;background:${on?'var(--accent)':'var(--border)'};opacity:${on?1:0.3};box-shadow:${on?'0 0 8px rgba(167,139,250,0.5)':'none'};transition:all 0.3s;animation:${on?`dotPop 0.3s ${(i*0.08+d*0.05)}s ease-out both`:'none'}"></div>`
      }
      html+=`</div>
        <span style="font-family:var(--mono);font-size:0.72rem;color:var(--accent);width:36px">${s.level}%</span>
      </div>`
    })
    html+='</div><style>@keyframes dotPop{from{transform:scale(0)}to{transform:scale(1)}}</style>'
    previewEl.innerHTML=html
  }
})

// ═══════════════════════════════
// E — Vertical Pillars
// ═══════════════════════════════
reg({ id:'E', name:'Vertical Pillars', desc:'Columns rising from bottom with glow tips', badge:'Bold',
  render(){
    let html='<div style="display:flex;align-items:flex-end;justify-content:center;gap:16px;height:300px;padding-top:40px">'
    skills.forEach((s,i)=>{
      const h=s.level*2.5
      html+=`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:60px">
        <span style="font-family:var(--mono);font-size:0.68rem;color:var(--accent)">${s.level}%</span>
        <div style="width:100%;height:0px;border-radius:8px 8px 4px 4px;background:linear-gradient(to top,var(--accent2),var(--accent));position:relative;animation:pillarRise 1s ${i*0.1}s ease-out forwards;box-shadow:0 -4px 16px rgba(167,139,250,0.3)">
          <div style="position:absolute;top:-2px;left:0;right:0;height:4px;background:rgba(255,255,255,0.3);border-radius:8px 8px 0 0"></div>
        </div>
        <span style="font-size:0.6rem;color:var(--text-h);text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);height:80px;overflow:hidden;font-weight:500">${s.name}</span>
      </div>
      <style>@keyframes pillarRise{to{height:${h}px}}</style>`
    })
    html+='</div>'
    previewEl.innerHTML=html
  }
})

// ═══════════════════════════════
// F — Stacked Cards
// ═══════════════════════════════
reg({ id:'F', name:'Skill Cards', desc:'Individual cards with mini bar + percentage', badge:'Modern',
  render(){
    let html='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">'
    skills.forEach((s,i)=>{
      html+=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 18px;animation:cardSlide 0.5s ${i*0.08}s ease-out both;opacity:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-size:0.82rem;font-weight:600;color:var(--text-h)">${s.name}</span>
          <span style="font-family:var(--mono);font-size:0.85rem;font-weight:700;color:var(--accent)">${s.level}%</span>
        </div>
        <div style="height:6px;background:var(--border);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));animation:barFill${i} 1s ${0.3+i*0.1}s ease-out forwards"></div>
        </div>
      </div>
      <style>
        @keyframes barFill${i}{to{width:${s.level}%}}
        @keyframes cardSlide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      </style>`
    })
    html+='</div>'
    previewEl.innerHTML=html
  }
})

// ═══════════════════════════════
// G — Orbit Skills
// ═══════════════════════════════
reg({ id:'G', name:'Orbit Ring', desc:'Skills orbiting in concentric rings', badge:'Unique',
  render(){
    const size=400,cx=size/2,cy=size/2
    let svg=`<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:400px;margin:0 auto;display:block">`
    // Rings
    const rings=[60,100,140,170]
    rings.forEach(r=>{ svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 4"/>` })
    // Skills on orbits
    skills.forEach((s,i)=>{
      const ring=rings[i%rings.length]
      const angle=(Math.PI*2/Math.min(3,skills.length))*((i%3))+(Math.floor(i/3)*1.2)
      const x=cx+Math.cos(angle)*ring, y=cy+Math.sin(angle)*ring
      const dotR=8+s.level/20
      svg+=`<g style="animation:orbitFade 0.8s ${i*0.15}s ease-out both">
        <circle cx="${x}" cy="${y}" r="${dotR+6}" fill="none" stroke="var(--accent)" stroke-width="0.5" opacity="0.3"/>
        <circle cx="${x}" cy="${y}" r="${dotR}" fill="var(--accent)" opacity="0.7">
          <animate attributeName="r" values="${dotR};${dotR+2};${dotR}" dur="3s" begin="${i*0.5}s" repeatCount="indefinite"/>
        </circle>
        <text x="${x}" y="${y-dotR-8}" text-anchor="middle" style="font-size:8px;fill:var(--text-h);font-weight:600;font-family:var(--sans)">${s.name}</text>
        <text x="${x}" y="${y+3}" text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700;font-family:var(--mono)">${s.level}</text>
      </g>`
    })
    // Center label
    svg+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" style="font-size:11px;fill:var(--text-h);font-weight:700">SKILLS</text>`
    svg+=`<text x="${cx}" y="${cy+8}" text-anchor="middle" style="font-size:8px;fill:var(--accent);font-family:var(--mono)">& Expertise</text>`
    svg+=`</svg><style>@keyframes orbitFade{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}</style>`
    previewEl.innerHTML=svg
  }
})

// ═══════════════════════════════
// H — Tag Cloud
// ═══════════════════════════════
reg({ id:'H', name:'Tag Cloud', desc:'Sized tags — bigger = higher skill', badge:'Playful',
  render(){
    let html='<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:20px">'
    const sorted=[...skills].sort(()=>Math.random()-0.5)
    sorted.forEach((s,i)=>{
      const size=0.7+s.level/100*0.9
      const opacity=0.5+s.level/100*0.5
      html+=`<span style="font-size:${size}rem;font-weight:${s.level>75?700:500};color:var(--accent);opacity:${opacity};padding:6px 14px;border-radius:99px;border:1px solid rgba(167,139,250,${opacity*0.4});background:rgba(167,139,250,${opacity*0.08});white-space:nowrap;animation:tagPop 0.4s ${i*0.06}s ease-out both;font-family:var(--sans)">${s.name}</span>`
    })
    html+='</div><style>@keyframes tagPop{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}</style>'
    previewEl.innerHTML=html
  }
})

// Build sidebar
const listEl=document.getElementById('list')
DESIGNS.forEach(d=>{
  const btn=document.createElement('button')
  btn.className='design-btn'
  btn.id='btn-'+d.id
  btn.innerHTML=`<span class="btn-name">${d.id} — ${d.name}</span><span class="btn-desc">${d.desc}</span><span class="badge">${d.badge}</span>`
  btn.onclick=()=>select(d.id)
  listEl.appendChild(btn)
})

function select(id){
  activeId=id
  document.querySelectorAll('.design-btn').forEach(b=>b.classList.remove('active'))
  document.getElementById('btn-'+id).classList.add('active')
  DESIGNS.find(d=>d.id===id).render()
}

document.getElementById('pickBtn').onclick=()=>{
  const d=DESIGNS.find(x=>x.id===activeId)
  const t=document.getElementById('toast')
  t.textContent=`Design ${d.id} — "${d.name}" selected! Tell Claude to apply it.`
  t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)'
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(60px)'},3500)
}

select('A')
</script>
</body>
</html>
