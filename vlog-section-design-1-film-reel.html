<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vlogs · 1 · Film Reel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════
   FILM REEL — the vlogs hung on a length of 35 mm film that runs
   across the section. Sprocket holes crawl, the strip drifts on
   its own, and you can drag / wheel / arrow it along. Hovering a
   frame lifts it out of the strip and starts its clip; clicking
   threads that frame up into a gate for the full detail.
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220; --card2:#1a1828;
  --bd:rgba(255,255,255,0.07); --bd2:rgba(255,255,255,0.12);
  --off:#f0eef6; --d1:rgba(240,238,246,0.65); --d2:rgba(240,238,246,0.4); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  --film:#0a0910; --film2:#131120;
  --sans:'Inter',sans-serif; --serif:'Playfair Display',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --fw:270px;          /* frame width  */
  --fh:152px;          /* frame height */
}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
::selection{background:var(--acc);color:#fff}

/* ── page context: the section sits between two others on /mygarage ── */
.page{width:90%;max-width:1240px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

/* ── the section card ── */
.sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;
  padding:26px 0 30px;overflow:hidden;
  opacity:0;transform:translateY(32px);animation:rise .8s var(--ease) .1s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.sec::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 120% at 50% -10%,rgba(139,92,246,0.12),transparent 62%)}

.head{position:relative;z-index:2;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
  padding:0 clamp(18px,3vw,30px);margin-bottom:22px}
.head .kick{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--acc2);display:block;margin-bottom:7px}
.head h2{font-family:var(--serif);font-size:clamp(1.3rem,3.4vw,1.85rem);font-weight:700;color:var(--off);
  line-height:1.1}
.head .note{font-size:0.75rem;color:var(--d2);line-height:1.6;max-width:400px;margin-top:8px}
.head .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.reel-count{font-family:var(--mono);font-size:0.62rem;color:var(--d2);letter-spacing:0.1em;
  display:flex;align-items:center;gap:7px}
.reel-count b{color:var(--off);font-weight:600}
.reel-count i{width:6px;height:6px;border-radius:50%;background:#ff4d4d;font-style:normal;
  animation:rec 1.6s ease-in-out infinite}
@keyframes rec{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,77,77,.5)}50%{opacity:.35;box-shadow:0 0 0 5px rgba(255,77,77,0)}}
.all{font-size:0.7rem;color:var(--acc2);text-decoration:none;padding:7px 15px;border-radius:999px;
  border:1px solid rgba(167,139,250,0.28);transition:.3s var(--ease);white-space:nowrap}
.all:hover{background:var(--acc);color:#fff;border-color:var(--acc);transform:translateY(-2px)}

/* ══ the film strip ══
   Two sprocket rails and a frame track. The rails are a repeating
   gradient scrolled by its own keyframe, so the perforations crawl
   whether or not the strip itself is moving. */
.strip{position:relative;z-index:2;background:linear-gradient(180deg,var(--film),var(--film2),var(--film));
  border-top:1px solid var(--bd2);border-bottom:1px solid var(--bd2);
  padding:0;cursor:grab;user-select:none;
  box-shadow:inset 0 20px 40px -28px #000,inset 0 -20px 40px -28px #000}
.strip.dragging{cursor:grabbing}
.rail{height:19px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,
    transparent 0 9px,rgba(255,255,255,0.5) 9px 20px,transparent 20px 30px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
  animation:crawl 1.1s linear infinite}
.rail::after{content:'';position:absolute;inset:0;background:var(--film);mix-blend-mode:color-burn;opacity:.15}
@keyframes crawl{to{background-position:-30px 0}}
.strip.paused .rail{animation-play-state:paused}

.track{display:flex;gap:10px;padding:11px 10px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;perspective:1100px}
.track::-webkit-scrollbar{display:none}

/* ── one frame ── */
.fr{position:relative;flex:0 0 var(--fw);height:var(--fh);border-radius:3px;overflow:hidden;
  background:#000;border:1px solid rgba(255,255,255,0.08);
  transform-style:preserve-3d;transition:transform .5s var(--ease),box-shadow .5s var(--ease),filter .45s ease;
  filter:saturate(.72) contrast(1.05) brightness(.82)}
/* every other frame sits a touch off-square, the way a real strip does */
.fr:nth-child(even){transform:rotateY(2.5deg)}
.fr:nth-child(odd){transform:rotateY(-2.5deg)}
.fr:hover{transform:translateY(-12px) scale(1.055) rotateY(0deg);z-index:5;
  filter:saturate(1.05) contrast(1) brightness(1);
  box-shadow:0 26px 46px -18px rgba(0,0,0,0.9),0 0 0 1px var(--acc2),0 0 34px -6px rgba(139,92,246,0.55)}
.fr img,.fr video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fr video{opacity:0;transition:opacity .5s ease}
.fr.playing video{opacity:1}
.fr.playing img{opacity:.001}
/* the emulsion tint that lifts on hover */
.fr::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(139,92,246,0.14),transparent 40%,rgba(0,0,0,0.72));
  transition:opacity .45s ease}
.fr:hover::after{opacity:.72}

.fr .meta{position:absolute;left:0;right:0;bottom:0;padding:9px 11px 10px;z-index:3;
  transform:translateY(6px);opacity:.92;transition:transform .5s var(--ease),opacity .4s ease}
.fr:hover .meta{transform:none;opacity:1}
.fr .t{font-size:0.76rem;font-weight:700;color:#fff;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 10px rgba(0,0,0,.8)}
.fr .s{display:flex;align-items:center;gap:7px;margin-top:5px;font-family:var(--mono);
  font-size:0.55rem;letter-spacing:0.08em;color:rgba(255,255,255,0.62);
  max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
.fr:hover .s{max-height:20px}
.fr .s u{text-decoration:none;color:var(--acc2)}

/* ── the tail of the reel ──
   The section only ever hangs five frames; the sixth is the leader that runs
   off the end of the strip and through to the full archive. */
.fr.tail{background:linear-gradient(135deg,#1b1730,#0d0b16);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;text-decoration:none;filter:none;
  border-color:rgba(167,139,250,0.3)}
.fr.tail::after{display:none}
.fr.tail:hover{filter:none;box-shadow:0 26px 46px -18px rgba(0,0,0,.9),0 0 0 1px var(--acc2),
  0 0 34px -6px rgba(139,92,246,.55)}
.fr.tail .big{font-family:var(--serif);font-size:1.9rem;font-weight:700;color:var(--off);line-height:1}
.fr.tail .lab{font-family:var(--mono);font-size:0.52rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--acc2);text-align:center;line-height:1.7}
.fr.tail .arrow{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:6px 13px;
  border-radius:999px;border:1px solid rgba(167,139,250,0.4);color:var(--off);font-size:0.64rem;
  font-family:var(--sans);font-weight:600;transition:.3s var(--ease)}
.fr.tail:hover .arrow{background:var(--acc);border-color:var(--acc);transform:translateX(3px)}
/* the perforated leader, scrolling out of frame */
.fr.tail .leader{position:absolute;inset:0;opacity:.16;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 16px,rgba(255,255,255,.5) 16px 20px);
  animation:crawl2 1.6s linear infinite}
@keyframes crawl2{to{background-position:-20px 0}}

/* frame number, burned into the edge like a real strip */
.fr .num{position:absolute;top:6px;left:8px;z-index:3;font-family:var(--mono);font-size:0.5rem;
  letter-spacing:0.14em;color:rgba(255,255,255,0.5);text-shadow:0 1px 6px #000}
.fr .dur{position:absolute;top:6px;right:7px;z-index:3;font-family:var(--mono);font-size:0.53rem;
  padding:2px 6px;border-radius:3px;background:rgba(0,0,0,0.72);color:#fff;
  backdrop-filter:blur(4px);transition:.4s var(--ease)}
.fr:hover .dur{background:var(--acc);transform:translateY(-1px)}
/* the short ones are vertical, so they get a badge instead of a crop lie */
.fr .short{position:absolute;top:6px;right:7px;z-index:3;display:none}
.fr[data-type="short"] .dur{right:auto;left:50%;top:auto;bottom:9px;transform:translateX(-50%)}
.fr[data-type="short"]:hover .dur{transform:translateX(-50%) translateY(-1px)}
.fr[data-type="short"] .meta{padding-bottom:26px}

/* the play mark that fades up under the pointer */
.fr .play{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;z-index:3;
  border-radius:50%;display:grid;place-items:center;background:rgba(10,9,16,0.6);
  border:1px solid rgba(255,255,255,0.28);backdrop-filter:blur(6px);
  opacity:0;transform:scale(.6);transition:.45s var(--ease)}
.fr:hover .play{opacity:1;transform:scale(1)}
.fr .play svg{width:13px;height:13px;fill:#fff;margin-left:2px}

/* ── strip controls ── */
.ctl{position:relative;z-index:2;display:flex;align-items:center;gap:10px;
  padding:16px clamp(18px,3vw,30px) 0}
.ctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd2);background:var(--card2);
  color:var(--d1);cursor:pointer;display:grid;place-items:center;transition:.3s var(--ease)}
.ctl button:hover{border-color:var(--acc2);color:var(--off);background:rgba(139,92,246,0.16);transform:scale(1.08)}
.ctl button svg{width:13px;height:13px;fill:currentColor}
.ctl .hint{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--d3)}
.ctl .bar{margin-left:auto;flex:0 1 220px;height:2px;background:var(--bd);border-radius:2px;overflow:hidden}
.ctl .bar i{display:block;height:100%;width:20%;background:var(--acc2);border-radius:2px;
  transition:transform .12s linear,width .2s ease;transform-origin:left}

/* ══ the gate — a frame threaded up for a proper look ══ */
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;
  background:rgba(6,5,11,0.86);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .4s ease}
.gate.on{opacity:1;pointer-events:auto}
.gate .box{width:min(880px,100%);background:var(--card);border:1px solid var(--bd2);border-radius:14px;
  overflow:hidden;transform:scale(.92) translateY(22px);opacity:0;
  transition:transform .55s var(--ease),opacity .4s ease;
  box-shadow:0 50px 90px -30px #000}
.gate.on .box{transform:none;opacity:1}
.gate .screen{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.gate .screen video,.gate .screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* shutter: two blades that snap open as the gate lands */
.gate .screen::before,.gate .screen::after{content:'';position:absolute;left:0;right:0;height:50%;
  background:#0a0910;z-index:4;transition:transform .6s var(--ease) .1s}
.gate .screen::before{top:0}
.gate .screen::after{bottom:0}
.gate.on .screen::before{transform:translateY(-100%)}
.gate.on .screen::after{transform:translateY(100%)}
.gate .body{padding:20px clamp(18px,3vw,26px) 22px;display:flex;flex-direction:column;gap:10px}
.gate .body h3{font-family:var(--serif);font-size:1.15rem;color:var(--off);font-weight:700;line-height:1.3}
.gate .body p{font-size:0.82rem;line-height:1.65;color:var(--d1);max-width:62ch}
.gate .tags{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:0.56rem;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--d2);margin-top:2px}
.gate .tags u{text-decoration:none;padding:4px 9px;border-radius:999px;background:rgba(139,92,246,0.14);
  border:1px solid rgba(167,139,250,0.22);color:var(--acc2)}
.gate .go{align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:9px;
  padding:10px 18px;border-radius:999px;background:var(--acc);color:#fff;text-decoration:none;
  font-size:0.75rem;font-weight:600;transition:.3s var(--ease)}
.gate .go:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(139,92,246,0.8)}
.gate .x{position:absolute;top:12px;right:12px;z-index:6;width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.2);background:rgba(10,9,16,0.7);color:#fff;cursor:pointer;
  backdrop-filter:blur(6px);font-size:1rem;line-height:1;transition:.3s}
.gate .x:hover{background:var(--acc);border-color:var(--acc);transform:rotate(90deg)}

/* ── empty state: a blank strip waiting to be exposed ── */
.empty{position:relative;z-index:2;margin:0 clamp(18px,3vw,30px);border:1px dashed var(--bd2);
  border-radius:12px;background:var(--card2);padding:clamp(32px,6vw,52px) 24px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.empty::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,255,255,0.035) 26px 30px);
  animation:slide 3.4s linear infinite}
@keyframes slide{to{transform:translateX(30px)}}
.empty .ico{font-size:1.9rem;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.empty .lab{font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--acc2);font-weight:700}
.empty p{font-size:0.8rem;color:var(--d2);max-width:420px;line-height:1.6}

@media(max-width:760px){
  :root{--fw:210px;--fh:120px}
  .page{width:94%;padding:40px 0 60px}
  .head .right{margin-left:0;width:100%}
  .ctl .bar{flex-basis:120px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
  .rail{animation:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="stub">↑ Accessories &amp; Add-ons</div>

  <section class="sec" id="sec">
    <div class="head">
      <div>
        <span class="kick" id="kick"></span>
        <h2 id="h2"></h2>
        <div class="note" id="note"></div>
      </div>
      <div class="right">
        <span class="reel-count"><i></i><b id="cnt">0</b> reels</span>
        <a class="all" id="all" target="_blank" rel="noopener">View all →</a>
      </div>
    </div>

    <div id="body"></div>
  </section>

  <div class="stub">↓ Ride Gallery</div>
</div>

<!-- threaded frame -->
<div class="gate" id="gate">
  <div class="box">
    <button class="x" id="gx" aria-label="Close">×</button>
    <div class="screen" id="gscreen"></div>
    <div class="body">
      <h3 id="gt"></h3>
      <p id="gp"></p>
      <div class="tags" id="gtags"></div>
      <a class="go" id="ggo" target="_blank" rel="noopener">Watch on YouTube ↗</a>
    </div>
  </div>
</div>

<script src="vlog-data.js"></script>
<script>
const V = window.VLOG
document.getElementById('kick').textContent = V.kicker
document.getElementById('h2').textContent   = V.heading
document.getElementById('note').textContent = V.note
document.getElementById('cnt').textContent  = `${V.LIMIT} of ${V.count}`
document.getElementById('all').href         = V.page

const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'

/* ── empty state ── */
if (V.isEmpty) {
  document.getElementById('body').innerHTML = `
    <div class="empty">
      <div class="ico">🎞️</div>
      <div class="lab">Reel not exposed yet</div>
      <p>The camera is mounted and the first rides are planned. The strip fills itself
         in the moment a ride video lands.</p>
    </div>`
  document.getElementById('cnt').textContent = '0'
} else {
  build()
}

function build() {
  document.getElementById('body').innerHTML = `
    <div class="strip" id="strip">
      <div class="rail"></div>
      <div class="track" id="track"></div>
      <div class="rail"></div>
    </div>
    <div class="ctl">
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6z"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg></button>
      <span class="hint">Drag the strip · ← → · hover to roll</span>
      <div class="bar"><i id="barfill"></i></div>
    </div>`

  const track = document.getElementById('track')
  track.innerHTML = V.shown.map(v => `
    <article class="fr" data-i="${v.i}" data-type="${v.type}" tabindex="0">
      <img src="${v.poster}" alt="${v.title}" loading="lazy"
           onerror="this.onerror=null;this.src='${v.still}'" />
      ${v.clip ? `<video src="${v.clip}" muted loop playsinline preload="none"></video>` : ''}
      <span class="num">${String(v.n).padStart(2, '0')}</span>
      <span class="dur">${v.duration}</span>
      <span class="play">${PLAY}</span>
      <div class="meta">
        <div class="t">${v.title}</div>
        <div class="s"><u>${v.cat}</u> · ${v.when.short} · ${v.views} views</div>
      </div>
    </article>`).join('') + `
    <a class="fr tail" href="${V.page}">
      <span class="leader"></span>
      <span class="big">+${V.more}</span>
      <span class="lab">more on the reel</span>
      <span class="arrow">All vlogs →</span>
    </a>`

  wire(track)
}

/* ══ strip behaviour ══
   Idle drift, wheel-to-horizontal, drag with momentum-free direct mapping,
   arrow keys, and hover-to-play on whichever frame is under the pointer. */
function wire(track) {
  const strip = document.getElementById('strip')
  const fill  = document.getElementById('barfill')
  const SPEED = 22          // px/s of idle drift
  let paused = false, last = 0, raf = 0

  const maxScroll = () => Math.max(1, track.scrollWidth - track.clientWidth)

  /* the bar is a viewport-on-the-strip: its width is how much of the reel
     fits on screen, its offset is how far along you are */
  const paint = () => {
    const barW = fill.parentElement.clientWidth
    const frac = Math.min(1, track.clientWidth / track.scrollWidth)
    const p = track.scrollLeft / maxScroll()
    fill.style.width = Math.max(10, frac * 100) + '%'
    fill.style.transform = `translateX(${p * (barW - frac * barW)}px)`
  }

  const tick = ts => {
    const dt = last ? (ts - last) / 1000 : 0
    last = ts
    if (!paused && !drag.on) {
      track.scrollLeft += SPEED * dt
      /* wrap gently rather than slamming into the end */
      if (track.scrollLeft >= maxScroll() - 1) track.scrollLeft = 0
    }
    paint()
    raf = requestAnimationFrame(tick)
  }
  raf = requestAnimationFrame(tick)

  /* hover: hold the strip and roll the clip */
  strip.addEventListener('pointerenter', () => { paused = true; strip.classList.add('paused') })
  strip.addEventListener('pointerleave', () => { paused = false; strip.classList.remove('paused') })

  track.addEventListener('pointerover', e => {
    const fr = e.target.closest('.fr'); if (!fr) return
    const vid = fr.querySelector('video'); if (!vid) return
    vid.play().then(() => fr.classList.add('playing')).catch(() => {})
  })
  track.addEventListener('pointerout', e => {
    const fr = e.target.closest('.fr'); if (!fr || fr.contains(e.relatedTarget)) return
    const vid = fr.querySelector('video'); if (!vid) return
    fr.classList.remove('playing'); vid.pause(); vid.currentTime = 0
  })

  /* wheel → sideways */
  strip.addEventListener('wheel', e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY
    track.scrollLeft += d
    e.preventDefault()
  }, { passive: false })

  /* drag */
  const drag = { on: false, x: 0, l: 0, moved: 0 }
  strip.addEventListener('pointerdown', e => {
    if (e.button) return
    drag.on = true; drag.x = e.clientX; drag.l = track.scrollLeft; drag.moved = 0
    strip.classList.add('dragging'); strip.setPointerCapture(e.pointerId)
  })
  strip.addEventListener('pointermove', e => {
    if (!drag.on) return
    const dx = e.clientX - drag.x
    drag.moved = Math.max(drag.moved, Math.abs(dx))
    track.scrollLeft = drag.l - dx
  })
  const stop = e => {
    if (!drag.on) return
    drag.on = false; strip.classList.remove('dragging')
    try { strip.releasePointerCapture(e.pointerId) } catch {}
  }
  strip.addEventListener('pointerup', stop)
  strip.addEventListener('pointercancel', stop)

  /* A drag that travelled should not also count as a click — including on the
     tail, where it would otherwise navigate away mid-drag. */
  track.addEventListener('click', e => {
    const fr = e.target.closest('.fr'); if (!fr) return
    if (drag.moved > 6) { e.preventDefault(); return }
    if (fr.dataset.i) open(V.all[+fr.dataset.i])
  })
  track.addEventListener('keydown', e => {
    const fr = e.target.closest('.fr')
    if (fr?.dataset.i && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); open(V.all[+fr.dataset.i])
    }
  })

  const step = d => track.scrollBy({ left: d * (270 + 10) * 2, behavior: 'smooth' })
  document.getElementById('prev').onclick = () => step(-1)
  document.getElementById('next').onclick = () => step(1)
  window.addEventListener('keydown', e => {
    if (document.getElementById('gate').classList.contains('on')) return
    if (e.key === 'ArrowRight') step(1)
    if (e.key === 'ArrowLeft')  step(-1)
  })
}

/* ══ the gate ══ */
const gate = document.getElementById('gate')
function open(v) {
  document.getElementById('gscreen').innerHTML = v.clip
    ? `<video src="${v.clip}" autoplay muted loop playsinline></video>`
    : `<img src="${v.posterBig}" alt="${v.title}"
         onerror="this.onerror=null;this.src='${v.still}'" />`
  document.getElementById('gt').textContent = v.title
  document.getElementById('gp').textContent = v.blurb
  document.getElementById('gtags').innerHTML =
    `<u>${v.cat}</u><u>${v.type === 'short' ? 'Short' : 'Film'}</u>` +
    `<span>${v.when.label} · ${v.duration} · ${v.views} views</span>`
  document.getElementById('ggo').href = v.url
  gate.classList.add('on')
}
function close() {
  gate.classList.remove('on')
  setTimeout(() => { document.getElementById('gscreen').innerHTML = '' }, 400)
}
document.getElementById('gx').onclick = close
gate.addEventListener('click', e => { if (e.target === gate) close() })
window.addEventListener('keydown', e => { if (e.key === 'Escape') close() })
</script>
</body>
</html>
