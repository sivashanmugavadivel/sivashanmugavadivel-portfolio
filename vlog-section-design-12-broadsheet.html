<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vlogs · 12 · Broadsheet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════════
   BROADSHEET — the vlogs set as the front page of a paper. One
   lead story with the film running inside a halftone screen, four
   briefs down the columns, and a "continued inside" line that
   carries you to the rest. Everything is print: rules, drop caps,
   a byline, and photographs that only come to colour when you
   lean on them.
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08070e; --card:#141220;
  --bd:rgba(255,255,255,0.07); --d3:rgba(240,238,246,0.22);
  --acc:#8b5cf6; --acc2:#a78bfa;
  /* the paper */
  --paper:#e9e4d7; --paper2:#ddd7c7; --ink:#17141d; --ink2:#4a4553; --ink3:#7d7787;
  --rule:rgba(23,20,29,0.22); --rule2:rgba(23,20,29,0.5);
  --red:#a8321f;
  --serif:'Playfair Display',Georgia,serif; --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--ink);color:var(--paper)}
.page{width:90%;max-width:1180px;margin:0 auto;padding:64px 0 90px;
  display:flex;flex-direction:column;gap:clamp(40px,7vh,76px)}
.stub{border:1px dashed var(--bd);border-radius:16px;padding:26px;color:var(--d3);
  font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;text-align:center}

/* ══ the sheet ══ */
.sheet{position:relative;background:var(--paper);border-radius:6px;overflow:hidden;
  padding:clamp(18px,3vw,34px) clamp(16px,3vw,34px) clamp(16px,2.4vw,26px);
  box-shadow:0 40px 70px -34px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.35);
  opacity:0;transform:translateY(34px) rotate(-.35deg);
  animation:press .9s var(--ease) .1s forwards}
@keyframes press{to{opacity:1;transform:none}}
/* paper tooth, and the slight browning at the edges */
.sheet::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(23,20,29,.022) 0 1px,transparent 1px 3px),
             radial-gradient(120% 90% at 50% 0%,transparent 62%,rgba(120,96,60,.16))}

/* ── masthead ── */
.mast{text-align:center;padding-bottom:9px;position:relative}
.mast .over{font-family:var(--mono);font-size:0.52rem;letter-spacing:0.36em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:9px;
  opacity:0;animation:fade .7s var(--ease) .5s forwards}
@keyframes fade{to{opacity:1}}
.mast h2{font-family:var(--serif);font-weight:900;color:var(--ink);line-height:.94;letter-spacing:-0.02em;
  font-size:clamp(1.9rem,7.4vw,4.4rem);text-transform:uppercase}
.mast h2 span{display:inline-block;transform:translateY(105%);opacity:0;
  animation:setword .8s var(--ease) forwards;animation-delay:calc(var(--i) * .07s + .28s)}
@keyframes setword{to{transform:none;opacity:1}}
.mast .h2wrap{overflow:hidden;padding:0 2px}
/* the two rules that box the masthead in draw across */
.rule{height:1px;background:var(--rule2);transform:scaleX(0);transform-origin:left;
  animation:draw .9s var(--ease) forwards}
.rule.thick{height:3px;background:var(--ink);animation-delay:.15s}
.rule.d2{animation-delay:.72s}
@keyframes draw{to{transform:none}}
.dateline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:7px 0;
  font-family:var(--mono);font-size:0.53rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink2);
  opacity:0;animation:fade .7s var(--ease) .8s forwards}
.dateline .mid{margin-left:auto}
.dateline b{color:var(--red);font-weight:700}

/* ══ the front page ══ */
.front{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(0,1fr);gap:0;
  border-top:1px solid var(--rule);margin-top:6px}
.lead{padding:16px 22px 18px 0;border-right:1px solid var(--rule);min-width:0}
.briefs{padding:16px 0 0 22px;min-width:0;display:flex;flex-direction:column}

/* ── the lead story ── */
.kicker{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--red);font-weight:700;margin-bottom:8px}
.lead h3{font-family:var(--serif);font-weight:700;color:var(--ink);line-height:1.04;letter-spacing:-0.015em;
  font-size:clamp(1.5rem,4.6vw,3rem);margin-bottom:10px}
.byline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:0.5rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink3)}
.byline b{color:var(--ink);font-weight:600}

/* the photograph, screened the way newsprint screens one */
.plate{position:relative;margin:14px 0 12px;aspect-ratio:16/9;overflow:hidden;background:var(--ink);
  border:1px solid var(--rule2);cursor:pointer}
.plate img,.plate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.42) brightness(1.02);transition:filter .7s var(--ease),transform 1.1s var(--ease)}
.plate video{opacity:0;transition:opacity .6s ease,filter .7s var(--ease)}
.plate.run video{opacity:1}
.plate .dots{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background-image:radial-gradient(circle,rgba(23,20,29,.85) 0.9px,transparent 1.1px);
  background-size:3px 3px;opacity:.85;transition:opacity .7s var(--ease)}
.plate:hover .dots{opacity:.16}
.plate:hover img,.plate:hover video{filter:grayscale(0) contrast(1.06);transform:scale(1.03)}
.plate .cred{position:absolute;right:0;bottom:0;background:var(--paper);color:var(--ink2);
  font-family:var(--mono);font-size:0.44rem;letter-spacing:0.14em;text-transform:uppercase;padding:3px 7px}
.plate .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:var(--paper);border:1px solid var(--ink);opacity:0;transition:.4s var(--ease)}
.plate:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.plate .play svg{width:15px;height:15px;fill:var(--ink);margin-left:2px}
.cap{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.1em;color:var(--ink3);
  padding-bottom:11px;border-bottom:1px solid var(--rule);margin-bottom:11px}

/* the standfirst, set in two columns with a drop cap */
.standfirst{columns:2;column-gap:22px;column-rule:1px solid var(--rule);
  font-size:0.82rem;line-height:1.72;color:var(--ink2);text-align:justify;hyphens:auto}
.standfirst p::first-letter{float:left;font-family:var(--serif);font-weight:700;color:var(--ink);
  font-size:3.05rem;line-height:.82;padding:3px 8px 0 0}
.readon{display:inline-flex;align-items:center;gap:8px;margin-top:13px;padding:9px 17px;
  background:var(--ink);color:var(--paper);text-decoration:none;font-size:0.68rem;font-weight:600;
  letter-spacing:0.04em;transition:.3s var(--ease)}
.readon:hover{background:var(--red);transform:translateX(3px)}

/* ── the briefs column ── */
.briefs .colhead{font-family:var(--mono);font-size:0.5rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--ink3);padding-bottom:8px;border-bottom:3px double var(--rule2);margin-bottom:12px}
.brief{display:block;text-decoration:none;color:inherit;padding:11px 0;border-bottom:1px solid var(--rule);
  cursor:pointer;position:relative;transition:.35s var(--ease);
  animation:slidein .7s var(--ease) backwards;animation-delay:calc(var(--k) * .1s + .9s)}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}}
/* leaning on a brief lifts it off the page */
.brief:hover{transform:translateX(-5px)}
.brief::before{content:'';position:absolute;inset:-6px -10px;background:var(--paper2);opacity:0;
  transition:opacity .3s;z-index:-1;box-shadow:0 10px 22px -14px rgba(0,0,0,.6)}
.brief:hover::before{opacity:1}
.brief .no{font-family:var(--mono);font-size:0.48rem;letter-spacing:0.18em;color:var(--red);font-weight:700}
.brief h4{font-family:var(--serif);font-size:1rem;font-weight:700;line-height:1.22;color:var(--ink);
  margin:5px 0 5px}
.brief p{font-size:0.74rem;line-height:1.6;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brief .foot{display:flex;gap:9px;margin-top:7px;font-family:var(--mono);font-size:0.46rem;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--ink3)}
.brief .foot em{font-style:normal;margin-left:auto;color:var(--ink);opacity:0;transform:translateX(-5px);
  transition:.3s var(--ease)}
.brief:hover .foot em{opacity:1;transform:none}

/* ── continued inside ── */
.contd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:12px;
  border-top:3px double var(--rule2);text-decoration:none;color:inherit;transition:.3s var(--ease)}
.contd .n{font-family:var(--serif);font-size:2rem;font-weight:900;color:var(--red);line-height:1}
.contd .tx b{display:block;font-family:var(--serif);font-size:1rem;font-weight:700;color:var(--ink)}
.contd .tx s{display:block;text-decoration:none;font-family:var(--mono);font-size:0.5rem;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.contd .arrow{margin-left:auto;font-family:var(--serif);font-size:1.4rem;color:var(--ink);
  transition:transform .3s var(--ease)}
.contd:hover{color:var(--red)}
.contd:hover .arrow{transform:translateX(7px);color:var(--red)}

/* ── empty state ── */
.empty{position:relative;text-align:center;padding:clamp(34px,6vw,58px) 20px;
  display:flex;flex-direction:column;align-items:center;gap:11px}
.empty .lines{position:absolute;inset:16px;display:flex;flex-direction:column;gap:9px;
  pointer-events:none;opacity:.24}
.empty .lines i{height:7px;background:var(--rule2);border-radius:2px;
  animation:typeset 3.4s var(--ease) infinite}
.empty .lines i:nth-child(2){width:88%;animation-delay:.2s}
.empty .lines i:nth-child(3){width:94%;animation-delay:.4s}
.empty .lines i:nth-child(4){width:70%;animation-delay:.6s}
.empty .lines i:nth-child(5){width:82%;animation-delay:.8s}
@keyframes typeset{0%,100%{opacity:.35}50%{opacity:.9}}
.empty > *:not(.lines){position:relative;z-index:2}
.empty .ico{font-size:2rem}
.empty .lab{font-family:var(--mono);font-size:0.56rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--red);font-weight:700}
.empty p{font-size:0.84rem;color:var(--ink2);max-width:420px;line-height:1.75}

@media(max-width:820px){
  .front{grid-template-columns:1fr}
  .lead{padding:16px 0 16px;border-right:0;border-bottom:1px solid var(--rule)}
  .briefs{padding:14px 0 0}
  .standfirst{columns:1}
}
@media(max-width:760px){.page{width:94%;padding:40px 0 60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001s!important}
  .mast h2 span,.brief{opacity:1;transform:none}
  .rule{transform:none}}
</style>
</head>
<body>
<div class="page">
  <div class="stub">↑ Accessories &amp; Add-ons</div>

  <section class="sheet" id="sheet"></section>

  <div class="stub">↓ Ride Gallery</div>
</div>

<script src="vlog-data.js"></script>
<script>
const V = window.VLOG
const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
const TITLE = 'The Garage Gazette'

/* the masthead is set word by word, so each one gets its own delay */
const mastWords = TITLE.split(' ')
  .map((w, i) => `<span style="--i:${i}">${w}</span>`).join(' ')

const masthead = `
  <div class="mast">
    <div class="over">${V.kicker} · filmed from the saddle · ${V.channelName}</div>
    <div class="rule thick"></div>
    <div class="h2wrap"><h2>${mastWords}</h2></div>
    <div class="rule d2"></div>
    <div class="dateline">
      <span>Vol. I · No. ${V.count}</span>
      <span class="mid">${V.all[0].when.label} edition</span>
      <span><b>Latest vlogs</b> · free to watch</span>
    </div>
    <div class="rule d2"></div>
  </div>`

if (V.isEmpty) {
  document.getElementById('sheet').innerHTML = masthead + `
    <div class="empty">
      <div class="lines"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="ico">📰</div>
      <div class="lab">Page held for the first edition</div>
      <p>Nothing has gone to press yet. The first ride that is filmed takes the
         lead, and the briefs fill the column beside it.</p>
    </div>`
} else {
  build()
}

function build() {
  const lead = V.shown[0]
  const rest = V.shown.slice(1)

  document.getElementById('sheet').innerHTML = masthead + `
    <div class="front">
      <article class="lead">
        <div class="kicker">${lead.cat} · ${lead.type === 'short' ? 'Short' : 'Full film'}${lead.fav ? ' · Pick of the reel' : ''}</div>
        <h3>${lead.title}</h3>
        <div class="byline">
          <span>Filmed &amp; cut by <b>${V.channelName}</b></span>
          <span>${lead.when.label}</span>
          <span>${lead.duration}</span>
          <span>${lead.views} views</span>
        </div>
        <div class="plate" id="plate">
          <img src="${lead.posterBig}" alt="${lead.title}"
               onerror="this.onerror=null;this.src='${lead.still}'" />
          ${lead.clip ? `<video src="${lead.clip}" muted loop playsinline preload="none"></video>` : ''}
          <span class="dots"></span>
          <span class="play">${PLAY}</span>
          <span class="cred">Still · ${lead.when.short}</span>
        </div>
        <div class="cap">Above: ${lead.blurb}</div>
        <div class="standfirst">
          <p>${lead.blurb} The whole thing was shot on the rig bolted to the bike —
          one camera on the bars, one on the tail, and no second takes. What made
          the cut is what happened.</p>
          <p>The rest of the reel runs in the column alongside, and the archive
          carries on past the fold.</p>
        </div>
        <a class="readon" href="${lead.url}" target="_blank" rel="noopener">Watch the film ▸</a>
      </article>

      <div class="briefs">
        <div class="colhead">Also in this edition</div>
        ${rest.map((v, k) => `
          <a class="brief" href="${v.url}" target="_blank" rel="noopener" style="--k:${k}">
            <span class="no">№ ${String(v.n).padStart(2, '0')} · ${v.cat}</span>
            <h4>${v.title}</h4>
            <p>${v.blurb}</p>
            <span class="foot">
              <span>${v.duration}</span><span>${v.when.short}</span>
              <em>Watch ▸</em>
            </span>
          </a>`).join('')}
        <a class="contd" href="${V.page}">
          <span class="n">+${V.more}</span>
          <span class="tx"><b>Continued inside</b><s>the full archive</s></span>
          <span class="arrow">→</span>
        </a>
      </div>
    </div>`

  wire(lead)
}

function wire(lead) {
  const plate = document.getElementById('plate')
  const vid = plate.querySelector('video')
  if (!vid) return

  /* the screen only clears while the plate is being looked at — a page of
     newsprint with a film running in it unattended is just a distraction */
  plate.addEventListener('pointerenter', () => {
    vid.play().then(() => plate.classList.add('run')).catch(() => {})
  })
  plate.addEventListener('pointerleave', () => {
    plate.classList.remove('run'); vid.pause(); vid.currentTime = 0
  })
  plate.addEventListener('click', () => window.open(lead.url, '_blank', 'noopener'))
}
</script>
</body>
</html>
