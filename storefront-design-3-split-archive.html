<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Storefront · 3 · Split Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════
   SPLIT ARCHIVE — no cards at all. The left half is a fixed
   viewing stage; the right half is a scrolling typed index.
   Hovering a line swaps the picture on the left. It reads
   like a catalogue ledger rather than a shop.
   ══════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#131210; --ink2:#1b1a17; --cream:#f0ebe1; --tan:#c9b99c; --burnt:#b4552e;
  --d1:rgba(240,235,225,0.6); --d2:rgba(240,235,225,0.36); --d3:rgba(240,235,225,0.18);
  --hair:rgba(240,235,225,0.13);
  --cond:'Oswald',sans-serif; --sans:'Work Sans',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--burnt);color:var(--cream)}

/* ── fixed viewing stage (left) ── */
.stage{position:fixed;left:0;top:0;bottom:0;width:46vw;z-index:10;
  border-right:1px solid var(--hair);display:flex;flex-direction:column;
  background:radial-gradient(70% 60% at 50% 42%,#1d1b17,var(--ink) 72%);overflow:hidden}
.stage .brand{padding:26px 34px;display:flex;align-items:baseline;gap:12px;z-index:3}
.stage .brand b{font-family:var(--cond);font-weight:300;font-size:1.4rem;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--cream)}
.stage .brand span{font-size:0.6rem;font-weight:500;letter-spacing:0.24em;text-transform:uppercase;color:var(--burnt)}
.stage .brand a{margin-left:auto;font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--d2);text-decoration:none;transition:.25s}
.stage .brand a:hover{color:var(--cream)}

.plate{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:0 8%}
.plate .layer{position:absolute;inset:0 8%;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(1.04);transition:opacity .55s var(--ease),transform .9s var(--ease)}
.plate .layer.on{opacity:1;transform:none}
.plate img{max-width:100%;max-height:66vh;object-fit:contain;
  filter:drop-shadow(0 40px 70px rgba(0,0,0,0.75))}
.plate .ghostno{position:absolute;font-family:var(--cond);font-weight:200;font-size:34vh;line-height:1;
  color:rgba(240,235,225,0.035);user-select:none;pointer-events:none;transition:.5s var(--ease)}
.plate .empty{font-size:0.68rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--d3)}
/* thin scan bar that sweeps when the plate changes */
.plate .sweep{position:absolute;left:8%;right:8%;height:1px;background:var(--burnt);opacity:0;top:50%}
.plate .sweep.go{animation:sweep .75s var(--ease)}
@keyframes sweep{0%{opacity:0;transform:scaleX(0)}30%{opacity:.9;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}

.stage .foot{padding:20px 34px 26px;border-top:1px solid var(--hair);display:flex;
  align-items:flex-end;gap:18px;min-height:118px}
.stage .foot .who{flex:1;min-width:0}
.stage .foot h2{font-family:var(--cond);font-weight:400;font-size:clamp(1.1rem,2vw,1.7rem);
  color:var(--cream);line-height:1.15;letter-spacing:0.01em;
  opacity:0;transform:translateY(10px);transition:.5s var(--ease)}
.stage .foot h2.on{opacity:1;transform:none}
.stage .foot .sub{font-size:0.6rem;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--tan);margin-top:7px;opacity:0;transition:.5s var(--ease) .1s}
.stage .foot .sub.on{opacity:1}
.stage .foot .thumbs{display:flex;gap:6px}
.stage .foot .thumbs button{width:44px;height:44px;padding:0;border:1px solid var(--hair);
  background:transparent;cursor:pointer;overflow:hidden;opacity:0.45;transition:.28s var(--ease)}
.stage .foot .thumbs button:hover{opacity:0.85;transform:translateY(-3px)}
.stage .foot .thumbs button.on{opacity:1;border-color:var(--burnt)}
.stage .foot .thumbs img{width:100%;height:100%;object-fit:cover}
.stage .foot .open{flex-shrink:0;padding:9px 15px;border:1px solid var(--hair);background:transparent;
  color:var(--cream);font-family:var(--sans);font-size:0.6rem;font-weight:600;letter-spacing:0.16em;
  text-transform:uppercase;cursor:pointer;transition:.28s}
.stage .foot .open:hover{background:var(--cream);color:var(--ink)}

/* ── scrolling ledger (right) ── */
.ledger{margin-left:46vw;min-height:100vh;padding:0 clamp(24px,4vw,58px) 90px}
.masthead{padding:96px 0 40px}
.masthead .kick{font-size:0.62rem;font-weight:600;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--burnt);margin-bottom:20px;opacity:0;animation:fade .8s var(--ease) .2s forwards}
.masthead h1{font-family:var(--cond);font-weight:200;font-size:clamp(2.4rem,6vw,4.4rem);line-height:0.98;
  text-transform:uppercase;letter-spacing:0.01em;color:var(--cream)}
.masthead h1 .w{display:block;overflow:hidden}
.masthead h1 .w span{display:block;transform:translateY(105%);animation:rise 1.05s var(--ease) forwards}
.masthead h1 em{font-style:normal;font-weight:500;color:var(--burnt)}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
.masthead p{max-width:400px;margin-top:20px;font-size:0.92rem;line-height:1.8;
  opacity:0;transform:translateY(14px);animation:up .9s var(--ease) .8s forwards}
@keyframes up{to{opacity:1;transform:none}}
.rowline{display:flex;gap:26px;margin-top:26px;padding-top:18px;border-top:1px solid var(--hair);
  opacity:0;transform:translateY(14px);animation:up .9s var(--ease) .95s forwards}
.rowline div b{display:block;font-family:var(--cond);font-weight:300;font-size:1.7rem;color:var(--cream);line-height:1}
.rowline div span{font-size:0.55rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--d2)}

/* jump bar — plain text links, no pills */
.jump{position:sticky;top:0;z-index:20;display:flex;gap:20px;flex-wrap:wrap;padding:16px 0;
  background:linear-gradient(to bottom,var(--ink) 68%,transparent);margin-bottom:12px}
.jump a{font-size:0.62rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--d2);text-decoration:none;padding-bottom:4px;border-bottom:1px solid transparent;transition:.28s}
.jump a:hover{color:var(--cream)}
.jump a.on{color:var(--burnt);border-color:var(--burnt)}

/* group heading is a rule with a word on it */
.group{margin-top:34px;scroll-margin-top:74px}
.group > h3{display:flex;align-items:center;gap:14px;font-family:var(--cond);font-weight:300;
  font-size:0.82rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--tan);margin-bottom:6px}
.group > h3::after{content:'';flex:1;height:1px;background:var(--hair)}
.group > h3 u{text-decoration:none;font-size:0.6rem;color:var(--d3);letter-spacing:0.14em}

/* the row — this replaces the card entirely */
.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:16px;
  padding:19px 10px 19px 6px;border-bottom:1px solid var(--hair);cursor:pointer;position:relative;
  transition:padding .4s var(--ease),background .35s}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--burnt);
  transform:scaleY(0);transform-origin:top;transition:transform .4s var(--ease)}
.row:hover,.row.live{background:rgba(240,235,225,0.028);padding-left:18px}
.row:hover::before,.row.live::before{transform:scaleY(1)}
.row .n{font-family:var(--cond);font-weight:300;font-size:0.86rem;letter-spacing:0.12em;color:var(--d3);
  transition:color .3s}
.row:hover .n,.row.live .n{color:var(--burnt)}
.row .t{min-width:0}
.row .t b{display:block;font-family:var(--cond);font-weight:400;font-size:clamp(1rem,1.8vw,1.35rem);
  letter-spacing:0.02em;color:var(--cream);line-height:1.2;transition:letter-spacing .45s var(--ease)}
.row:hover .t b,.row.live .t b{letter-spacing:0.055em}
.row .t span{display:block;margin-top:5px;font-size:0.62rem;font-weight:500;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--d3)}
.row .r{display:flex;align-items:center;gap:12px}
.row .r .vend{font-size:0.62rem;font-weight:500;letter-spacing:0.1em;color:var(--d2);white-space:nowrap}
.row .r .arrow{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--hair);
  border-radius:50%;color:var(--cream);font-size:0.7rem;transition:.35s var(--ease)}
.row:hover .r .arrow{background:var(--burnt);border-color:var(--burnt);transform:rotate(-45deg)}
.row .star{position:absolute;left:-2px;top:50%;transform:translateY(-50%);font-size:0.5rem;color:var(--burnt)}

/* buy links slide open under the live row */
.drawer{max-height:0;overflow:hidden;transition:max-height .5s var(--ease);border-bottom:1px solid transparent}
.drawer.open{max-height:120px;border-bottom-color:var(--hair)}
.drawer .in{display:flex;gap:9px;flex-wrap:wrap;padding:0 10px 20px 24px}
.buy{padding:11px 20px;text-decoration:none;font-size:0.68rem;font-weight:600;letter-spacing:0.12em;
  text-transform:uppercase;transition:.3s var(--ease)}
.buy.p{background:var(--cream);color:var(--ink)}
.buy.p:hover{background:var(--burnt);color:var(--cream)}
.buy.s{border:1px solid var(--hair);color:var(--cream)}
.buy.s:hover{border-color:var(--cream);background:rgba(240,235,225,0.07)}
.soon{font-size:0.68rem;color:var(--d3);font-style:italic;letter-spacing:0.06em}

.endnote{margin-top:56px;padding-top:26px;border-top:1px solid var(--hair)}
.endnote p{max-width:400px;font-size:0.86rem;line-height:1.8;color:var(--d2)}
.back{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:13px 24px;
  border:1px solid var(--hair);color:var(--cream);text-decoration:none;font-size:0.66rem;
  font-weight:600;letter-spacing:0.16em;text-transform:uppercase;transition:.3s var(--ease)}
.back:hover{background:var(--burnt);border-color:var(--burnt);transform:translateX(-5px)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:999;background:rgba(12,11,9,0.97);display:none;
  align-items:center;justify-content:center;padding:58px}
.lb.on{display:flex;animation:fade2 .3s}
@keyframes fade2{from{opacity:0}}
.lb img{max-width:86vw;max-height:78vh;object-fit:contain;animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.lb .cap{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-family:var(--cond);
  font-weight:300;font-size:0.85rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--tan)}
.lb button{position:absolute;width:44px;height:44px;border:1px solid var(--hair);background:var(--ink2);
  color:var(--cream);font-size:1.05rem;cursor:pointer;transition:.22s}
.lb button:hover{background:var(--cream);color:var(--ink)}
.lb .x{top:24px;right:24px}.lb .prev{left:24px;top:50%}.lb .next{right:24px;top:50%}

@media(max-width:900px){
  .stage{position:sticky;width:100%;height:46svh;bottom:auto;border-right:0;
    border-bottom:1px solid var(--hair);z-index:15}
  .stage .brand{padding:14px 20px 8px}
  .stage .foot{min-height:0;padding:10px 20px 14px;gap:12px}
  .stage .foot h2{font-size:0.98rem}
  .stage .foot .thumbs button{width:36px;height:36px}
  .plate{padding:0 6%}
  .plate img{max-height:24svh}
  .plate .ghostno{font-size:18svh}
  .ledger{margin-left:0;padding:0 20px calc(60px + env(safe-area-inset-bottom))}
  .masthead{padding:34px 0 26px}
  .jump{top:46svh;gap:14px;padding:12px 0}
}
@media(max-width:560px){
  .stage{height:40svh}
  .plate img{max-height:20svh}
  .jump{top:40svh}
  .stage .foot .open{display:none}
  .row{grid-template-columns:38px 1fr;gap:12px;padding:15px 6px}
  .row .r{grid-column:2;justify-content:flex-start;margin-top:6px}
  .row .t b{font-size:1rem}
  .drawer.open{max-height:170px}
  .drawer .in{padding:0 6px 16px 18px}
  .buy{padding:10px 15px;font-size:0.64rem}
}
</style>
</head>
<body>

<!-- fixed viewing stage -->
<aside class="stage">
  <div class="brand">
    <b>Storefront</b><span>Bear 650</span>
    <a href="#">✕ Garage</a>
  </div>
  <div class="plate" id="plate">
    <span class="ghostno" id="ghost">00</span>
    <span class="sweep" id="sweep"></span>
    <span class="empty" id="empty">Hover an entry</span>
  </div>
  <div class="foot">
    <div class="who">
      <h2 id="stName">The Storefront</h2>
      <div class="sub" id="stSub">Every part, in order</div>
    </div>
    <div class="thumbs" id="stThumbs"></div>
    <button class="open" id="stOpen">Enlarge</button>
  </div>
</aside>

<!-- scrolling ledger -->
<main class="ledger">
  <header class="masthead">
    <div class="kick">Index of parts · as fitted</div>
    <h1>
      <span class="w"><span style="animation-delay:.18s">The full</span></span>
      <span class="w"><span style="animation-delay:.32s"><em>ledger</em></span></span>
    </h1>
    <p id="lede"></p>
    <div class="rowline" id="rowline"></div>
  </header>
  <nav class="jump" id="jump"></nav>
  <div id="groups"></div>
  <div class="endnote">
    <p>Bought, fitted, ridden. When something gets replaced it comes off this list — so what you see is only what's actually on the bike today.</p>
    <a class="back" href="#">← Back to My Garage</a>
  </div>
</main>

<div class="lb" id="lb">
  <button class="x" onclick="closeLb()">✕</button>
  <button class="prev" onclick="stepLb(-1)">‹</button>
  <button class="next" onclick="stepLb(1)">›</button>
  <img id="lbImg" alt="" />
  <div class="cap" id="lbCap"></div>
</div>

<script src="storefront-data.js"></script>
<script>
document.getElementById('lede').textContent = SF.note
document.getElementById('rowline').innerHTML = [
  ['Entries', SF.count], ['Groups', SF.cats.length], ['Plates', SF.photoCount], ['Sources', SF.vendors.length],
].map(([l, v]) => `<div><b>${String(v).padStart(2, '0')}</b><span>${l}</span></div>`).join('')

document.getElementById('jump').innerHTML = SF.cats.map(c =>
  `<a href="#g-${c.id}" data-for="g-${c.id}">${c.label}</a>`).join('')

/* the ledger: text rows, no cards */
let seq = 0
document.getElementById('groups').innerHTML = SF.cats.map(c => `
  <section class="group" id="g-${c.id}">
    <h3>${c.icon} ${c.label} <u>${String(c.items.length).padStart(2, '0')}</u></h3>
    ${c.items.map(it => row(it, c, ++seq)).join('')}
  </section>`).join('')

function row(it, c, n) {
  const imgs = it.imgs.map(f => SF.url(f))
  return `<div class="row" data-n="${String(n).padStart(2, '0')}" data-name="${it.name}"
      data-sub="${c.label} · ${imgs.length || 'no'} ${imgs.length === 1 ? 'plate' : 'plates'}"
      data-imgs='${JSON.stringify(imgs)}'>
    ${it.featured ? '<span class="star">★</span>' : ''}
    <span class="n">${String(n).padStart(2, '0')}</span>
    <span class="t"><b>${it.name}</b><span>${c.label}</span></span>
    <span class="r">
      <span class="vend">${it.links.map(l => l[0]).join(' · ') || '—'}</span>
      <span class="arrow">↗</span>
    </span>
  </div>
  <div class="drawer"><div class="in">
    ${it.links.length ? it.links.map(([v, u], k) =>
      `<a class="buy ${k === 0 ? 'p' : 's'}" href="${u}" target="_blank" rel="noopener noreferrer">Buy on ${v}</a>`).join('')
      : '<span class="soon">Link coming soon</span>'}
  </div></div>`
}

/* ── the stage reacts to whichever row you're on ── */
const plate = document.getElementById('plate'), ghost = document.getElementById('ghost')
const empty = document.getElementById('empty'), sweep = document.getElementById('sweep')
const stName = document.getElementById('stName'), stSub = document.getElementById('stSub')
const stThumbs = document.getElementById('stThumbs')
let live = null, set = [], at = 0, who = ''

function show(rowEl, index = 0) {
  const imgs = JSON.parse(rowEl.dataset.imgs)
  set = imgs; at = index; who = rowEl.dataset.name
  ghost.textContent = rowEl.dataset.n
  stName.textContent = rowEl.dataset.name
  stSub.textContent = rowEl.dataset.sub
  stName.classList.add('on'); stSub.classList.add('on')
  empty.style.display = imgs.length ? 'none' : 'block'

  /* cross-fade: keep the outgoing plate around for the length of the fade */
  plate.querySelectorAll('.layer').forEach(l => {
    l.classList.remove('on')
    setTimeout(() => l.remove(), 560)
  })
  if (imgs.length) {
    const layer = document.createElement('div')
    layer.className = 'layer'
    layer.innerHTML = `<img src="${imgs[index]}" alt="${who}" />`
    plate.appendChild(layer)
    requestAnimationFrame(() => layer.classList.add('on'))
  }
  sweep.classList.remove('go'); void sweep.offsetWidth; sweep.classList.add('go')

  stThumbs.innerHTML = imgs.length > 1
    ? imgs.map((s, k) => `<button class="${k === index ? 'on' : ''}" data-k="${k}"><img src="${s}" alt="" /></button>`).join('')
    : ''
}

const rows = [...document.querySelectorAll('.row')]
rows.forEach(r => {
  r.addEventListener('mouseenter', () => show(r, 0))
  r.addEventListener('click', () => {
    const isLive = r.classList.contains('live')
    rows.forEach(x => { x.classList.remove('live'); x.nextElementSibling.classList.remove('open') })
    if (!isLive) { r.classList.add('live'); r.nextElementSibling.classList.add('open'); show(r, 0) }
    live = isLive ? null : r
  })
})
stThumbs.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  const k = +b.dataset.k
  at = k
  const target = live || rows.find(r => r.dataset.name === who)
  if (target) show(target, k)
})
document.getElementById('stOpen').addEventListener('click', () => { if (set.length) openLb() })

/* on scroll, keep the stage showing whatever row is nearest the middle */
const near = new IntersectionObserver(es => {
  if (live) return
  const hit = es.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]
  if (hit) show(hit.target, 0)
}, { rootMargin: '-42% 0px -42% 0px', threshold: [0, 1] })
rows.forEach(r => near.observe(r))

/* active jump link */
const links = [...document.querySelectorAll('.jump a')]
const gspy = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.for === e.target.id))
}), { rootMargin: '-80px 0px -70% 0px' })
document.querySelectorAll('.group').forEach(g => gspy.observe(g))

/* first entry primes the stage */
if (rows.length) show(rows[0], 0)

/* lightbox */
function openLb() { paint(); document.getElementById('lb').classList.add('on') }
function paint() {
  document.getElementById('lbImg').src = set[at]
  document.getElementById('lbCap').textContent = `${who} — plate ${at + 1} of ${set.length}`
}
function stepLb(d) { at = (at + d + set.length) % set.length; paint() }
function closeLb() { document.getElementById('lb').classList.remove('on') }
document.getElementById('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLb() })
addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('on')) return
  if (e.key === 'Escape') closeLb()
  if (e.key === 'ArrowRight') stepLb(1)
  if (e.key === 'ArrowLeft') stepLb(-1)
})
</script>
</body>
</html>
