<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Garage Journey — Theme Picker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Caveat:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#08070e; --panel:#0e0c17; --card:#141220; --card2:#1a1828;
      --text:rgba(240,238,246,0.65); --text-h:#f0eef6; --dim:rgba(240,238,246,0.4); --dim2:rgba(240,238,246,0.22);
      --accent:#8b5cf6; --accent2:#a78bfa; --accbg:rgba(139,92,246,0.12);
      --honey:#e0bb3c; --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
      --sans:'Inter',sans-serif; --heading:'Playfair Display',serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
    .layout{display:flex;height:100vh}
    .sidebar{width:250px;flex-shrink:0;background:#0b0912;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0}
    .sidebar-title{font-size:0.66rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent2);padding:0 16px 14px;border-bottom:1px solid var(--border)}
    .design-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
    .design-btn{padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--sans);font-size:0.78rem;text-align:left;transition:all .2s;cursor:pointer}
    .design-btn:hover{border-color:var(--accent);color:var(--text-h);background:rgba(139,92,246,0.06)}
    .design-btn.active{border-color:var(--accent);background:rgba(139,92,246,0.14);color:var(--text-h)}
    .btn-name{font-weight:700;display:block;margin-bottom:3px}
    .btn-desc{font-size:0.64rem;opacity:.55;display:block;line-height:1.45}
    .badge{font-size:0.55rem;padding:2px 7px;border-radius:99px;background:rgba(139,92,246,0.18);color:var(--accent2);border:1px solid rgba(167,139,250,0.25);font-weight:700;margin-top:6px;display:inline-block;letter-spacing:.06em}
    .sidebar-foot{padding:12px 16px 0;border-top:1px solid var(--border);font-size:0.6rem;line-height:1.6;color:var(--dim)}

    .preview{flex:1;overflow-y:auto;padding:34px 40px 90px}
    .preview-inner{max-width:1180px;margin:0 auto}
    .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
    .head-name{font-family:var(--heading);font-size:1.7rem;color:var(--text-h);line-height:1.1}
    .head-sub{font-size:0.76rem;color:var(--dim);margin-top:6px;max-width:560px;line-height:1.5}
    .replay{padding:9px 16px;border-radius:99px;border:1px solid var(--border2);background:var(--card2);color:var(--text-h);font-family:var(--sans);font-size:0.72rem;font-weight:600;cursor:pointer;transition:all .2s;flex-shrink:0}
    .replay:hover{border-color:var(--accent);background:var(--accbg);color:var(--accent2)}
    .shell{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
    .nav{display:flex;gap:8px;margin-top:30px;justify-content:center}
    .nav button{padding:8px 18px;border-radius:99px;border:1px solid var(--border2);background:transparent;color:var(--text);font-family:var(--sans);font-size:0.72rem;cursor:pointer;transition:all .2s}
    .nav button:hover{border-color:var(--accent2);color:var(--text-h)}

    /* ═══════ shared reveal ═══════ */
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
    @keyframes fadein{from{opacity:0}to{opacity:1}}

    /* ═══════════════════════════════════════════════════════════
       A — ODOMETER REEL
       ═══════════════════════════════════════════════════════════ */
    .odo{background:linear-gradient(170deg,#151310,#0d0b09 60%);padding:24px}
    .odo-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;margin-bottom:6px;border-bottom:1px solid rgba(224,187,60,0.16);flex-wrap:wrap}
    .odo-eyebrow{font-family:var(--mono);font-size:0.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--honey);opacity:.85}
    .odo-title{font-family:var(--heading);font-size:1.35rem;color:#f6f0e2;margin-top:5px}
    .odo-total{text-align:right;font-family:var(--mono)}
    .odo-total b{font-size:1.5rem;color:var(--honey);font-weight:700;letter-spacing:-0.02em}
    .odo-total span{display:block;font-size:0.52rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(246,240,226,0.35);margin-top:3px}

    .odo-row{display:grid;grid-template-columns:52px 1fr 190px 108px;align-items:center;gap:16px;padding:15px 4px;border-bottom:1px solid rgba(255,255,255,0.05);opacity:0;animation:odoRow .62s cubic-bezier(.22,1,.36,1) forwards;transition:background .25s}
    .odo-row:last-child{border-bottom:none}
    .odo-row:hover{background:rgba(224,187,60,0.045)}
    @keyframes odoRow{from{opacity:0;transform:translateX(-26px) rotateX(-14deg)}to{opacity:1;transform:none}}
    .odo-ch{font-family:var(--mono);font-size:0.8rem;color:rgba(246,240,226,0.28);letter-spacing:.06em}
    .odo-row.now .odo-ch{color:var(--honey)}
    .odo-name{font-size:0.92rem;font-weight:700;color:#f6f0e2}
    .odo-type{font-family:var(--mono);font-size:0.58rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(246,240,226,0.34);margin-top:3px}
    .odo-note{font-size:0.68rem;color:rgba(246,240,226,0.5);margin-top:6px;line-height:1.5;max-width:420px}

    /* the reel */
    .reel-wrap{display:flex;align-items:baseline;gap:5px;justify-content:flex-end}
    .reel-box{display:flex;gap:2px;padding:5px 6px;border-radius:6px;
      background:linear-gradient(180deg,#0a0908,#1c1813 45%,#0a0908);
      border:1px solid rgba(224,187,60,0.22);
      box-shadow:inset 0 2px 6px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.5)}
    .reel{height:1.5em;overflow:hidden;font-family:var(--mono);font-size:1.28rem;font-weight:700;line-height:1.5em;width:0.78em;text-align:center;position:relative}
    .reel::after{content:'';position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,.85),transparent 32%,transparent 68%,rgba(0,0,0,.85))}
    .reel-strip{display:block;color:var(--honey);animation:roll 1.5s cubic-bezier(.16,.9,.2,1) forwards;transform:translateY(0)}
    @keyframes roll{from{transform:translateY(0)}to{transform:translateY(var(--land))}}
    .reel-dot{font-family:var(--mono);font-size:1.28rem;font-weight:700;color:var(--honey);align-self:flex-end;padding-bottom:2px}
    .reel-unit{font-family:var(--mono);font-size:0.58rem;letter-spacing:.14em;color:rgba(246,240,226,0.4);text-transform:uppercase}
    .reel-flat{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:rgba(246,240,226,0.42);letter-spacing:.04em;padding:5px 8px;border-radius:6px;border:1px dashed rgba(246,240,226,0.2)}

    .odo-gauge{position:relative;height:34px}
    .odo-gauge-track{position:absolute;left:0;right:0;top:15px;height:3px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden}
    .odo-gauge-fill{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,rgba(224,187,60,.35),var(--honey));animation:gaugeGrow 1.3s cubic-bezier(.22,1,.36,1) forwards;box-shadow:0 0 8px rgba(224,187,60,.5)}
    @keyframes gaugeGrow{to{width:var(--w)}}
    .odo-ticks{position:absolute;left:0;right:0;top:22px;display:flex;justify-content:space-between}
    .odo-ticks i{width:1px;height:5px;background:rgba(255,255,255,0.1)}
    .odo-stat{font-family:var(--mono);font-size:0.54rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid;white-space:nowrap;text-align:center;opacity:0;animation:fadein .5s .9s forwards}

    /* ═══════════════════════════════════════════════════════════
       B — HIGHWAY MILESTONES
       ═══════════════════════════════════════════════════════════ */
    .hw{position:relative;padding:26px 24px 0;background:radial-gradient(120% 90% at 50% 120%,rgba(139,92,246,0.13),transparent 65%),#0b0913;overflow:hidden}
    .hw-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap;position:relative;z-index:3}
    .hw-eyebrow{font-size:0.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent2)}
    .hw-title{font-family:var(--heading);font-size:1.35rem;color:var(--text-h);margin-top:5px}
    .hw-sub{font-size:0.72rem;color:var(--dim);margin-top:5px}
    .hw-odo{font-family:var(--mono);font-size:0.62rem;color:var(--dim);text-align:right}
    .hw-odo b{display:block;font-size:1.35rem;color:var(--accent2);letter-spacing:-0.02em}

    .hw-stage{position:relative;padding:26px 0 0;z-index:2}
    .hw-stones{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end;position:relative;z-index:2}
    .stone{opacity:0;animation:stonePop .7s cubic-bezier(.34,1.56,.64,1) forwards;cursor:default}
    @keyframes stonePop{0%{opacity:0;transform:translateY(46px) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
    .stone-body{border-radius:16px 16px 5px 5px;overflow:hidden;border:1px solid var(--border);background:var(--card2);transition:transform .28s cubic-bezier(.34,1.4,.64,1),box-shadow .28s,border-color .28s}
    .stone:hover .stone-body{transform:translateY(-7px);border-color:var(--accent);box-shadow:0 14px 34px -12px rgba(139,92,246,.55)}
    .stone.now .stone-body{border-color:rgba(139,92,246,.5);box-shadow:0 0 0 1px rgba(139,92,246,.25),0 14px 40px -16px rgba(139,92,246,.6)}
    .stone.next .stone-body{border-style:dashed;background:transparent}
    .stone-cap{padding:11px 12px 10px;text-align:center;background:linear-gradient(180deg,var(--accent),#6d3fd4);color:#fff;position:relative;overflow:hidden}
    .stone.next .stone-cap{background:linear-gradient(180deg,#3b3550,#2a2540)}
    .stone-cap::after{content:'';position:absolute;top:0;bottom:0;width:36%;left:-45%;
      background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);animation:sheen 2.6s 1.1s infinite}
    @keyframes sheen{0%{left:-45%}55%,100%{left:130%}}
    .stone-cc{font-size:1.5rem;font-weight:900;line-height:1;letter-spacing:-0.03em}
    .stone-unit{font-size:0.52rem;letter-spacing:.2em;text-transform:uppercase;opacity:.8;margin-top:3px}
    .stone-mid{padding:12px 12px 13px;text-align:center}
    .stone-icon{font-size:1.4rem;line-height:1;margin-bottom:8px;display:inline-block;animation:bob 3.2s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .stone.next .stone-icon{filter:grayscale(1) opacity(.5);animation:none}
    .stone-name{font-size:0.76rem;font-weight:700;color:var(--text-h);line-height:1.3}
    .stone-type{font-size:0.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:4px}
    .stone-note{font-size:0.63rem;color:var(--text);line-height:1.5;margin-top:8px;max-height:0;overflow:hidden;opacity:0;transition:max-height .38s ease,opacity .3s,margin-top .3s}
    .stone:hover .stone-note{max-height:80px;opacity:1}
    .stone-ch{position:absolute;top:8px;left:10px;font-family:var(--mono);font-size:0.56rem;color:rgba(255,255,255,.55);z-index:2}

    /* the road */
    .road{position:relative;height:96px;margin-top:20px;
      background:linear-gradient(180deg,#191527,#0d0b16);border-top:1px solid var(--border2)}
    .road::before,.road::after{content:'';position:absolute;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 18px,transparent 18px 40px)}
    .road::before{top:14px}
    .road::after{bottom:14px}
    .road-center{position:absolute;top:48px;left:0;right:0;height:3px;
      background:repeating-linear-gradient(90deg,var(--accent2) 0 30px,transparent 30px 66px);
      animation:dash 1.5s linear infinite;opacity:.75}
    @keyframes dash{to{background-position-x:96px}}
    .road-glow{position:absolute;top:0;bottom:0;width:190px;left:-190px;pointer-events:none;
      background:radial-gradient(60% 70% at 50% 50%,rgba(224,187,60,.32),transparent 70%);
      animation:sweep 4.2s cubic-bezier(.4,0,.6,1) infinite}
    @keyframes sweep{0%{left:-190px}100%{left:100%}}
    .road-km{position:absolute;bottom:24px;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;
      font-family:var(--mono);font-size:0.56rem;letter-spacing:.1em;color:var(--dim2)}
    .hw-foot{position:relative;z-index:3;border-top:1px solid var(--border);padding:12px 0;text-align:center;font-size:.7rem;font-style:italic;color:var(--text)}

    /* ═══════════════════════════════════════════════════════════
       C — BLUEPRINT DRAFT
       ═══════════════════════════════════════════════════════════ */
    .bp{--ink:#7dd3fc;--ink2:#bae6fd;padding:24px;background:#070d14;position:relative;
      background-image:linear-gradient(rgba(125,211,252,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.07) 1px,transparent 1px);
      background-size:22px 22px}
    .bp::before{content:'';position:absolute;inset:12px;border:1px solid rgba(125,211,252,.2);pointer-events:none;
      clip-path:inset(0 0 0 0);animation:frameDraw 1.1s ease forwards}
    @keyframes frameDraw{from{clip-path:inset(0 100% 100% 0)}to{clip-path:inset(0 0 0 0)}}
    .bp-inner{position:relative;padding:14px}
    .bp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
      padding-bottom:14px;border-bottom:1px dashed rgba(125,211,252,.3);margin-bottom:22px}
    .bp-t{font-family:var(--mono)}
    .bp-t .l1{font-size:.55rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink);opacity:.75}
    .bp-t .l2{font-size:1.2rem;font-weight:700;color:var(--ink2);letter-spacing:.03em;margin-top:6px;
      overflow:hidden;white-space:nowrap;border-right:2px solid var(--ink);
      width:0;animation:type 1.1s steps(28) .25s forwards,caret .7s step-end 6}
    @keyframes type{to{width:var(--ch)}}
    @keyframes caret{50%{border-color:transparent}}
    .bp-meta{font-family:var(--mono);font-size:.52rem;line-height:1.9;color:rgba(186,230,253,.45);text-align:right;letter-spacing:.08em}
    .bp-meta b{color:var(--ink)}

    .bp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
    .bp-cell{position:relative;padding-top:30px}
    .bp-dim{position:absolute;top:9px;left:0;right:0;height:12px}
    .bp-dim i{position:absolute;top:5px;left:0;right:0;height:1px;background:var(--ink);opacity:.45;
      transform:scaleX(0);transform-origin:0 50%;animation:dimGrow .5s ease forwards}
    @keyframes dimGrow{to{transform:scaleX(1)}}
    .bp-dim s{position:absolute;top:0;width:1px;height:11px;background:var(--ink);opacity:.55}
    .bp-dim s:first-of-type{left:0}
    .bp-dim s:last-of-type{right:0}
    .bp-dim em{position:absolute;top:-4px;left:50%;transform:translateX(-50%);background:#070d14;padding:0 5px;
      font-family:var(--mono);font-size:.5rem;font-style:normal;color:var(--ink);letter-spacing:.1em;opacity:0;animation:fadein .4s .45s forwards}

    .bp-card{border:1px solid rgba(125,211,252,.3);padding:13px 13px 15px;background:rgba(125,211,252,.03);
      clip-path:inset(0 100% 100% 0);animation:cardDraw .6s cubic-bezier(.5,0,.3,1) forwards;transition:background .25s,border-color .25s}
    @keyframes cardDraw{to{clip-path:inset(0 0 0 0)}}
    .bp-card:hover{background:rgba(125,211,252,.09);border-color:var(--ink)}
    .bp-card.now{border-color:var(--ink);background:rgba(125,211,252,.09);box-shadow:0 0 0 1px rgba(125,211,252,.25),inset 0 0 30px rgba(125,211,252,.06)}
    .bp-card.next{border-style:dashed;opacity:.72}
    .bp-ch{font-family:var(--mono);font-size:.5rem;letter-spacing:.16em;color:rgba(186,230,253,.4);display:flex;justify-content:space-between}
    .bp-cc{font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--ink2);margin:9px 0 2px;letter-spacing:-.02em;line-height:1}
    .bp-cc small{font-size:.5rem;letter-spacing:.12em;opacity:.6;font-weight:400}
    .bp-svg{display:block;width:100%;height:26px;margin:6px 0 10px}
    .bp-svg path{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
      animation:trace 1.2s ease forwards}
    @keyframes trace{to{stroke-dashoffset:0}}
    .bp-name{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--ink2);line-height:1.35;letter-spacing:.01em}
    .bp-type{font-family:var(--mono);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(186,230,253,.42);margin-top:4px}
    .bp-note{font-family:var(--sans);font-size:.63rem;color:rgba(186,230,253,.55);line-height:1.5;margin-top:9px}
    .bp-tag{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:.48rem;letter-spacing:.14em;text-transform:uppercase;
      border:1px solid;padding:2px 6px;opacity:0;animation:fadein .5s 1s forwards}
    .bp-cross{position:absolute;width:9px;height:9px;pointer-events:none;opacity:.5;animation:blink 2.4s infinite}
    .bp-cross::before,.bp-cross::after{content:'';position:absolute;background:var(--ink)}
    .bp-cross::before{left:4px;top:0;width:1px;height:9px}
    .bp-cross::after{top:4px;left:0;height:1px;width:9px}
    @keyframes blink{0%,100%{opacity:.5}50%{opacity:.12}}
    .bp-foot{font-family:var(--mono);font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(186,230,253,.35);
      margin-top:20px;padding-top:12px;border-top:1px dashed rgba(125,211,252,.25);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

    /* ═══════════════════════════════════════════════════════════
       D — BOARDING PASS STACK
       ═══════════════════════════════════════════════════════════ */
    .bpass{padding:26px 24px;background:linear-gradient(160deg,#100e1c,#0a0813 70%)}
    .bpass-head{text-align:center;margin-bottom:26px}
    .bpass-eyebrow{font-family:var(--mono);font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:#5eead4}
    .bpass-title{font-family:var(--heading);font-size:1.4rem;color:var(--text-h);margin-top:7px}
    .bpass-sub{font-size:.72rem;color:var(--dim);margin-top:6px}
    .bpass-row{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;perspective:1400px}
    .pass{position:relative;border-radius:11px;background:linear-gradient(165deg,#211d33,#171426);border:1px solid var(--border2);
      overflow:hidden;transform-style:preserve-3d;opacity:0;
      animation:passIn .8s cubic-bezier(.22,1,.36,1) forwards;transition:transform .35s cubic-bezier(.34,1.4,.64,1),box-shadow .35s,border-color .35s}
    @keyframes passIn{0%{opacity:0;transform:rotateY(-58deg) translateX(-30px) scale(.94)}100%{opacity:1;transform:none}}
    .pass:hover{transform:translateY(-9px) rotateY(-7deg) scale(1.025);box-shadow:-14px 20px 44px -16px rgba(0,0,0,.85);border-color:#5eead4;z-index:5}
    .pass.now{border-color:rgba(94,234,212,.5);box-shadow:0 0 0 1px rgba(94,234,212,.22),0 18px 44px -20px rgba(94,234,212,.5)}
    .pass.next{border-style:dashed;background:linear-gradient(165deg,#1a1828,#121020)}
    .pass-top{padding:11px 12px 9px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;
      font-family:var(--mono);font-size:.54rem;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
    .pass-top b{color:#5eead4}
    /* perforation */
    .perf{position:relative;height:16px;display:flex;align-items:center;justify-content:center;gap:5px}
    .perf::before,.perf::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#0a0813;top:1px}
    .perf::before{left:-8px}
    .perf::after{right:-8px}
    .perf i{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.16)}
    .pass-mid{padding:4px 12px 12px;text-align:center}
    .pass-icon{font-size:1.6rem;line-height:1;display:inline-block;animation:tilt 4s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    .pass.next .pass-icon{filter:grayscale(1) opacity(.45);animation:none}
    .pass-cc{font-size:1.45rem;font-weight:900;color:var(--text-h);letter-spacing:-.03em;line-height:1;margin-top:9px}
    .pass-cc small{font-size:.5rem;font-weight:600;letter-spacing:.14em;color:var(--dim);display:block;margin-top:3px;text-transform:uppercase}
    .pass-name{font-size:.75rem;font-weight:700;color:var(--text-h);line-height:1.3;margin-top:11px}
    .pass-type{font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:4px}
    .pass-note{font-size:.62rem;color:var(--text);line-height:1.5;margin-top:9px;text-align:left}
    /* stamp */
    .stamp{position:absolute;top:44px;right:6px;font-family:var(--mono);font-size:.5rem;font-weight:700;letter-spacing:.14em;
      text-transform:uppercase;padding:3px 7px;border:1.5px solid;border-radius:3px;transform:rotate(-13deg) scale(2.4);opacity:0;
      animation:thud .5s cubic-bezier(.3,1.7,.5,1) forwards;z-index:3}
    @keyframes thud{0%{opacity:0;transform:rotate(-13deg) scale(2.4)}70%{opacity:1;transform:rotate(-13deg) scale(.94)}100%{opacity:1;transform:rotate(-13deg) scale(1)}}
    /* barcode */
    .bars{display:flex;gap:1.5px;align-items:flex-end;height:22px;padding:0 12px 11px;overflow:hidden}
    .bars i{flex:1;background:rgba(255,255,255,.28);transform:scaleY(0);transform-origin:bottom;animation:barUp .4s ease forwards}
    @keyframes barUp{to{transform:scaleY(1)}}
    .pass-foot{border-top:1px dashed var(--border2);padding:8px 12px;font-family:var(--mono);font-size:.5rem;
      letter-spacing:.1em;color:var(--dim2);display:flex;justify-content:space-between}
    .bpass-foot{text-align:center;margin-top:24px;font-size:.72rem;font-style:italic;color:var(--text)}

    /* ═══════════════════════════════════════════════════════════
       E — TACHOMETER / GEARBOX
       ═══════════════════════════════════════════════════════════ */
    .tach{display:grid;grid-template-columns:270px 1fr;gap:0;background:#08070c}
    .tach-left{padding:26px 22px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;
      background:radial-gradient(90% 60% at 50% 30%,rgba(239,68,68,.09),transparent 70%)}
    .tach-eyebrow{font-family:var(--mono);font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;color:#f87171;text-align:center}
    .tach-title{font-family:var(--heading);font-size:1.2rem;color:var(--text-h);text-align:center;margin:6px 0 18px;line-height:1.2}
    .dial{position:relative;width:210px;height:210px}
    .dial svg{position:absolute;inset:0;transform:rotate(135deg)}
    .dial-arc{fill:none;stroke:rgba(255,255,255,.07);stroke-width:9;stroke-linecap:round}
    .dial-fill{fill:none;stroke:url(#tachGrad);stroke-width:9;stroke-linecap:round;
      stroke-dasharray:var(--c);stroke-dashoffset:var(--c);animation:arcFill 1.6s cubic-bezier(.22,1,.36,1) .2s forwards}
    @keyframes arcFill{to{stroke-dashoffset:var(--off)}}
    .needle{position:absolute;left:50%;bottom:50%;width:2.5px;height:82px;margin-left:-1.25px;transform-origin:50% 100%;
      background:linear-gradient(180deg,#ef4444,#fca5a5);border-radius:2px;
      transform:rotate(-135deg);animation:needleSweep 1.9s cubic-bezier(.3,1.35,.5,1) .2s forwards;
      box-shadow:0 0 10px rgba(239,68,68,.65);z-index:3}
    @keyframes needleSweep{0%{transform:rotate(-135deg)}70%{transform:rotate(calc(var(--deg) + 11deg))}100%{transform:rotate(var(--deg))}}
    .hub{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
      background:linear-gradient(160deg,#2a2733,#12111a);border:1px solid var(--border2);z-index:4}
    .dial-read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:34px;z-index:2}
    .dial-cc{font-family:var(--mono);font-size:1.65rem;font-weight:700;color:var(--text-h);line-height:1;letter-spacing:-.02em}
    .dial-lbl{font-family:var(--mono);font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:5px}
    .dial-gear{font-family:var(--heading);font-size:.95rem;color:#f87171;margin-top:7px}
    .dial-marks{position:absolute;inset:0}
    .dial-marks i{position:absolute;left:50%;top:50%;width:1px;height:96px;margin-left:-.5px;transform-origin:50% 100%;
      background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 40%)}
    .tach-hint{font-family:var(--mono);font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-top:18px;text-align:center;line-height:1.8}

    .tach-right{padding:22px 22px}
    .gear{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:13px 14px;border-radius:11px;
      border:1px solid var(--border);background:var(--card2);margin-bottom:9px;cursor:pointer;opacity:0;
      animation:gearIn .55s cubic-bezier(.22,1,.36,1) forwards;
      transition:transform .22s cubic-bezier(.34,1.5,.64,1),border-color .22s,background .22s,box-shadow .22s}
    @keyframes gearIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
    .gear:last-child{margin-bottom:0}
    .gear:hover{transform:translateX(7px);border-color:#f87171;background:rgba(239,68,68,.07)}
    .gear.sel{border-color:#ef4444;background:rgba(239,68,68,.11);box-shadow:0 0 0 1px rgba(239,68,68,.25),-6px 0 0 0 #ef4444;transform:translateX(7px)}
    .gear.next{border-style:dashed;opacity:.001;animation-name:gearInDash}
    @keyframes gearInDash{from{opacity:0;transform:translateX(34px)}to{opacity:.8;transform:none}}
    .gear-no{font-family:var(--heading);font-size:1.5rem;color:var(--dim2);text-align:center;line-height:1;transition:color .22s}
    .gear.sel .gear-no,.gear:hover .gear-no{color:#f87171}
    .gear-no small{display:block;font-family:var(--mono);font-size:.44rem;letter-spacing:.14em;margin-top:3px;color:var(--dim2)}
    .gear-name{font-size:.86rem;font-weight:700;color:var(--text-h)}
    .gear-type{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:3px}
    .gear-note{font-size:.65rem;color:var(--text);line-height:1.5;margin-top:6px;max-width:430px}
    .gear-cc{font-family:var(--mono);text-align:right}
    .gear-cc b{font-size:1.15rem;color:var(--text-h);letter-spacing:-.02em}
    .gear-cc span{display:block;font-size:.48rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:3px}
    .gear-bar{grid-column:1/-1;height:2px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:10px}
    .gear-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7f1d1d,#ef4444);animation:gaugeGrow 1s cubic-bezier(.22,1,.36,1) forwards}
    .tach-foot{grid-column:1/-1;border-top:1px solid var(--border);padding:12px;text-align:center;font-size:.72rem;font-style:italic;color:var(--text)}

    /* ═══════════════════════════════════════════════════════════
       F — FILM STRIP
       ═══════════════════════════════════════════════════════════ */
    .film{background:#0a0a0a;padding:0 0 22px;position:relative;overflow:hidden}
    .film-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:22px 24px 18px}
    .film-eyebrow{font-family:var(--mono);font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:#fbbf24}
    .film-title{font-family:'Bebas Neue',var(--heading);font-size:2rem;letter-spacing:.06em;color:#f5f2e8;line-height:1;margin-top:8px}
    .film-meta{font-family:var(--mono);font-size:.52rem;letter-spacing:.14em;color:rgba(245,242,232,.35);text-align:right;line-height:1.9}
    .film-meta b{color:#fbbf24}
    /* sprocket rails */
    .strip{position:relative;background:#141414;border-top:1px solid #262626;border-bottom:1px solid #262626;padding:26px 0}
    .strip::before,.strip::after{content:'';position:absolute;left:0;right:0;height:18px;
      background-image:radial-gradient(closest-side,#f5f2e8 96%,transparent);background-size:34px 12px;background-repeat:repeat-x;
      background-position:0 50%;opacity:.85;animation:sprocket 1.1s linear infinite}
    .strip::before{top:5px}
    .strip::after{bottom:5px}
    @keyframes sprocket{to{background-position:34px 50%}}
    .frames{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:0 3px}
    .frame{position:relative;background:#000;border-left:2px solid #0a0a0a;border-right:2px solid #0a0a0a;
      opacity:0;animation:flicker 1s steps(1) forwards;overflow:hidden}
    @keyframes flicker{0%{opacity:0}18%{opacity:.55}26%{opacity:.1}42%{opacity:.85}52%{opacity:.35}70%{opacity:1}78%{opacity:.7}100%{opacity:1}}
    .frame-img{height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;
      background:radial-gradient(80% 70% at 50% 40%,#3a3222,#100e0a 75%)}
    .frame.now .frame-img{background:radial-gradient(80% 70% at 50% 40%,#5c4a1e,#14110a 75%)}
    .frame.next .frame-img{background:repeating-linear-gradient(45deg,#131313 0 8px,#0d0d0d 8px 16px)}
    .frame-icon{font-size:2.1rem;line-height:1;filter:drop-shadow(0 3px 10px rgba(0,0,0,.8))}
    .frame.next .frame-icon{filter:grayscale(1) opacity(.4)}
    .frame-cc{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.05em;color:#fbbf24;line-height:1}
    .frame-cc small{font-family:var(--mono);font-size:.44rem;letter-spacing:.16em;opacity:.65;margin-left:3px}
    .frame-no{position:absolute;top:5px;left:6px;font-family:var(--mono);font-size:.46rem;letter-spacing:.1em;color:rgba(251,191,36,.55)}
    .frame-edge{position:absolute;top:5px;right:6px;font-family:var(--mono);font-size:.46rem;color:rgba(245,242,232,.2)}
    .frame-cap{padding:10px 11px 12px;background:#0d0d0d;border-top:1px solid #1f1f1f}
    .frame-name{font-size:.74rem;font-weight:700;color:#f5f2e8;line-height:1.3}
    .frame-type{font-family:var(--mono);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,242,232,.35);margin-top:4px}
    .frame-note{font-size:.62rem;color:rgba(245,242,232,.5);line-height:1.5;margin-top:7px}
    /* projector burn on the live frame + grain over everything */
    .frame.now::after{content:'';position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(60% 45% at 50% 30%,rgba(251,191,36,.16),transparent 70%);animation:burn 2.6s ease-in-out infinite}
    @keyframes burn{0%,100%{opacity:.5}50%{opacity:1}}
    .grain{position:absolute;inset:0;pointer-events:none;opacity:.055;z-index:6;
      background-image:repeating-conic-gradient(#fff 0 25%,transparent 0 50%);background-size:3px 3px;animation:grainShift .12s steps(3) infinite}
    @keyframes grainShift{0%{transform:translate(0,0)}33%{transform:translate(-1px,1px)}66%{transform:translate(1px,-1px)}}
    .film-foot{display:flex;justify-content:space-between;padding:16px 24px 0;font-family:var(--mono);font-size:.5rem;
      letter-spacing:.2em;text-transform:uppercase;color:rgba(245,242,232,.3)}

    /* ═══════════════════════════════════════════════════════════
       G — TERMINAL BOOT LOG
       ═══════════════════════════════════════════════════════════ */
    .term{background:#050807;padding:22px 24px 20px;font-family:var(--mono);position:relative;overflow:hidden;--ph:#4ade80}
    .term::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:crt 6s steps(60) infinite}
    @keyframes crt{0%,97%{opacity:.55}98%{opacity:.8}99%{opacity:.4}100%{opacity:.55}}
    .term-bar{display:flex;align-items:center;gap:7px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid rgba(74,222,128,.16)}
    .term-bar i{width:9px;height:9px;border-radius:50%;display:block}
    .term-bar span{margin-left:8px;font-size:.56rem;letter-spacing:.14em;color:rgba(74,222,128,.45)}
    .term-line{white-space:nowrap;overflow:hidden;width:0;font-size:.72rem;line-height:1.95;color:var(--ph);
      text-shadow:0 0 7px rgba(74,222,128,.42);animation:typeW var(--dur,.7s) steps(46) var(--del,0s) forwards}
    @keyframes typeW{to{width:var(--w,100%)}}
    .term-row{display:grid;grid-template-columns:46px 1fr 128px 74px 92px;gap:10px;align-items:center;
      font-size:.7rem;line-height:2.05;color:rgba(74,222,128,.82);text-shadow:0 0 6px rgba(74,222,128,.3);
      opacity:0;animation:termRow .3s steps(2) var(--del) forwards;padding:1px 4px;border-radius:3px;transition:background .18s}
    @keyframes termRow{to{opacity:1}}
    .term-row:hover{background:rgba(74,222,128,.09)}
    .term-row.now{color:#bbf7d0;background:rgba(74,222,128,.08)}
    .term-row.next{color:rgba(74,222,128,.4)}
    .term-dim{color:rgba(74,222,128,.4)}
    .term-bar-ascii{letter-spacing:-.06em}
    .term-ok{color:#bbf7d0}
    .term-warn{color:#fbbf24;text-shadow:0 0 6px rgba(251,191,36,.4)}
    .term-note{font-size:.6rem;color:rgba(74,222,128,.34);padding:0 4px 5px 60px;line-height:1.7;
      opacity:0;animation:termRow .4s var(--del) forwards}
    .term-cursor{display:inline-block;width:8px;height:1em;background:var(--ph);vertical-align:-2px;margin-left:3px;
      animation:cbl .95s step-end infinite;box-shadow:0 0 8px rgba(74,222,128,.6)}
    @keyframes cbl{50%{opacity:0}}
    .term-hr{border:none;border-top:1px dashed rgba(74,222,128,.2);margin:11px 0}

    /* ═══════════════════════════════════════════════════════════
       H — VINYL TURNTABLE
       ═══════════════════════════════════════════════════════════ */
    .vinyl{display:grid;grid-template-columns:300px 1fr;background:linear-gradient(150deg,#181219,#0d0a10)}
    .vinyl-left{padding:26px 24px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center}
    .vinyl-eyebrow{font-family:var(--mono);font-size:.54rem;letter-spacing:.28em;text-transform:uppercase;color:#f0abfc;text-align:center}
    .vinyl-title{font-family:var(--heading);font-size:1.25rem;color:var(--text-h);text-align:center;margin:6px 0 20px;line-height:1.2}
    .deck{position:relative;width:236px;height:236px}
    .disc{position:absolute;inset:0;border-radius:50%;animation:spin 3.6s linear infinite;
      background:
        repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.045) 0 1px,transparent 1px 4px),
        radial-gradient(circle at 50% 50%,#2b2233 0 26%,#0b0910 26.5%,#141019 100%);
      box-shadow:0 22px 50px -18px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.06)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .disc::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
      background:conic-gradient(from 0deg,transparent 0 12%,rgba(255,255,255,.11) 16%,transparent 22% 62%,rgba(240,171,252,.13) 68%,transparent 74%)}
    .label{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
      background:radial-gradient(circle at 40% 35%,#c026d3,#6b21a8 70%);display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;padding:8px;z-index:2;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
    .label::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
      border-radius:50%;background:#0d0a10}
    .label b{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.04em;color:#fff;line-height:1;
      transition:opacity .3s}
    .label span{font-family:var(--mono);font-size:.44rem;letter-spacing:.14em;color:rgba(255,255,255,.7);margin-top:4px;
      text-transform:uppercase;transition:opacity .3s}
    .arm{position:absolute;top:-6px;right:-14px;width:16px;height:158px;transform-origin:8px 12px;z-index:5;
      transform:rotate(-26deg);animation:armDrop 1.4s cubic-bezier(.34,1.3,.64,1) .3s forwards}
    @keyframes armDrop{to{transform:rotate(var(--arm,16deg))}}
    .arm-pivot{position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;
      background:linear-gradient(150deg,#4a4356,#221e2b);box-shadow:0 0 0 3px #14111b}
    .arm-rod{position:absolute;top:12px;left:7px;width:2.5px;height:126px;border-radius:2px;
      background:linear-gradient(180deg,#8b8296,#57506a)}
    .arm-head{position:absolute;top:132px;left:1px;width:14px;height:20px;border-radius:3px;
      background:linear-gradient(160deg,#f0abfc,#a21caf);box-shadow:0 0 12px rgba(240,171,252,.5)}
    .vu{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:20px}
    .vu i{width:4px;border-radius:1px;background:linear-gradient(180deg,#f0abfc,#7e22ce);animation:vuBounce .7s ease-in-out infinite alternate}
    @keyframes vuBounce{from{height:14%}to{height:100%}}
    .vinyl-right{padding:22px 22px}
    .vinyl-side{font-family:var(--mono);font-size:.54rem;letter-spacing:.22em;text-transform:uppercase;
      color:var(--dim);padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
    .track{display:grid;grid-template-columns:38px 1fr auto;gap:13px;align-items:center;padding:11px 12px;border-radius:9px;
      cursor:pointer;opacity:0;animation:gearIn .5s cubic-bezier(.22,1,.36,1) forwards;transition:background .22s,padding-left .22s}
    .track:hover{background:rgba(240,171,252,.07);padding-left:17px}
    .track.playing{background:rgba(240,171,252,.11);box-shadow:inset 2px 0 0 #f0abfc;padding-left:17px}
    .track-no{font-family:var(--mono);font-size:.66rem;color:var(--dim2);letter-spacing:.06em}
    .track.playing .track-no{color:#f0abfc}
    .track-name{font-size:.85rem;font-weight:700;color:var(--text-h)}
    .track-type{font-size:.56rem;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:3px}
    .track-note{font-size:.64rem;color:var(--text);line-height:1.5;margin-top:5px;max-width:420px}
    .track-len{font-family:var(--mono);font-size:.7rem;color:var(--dim);text-align:right}
    .track.playing .track-len{color:#f0abfc}
    .vinyl-foot{grid-column:1/-1;border-top:1px solid var(--border);padding:12px;text-align:center;
      font-size:.72rem;font-style:italic;color:var(--text)}

    /* ═══════════════════════════════════════════════════════════
       I — METRO LINE MAP
       ═══════════════════════════════════════════════════════════ */
    .metro{background:#0c0a14;padding:24px}
    .metro-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
    .roundel{position:relative;width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .roundel i{position:absolute;inset:0;border-radius:50%;border:6px solid var(--accent);
      animation:roundelIn .8s cubic-bezier(.34,1.5,.64,1) forwards;transform:scale(0) rotate(-90deg)}
    @keyframes roundelIn{to{transform:none}}
    .roundel b{position:absolute;left:-6px;right:-6px;height:13px;background:var(--accent);
      font-family:'Bebas Neue',sans-serif;font-size:.6rem;letter-spacing:.16em;color:#fff;text-align:center;line-height:13px;
      transform:scaleX(0);animation:roundelBar .5s ease .45s forwards}
    @keyframes roundelBar{to{transform:none}}
    .metro-t{font-family:'Bebas Neue',var(--heading);font-size:1.85rem;letter-spacing:.05em;color:var(--text-h);line-height:1}
    .metro-sub{font-size:.7rem;color:var(--dim);margin-top:3px}
    /* Padding on the outer box only insets the rail because the positioning
       context is .metro-rail — absolute children ignore their parent's padding.
       That inset is what keeps the first/last labels off the card edges. */
    .metro-map{height:250px;margin-top:14px;padding:0 52px}
    .metro-rail{position:relative;height:100%}
    /* Plain divs rather than SVG: a stroke-dashoffset draw needs the dash array
       to match the path length, which a percentage-width viewBox can't promise. */
    .mline{position:absolute;top:calc(50% - 4.5px);height:9px;border-radius:5px;
      transform:scaleX(0);transform-origin:0 50%;animation:lineDraw 1.4s cubic-bezier(.5,0,.3,1) .2s forwards}
    @keyframes lineDraw{to{transform:scaleX(1)}}
    .mline.run{left:10%;width:60%;background:var(--accent);box-shadow:0 0 22px -2px rgba(139,92,246,.55)}
    .mline.plan{left:70%;width:20%;animation-delay:1.5s;
      background:repeating-linear-gradient(90deg,#60a5fa 0 11px,transparent 11px 20px)}
    .train{position:absolute;top:calc(50% - 9px);width:26px;height:18px;border-radius:5px;margin-left:-13px;
      background:linear-gradient(150deg,#fde68a,#f59e0b);box-shadow:0 0 20px 3px rgba(245,158,11,.6);z-index:4;
      animation:trainRun 7s cubic-bezier(.5,0,.5,1) 1.2s infinite}
    .train::after{content:'';position:absolute;top:5px;right:-9px;width:9px;height:8px;border-radius:2px;
      background:radial-gradient(closest-side,rgba(253,230,138,.9),transparent)}
    @keyframes trainRun{
      0%,6%{left:10%} 16%,24%{left:30%} 34%,42%{left:50%} 52%,66%{left:70%} 78%,100%{left:90%}}
    .stn{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:3}
    .stn-dot{width:20px;height:20px;border-radius:50%;background:#0c0a14;border:5px solid var(--accent);
      transform:scale(0);animation:stnPop .5s cubic-bezier(.34,1.7,.64,1) forwards}
    @keyframes stnPop{to{transform:scale(1)}}
    .stn.now .stn-dot{width:28px;height:28px;border-width:6px;border-color:#fbbf24;
      box-shadow:0 0 0 4px rgba(251,191,36,.18),0 0 22px rgba(251,191,36,.5)}
    .stn.now .stn-dot::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid #fbbf24;
      animation:ping 1.9s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(.85);opacity:.9}100%{transform:scale(2.1);opacity:0}}
    .stn.next .stn-dot{border-color:#60a5fa;border-style:dashed;background:#0c0a14}
    /* The rise must carry the -50% with it — a plain `transform:none` end state
       silently drops the centering and left-anchors every label on its dot. */
    .stn-lbl{position:absolute;left:50%;width:186px;text-align:center;
      opacity:0;animation:stnRise .55s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes stnRise{
      from{opacity:0;transform:translate(-50%,22px)}
      to{opacity:1;transform:translate(-50%,0)}}
    .stn-lbl.up{bottom:26px}
    .stn-lbl.down{top:26px}
    .stn-name{font-size:.8rem;font-weight:700;color:var(--text-h);line-height:1.25}
    .stn-meta{font-family:var(--mono);font-size:.53rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:4px}
    .stn-cc{display:inline-block;margin-top:6px;font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:.05em;
      color:var(--accent2);border:1px solid rgba(139,92,246,.35);background:rgba(139,92,246,.1);border-radius:4px;padding:1px 8px}
    .stn-note{font-size:.6rem;color:var(--dim);line-height:1.45;margin-top:6px}
    .metro-key{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--border);
      padding-top:14px;margin-top:6px;font-family:var(--mono);font-size:.53rem;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
    .metro-key span{display:flex;align-items:center;gap:7px}
    .metro-key i{width:16px;height:4px;border-radius:2px;display:block}

    /* ═══════════════════════════════════════════════════════════
       J — POLAROID WALL
       ═══════════════════════════════════════════════════════════ */
    .wall{padding:26px 24px 30px;position:relative;
      background:
        repeating-linear-gradient(48deg,rgba(255,255,255,.014) 0 2px,transparent 2px 5px),
        radial-gradient(120% 90% at 50% 0%,#231b16,#120e0c 70%)}
    .wall-head{text-align:center;margin-bottom:24px}
    .wall-eyebrow{font-family:'Caveat',cursive;font-size:1.15rem;color:#fbbf24;letter-spacing:.02em}
    .wall-title{font-family:var(--heading);font-size:1.45rem;color:#f7f1e6;margin-top:2px}
    .wall-sub{font-family:'Caveat',cursive;font-size:1rem;color:rgba(247,241,230,.5);margin-top:4px}
    .wall-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:start;padding-top:14px}
    .pola{position:relative;background:#f7f1e6;padding:10px 10px 0;border-radius:2px;
      box-shadow:0 16px 30px -14px rgba(0,0,0,.9),0 2px 5px rgba(0,0,0,.5);
      opacity:0;transform-origin:50% 0;
      animation:drop .85s cubic-bezier(.3,1.45,.6,1) forwards;
      transition:transform .3s cubic-bezier(.34,1.4,.64,1),box-shadow .3s,z-index 0s}
    @keyframes drop{0%{opacity:0;transform:translateY(-70px) rotate(var(--rot)) scale(.92)}
                    65%{opacity:1;transform:translateY(6px) rotate(calc(var(--rot) * 1.35))}
                    100%{opacity:1;transform:rotate(var(--rot))}}
    .pola:hover{transform:rotate(0deg) translateY(-10px) scale(1.06);z-index:9;
      box-shadow:0 28px 50px -16px rgba(0,0,0,.95)}
    .pola.next{background:#e7e0d3;opacity:.9}
    /* pushpin */
    .pin{position:absolute;top:-9px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;z-index:4;
      background:radial-gradient(circle at 33% 30%,#fca5a5,#dc2626 60%,#7f1d1d);
      box-shadow:0 3px 6px rgba(0,0,0,.6)}
    .pola.now .pin{background:radial-gradient(circle at 33% 30%,#fde68a,#f59e0b 60%,#92400e)}
    /* washi tape */
    .tape{position:absolute;top:-10px;width:56px;height:20px;background:rgba(251,191,36,.32);
      border-left:1px dashed rgba(0,0,0,.14);border-right:1px dashed rgba(0,0,0,.14);
      transform:rotate(-6deg);opacity:0;animation:fadein .5s var(--tdel) forwards;z-index:3}
    .tape.l{left:-14px}
    .tape.r{right:-14px;transform:rotate(7deg)}
    .pola-img{aspect-ratio:1/.86;background:radial-gradient(75% 65% at 50% 38%,#3d3529,#181410 78%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;overflow:hidden}
    .pola.next .pola-img{background:repeating-linear-gradient(45deg,#cfc7b8 0 9px,#c4bbab 9px 18px)}
    /* developing wash — the photo "appears" */
    .pola-img::after{content:'';position:absolute;inset:0;background:#efe7d8;animation:develop 1.5s ease-out var(--ddel) forwards}
    @keyframes develop{0%{opacity:1}100%{opacity:0}}
    .pola-icon{font-size:2rem;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.7))}
    .pola.next .pola-icon{filter:grayscale(1) opacity(.4)}
    .pola-cc{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:.05em;color:#fbbf24}
    .pola-cc small{font-family:var(--mono);font-size:.42rem;letter-spacing:.14em;margin-left:3px;opacity:.7}
    .pola-cap{padding:11px 4px 14px;text-align:center;font-family:'Caveat',cursive;color:#1c1917}
    .pola-name{font-size:1.15rem;font-weight:700;line-height:1.15}
    .pola-note{font-size:.88rem;line-height:1.3;color:#57534e;margin-top:5px;
      clip-path:inset(0 100% 0 0);animation:write .9s steps(24) var(--wdel) forwards}
    @keyframes write{to{clip-path:inset(0 0 0 0)}}
    .pola-yr{position:absolute;bottom:6px;right:9px;font-family:var(--mono);font-size:.46rem;letter-spacing:.1em;color:#a8a29e}
    .wall-foot{text-align:center;margin-top:28px;font-family:'Caveat',cursive;font-size:1.25rem;color:rgba(247,241,230,.6)}

    /* ═══════════════════════════════════════════════════════════
       K — TRADING CARDS
       ═══════════════════════════════════════════════════════════ */
    .tcg{padding:26px 24px;background:radial-gradient(110% 80% at 50% 0%,#1b1430,#0a0812 70%)}
    .tcg-head{text-align:center;margin-bottom:24px}
    .tcg-eyebrow{font-family:var(--mono);font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:#fbbf24}
    .tcg-title{font-family:'Bebas Neue',var(--heading);font-size:2rem;letter-spacing:.05em;color:var(--text-h);margin-top:6px;line-height:1}
    .tcg-sub{font-size:.72rem;color:var(--dim);margin-top:5px}
    .tcg-row{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;perspective:1300px}
    .tc{position:relative;border-radius:13px;padding:2px;transform-style:preserve-3d;opacity:0;
      animation:deal .75s cubic-bezier(.25,1.3,.5,1) forwards;
      transition:transform .16s ease-out,box-shadow .3s;will-change:transform}
    @keyframes deal{0%{opacity:0;transform:translate(-120px,-46px) rotate(-19deg) scale(.85)}
                    100%{opacity:1;transform:none}}
    .tc-inner{border-radius:11px;background:linear-gradient(168deg,#191528,#100d1c);overflow:hidden;height:100%;
      position:relative;z-index:2}
    /* rarity frame — the padding on .tc is the frame */
    .tc.r-common{background:linear-gradient(150deg,#4b5563,#1f2937)}
    .tc.r-uncommon{background:linear-gradient(150deg,#34d399,#065f46)}
    .tc.r-rare{background:linear-gradient(150deg,#60a5fa,#1e3a8a)}
    .tc.r-legend{background:linear-gradient(150deg,#fde68a,#f59e0b 45%,#b45309);
      box-shadow:0 0 26px -4px rgba(245,158,11,.55);animation:deal .75s cubic-bezier(.25,1.3,.5,1) forwards,legendPulse 2.4s ease-in-out infinite 1s}
    @keyframes legendPulse{0%,100%{box-shadow:0 0 22px -6px rgba(245,158,11,.45)}50%{box-shadow:0 0 40px 0 rgba(245,158,11,.75)}}
    .tc.r-locked{background:repeating-linear-gradient(135deg,#312e46 0 7px,#221f33 7px 14px)}
    /* holo foil sweep, driven by --mx/--my from JS on hover */
    .tc-holo{position:absolute;inset:0;border-radius:11px;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s;
      background:radial-gradient(120px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.42),transparent 62%),
        conic-gradient(from 210deg at var(--mx,50%) var(--my,50%),#f0abfc,#7dd3fc,#86efac,#fde68a,#f0abfc);
      mix-blend-mode:color-dodge;filter:blur(2px)}
    .tc:hover .tc-holo{opacity:.4}
    .tc-top{display:flex;justify-content:space-between;align-items:center;padding:9px 11px 7px;
      font-family:var(--mono);font-size:.5rem;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
    .tc-cost{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;font-size:.72rem;color:#0a0812;background:#fbbf24}
    .tc-art{height:96px;margin:0 9px;border-radius:7px;display:flex;align-items:center;justify-content:center;position:relative;
      overflow:hidden;background:radial-gradient(75% 70% at 50% 35%,rgba(255,255,255,.09),rgba(0,0,0,.45))}
    .tc-art::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-50%;
      background:linear-gradient(105deg,transparent,rgba(255,255,255,.3),transparent);animation:sheen 3.4s var(--sdel) infinite}
    .tc-icon{font-size:2.4rem;line-height:1;animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
    @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.05)}}
    .tc.r-locked .tc-icon{filter:grayscale(1) opacity(.32);animation:none}
    .tc-name{font-family:'Bebas Neue',sans-serif;font-size:1.02rem;letter-spacing:.04em;color:var(--text-h);
      padding:10px 11px 0;line-height:1.15}
    .tc-type{font-family:var(--mono);font-size:.48rem;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);padding:4px 11px 0}
    .tc-flavor{font-size:.6rem;font-style:italic;color:var(--text);line-height:1.45;padding:8px 11px 0;min-height:46px}
    .tc-stats{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px}
    .tc-stat{display:grid;grid-template-columns:52px 1fr;gap:7px;align-items:center;
      font-family:var(--mono);font-size:.45rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
    .tc-stat b{height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;display:block;width:100%}
    .tc-stat b i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--accent),#fbbf24);
      animation:gaugeGrow .85s cubic-bezier(.22,1,.36,1) var(--bdel) forwards}
    .tc-foot{border-top:1px solid rgba(255,255,255,.07);padding:7px 11px;display:flex;justify-content:space-between;
      font-family:var(--mono);font-size:.44rem;letter-spacing:.1em;color:var(--dim2)}
    .tcg-foot{text-align:center;margin-top:24px;font-size:.72rem;font-style:italic;color:var(--text)}

    @media(max-width:1100px){
      .odo-row{grid-template-columns:40px 1fr 150px 96px;gap:10px}
      .tach,.vinyl{grid-template-columns:1fr}
      .tach-left,.vinyl-left{border-right:none;border-bottom:1px solid var(--border)}
    }
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">Dream Garage · Theme Picker</div>
    <div class="design-list" id="list"></div>
    <div class="sidebar-foot">
      Same 5 vehicles in every theme.<br />
      Hit <b>Replay</b> to re-watch the entry animation, and hover the cards for the
      per-card transitions.
    </div>
  </div>
  <div class="preview">
    <div class="preview-inner">
      <div class="head">
        <div>
          <div class="head-name" id="hName"></div>
          <div class="head-sub" id="hSub"></div>
        </div>
        <button class="replay" onclick="render()">↻ Replay animation</button>
      </div>
      <div id="stage"></div>
      <div class="nav">
        <button onclick="step(-1)">← Previous theme</button>
        <button onclick="step(1)">Next theme →</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── the data, identical to src/data/garage.js › garageJourney ─────────── */
const journey = [
  { ch:'01', name:'Hercules Bicycle',        type:'Bicycle',       cc:0,    ccLabel:'0',    icon:'🚲', status:'owned',
    note:'The first vehicle that was mine. Every street in the neighbourhood, learnt on it.' },
  { ch:'02', name:'TVS XL Super 100',        type:'Moped',         cc:99.7, ccLabel:'99.7', icon:'⛽', status:'owned',
    note:'First engine, first fuel bill. Carried school bags, groceries and half the family.' },
  { ch:'03', name:'Suzuki Avenis 125',       type:'Scooter',       cc:124,  ccLabel:'124',  icon:'🛵', status:'owned',
    note:'The daily commuter. City traffic stopped being something to plan around.' },
  { ch:'04', name:'Royal Enfield Bear 650',  type:'Motorcycle',    cc:648,  ccLabel:'648',  icon:'🏍️', status:'current',
    note:'The one the highway was waiting for. Where the long rides actually began.' },
  { ch:'05', name:'A Car',                   type:'Yet to decide', cc:null, ccLabel:'?',    icon:'🚗', status:'upcoming',
    note:'Four wheels next. Model still undecided — the shortlist changes every month.' },
]

const MAXCC = 648
const LABEL = { owned:'Owned', current:'Riding now', upcoming:'Next up' }
const COLOR = { owned:'#22c55e', current:'#a78bfa', upcoming:'#60a5fa' }
const cls   = v => v.status === 'current' ? 'now' : v.status === 'upcoming' ? 'next' : ''
const pct   = v => v.cc ? Math.max(4, (v.cc / MAXCC) * 100) : 100

const DESIGNS = []
const reg = d => DESIGNS.push(d)

/* ═══════════════════════════════════════════════════════════════════════
   A — ODOMETER REEL
   Mechanical instrument panel. Displacement rolls up on physical digit
   reels; each row banks in on an X-axis rotate; the gauge under it grows.
   ═══════════════════════════════════════════════════════════════════════ */
reg({
  id:'A', name:'Odometer Reel', badge:'Mechanical',
  desc:'Brushed-metal instrument panel. cc digits physically roll into place on odometer drums.',
  sub:'Every displacement lands on a spinning mechanical drum — the numbers do the storytelling. Honey accent picked up from the Bear’s Wild Honey paint.',
  render(){
    // A reel is a 3× repeated 0-9 strip; landing at -(20 + digit) rows gives two full rolls.
    const reel = (digit, delay) => `<span class="reel"><span class="reel-strip" style="--land:-${20 + (+digit)}.5em;animation-delay:${delay}s">${
      '0123456789'.repeat(3).split('').map(d => `<b style="display:block;font-weight:700">${d}</b>`).join('')
    }</span></span>`

    let h = `<div class="odo">
      <div class="odo-head">
        <div>
          <div class="odo-eyebrow">Dream Garage</div>
          <div class="odo-title">The Journey So Far</div>
        </div>
        <div class="odo-total"><b>04<span style="color:rgba(246,240,226,.22)">/05</span></b><span>Chapters logged</span></div>
      </div>`

    journey.forEach((v, i) => {
      const d = 0.1 + i * 0.11
      let reels
      if (v.cc === null) {
        reels = `<span class="reel-flat">— ? —</span>`
      } else if (v.cc === 0) {
        reels = `<span class="reel-flat">PEDAL</span>`
      } else {
        const s = String(v.ccLabel)
        reels = `<span class="reel-box">${
          s.split('').map((c, j) => c === '.'
            ? `<span class="reel-dot">.</span>`
            : reel(c, d + 0.32 + j * 0.1)).join('')
        }</span><span class="reel-unit">cc</span>`
      }

      h += `<div class="odo-row ${cls(v)}" style="animation-delay:${d}s">
        <div class="odo-ch">${v.ch}</div>
        <div>
          <div class="odo-name">${v.name}</div>
          <div class="odo-type">${v.type}</div>
          <div class="odo-note">${v.note}</div>
        </div>
        <div>
          <div class="reel-wrap">${reels}</div>
          <div class="odo-gauge">
            <div class="odo-gauge-track"><div class="odo-gauge-fill" style="--w:${pct(v)}%;animation-delay:${d + .35}s;${v.cc===null?'background:repeating-linear-gradient(90deg,rgba(246,240,226,.3) 0 4px,transparent 4px 8px);box-shadow:none':''}"></div></div>
            <div class="odo-ticks">${'<i></i>'.repeat(9)}</div>
          </div>
        </div>
        <div class="odo-stat" style="color:${COLOR[v.status]};border-color:${COLOR[v.status]}44;background:${COLOR[v.status]}14;animation-delay:${d + .8}s">${LABEL[v.status]}</div>
      </div>`
    })

    h += `<div style="border-top:1px solid rgba(224,187,60,.14);margin-top:10px;padding-top:14px;text-align:center;
      font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(246,240,226,.4)">
      Keep Riding · Keep Dreaming</div></div>`
    return h
  }
})

/* ═══════════════════════════════════════════════════════════════════════
   B — HIGHWAY MILESTONES
   Indian km-stone markers standing on a live road: the centre line runs,
   a headlight glow sweeps past, stones spring up out of the tarmac.
   ═══════════════════════════════════════════════════════════════════════ */
reg({
  id:'B', name:'Highway Milestones', badge:'Narrative',
  desc:'Km-stone markers on a moving road. Dashes scroll, a headlight sweeps, stones spring up.',
  sub:'Leans on the thing the whole page is about — the road. Cards are milestone stones; hover one to expand its story.',
  render(){
    let h = `<div class="hw">
      <div class="hw-head">
        <div>
          <div class="hw-eyebrow">Dream Garage</div>
          <div class="hw-title">The Journey So Far</div>
          <div class="hw-sub">Five machines, in the order they arrived.</div>
        </div>
        <div class="hw-odo"><b>04 / 05</b>milestones passed</div>
      </div>
      <div class="hw-stage"><div class="hw-stones">`

    journey.forEach((v, i) => {
      h += `<div class="stone ${cls(v)}" style="animation-delay:${0.15 + i * 0.13}s">
        <div class="stone-body">
          <div class="stone-cap">
            <div class="stone-ch">${v.ch}</div>
            <div class="stone-cc">${v.ccLabel}</div>
            <div class="stone-unit">${v.cc ? 'cc' : v.cc === 0 ? 'pedal' : 'undecided'}</div>
          </div>
          <div class="stone-mid">
            <div class="stone-icon" style="animation-delay:${i * .35}s">${v.icon}</div>
            <div class="stone-name">${v.name}</div>
            <div class="stone-type">${v.type}</div>
            <div class="stone-note">${v.note}</div>
            <div style="margin-top:9px;display:inline-flex;align-items:center;gap:5px;font-size:.53rem;font-weight:700;
              letter-spacing:.1em;text-transform:uppercase;color:${COLOR[v.status]};border:1px solid ${COLOR[v.status]}44;
              background:${COLOR[v.status]}14;padding:3px 8px;border-radius:99px">
              <span style="width:4px;height:4px;border-radius:50%;background:${COLOR[v.status]}"></span>${LABEL[v.status]}
            </div>
          </div>
        </div>
      </div>`
    })

    h += `</div>
      <div class="road">
        <div class="road-center"></div>
        <div class="road-glow"></div>
        <div class="road-km">${journey.map(v => `<span>KM ${v.ch}0</span>`).join('')}</div>
      </div></div>
      <div class="hw-foot">Keep Riding. Keep Dreaming.</div>
    </div>`
    return h
  }
})

/* ═══════════════════════════════════════════════════════════════════════
   C — BLUEPRINT DRAFT
   Engineering drawing. Nothing fades in — every line draws itself, the
   title types out, dimension arrows measure each card.
   ═══════════════════════════════════════════════════════════════════════ */
reg({
  id:'C', name:'Blueprint Draft', badge:'Technical',
  desc:'Graph-paper draft. Borders draw themselves, the title types out, dimension arrows measure each card.',
  sub:'Reads as an engineering document — fits the spec-callout half of the page. Everything is drawn rather than faded, so the motion feels like a hand working.',
  render(){
    // A rough profile per vehicle, traced with stroke-dashoffset.
    const PROFILE = [
      'M4 20 h56 M14 20 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M40 20 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M21 20 l8 -11 h9',
      'M4 20 h56 M13 20 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 M43 20 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 M19 20 l5 -9 h16 l6 9',
      'M4 20 h56 M12 20 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 M44 20 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 M18 20 q6 -13 20 -13 l10 13',
      'M4 20 h56 M11 20 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 M43 20 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 M19 20 l6 -12 h14 l8 12 M25 8 h12',

/* ═══════════════════════════════════════════════════════════════════════
   E — TACHOMETER GEARBOX
   A live tach on the left, gear positions on the right. The needle sweeps
   in on load and re-sweeps to whichever gear you hover or click.
   ═══════════════════════════════════════════════════════════════════════ */
reg({
  id:'E', name:'Tachometer Gearbox', badge:'Interactive',
  desc:'A real gauge that responds. Needle sweeps with overshoot to whichever vehicle you hover.',
  sub:'The only theme where the section reacts to you: the dial re-reads live as you move down the gears. Redline red against the dark panel.',
  render(){
    const R = 88, C = 2 * Math.PI * R * 0.75          // 270° of arc
    const deg = i => -135 + (i / (journey.length - 1)) * 270
    const marks = journey.map((_, i) =>
      `<i style="transform:rotate(${deg(i)}deg)"></i>`).join('')

    let h = `<div class="tach">
      <div class="tach-left">
        <div class="tach-eyebrow">Dream Garage</div>
        <div class="tach-title">The Journey<br />So Far</div>
        <div class="dial">
          <svg viewBox="0 0 210 210">
            <defs><linearGradient id="tachGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7f1d1d" /><stop offset="70%" stop-color="#ef4444" /><stop offset="100%" stop-color="#fca5a5" />
            </linearGradient></defs>
            <circle class="dial-arc" cx="105" cy="105" r="${R}" stroke-dasharray="${C} 999" />
            <circle class="dial-fill" id="dialFill" cx="105" cy="105" r="${R}"
              style="--c:${C};--off:${C * (1 - 3 / 4)}" stroke-dasharray="${C} 999" />
          </svg>
          <div class="dial-marks">${marks}</div>
          <div class="needle" id="needle" style="--deg:${deg(3)}deg"></div>
          <div class="hub"></div>
          <div class="dial-read">
            <div class="dial-cc" id="dialCc">648</div>
            <div class="dial-lbl" id="dialLbl">cc · displacement</div>
            <div class="dial-gear" id="dialGear">4th · Bear 650</div>
          </div>
        </div>
        <div class="tach-hint">Hover a gear<br />to read the dial</div>
      </div>
      <div class="tach-right">`

    journey.forEach((v, i) => {
      const d = 0.2 + i * 0.12
      h += `<div class="gear ${cls(v)} ${v.status === 'current' ? 'sel' : ''}" data-i="${i}"
        style="animation-delay:${d}s" onmouseenter="tachTo(${i})" onclick="tachPin(${i},this)">
        <div class="gear-no">${i + 1}<small>${['1ST','2ND','3RD','4TH','5TH'][i]}</small></div>
        <div>
          <div class="gear-name">${v.name}</div>
          <div class="gear-type">${v.type} · ${LABEL[v.status]}</div>
          <div class="gear-note">${v.note}</div>
        </div>
        <div class="gear-cc"><b>${v.ccLabel}</b><span>${v.cc ? 'cc' : v.cc === 0 ? 'pedal' : 'tbd'}</span></div>
        <div class="gear-bar"><i style="--w:${pct(v)}%;animation-delay:${d + .3}s;${v.cc===null?'background:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 4px,transparent 4px 8px)':''}"></i></div>
      </div>`
    })

    h += `</div><div class="tach-foot">Keep Riding. Keep Dreaming.</div></div>`
    return h
  },
  // Re-point the needle + centre readout. Called on hover; click locks it in.
  after(){
    window.tachTo = i => {
      const v = journey[i], n = document.getElementById('needle')
      if (!n) return
      const deg = -135 + (i / (journey.length - 1)) * 270
      n.style.animation = 'none'                       // hand control over from the entry sweep
      n.style.transition = 'transform .55s cubic-bezier(.34,1.5,.64,1)'
      n.style.transform = `rotate(${deg}deg)`
      const fill = document.getElementById('dialFill')
      const C = 2 * Math.PI * 88 * 0.75
      fill.style.animation = 'none'
      fill.style.transition = 'stroke-dashoffset .55s cubic-bezier(.34,1.3,.64,1)'
      fill.style.strokeDashoffset = C * (1 - i / 4)
      document.getElementById('dialCc').textContent = v.ccLabel
      document.getElementById('dialLbl').textContent = v.cc ? 'cc · displacement' : v.cc === 0 ? 'pedal · no engine' : 'not decided yet'
      document.getElementById('dialGear').textContent = `${['1st','2nd','3rd','4th','5th'][i]} · ${v.name.replace('Royal Enfield ','').replace('A Car','Car')}`
    }
    window.tachPin = (i, el) => {
      document.querySelectorAll('.gear').forEach(g => g.classList.remove('sel'))
      el.classList.add('sel')
      window.tachTo(i)
    }
  }
})

reg({

  sub:'The most "you" of the set given the automation background — the garage printed as a command you ran. ASCII bars instead of divs, real CRT scanline flicker.',
  render(){
    const ascii = v => {
      const filled = v.cc === null ? 0 : Math.round(pct(v) / 10)
      return v.cc === null ? '[░░░░░░░░░░]' : `[${'█'.repeat(filled)}${'░'.repeat(10 - filled)}]`
    }
    const pad = (s, n) => (s + ' '.repeat(n)).slice(0, n)

    let h = `<div class="term">
      <div class="term-bar">
        <i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
        <span>siva@garage — zsh — 96×28</span>
      </div>
      <div class="term-line" style="--w:31ch;--dur:.75s;--del:.1s">$ garage --history --verbose</div>
      <div class="term-line term-dim" style="--w:44ch;--dur:.7s;--del:.95s">→ reading ownership records ... <span class="term-ok">5 found</span></div>

    journey.forEach((v, i) => {
      const d = 1.75 + i * 0.26
      const st = v.status === 'current' ? '<span class="term-ok">● ACTIVE  </span>'

               : '<span class="term-dim">✓ ARCHIVED</span>'
      h += `<div class="term-row ${cls(v)}" style="--del:${d}s">
          <span class="term-dim">CH${v.ch}</span>
          <span>${pad(v.name.toLowerCase().replace(/ /g, '-'), 24)}</span>
          <span class="term-bar-ascii">${ascii(v)}</span>
          <span style="text-align:right">${v.cc === null ? '???' : v.ccLabel}<span class="term-dim"> cc</span></span>
          <span>${st}</span>
        </div>
        <div class="term-note" style="--del:${d + 0.14}s"># ${v.note}</div>`
    })

    h += `<hr class="term-hr" />
      <div class="term-line term-dim" style="--w:52ch;--dur:.8s;--del:3.3s">→ 4 owned · 1 planned · 871.7 cc lifetime displacement</div>
      <div class="term-line" style="--w:40ch;--dur:.7s;--del:4.1s">$ echo "keep riding. keep dreaming."<span class="term-cursor"></span></div>

    return h

/* ═══════════════════════════════════════════════════════════════════════
   H — VINYL TURNTABLE
   Self-playing: the record spins, the tonearm steps down the tracklist on
   its own, and the centre label re-prints for whatever is playing.
   ═══════════════════════════════════════════════════════════════════════ */
reg({
  id:'H', name:'Vinyl Turntable', badge:'Self-playing',
  desc:'A record that plays itself. Tonearm steps down the tracklist, label re-prints, VU meters bounce.',
  sub:'The only theme that animates on its own loop rather than waiting for scroll or hover — the section literally plays through your garage, one track at a time.',
  render(){
    const vu = n => Array.from({ length: n }, (_, j) =>
      `<i style="animation-delay:${(j * 0.11).toFixed(2)}s;animation-duration:${(0.45 + (j % 4) * 0.13).toFixed(2)}s"></i>`).join('')

    let h = `<div class="vinyl">
      <div class="vinyl-left">
        <div class="vinyl-eyebrow">Dream Garage</div>
        <div class="vinyl-title">The Journey So Far</div>
        <div class="deck">
          <div class="disc"></div>
          <div class="label">
            <b id="vLabel">648</b>
            <span id="vLabelSub">cc · side A</span>
          </div>
          <div class="arm" id="vArm" style="--arm:22deg">
            <div class="arm-pivot"></div><div class="arm-rod"></div><div class="arm-head"></div>
          </div>
        </div>
        <div class="vu">${vu(14)}</div>
      </div>
      <div class="vinyl-right">
        <div class="vinyl-side"><span>Side A · 5 tracks</span><span>871.7 cc total</span></div>`

    journey.forEach((v, i) => {
      h += `<div class="track ${v.status === 'current' ? 'playing' : ''}" data-i="${i}"
        style="animation-delay:${0.2 + i * 0.11}s" onmouseenter="vinylTo(${i}, true)">
        <div class="track-no">A${i + 1}</div>
        <div>
          <div class="track-name">${v.name}</div>
          <div class="track-type">${v.type} · ${LABEL[v.status]}</div>
          <div class="track-note">${v.note}</div>
        </div>
        <div class="track-len">${v.cc === null ? '--:--' : v.ccLabel}</div>
      </div>`
    })

    h += `</div><div class="vinyl-foot">Keep Riding. Keep Dreaming.</div></div>`
    return h
  },
  after(){
    // Tonearm travels outer→inner across the record, exactly like a real one.
    const ARM_START = 16, ARM_END = 40
    let auto = true

    window.vinylTo = (i, manual) => {
      if (manual) auto = false                      // hovering takes the needle off auto
      const v = journey[i]
      const arm = document.getElementById('vArm')
      if (!arm) return
      arm.style.animation = 'none'
      arm.style.transition = 'transform .8s cubic-bezier(.34,1.3,.64,1)'
      arm.style.transform = `rotate(${ARM_START + (i / (journey.length - 1)) * (ARM_END - ARM_START)}deg)`
      document.getElementById('vLabel').textContent = v.ccLabel
      document.getElementById('vLabelSub').textContent =
        v.cc ? 'cc · side A' : v.cc === 0 ? 'pedal · side A' : 'unreleased'
      document.querySelectorAll('.track').forEach(t =>
        t.classList.toggle('playing', +t.dataset.i === i))
    }

    let n = 3
    const id = setInterval(() => {
      if (!auto || !document.getElementById('vArm')) return
      n = (n + 1) % journey.length
      window.vinylTo(n)
    }, 2600)
    window.__timers.push(id)

    // Give the drop-in animation its moment before auto-play takes over.
    window.__timers.push(setTimeout(() => { if (auto) window.vinylTo(3) }, 1800))
  }
})

    let h = `<div class="tcg">
      <div class="tcg-head">
        <div class="tcg-eyebrow">Dream Garage · Set 01</div>
        <div class="tcg-title">The Journey So Far</div>
        <div class="tcg-sub">4 of 5 collected · 1 legendary in the deck</div>
      </div>
      <div class="tcg-row">`

    journey.forEach((v, i) => {
      const d = 0.1 + i * 0.13
      const stats = STATS[i].map(([k, val], j) =>
        `<div class="tc-stat"><span>${k}</span><b><i style="--w:${val}%;--bdel:${d + .5 + j * .09}s"></i></b></div>`).join('')
      h += `<div class="tc r-${RARITY[i]}" style="animation-delay:${d}s;--sdel:${d + .6}s">
        <div class="tc-holo"></div>
        <div class="tc-inner">
          <div class="tc-top"><span>CH ${v.ch}</span><span class="tc-cost">${i + 1}</span></div>
          <div class="tc-art"><div class="tc-icon" style="animation-delay:${i * .3}s">${v.icon}</div></div>
          <div class="tc-name">${v.name}</div>
          <div class="tc-type">${v.type} · ${v.ccLabel}${v.cc ? 'cc' : ''}</div>
          <div class="tc-flavor">“${FLAVOR[i]}”</div>
          <div class="tc-stats">${stats}</div>
          <div class="tc-foot"><span>${RNAME[i]}</span><span>${LABEL[v.status]}</span></div>
        </div>
      </div>`
    })

    h += `</div><div class="tcg-foot">Keep Riding. Keep Dreaming.</div></div>`
    return h
  },
  after(){
    // Cursor-tracked 3D tilt + holo hotspot. Listeners die with the innerHTML swap.
    document.querySelectorAll('.tc').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect()
        const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height
        card.style.setProperty('--mx', `${px * 100}%`)
        card.style.setProperty('--my', `${py * 100}%`)
        card.style.animation = 'none'                 // release the deal-in transform
        card.style.transform =
          `perspective(900px) rotateY(${(px - .5) * 20}deg) rotateX(${(.5 - py) * 20}deg) translateY(-9px) scale(1.05)`
        card.style.zIndex = 9
      })
      card.addEventListener('mouseleave', () => {
        card.style.transform = ''
        card.style.zIndex = ''
      })
    })
  }
})

/* ── picker plumbing ──────────────────────────────────────────────────── */
let cur = 0

window.__timers = []

function render(){
  // Themes that drive themselves (H) leave intervals behind — kill them before
  // the swap, or every theme change stacks another one on top.
  window.__timers.forEach(t => { clearInterval(t); clearTimeout(t) })
  window.__timers = []

  const d = DESIGNS[cur]
  document.getElementById('hName').textContent = `${d.id} — ${d.name}`
  document.getElementById('hSub').textContent = d.sub
  const stage = document.getElementById('stage')
  stage.innerHTML = ''                       // clearing first restarts every CSS animation
  void stage.offsetHeight
  stage.innerHTML = `<div class="shell">${d.render()}</div>`
  if (d.after) d.after()
  document.querySelectorAll('.design-btn').forEach((b, i) => b.classList.toggle('active', i === cur))
}

function step(dir){
  cur = (cur + dir + DESIGNS.length) % DESIGNS.length
  render()
  document.querySelector('.preview').scrollTo({ top: 0, behavior: 'smooth' })
}

document.getElementById('list').innerHTML = DESIGNS.map((d, i) => `
  <button class="design-btn" onclick="cur=${i};render()">
    <span class="btn-name">${d.id} — ${d.name}</span>
    <span class="btn-desc">${d.desc}</span>
    <span class="badge">${d.badge}</span>
  </button>`).join('')

render()
</script>
</body>
</html>
