<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Storefront · 6 · Carousel Dial</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Sora:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════════════════
   CAROUSEL DIAL — the page doesn't scroll at all. Every part
   sits on a 3D ring you spin with drag, wheel or arrow keys;
   the one facing you is the one you're reading. Categories
   are a dial along the bottom that spins the ring to them.
   ══════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0812; --off:#f3f0ff;
  --d1:rgba(243,240,255,0.6); --d2:rgba(243,240,255,0.36); --d3:rgba(243,240,255,0.18);
  --bd:rgba(255,255,255,0.1); --bd2:rgba(255,255,255,0.2);
  --hue:#8b5cf6;
  --disp:'Syne',sans-serif; --sans:'Sora',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--d1);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  user-select:none;transition:background 1s ease}
::selection{background:var(--hue);color:#fff}

/* atmosphere — takes on the active part's category hue */
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1s ease;
  background:radial-gradient(58vw 58vw at 50% 44%,var(--hue),transparent 66%);opacity:0.24;filter:blur(70px)}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.3;
  background-image:linear-gradient(rgba(255,255,255,0.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,0.045) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.floor{position:fixed;left:0;right:0;bottom:0;height:42vh;z-index:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,0.82),transparent)}

/* corner chrome only — no header bar */
.tl{position:fixed;top:26px;left:30px;z-index:40;font-family:var(--disp);font-weight:800;
  font-size:0.86rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--off);
  display:flex;align-items:center;gap:10px}
.tl i{width:8px;height:8px;border-radius:2px;background:var(--hue);transition:background 1s ease;
  animation:tick 3s var(--ease) infinite}
@keyframes tick{0%,72%,100%{transform:rotate(0)}84%{transform:rotate(135deg) scale(1.3)}}
.tr{position:fixed;top:26px;right:30px;z-index:40;font-size:0.66rem;font-weight:500;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--d2);text-decoration:none;transition:.3s}
.tr:hover{color:var(--off)}
.bl{position:fixed;bottom:26px;left:30px;z-index:40;font-size:0.6rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--d3);display:flex;gap:16px;align-items:center}
.bl kbd{border:1px solid var(--bd);border-radius:5px;padding:3px 7px;font-family:var(--sans);
  font-size:0.58rem;color:var(--d2)}

/* ── the ring ── */
.scene{position:fixed;inset:0;z-index:5;perspective:1500px;perspective-origin:50% 44%;
  cursor:grab;touch-action:pan-y}
.scene.drag{cursor:grabbing}
.ring{position:absolute;left:50%;top:44%;width:0;height:0;transform-style:preserve-3d;
  transform:rotateY(0deg)}
.node{position:absolute;width:230px;height:296px;margin:-148px 0 0 -115px;
  transform-style:preserve-3d;transition:opacity .45s ease,filter .45s ease}
.node .face{width:100%;height:100%;border-radius:20px;overflow:hidden;position:relative;
  background:rgba(255,255,255,0.045);border:1px solid var(--bd);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  transition:transform .55s var(--ease),border-color .45s,box-shadow .55s}
.node .face img{max-width:100%;max-height:100%;object-fit:contain;padding:16px;
  transition:transform .6s var(--ease),opacity .25s}
.node .face .none{font-size:2.4rem;opacity:0.2}
.node .no{position:absolute;top:11px;left:13px;z-index:2;font-family:var(--disp);font-weight:800;
  font-size:0.68rem;letter-spacing:0.12em;color:var(--d2)}
.node .star{position:absolute;top:11px;right:13px;z-index:2;font-size:0.62rem;color:var(--hue);
  transition:color 1s ease}
.node .tagname{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;z-index:2;
  background:linear-gradient(to top,rgba(6,4,12,0.92),transparent);
  font-size:0.7rem;font-weight:500;color:var(--off);line-height:1.3;text-align:center;
  opacity:0;transition:opacity .4s}
.node.near .tagname{opacity:1}
/* only the facing card is bright */
.node{opacity:0.3;filter:saturate(0.5)}
.node.near{opacity:0.72;filter:none}
.node.live{opacity:1;filter:none}
.node.live .face{border-color:var(--hue);box-shadow:0 0 0 1px var(--hue),0 40px 80px -30px rgba(0,0,0,0.95);
  transform:scale(1.14)}
.node.live .tagname{opacity:0}
.node .face:hover{transform:scale(1.06)}
.node.live .face:hover{transform:scale(1.18)}
.node.live .face{cursor:zoom-in}
/* reflection under the ring */
.node .shadow{position:absolute;left:8%;right:8%;bottom:-26px;height:22px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,0.65),transparent 70%);filter:blur(9px);opacity:0.7}

/* ── read-out over the ring ── */
.title{position:fixed;left:0;right:0;top:11vh;z-index:20;text-align:center;pointer-events:none;padding:0 20px}
.title .cat{font-size:0.62rem;font-weight:600;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--hue);margin-bottom:12px;transition:color 1s ease}
.title h1{font-family:var(--disp);font-weight:800;font-size:clamp(1.6rem,4.6vw,3.4rem);line-height:1.02;
  letter-spacing:-0.03em;color:var(--off);max-width:15ch;margin:0 auto}
.title .swap{display:inline-block;animation:swapIn .55s var(--ease)}
@keyframes swapIn{from{opacity:0;transform:translateY(16px) rotateX(-40deg)}}
.title .meta{margin-top:12px;font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--d2)}

/* action bar under the ring */
.acts{position:fixed;left:0;right:0;bottom:19vh;z-index:20;display:flex;justify-content:center;
  gap:10px;flex-wrap:wrap;padding:0 20px}
.go{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:999px;
  text-decoration:none;font-size:0.78rem;font-weight:500;transition:all .35s var(--ease)}
.go.p{background:var(--off);color:#0a0812}
.go.p:hover{background:var(--hue);color:#fff;transform:translateY(-3px)}
.go.s{border:1px solid var(--bd2);color:var(--off);backdrop-filter:blur(8px)}
.go.s:hover{border-color:var(--hue);color:var(--hue);transform:translateY(-3px)}
.soon{font-size:0.76rem;color:var(--d3);font-style:italic}
/* plate selector for the live item */
.plates{position:fixed;left:0;right:0;bottom:13.5vh;z-index:20;display:flex;justify-content:center;gap:6px}
.plates button{width:34px;height:4px;padding:0;border:0;border-radius:99px;cursor:pointer;
  background:rgba(255,255,255,0.22);transition:.3s var(--ease)}
.plates button:hover{background:rgba(255,255,255,0.5)}
.plates button.on{background:var(--hue)}

/* ── the dial ── */
.dial{position:fixed;left:0;right:0;bottom:0;z-index:30;height:11vh;min-height:74px;
  display:flex;align-items:center;justify-content:center;gap:0;
  background:linear-gradient(to top,rgba(8,6,15,0.95),transparent);
  border-top:1px solid var(--bd)}
.dial button{position:relative;padding:0 clamp(10px,2.2vw,26px);background:transparent;border:0;
  cursor:pointer;font-family:var(--sans);font-size:0.7rem;font-weight:400;letter-spacing:0.1em;
  color:var(--d2);transition:color .32s;display:flex;flex-direction:column;align-items:center;gap:7px}
.dial button:hover{color:var(--off)}
.dial button.on{color:var(--off)}
.dial button i{font-style:normal;font-size:0.95rem;opacity:0.7;transition:.35s var(--ease)}
.dial button.on i{opacity:1;transform:translateY(-2px) scale(1.18)}
.dial button::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%) scaleX(0);
  width:70%;height:2px;background:var(--hue);transition:transform .4s var(--ease)}
.dial button.on::after{transform:translateX(-50%) scaleX(1)}
.dial .sep{width:1px;height:22px;background:var(--bd);align-self:center}

/* position counter, right side */
.ticker{position:fixed;right:30px;top:50%;transform:translateY(-50%);z-index:40;text-align:right}
.ticker b{display:block;font-family:var(--disp);font-weight:800;font-size:2.4rem;color:var(--off);line-height:1}
.ticker span{font-size:0.62rem;letter-spacing:0.2em;color:var(--d3)}
.ticker .bar{margin-top:10px;width:2px;height:120px;background:var(--bd);margin-left:auto;position:relative}
.ticker .bar i{position:absolute;left:0;width:2px;height:22px;background:var(--hue);
  transition:top .45s var(--ease),background 1s ease}

/* intro veil */
.veil{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;
  transition:opacity .8s var(--ease),visibility .8s}
.veil.gone{opacity:0;visibility:hidden}
.veil h2{font-family:var(--disp);font-weight:800;font-size:clamp(2rem,7vw,4.6rem);color:var(--off);
  letter-spacing:-0.035em;line-height:0.98}
.veil h2 em{font-style:normal;color:var(--hue)}
.veil p{max-width:420px;font-size:0.92rem;line-height:1.75}
.veil .figs{display:flex;gap:34px;margin-top:6px}
.veil .figs b{display:block;font-family:var(--disp);font-weight:800;font-size:1.7rem;color:var(--off)}
.veil .figs span{font-size:0.58rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--d2)}
.veil button{margin-top:14px;padding:14px 32px;border-radius:999px;border:0;background:var(--off);
  color:#0a0812;font-family:var(--sans);font-size:0.8rem;font-weight:500;cursor:pointer;
  transition:.35s var(--ease)}
.veil button:hover{background:var(--hue);color:#fff;transform:translateY(-3px)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:999;background:rgba(6,4,12,0.97);backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;padding:56px}
.lb.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.lb img{max-width:86vw;max-height:78vh;object-fit:contain;border-radius:16px;animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.93)}}
.lb .cap{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:0.72rem;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--hue)}
.lb button{position:absolute;width:46px;height:46px;border-radius:50%;border:1px solid var(--bd2);
  background:rgba(20,16,32,0.9);color:var(--off);font-size:1.05rem;cursor:pointer;transition:.22s}
.lb button:hover{background:var(--off);color:#0a0812}
.lb .x{top:24px;right:24px}.lb .prev{left:24px;top:50%}.lb .next{right:24px;top:50%}

/* ── phones: the stack under the ring is measured in px, not vh, so it
      cannot collide on a short screen ── */
@media(max-width:820px){
  .node{width:164px;height:212px;margin:-106px 0 0 -82px}
  .node .face{border-radius:15px}
  .ticker{display:none}
  .bl{display:none}
  .tl{top:16px;left:16px;font-size:0.74rem}
  .tr{top:18px;right:16px;font-size:0.58rem}
  .title{top:64px;padding:0 16px}
  .title h1{font-size:clamp(1.15rem,5.4vw,1.7rem);max-width:20ch}
  .title .cat{font-size:0.55rem;letter-spacing:0.22em;margin-bottom:8px}
  .title .meta{font-size:0.58rem;margin-top:8px}
  .ring{top:47%}
  .dial{height:auto;min-height:0;padding:9px 0 calc(9px + env(safe-area-inset-bottom));
    overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .dial::-webkit-scrollbar{display:none}
  .dial button{flex-shrink:0;padding:0 16px;gap:4px}
  .dial button span{display:none}
  .dial .sep{flex-shrink:0}
  .acts{bottom:calc(112px + env(safe-area-inset-bottom));gap:8px;padding:0 16px}
  .go{padding:11px 18px;font-size:0.72rem}
  .plates{bottom:calc(92px + env(safe-area-inset-bottom))}
  .veil{padding:20px}
  .veil .figs{gap:22px}
  .veil button{padding:13px 26px;font-size:0.76rem}
}
@media(max-width:400px){
  .node{width:142px;height:184px;margin:-92px 0 0 -71px}
  .acts{bottom:calc(104px + env(safe-area-inset-bottom))}
  .go{padding:10px 15px;font-size:0.68rem}
}
/* short landscape phones: drop the read-out furniture rather than overlap it */
@media(max-height:460px){
  .title .meta{display:none}
  .plates{display:none}
  .acts{bottom:calc(84px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="aura"></div><div class="grid"></div><div class="floor"></div>

<div class="tl"><i></i>Storefront</div>
<a class="tr" href="#">✕ Garage</a>
<div class="bl"><span><kbd>←</kbd> <kbd>→</kbd> spin</span><span>drag · scroll · click a plate</span></div>

<div class="title">
  <div class="cat" id="tCat"></div>
  <h1 id="tName"></h1>
  <div class="meta" id="tMeta"></div>
</div>

<div class="scene" id="scene"><div class="ring" id="ring"></div></div>

<div class="plates" id="plates"></div>
<div class="acts" id="acts"></div>

<div class="ticker"><b id="tkN">01</b><span id="tkT">/ 17</span><div class="bar"><i id="tkBar"></i></div></div>

<nav class="dial" id="dial"></nav>

<div class="veil" id="veil">
  <h2>Spin through <em>the build</em></h2>
  <p id="lede"></p>
  <div class="figs" id="figs"></div>
  <button id="enter">Enter the ring →</button>
</div>

<div class="lb" id="lb">
  <button class="x" onclick="closeLb()">✕</button>
  <button class="prev" onclick="stepLb(-1)">‹</button>
  <button class="next" onclick="stepLb(1)">›</button>
  <img id="lbImg" alt="" />
  <div class="cap" id="lbCap"></div>
</div>

<script src="storefront-data.js"></script>
<script>
const HUE = { camera: '#4fc3ff', lighting: '#ffc53d', helmet: '#a78bfa', safety: '#ff5c7a', essentials: '#3ddc97' }
const ITEMS = SF.all.map((it, i) => ({ ...it, no: i + 1, imgs: it.imgs.map(f => SF.url(f)) }))
const N = ITEMS.length
const STEP = 360 / N

document.getElementById('lede').textContent = SF.note
document.getElementById('figs').innerHTML = [
  ['Parts', SF.count], ['Categories', SF.cats.length], ['Plates', SF.photoCount],
].map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')
document.getElementById('tkT').textContent = '/ ' + String(N).padStart(2, '0')

/* ── build the ring ── */
const ring = document.getElementById('ring')
ring.innerHTML = ITEMS.map((it, i) => `
  <div class="node" data-i="${i}" style="transform:rotateY(${i * STEP}deg) translateZ(var(--r))">
    <div class="face" onclick="tap(${i})">
      <span class="no">${String(it.no).padStart(2, '0')}</span>
      ${it.featured ? '<span class="star">★</span>' : ''}
      ${it.imgs.length ? `<img src="${it.imgs[0]}" alt="${it.name}" loading="lazy" />` : `<span class="none">${it.cat.icon}</span>`}
      <span class="tagname">${it.name}</span>
    </div>
    <span class="shadow"></span>
  </div>`).join('')
const nodes = [...ring.querySelectorAll('.node')]

function radius() { return innerWidth < 820 ? 330 : Math.min(620, innerWidth * 0.42) }
function sizeRing() { ring.style.setProperty('--r', radius() + 'px') }
sizeRing(); addEventListener('resize', sizeRing)

/* ── spin state: eased toward a target angle ── */
let rot = 0, target = 0, dragging = false, lastX = 0, vel = 0, live = -1

function tick() {
  if (!dragging) {
    rot += (target - rot) * 0.11
    if (Math.abs(target - rot) < 0.01) rot = target
  }
  ring.style.transform = `rotateY(${rot}deg)`
  const idx = ((Math.round(-rot / STEP) % N) + N) % N
  if (idx !== live) setLive(idx)
  requestAnimationFrame(tick)
}
function goTo(i, instant) {
  /* travel the short way round rather than unwinding the whole ring */
  const want = -i * STEP
  const delta = ((want - target) % 360 + 540) % 360 - 180
  target += delta
  if (instant) rot = target
}

/* ── the read-out follows whatever is facing you ── */
const tCat = document.getElementById('tCat'), tName = document.getElementById('tName')
const tMeta = document.getElementById('tMeta'), acts = document.getElementById('acts')
const platesEl = document.getElementById('plates')
let plateAt = 0

function setLive(i) {
  live = i
  const it = ITEMS[i]
  const hue = HUE[it.cat.id] || '#8b5cf6'
  document.documentElement.style.setProperty('--hue', hue)
  document.body.style.background = shade(hue)

  nodes.forEach((n, j) => {
    const d = Math.min((j - i + N) % N, (i - j + N) % N)
    n.classList.toggle('live', j === i)
    n.classList.toggle('near', d === 1)
  })

  tCat.textContent = `${it.cat.icon}  ${it.cat.label}`
  tName.innerHTML = `<span class="swap">${it.name}</span>`
  tMeta.textContent = `${String(it.no).padStart(2, '0')} of ${String(N).padStart(2, '0')} · ${it.imgs.length || 'no'} ${it.imgs.length === 1 ? 'plate' : 'plates'}${it.featured ? ' · headline pick' : ''}`

  acts.innerHTML = it.links.length
    ? it.links.map(([v, u], k) => `<a class="go ${k === 0 ? 'p' : 's'}" href="${u}" target="_blank" rel="noopener noreferrer">${k === 0 ? 'Buy on ' + v : v} ↗</a>`).join('')
    : '<span class="soon">Link coming soon</span>'

  plateAt = 0
  platesEl.innerHTML = it.imgs.length > 1
    ? it.imgs.map((_, k) => `<button class="${k === 0 ? 'on' : ''}" data-k="${k}" aria-label="plate ${k + 1}"></button>`).join('')
    : ''

  document.getElementById('tkN').textContent = String(it.no).padStart(2, '0')
  document.getElementById('tkBar').style.top = (i / Math.max(1, N - 1)) * 98 + 'px'

  document.querySelectorAll('.dial button').forEach(b => b.classList.toggle('on', b.dataset.cat === it.cat.id))
}
/* darken a hue into a page background */
function shade(hex) {
  const n = parseInt(hex.slice(1), 16)
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255
  return `rgb(${Math.round(r * 0.09 + 8)},${Math.round(g * 0.09 + 6)},${Math.round(b * 0.09 + 14)})`
}

platesEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  plateAt = +b.dataset.k
  const img = nodes[live].querySelector('img')
  img.style.opacity = 0
  setTimeout(() => { img.src = ITEMS[live].imgs[plateAt]; img.style.opacity = 1 }, 150)
  platesEl.querySelectorAll('button').forEach((x, j) => x.classList.toggle('on', j === plateAt))
})

/* clicking a card brings it round; clicking the front one opens it */
function tap(i) { if (i === live) openLb(); else goTo(i) }

/* ── drag / wheel / keys ── */
const scene = document.getElementById('scene')
scene.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; vel = 0
  scene.classList.add('drag'); scene.setPointerCapture(e.pointerId)
})
scene.addEventListener('pointermove', e => {
  if (!dragging) return
  const dx = e.clientX - lastX; lastX = e.clientX
  vel = dx * 0.22
  rot += vel; target = rot
})
scene.addEventListener('pointerup', () => {
  if (!dragging) return
  dragging = false; scene.classList.remove('drag')
  const glide = rot + vel * 9
  goTo(((Math.round(-glide / STEP) % N) + N) % N)
})
scene.addEventListener('pointercancel', () => { dragging = false; scene.classList.remove('drag') })

let wheelLock = 0
addEventListener('wheel', e => {
  if (document.getElementById('lb').classList.contains('on')) return
  const now = performance.now()
  if (now - wheelLock < 190) return
  wheelLock = now
  goTo((live + (e.deltaY > 0 ? 1 : -1) + N) % N)
}, { passive: true })

addEventListener('keydown', e => {
  if (document.getElementById('lb').classList.contains('on')) return
  if (e.key === 'ArrowRight') goTo((live + 1) % N)
  if (e.key === 'ArrowLeft') goTo((live - 1 + N) % N)
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb() }
})

/* ── the dial jumps to the first part of a category ── */
document.getElementById('dial').innerHTML = SF.cats.map((c, i) => {
  const first = ITEMS.findIndex(x => x.cat.id === c.id)
  return `${i ? '<span class="sep"></span>' : ''}
    <button data-i="${first}" data-cat="${c.id}"><i>${c.icon}</i><span>${c.label}</span></button>`
}).join('')
document.querySelectorAll('.dial button').forEach(b =>
  b.addEventListener('click', () => goTo(+b.dataset.i)))

/* ── veil ── */
document.getElementById('enter').addEventListener('click', () => {
  document.getElementById('veil').classList.add('gone')
})
setLive(0); goTo(0, true); tick()

/* lightbox */
let set = [], at = 0, who = ''
function openLb() {
  const it = ITEMS[live]
  set = it.imgs; if (!set.length) return
  at = plateAt; who = it.name
  paint(); document.getElementById('lb').classList.add('on')
}
function paint() {
  document.getElementById('lbImg').src = set[at]
  document.getElementById('lbCap').textContent = `${who} — plate ${at + 1} / ${set.length}`
}
function stepLb(d) { at = (at + d + set.length) % set.length; paint() }
function closeLb() { document.getElementById('lb').classList.remove('on') }
document.getElementById('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLb() })
addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('on')) return
  if (e.key === 'Escape') closeLb()
  if (e.key === 'ArrowRight') stepLb(1)
  if (e.key === 'ArrowLeft') stepLb(-1)
})
</script>
</body>
</html>
