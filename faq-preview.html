<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ Design Picker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#16141a;--bg2:#1e1c24;--card:#1e1c24;--text:#9ca3af;--text-h:#f3f0ff;--accent:#a78bfa;--accent2:#7c3aed;--border:#2e2a38;--sans:'Inter',sans-serif;--heading:'Playfair Display',serif;--mono:ui-monospace,monospace}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
    .layout{display:flex;height:100vh}
    .sidebar{width:240px;flex-shrink:0;background:#13111e;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0}
    .sidebar-title{font-size:0.68rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);padding:0 16px 14px;border-bottom:1px solid var(--border)}
    .design-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
    .design-btn{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--sans);font-size:0.78rem;text-align:left;transition:all 0.2s;cursor:pointer}
    .design-btn:hover{border-color:var(--accent);color:var(--text-h);background:rgba(167,139,250,0.06)}
    .design-btn.active{border-color:var(--accent);background:rgba(167,139,250,0.12);color:var(--text-h)}
    .btn-name{font-weight:600;display:block;margin-bottom:2px}
    .btn-desc{font-size:0.65rem;opacity:0.55;display:block}
    .badge{font-size:0.58rem;padding:2px 7px;border-radius:99px;background:rgba(124,58,237,0.2);color:var(--accent);border:1px solid rgba(167,139,250,0.25);font-weight:600;margin-top:4px;display:inline-block}
    .preview{flex:1;overflow-y:auto;padding:48px 40px}
    .preview-inner{max-width:700px;margin:0 auto}
    .section-label{font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);font-family:var(--mono);margin-bottom:10px}
    .section-title{font-family:var(--heading);font-size:2rem;font-weight:700;color:var(--text-h);margin-bottom:32px}
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">FAQ Design Picker</div>
    <div class="design-list" id="list"></div>
  </div>
  <div class="preview"><div class="preview-inner" id="preview"></div></div>
</div>

<script>
const faqs = [
  { q: "What do you specialize in?", a: "I specialize in industrial automation, PLC programming, and building modern web applications. My unique blend of factory-floor engineering and frontend development lets me create end-to-end solutions." },
  { q: "Are you available for freelance work?", a: "Yes! I'm open to freelance projects, especially those involving industrial software, React web apps, or creative portfolio work. Feel free to reach out via the contact page." },
  { q: "What technologies do you work with?", a: "PLC (Siemens, Allen-Bradley), OPC UA, Modbus, React, Node.js, Python, .NET, Docker, and more. I'm always learning and adapting to new tools." },
  { q: "Where are you currently based?", a: "I'm originally from Kangayam, Tamil Nadu, India. Currently working onsite in the USA for Continental Tires through Chennova Software." },
  { q: "Do you sell your photographs?", a: "Yes! My photos are available on Shutterstock. I capture moments from my travels and everyday life — landscapes, portraits, and cultural shots." },
  { q: "How can I get in touch?", a: "Head to the Contact page on my portfolio, or connect with me on LinkedIn, Instagram, or YouTube. I typically respond within 24 hours." },
]

const DESIGNS = []
function reg(d){ DESIGNS.push(d) }

// ═══════════════════════════════
// A — Classic Accordion
// ═══════════════════════════════
reg({ id:'A', name:'Classic Accordion', desc:'Click to expand/collapse with smooth animation', badge:'Clean',
  render(){
    let html = heading()
    html += '<div style="display:flex;flex-direction:column;gap:8px">'
    faqs.forEach((f,i) => {
      html += `<div class="faq-a" onclick="toggleA(this)" style="background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.3s">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;gap:12px">
          <span style="font-size:0.92rem;font-weight:600;color:var(--text-h)">${f.q}</span>
          <span class="faq-chevron" style="color:var(--accent);font-size:0.75rem;transition:transform 0.3s;flex-shrink:0">▼</span>
        </div>
        <div class="faq-answer" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease,padding 0.3s">
          <p style="padding:0 20px 16px;font-size:0.85rem;line-height:1.7;color:var(--text);margin:0">${f.a}</p>
        </div>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// B — Bordered Minimal
// ═══════════════════════════════
reg({ id:'B', name:'Bordered Minimal', desc:'Border-bottom dividers, no card background', badge:'Minimal',
  render(){
    let html = heading()
    faqs.forEach((f,i) => {
      html += `<div class="faq-a" onclick="toggleA(this)" style="border-bottom:1px solid var(--border);cursor:pointer;padding:20px 0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <span style="font-size:0.92rem;font-weight:600;color:var(--text-h)">${f.q}</span>
          <span class="faq-chevron" style="color:var(--accent);font-size:0.8rem;transition:transform 0.3s;flex-shrink:0">+</span>
        </div>
        <div class="faq-answer" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease">
          <p style="padding-top:12px;font-size:0.85rem;line-height:1.7;color:var(--text);margin:0">${f.a}</p>
        </div>
      </div>`
    })
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// C — Cards Grid
// ═══════════════════════════════
reg({ id:'C', name:'Cards Grid', desc:'All answers visible in a 2-column grid', badge:'Open',
  render(){
    let html = heading()
    html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px">'
    faqs.forEach((f,i) => {
      html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;transition:border-color 0.3s,box-shadow 0.3s" onmouseenter="this.style.borderColor='var(--accent)';this.style.boxShadow='0 0 20px rgba(167,139,250,0.1)'" onmouseleave="this.style.borderColor='var(--border)';this.style.boxShadow='none'">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">${i+1}</span>
          <h3 style="font-size:0.88rem;font-weight:600;color:var(--text-h);margin:0">${f.q}</h3>
        </div>
        <p style="font-size:0.82rem;line-height:1.7;color:var(--text);margin:0">${f.a}</p>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// D — Chat Bubbles
// ═══════════════════════════════
reg({ id:'D', name:'Chat Bubbles', desc:'Conversation-style Q&A like a chat', badge:'Playful',
  render(){
    let html = heading()
    html += '<div style="display:flex;flex-direction:column;gap:20px;max-width:560px">'
    faqs.forEach((f,i) => {
      // Question — right aligned
      html += `<div style="display:flex;justify-content:flex-end">
        <div style="background:var(--accent);color:#fff;padding:12px 18px;border-radius:16px 16px 4px 16px;max-width:80%;font-size:0.85rem;font-weight:500">${f.q}</div>
      </div>`
      // Answer — left aligned
      html += `<div style="display:flex;justify-content:flex-start">
        <div style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:16px 16px 16px 4px;max-width:85%;font-size:0.82rem;line-height:1.65">${f.a}</div>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// E — Numbered Timeline
// ═══════════════════════════════
reg({ id:'E', name:'Numbered Timeline', desc:'Vertical timeline with numbered dots', badge:'Structured',
  render(){
    let html = heading()
    html += '<div style="position:relative;padding-left:48px">'
    // Line
    html += '<div style="position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--border)"></div>'
    faqs.forEach((f,i) => {
      html += `<div class="faq-a" onclick="toggleA(this)" style="position:relative;margin-bottom:24px;cursor:pointer">
        <div style="position:absolute;left:-48px;top:2px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:700;z-index:1;box-shadow:0 0 0 4px var(--bg)">${i+1}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <h3 style="font-size:0.92rem;font-weight:600;color:var(--text-h);margin:0">${f.q}</h3>
          <span class="faq-chevron" style="color:var(--accent);font-size:0.7rem;transition:transform 0.3s;flex-shrink:0">▼</span>
        </div>
        <div class="faq-answer" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease">
          <p style="padding-top:10px;font-size:0.82rem;line-height:1.7;color:var(--text);margin:0">${f.a}</p>
        </div>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// F — Glassmorphism Cards
// ═══════════════════════════════
reg({ id:'F', name:'Glass Cards', desc:'Frosted glass accordion with glow on expand', badge:'Premium',
  render(){
    let html = heading()
    html += '<div style="display:flex;flex-direction:column;gap:10px">'
    faqs.forEach((f,i) => {
      html += `<div class="faq-a" onclick="toggleA(this)" style="background:rgba(167,139,250,0.04);backdrop-filter:blur(12px);border:1px solid rgba(167,139,250,0.15);border-radius:14px;cursor:pointer;transition:all 0.3s;overflow:hidden" onmouseenter="this.style.borderColor='rgba(167,139,250,0.35)';this.style.boxShadow='0 0 24px rgba(167,139,250,0.08)'" onmouseleave="this.style.borderColor='rgba(167,139,250,0.15)';this.style.boxShadow='none'">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 22px;gap:12px">
          <div style="display:flex;align-items:center;gap:12px">
            <span style="color:var(--accent);font-size:1rem">✦</span>
            <span style="font-size:0.92rem;font-weight:600;color:var(--text-h)">${f.q}</span>
          </div>
          <span class="faq-chevron" style="color:var(--accent);font-size:0.7rem;transition:transform 0.3s;flex-shrink:0">▼</span>
        </div>
        <div class="faq-answer" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease">
          <p style="padding:0 22px 18px 46px;font-size:0.84rem;line-height:1.7;color:var(--text);margin:0">${f.a}</p>
        </div>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// G — Tabs Style
// ═══════════════════════════════
reg({ id:'G', name:'Tab Selector', desc:'Click a question tab on left, answer shows on right', badge:'Modern',
  render(){
    let html = heading()
    html += `<div style="display:flex;gap:20px;min-height:300px">
      <div id="faq-tabs" style="flex:0 0 260px;display:flex;flex-direction:column;gap:4px">`
    faqs.forEach((f,i) => {
      html += `<button onclick="selectTab(${i})" id="ftab-${i}" style="text-align:left;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:${i===0?'var(--accent)':'transparent'};color:${i===0?'#fff':'var(--text)'};font-family:var(--sans);font-size:0.82rem;font-weight:${i===0?600:400};cursor:pointer;transition:all 0.2s">${f.q}</button>`
    })
    html += `</div>
      <div id="faq-tab-answer" style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;display:flex;align-items:flex-start">
        <p style="font-size:0.9rem;line-height:1.8;color:var(--text);margin:0">${faqs[0].a}</p>
      </div>
    </div>`
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// H — Hover Reveal
// ═══════════════════════════════
reg({ id:'H', name:'Hover Reveal', desc:'Hover over a question to see the answer', badge:'Interactive',
  render(){
    let html = heading()
    html += '<div style="display:flex;flex-direction:column;gap:10px">'
    faqs.forEach((f,i) => {
      html += `<div style="position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 22px;cursor:default;overflow:hidden;transition:all 0.3s" onmouseenter="this.querySelector('.hover-a').style.maxHeight='200px';this.querySelector('.hover-a').style.opacity='1';this.style.borderColor='var(--accent)'" onmouseleave="this.querySelector('.hover-a').style.maxHeight='0';this.querySelector('.hover-a').style.opacity='0';this.style.borderColor='var(--border)'">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="color:var(--accent);font-weight:700;font-size:0.8rem;font-family:var(--mono)">Q${i+1}</span>
          <span style="font-size:0.9rem;font-weight:600;color:var(--text-h)">${f.q}</span>
        </div>
        <div class="hover-a" style="max-height:0;overflow:hidden;opacity:0;transition:all 0.4s ease">
          <p style="padding-top:12px;font-size:0.82rem;line-height:1.7;color:var(--text);margin:0;border-top:1px dashed var(--border);margin-top:12px;padding-top:12px">${f.a}</p>
        </div>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// Helpers
function heading(){
  return `<div style="margin-bottom:32px"><span class="section-label">Got Questions?</span><h2 class="section-title">Frequently Asked Questions</h2></div>`
}

function toggleA(el){
  const answer = el.querySelector('.faq-answer')
  const chevron = el.querySelector('.faq-chevron')
  const isOpen = answer.style.maxHeight && answer.style.maxHeight !== '0px'
  if(isOpen){
    answer.style.maxHeight = '0'; answer.style.padding && (answer.style.paddingTop = '0')
    if(chevron) chevron.style.transform = 'rotate(0deg)'
    el.style.borderColor = 'var(--border)'
  } else {
    answer.style.maxHeight = answer.scrollHeight + 20 + 'px'
    if(chevron){ chevron.style.transform = 'rotate(180deg)'; if(chevron.textContent==='+') chevron.textContent = '−' }
    el.style.borderColor = 'var(--accent)'
  }
}

function selectTab(i){
  document.getElementById('faq-tab-answer').innerHTML = `<p style="font-size:0.9rem;line-height:1.8;color:var(--text);margin:0">${faqs[i].a}</p>`
  faqs.forEach((_,j) => {
    const tab = document.getElementById('ftab-'+j)
    if(tab){ tab.style.background = j===i?'var(--accent)':'transparent'; tab.style.color = j===i?'#fff':'var(--text)'; tab.style.fontWeight = j===i?600:400 }
  })
}

// ═══════════════════════════════
// I — Pill Selector
// ═══════════════════════════════
reg({ id:'I', name:'Pill Selector', desc:'Click pill buttons, answer slides in below', badge:'Sleek',
  render(){
    let html = heading()
    html += `<div id="pill-wrap" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px">`
    faqs.forEach((f,i) => {
      html += `<button onclick="selectPill(${i})" id="pill-${i}" style="padding:8px 18px;border-radius:999px;border:1px solid ${i===0?'var(--accent)':'var(--border)'};background:${i===0?'var(--accent)':'transparent'};color:${i===0?'#fff':'var(--text)'};font-family:var(--sans);font-size:0.78rem;font-weight:500;cursor:pointer;transition:all 0.25s;white-space:nowrap">${f.q}</button>`
    })
    html += `</div>
    <div id="pill-answer" style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 28px;min-height:80px;transition:all 0.3s">
      <p style="font-size:0.88rem;line-height:1.8;color:var(--text);margin:0">${faqs[0].a}</p>
    </div>`
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// J — Stacked Reveal
// ═══════════════════════════════
reg({ id:'J', name:'Stacked Reveal', desc:'Cards stack with accent left bar, expand on click', badge:'Bold',
  render(){
    let html = heading()
    html += '<div style="display:flex;flex-direction:column;gap:6px">'
    faqs.forEach((f,i) => {
      html += `<div class="faq-a" onclick="toggleA(this)" style="display:flex;gap:0;cursor:pointer;border-radius:12px;overflow:hidden;border:1px solid var(--border);transition:border-color 0.3s">
        <div style="width:4px;background:var(--accent);flex-shrink:0;transition:width 0.3s"></div>
        <div style="flex:1;padding:16px 20px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
            <span style="font-size:0.9rem;font-weight:600;color:var(--text-h)">${f.q}</span>
            <span class="faq-chevron" style="color:var(--accent);font-size:0.65rem;transition:transform 0.3s;flex-shrink:0;opacity:0.6">▶</span>
          </div>
          <div class="faq-answer" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease">
            <p style="padding-top:12px;font-size:0.83rem;line-height:1.7;color:var(--text);margin:0">${f.a}</p>
          </div>
        </div>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// K — Flip Cards
// ═══════════════════════════════
reg({ id:'K', name:'Flip Cards', desc:'Hover to flip card revealing answer on back', badge:'3D',
  render(){
    let html = heading()
    html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px">'
    faqs.forEach((f,i) => {
      html += `<div style="perspective:600px;height:180px">
        <div style="position:relative;width:100%;height:100%;transition:transform 0.6s;transform-style:preserve-3d;cursor:pointer" onmouseenter="this.style.transform='rotateY(180deg)'" onmouseleave="this.style.transform='rotateY(0)'">
          <div style="position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center">
            <span style="color:var(--accent);font-size:1.4rem;margin-bottom:10px">?</span>
            <span style="font-size:0.88rem;font-weight:600;color:var(--text-h)">${f.q}</span>
          </div>
          <div style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center">
            <p style="font-size:0.8rem;line-height:1.65;color:#fff;margin:0">${f.a}</p>
          </div>
        </div>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// L — Spotlight Search
// ═══════════════════════════════
reg({ id:'L', name:'Spotlight Search', desc:'Search bar filters FAQs as you type', badge:'Smart',
  render(){
    let html = heading()
    html += `<div style="margin-bottom:24px">
      <input id="faq-search" type="text" placeholder="Search questions..." oninput="filterFAQ()" style="width:100%;padding:14px 20px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text-h);font-family:var(--sans);font-size:0.9rem;outline:none;transition:border-color 0.3s" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'" />
    </div>
    <div id="faq-search-results" style="display:flex;flex-direction:column;gap:8px">`
    faqs.forEach((f,i) => {
      html += `<div class="faq-search-item faq-a" onclick="toggleA(this)" data-q="${f.q.toLowerCase()}" style="background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;overflow:hidden;transition:border-color 0.3s">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;gap:12px">
          <span style="font-size:0.9rem;font-weight:600;color:var(--text-h)">${f.q}</span>
          <span class="faq-chevron" style="color:var(--accent);font-size:0.7rem;transition:transform 0.3s;flex-shrink:0">▼</span>
        </div>
        <div class="faq-answer" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease">
          <p style="padding:0 20px 16px;font-size:0.83rem;line-height:1.7;color:var(--text);margin:0">${f.a}</p>
        </div>
      </div>`
    })
    html += '</div>'
    preview.innerHTML = html
  }
})

// ═══════════════════════════════
// M — Emoji Accent
// ═══════════════════════════════
reg({ id:'M', name:'Emoji Accent', desc:'Each FAQ has an emoji icon, colorful and friendly', badge:'Friendly',
  render(){
    const emojis = ['🎯','💼','⚡','🌍','📷','💬']
    let html = heading()
    html += '<div style="display:flex;flex-direction:column;gap:10px">'
    faqs.forEach((f,i) => {
      html += `<div class="faq-a" onclick="toggleA(this)" style="background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;overflow:hidden;transition:all 0.3s">
        <div style="display:flex;align-items:center;padding:18px 22px;gap:14px">
          <span style="font-size:1.4rem;flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(167,139,250,0.1);border-radius:10px">${emojis[i]||'❓'}</span>

// Helper for pill selector
function selectPill(i){
  document.getElementById('pill-answer').innerHTML = `<p style="font-size:0.88rem;line-height:1.8;color:var(--text);margin:0">${faqs[i].a}</p>`
  faqs.forEach((_,j) => {

// Helper for search filter
function filterFAQ(){
  const q = document.getElementById('faq-search').value.toLowerCase()
  document.querySelectorAll('.faq-search-item').forEach(el => {
    el.style.display = el.dataset.q.includes(q) ? 'block' : 'none'
  })
}

// Carousel slide helper
function slideFAQ(dir){
  const total = faqs.length
  window._faqSlide = Math.max(0, Math.min(total-1, (window._faqSlide||0)+dir))
  const el = document.getElementById('faq-carousel')
  if(el) el.style.transform = `translateX(-${window._faqSlide*100}%)`
  const num = document.getElementById('faq-slide-num')
  if(num) num.textContent = `${window._faqSlide+1} / ${total}`
}

// Expandable tile helper
function expandTile(el, idx){
  const expand = document.getElementById('faq-tile-expand')
  if(expand.dataset.open === String(idx)){ expand.style.maxHeight='0'; expand.style.opacity='0'; expand.style.marginTop='0'; expand.dataset.open=''; return }
  expand.innerHTML = `<div style="padding:24px"><h3 style="font-size:0.95rem;font-weight:600;color:var(--text-h);margin:0 0 10px">${faqs[idx].q}</h3><p style="font-size:0.85rem;line-height:1.7;color:var(--text);margin:0">${faqs[idx].a}</p></div>`
  expand.style.maxHeight='300px'; expand.style.opacity='1'; expand.style.marginTop='14px'; expand.style.border='1px solid var(--accent)'
  expand.dataset.open = idx
}

// Typewriter helper
function typewriterFAQ(el, idx){
  const wrap = el.querySelector('.tw-answer')
  const p = wrap.querySelector('p')
  if(wrap.style.maxHeight && wrap.style.maxHeight !== '0px'){ wrap.style.maxHeight='0'; return }
  wrap.style.maxHeight='300px'
  el.style.borderColor='var(--accent)'
  const text = faqs[idx].a
  p.textContent = ''
  let ci = 0
  const type = () => {
    if(ci < text.length){ p.textContent += text[ci]; ci++; setTimeout(type, 12) }
  }
  type()
}
